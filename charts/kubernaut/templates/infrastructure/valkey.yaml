{{- $v := include "kubernaut.mergedValues" (dict "root" $ "service" "valkey") | fromYaml }}
{{- if $v.enabled }}
# DD-PLATFORM-003: Valkey renders in ArgoCD's "-1" sync-wave (ahead of the
# default "0" application controllers) -- DataStorage needs it Ready before
# its own wave can proceed, and running it concurrently with ~14 application
# controllers was a measured contributor to CI resource-contention pod
# restarts.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: valkey
  namespace: {{ .Release.Namespace }}
  labels:
    app: valkey
    {{- include "kubernaut.labels" . | nindent 4 }}
  annotations:
    "argocd.argoproj.io/sync-wave": "-1"
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: {{ .Release.Namespace }}
  labels:
    app: valkey
    {{- include "kubernaut.labels" . | nindent 4 }}
  annotations:
    "argocd.argoproj.io/sync-wave": "-1"
spec:
  type: ClusterIP
  ports:
    # DD-PLATFORM-006 DA8: TLS-only (plaintext port disabled below) -- 6380
    # matches the --tls-port set on the container.
    - name: valkey
      port: 6380
      targetPort: 6380
      protocol: TCP
  selector:
    app: valkey
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: {{ .Release.Namespace }}
  labels:
    app: valkey
    {{- include "kubernaut.labels" . | nindent 4 }}
  annotations:
    "argocd.argoproj.io/sync-wave": "-1"
spec:
  replicas: {{ $v.replicas }}
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      serviceAccountName: valkey
      {{- include "kubernaut.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "kubernaut.mergedSecurityContext" (dict "override" .Values.valkey.podSecurityContext "defaults" (dict "runAsNonRoot" true "runAsUser" 999 "fsGroup" 999 "seccompProfile" (dict "type" "RuntimeDefault"))) | nindent 8 }}
      {{- include "kubernaut.affinity" (dict "component" .Values.valkey "matchLabels" (dict "app" "valkey")) | nindent 6 }}
      {{- include "kubernaut.scheduling" (dict "component" .Values.valkey "global" .Values.global) | nindent 6 }}
      containers:
        - name: valkey
          image: {{ $v.image }}
          imagePullPolicy: {{ include "kubernaut.imagePullPolicy" $ }}
          securityContext:
            {{- include "kubernaut.mergedSecurityContext" (dict "override" .Values.valkey.containerSecurityContext "defaults" (dict "allowPrivilegeEscalation" false "readOnlyRootFilesystem" false "runAsNonRoot" true "runAsUser" 999)) | nindent 12 }}
          # DD-PLATFORM-006 DA8: Valkey is TLS-only -- the plaintext port is
          # disabled (--port 0) and the cert/key/ca generated by
          # tls-cert-job.yaml's Section 2 loop (valkey-tls Secret, same
          # inter-service-ca trust root as every other consumer) are mounted
          # below. One-way TLS only (--tls-auth-clients no): clients verify
          # Valkey's server cert, Valkey does not require client certs.
          args:
            - "--port"
            - "0"
            - "--tls-port"
            - "6380"
            - "--tls-cert-file"
            - "/certs/tls.crt"
            - "--tls-key-file"
            - "/certs/tls.key"
            - "--tls-ca-cert-file"
            - "/certs/ca.crt"
            - "--tls-auth-clients"
            - "no"
          ports:
            - name: valkey
              containerPort: 6380
          volumeMounts:
            - name: valkey-data
              mountPath: {{ include "kubernaut.valkey.dataDir" . }}
            - name: valkey-tls
              mountPath: /certs
              readOnly: true
          resources:
            {{- toYaml .Values.valkey.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["valkey-cli", "--tls", "--cacert", "/certs/ca.crt", "-p", "6380", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["valkey-cli", "--tls", "--cacert", "/certs/ca.crt", "-p", "6380", "ping"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: valkey-data
          persistentVolumeClaim:
            claimName: valkey-data
        - name: valkey-tls
          secret:
            secretName: valkey-tls
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: valkey-data
  namespace: {{ .Release.Namespace }}
  labels:
    app: valkey
    {{- include "kubernaut.labels" . | nindent 4 }}
  annotations:
    "helm.sh/resource-policy": keep
    "argocd.argoproj.io/sync-wave": "-1"
spec:
  accessModes:
    - ReadWriteOnce
  {{- if $v.storage.storageClassName }}
  storageClassName: {{ $v.storage.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ $v.storage.size }}
{{- end }}
