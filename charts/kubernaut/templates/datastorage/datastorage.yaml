{{- define "kubernaut.datastorage.configYAML" -}}
{{- $v := include "kubernaut.mergedValues" (dict "root" . "service" "datastorage") | fromYaml -}}
# GAP-14 / Issue #1519: OTel distributed tracing, opt-in (BYO-collector).
# Shared across Gateway/DataStorage/KubernautAgent (top-level .Values.telemetry).
# Empty endpoint + logSink=false (default) disables tracing entirely.
telemetry:
  endpoint: {{ .Values.telemetry.endpoint | default "" | quote }}
  logSink: {{ .Values.telemetry.logSink | default false }}
  tls:
    enabled: {{ .Values.telemetry.tls.enabled | default false }}
    caFile: {{ .Values.telemetry.tls.caFile | default "" | quote }}
    certFile: {{ .Values.telemetry.tls.certFile | default "" | quote }}
    keyFile: {{ .Values.telemetry.tls.keyFile | default "" | quote }}
server:
  port: 8080
  host: "0.0.0.0"
  healthPort: 8081
  metricsPort: 9090
  readTimeout: {{ $v.config.server.readTimeout }}
  writeTimeout: {{ $v.config.server.writeTimeout }}
  # #1048 Phase 4 / SC-5: Maximum request body size in bytes (default: 5242880 = 5 MiB)
  maxBodySize: {{ $v.config.server.maxBodySize | quote }}
  # SEC-H3 / AC-4: CORS allowed origins (default: [] = reject all cross-origin)
  corsAllowedOrigins:
  {{- if $v.config.server.corsAllowedOrigins }}
    {{- toYaml $v.config.server.corsAllowedOrigins | nindent 4 }}
  {{- end }}
  signerCertDir: {{ $v.config.server.signerCertDir | quote }}
  # GAP-09 (Issue #1505) / SC-5: Per-IP rate limiting, disabled by default
  # (existing deployments may rely on an external ingress/proxy for this).
  rateLimit:
    enabled: true
    requestsPerSecond: {{ $v.config.server.rateLimit.requestsPerSecond }}
    burst: {{ $v.config.server.rateLimit.burst }}
  tls:
    certDir: {{ include "kubernaut.interServiceTLS.certDir" . | quote }}
database:
  host: {{ include "kubernaut.postgresql.host" . }}
  port: {{ include "kubernaut.postgresql.port" . }}
  name: {{ include "kubernaut.postgresql.database" . }}
  user: {{ include "kubernaut.postgresql.username" . }}
  sslMode: {{ $v.config.database.sslMode }}
  maxOpenConns: {{ $v.config.database.maxOpenConns }}
  maxIdleConns: {{ $v.config.database.maxIdleConns }}
  connMaxLifetime: {{ $v.config.database.connMaxLifetime }}
  connMaxIdleTime: {{ $v.config.database.connMaxIdleTime }}
  secretsFile: "/etc/datastorage/secrets/db-secrets.yaml"
  usernameKey: "username"
  passwordKey: "password"
redis:
  addr: {{ include "kubernaut.valkey.addr" . }}
  dlqMaxLen: {{ $v.config.redis.dlqMaxLen }}
  secretsFile: "/etc/datastorage/secrets/valkey-secrets.yaml"
  passwordKey: "password"
  tls:
    enabled: true
    # DD-PLATFORM-006 DA19 (kubernaut#2269, BR-NET-002/AC-4): Valkey now
    # requires client certs (--tls-auth-clients yes). certFile/keyFile
    # default to DataStorage's own already-mounted datastorage-tls Secret
    # (the same cert it presents for its own inbound server TLS, at the
    # tls-certs volume mount below) so this "just works" without any extra
    # configuration -- override only to present a different client identity.
    certFile: {{ .Values.datastorage.config.redis.tls.certFile | default (printf "%s/tls.crt" (include "kubernaut.interServiceTLS.certDir" .)) | quote }}
    keyFile: {{ .Values.datastorage.config.redis.tls.keyFile | default (printf "%s/tls.key" (include "kubernaut.interServiceTLS.certDir" .)) | quote }}
    # DD-PLATFORM-006 DA8: the chart's own Valkey is TLS-only -- caFile defaults
    # to the already-mounted inter-service CA (see the tls-ca volume/mount
    # below) so this works without extra configuration; override only for a
    # BYO Valkey/Redis signed by a different CA.
    caFile: {{ .Values.datastorage.config.redis.tls.caFile | default (include "kubernaut.interServiceTLS.caFile" .) | quote }}
retention:
  # DD-PLATFORM-006 DA14 (PR9): deliberately NOT routed through $v/kubernaut.
  # mergedValues -- values.schema.json's own default (false) intentionally
  # diverges from this chart's hardened default (true, AU-11 minimum
  # retention floor). Routing this through the generic schema-defaults
  # merge would silently flip retention off whenever a user's values.yaml
  # omits it, defeating the hardening. Stays a direct .Values read with its
  # own explicit `default true` fallback.
  enabled: {{ .Values.datastorage.config.retention.enabled | default true }}
  interval: {{ $v.config.retention.interval | quote }}
  batchSize: {{ $v.config.retention.batchSize }}
  defaultDays: {{ $v.config.retention.defaultDays }}
# GAP-05 (Issue #1505) / AU-9: Keyed HMAC-SHA256 audit hash chain.
audit:
  hashKeySecretsFile: "/etc/datastorage/secrets/audit-hmac-key.yaml"
  hashKeyKey: {{ $v.config.auditHashKey.secretKey | quote }}
logging:
  level: {{ $v.logging.level | upper | quote }}
# BR-PLATFORM-012, Issue #2275: secure-by-default pprof toggle.
debug:
  pprofEnabled: {{ $v.debug.pprofEnabled }}
{{- end }}
---
# DD-PLATFORM-003: DataStorage (ConfigMap + Deployment + Service) renders in
# ArgoCD's "-1" sync-wave -- it is the sole dependency of ~11 other
# application controllers (ADR-032 data-access-layer isolation) and of the
# db-migration / interservice-ca-sync hook Jobs, so bringing it up ahead of
# the default "0" wave both prevents a repeat of the CI resource-contention
# failure and guarantees it is Ready before any dependent controller starts.
apiVersion: v1
kind: ConfigMap
metadata:
  name: datastorage-config
  namespace: {{ .Release.Namespace }}
  labels:
    app: datastorage
    {{- include "kubernaut.labels" . | nindent 4 }}
  annotations:
    "argocd.argoproj.io/sync-wave": "-1"
data:
  config.yaml: |
    {{- include "kubernaut.datastorage.configYAML" . | nindent 4 }}
---
{{- /*
DD-PLATFORM-006 Decision Area 14 (PR9): recomputed here since this is a
separate top-level scope from kubernaut.datastorage.configYAML above (not a
nested named-template call).
*/}}
{{- $v := include "kubernaut.mergedValues" (dict "root" $ "service" "datastorage") | fromYaml }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: datastorage
  namespace: {{ .Release.Namespace }}
  labels:
    app: datastorage
    {{- include "kubernaut.labels" . | nindent 4 }}
  annotations:
    "argocd.argoproj.io/sync-wave": "-1"
spec:
  replicas: {{ $v.replicas }}
  # PR #1790 round-13 RCA: see gateway.yaml's progressDeadlineSeconds comment
  # -- K8s's Deployment controller enforces this SERVER-SIDE (default 600s)
  # independently of `kubectl rollout status --timeout`, which is why round-12's
  # 480s->720s CLI timeout bump had no effect. 750s makes that 720s CLI
  # timeout the real ceiling again.
  progressDeadlineSeconds: 750
  selector:
    matchLabels:
      app: datastorage
  template:
    metadata:
      labels:
        app: datastorage
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
        checksum/config: {{ include "kubernaut.datastorage.configYAML" . | sha256sum }}
    spec:
      serviceAccountName: data-storage-sa
      {{- include "kubernaut.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "kubernaut.podSecurityContext" .Values.datastorage | nindent 8 }}
      {{- include "kubernaut.affinity" (dict "component" .Values.datastorage "matchLabels" (dict "app" "datastorage")) | nindent 6 }}
      {{- include "kubernaut.scheduling" (dict "component" .Values.datastorage "global" .Values.global) | nindent 6 }}
      terminationGracePeriodSeconds: 90
      initContainers:
        - name: wait-for-postgres
          image: {{ (include "kubernaut.mergedValues" (dict "root" $ "service" "postgresql") | fromYaml).image }}
          imagePullPolicy: {{ include "kubernaut.imagePullPolicy" $ }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          command: ['sh', '-c', 'until pg_isready -h {{ include "kubernaut.postgresql.host" . }} -p {{ include "kubernaut.postgresql.port" . }}; do echo "waiting for postgresql..."; sleep 2; done']
      containers:
        - name: datastorage
          image: {{ include "kubernaut.image" (dict "service" "datastorage" "root" $ "appVersion" .Chart.AppVersion) }}
          imagePullPolicy: {{ include "kubernaut.imagePullPolicy" $ }}
          securityContext:
            {{- include "kubernaut.containerSecurityContext" .Values.datastorage | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
            - name: health
              containerPort: 8081
            - name: metrics
              containerPort: 9090
          env:
            - name: CONFIG_PATH
              value: /etc/datastorage/config.yaml
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: config
              mountPath: /etc/datastorage
              readOnly: true
            - name: secrets
              mountPath: /etc/datastorage/secrets
              readOnly: true
            - name: tls-certs
              mountPath: {{ include "kubernaut.interServiceTLS.certDir" . }}
              readOnly: true
            - name: signing-certs
              mountPath: {{ $v.config.server.signerCertDir }}
              readOnly: true
            # DD-PLATFORM-006 DA8: lets redis.tls.caFile verify the chart's own
            # TLS-only Valkey without any extra configuration (defaults to this
            # mount's ca.crt above).
            {{- include "kubernaut.tlsCaVolumeMount" . | nindent 12 }}
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.datastorage.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: datastorage-config
        - name: secrets
          projected:
            sources:
              - secret:
                  name: {{ include "kubernaut.datastorage.dbSecretName" . }}
                  items:
                    - key: db-secrets.yaml
                      path: db-secrets.yaml
              - secret:
                  name: {{ include "kubernaut.valkey.secretName" . }}
                  items:
                    - key: valkey-secrets.yaml
                      path: valkey-secrets.yaml
              - secret:
                  name: {{ include "kubernaut.datastorage.auditHashKeySecretName" . }}
                  items:
                    - key: audit-hmac-key.yaml
                      path: audit-hmac-key.yaml
        - name: tls-certs
          secret:
            secretName: datastorage-tls
            optional: true
        - name: signing-certs
          secret:
            secretName: datastorage-signing-cert
        {{- include "kubernaut.tlsCaVolume" . | nindent 8 }}
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: data-storage-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: datastorage
    {{- include "kubernaut.labels" . | nindent 4 }}
  annotations:
    "argocd.argoproj.io/sync-wave": "-1"
spec:
  type: {{ $v.service.type }}
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
      {{- if and (eq $v.service.type "NodePort") $v.service.nodePort }}
      nodePort: {{ $v.service.nodePort }}
      {{- end }}
    - name: health
      port: 8081
      targetPort: 8081
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
  selector:
    app: datastorage
