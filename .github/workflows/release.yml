name: Release

# Triggered by version tag push (e.g., v1.0.0, v1.1.0-rc0)
# Builds multi-arch images (amd64 + arm64) for all 13 services in parallel,
# runs Helm smoke tests against the amd64 images, scans all images for CVEs
# (Trivy) and generates SBOMs (CycloneDX), signs images with Cosign (keyless),
# generates SLSA v1.0 Build L3 provenance (via an isolated reusable workflow,
# slsa-provenance.yml), publishes Helm chart to OCI registry, and creates a
# GitHub Release gated on smoke test + security scan success.
# Pre-release tags (-rc*, -alpha*, -beta*) create a pre-release and skip :latest tagging.
#
# Prerequisites:
#   - Quay.io robot account with Creator role in kubernaut-ai org
#   - GitHub Actions secrets: QUAY_ROBOT_USERNAME, QUAY_ROBOT_TOKEN
#
# Authority: Issue #257 (sub-issue of #80), Issue #569, Issue #1315, Issue #1319,
#            Issue #1109 (SLSA Build L3)
# Business Requirement: BR-PLATFORM-RELEASE-001
# FedRAMP Controls: SA-12 (Supply Chain), RA-5 (Vulnerability Scanning),
#                   CM-14 (Signed Components), AU-3 (Audit Content)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      operator_candidate_manifest:
        description: Immutable kubernaut-operator candidate manifest URL (required for promotion)
        required: false
        type: string
        default: ''
      operator_ref:
        description: Exact operator SHA fallback for development qualification
        required: false
        type: string
        default: 2c021da02bd62aa9adf5c36d511b33c0483da359
      release_version:
        description: Application release version for manual qualification
        required: false
        type: string
        default: 1.6.0-rc27


# Least-privilege default for every job. All image push/pull in this workflow
# goes to Quay.io via QUAY_ROBOT_* secrets, not GITHUB_TOKEN, so no job needs
# a `packages` scope. Only sign-and-attest (Cosign OIDC), provenance (isolated
# SLSA Build L3 attestation via slsa-provenance.yml), and release (gh release
# create/upload) need elevated GITHUB_TOKEN scopes; they declare their own
# job-level `permissions:` below, which fully replaces (not merges with) this
# default for that job.
permissions:
  contents: read

env:
  IMAGE_REGISTRY: quay.io/kubernaut-ai
  KUBERNAUT_OPERATOR_REF: 2c021da02bd62aa9adf5c36d511b33c0483da359

jobs:
  # ========================================
  # STAGE 0: PREPARE
  # Extract version metadata and generate code once.
  # Outputs are consumed by all downstream jobs.
  # ========================================

  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      build_date: ${{ steps.version.outputs.build_date }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      qualification_tag: ${{ steps.version.outputs.qualification_tag }}
    steps:
      - name: Extract version from tag
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="v${{ inputs.release_version }}"
          else
            TAG=${GITHUB_REF#refs/tags/}
          fi
          VERSION=${TAG#v}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -z "${{ inputs.operator_candidate_manifest }}" ]]; then
            echo "qualification_tag=${VERSION}-qualification-${GITHUB_RUN_ID}" >> $GITHUB_OUTPUT
          else
            echo "qualification_tag=$VERSION" >> $GITHUB_OUTPUT
          fi

          if [[ "$VERSION" =~ -(rc|alpha|beta) ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "Pre-release: $TAG (version: $VERSION)"
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "Release: $TAG (version: $VERSION)"
          fi

  # ========================================
  # OPERATOR CANDIDATE INPUT
  # Release promotion consumes the manual operator handoff manifest. A direct
  # SHA is retained only for development qualification and is never treated as
  # a promotion artifact.
  # ========================================

  prepare-operator-candidate:
    name: Verify operator candidate input
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      operator_sha: ${{ steps.candidate.outputs.operator_sha }}
      operator_image: ${{ steps.candidate.outputs.operator_image }}
      candidate_manifest: ${{ steps.candidate.outputs.candidate_manifest }}
    steps:
      - name: Install yq
        run: |
          YQ_VERSION="v4.47.2"
          curl --fail --location --retry 3 "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" -o yq
          chmod +x yq
          sudo mv yq /usr/local/bin/yq
          yq --version
      - name: Checkout exact operator source for development fallback
        if: inputs.operator_candidate_manifest == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: jordigilh/kubernaut-operator
          ref: ${{ inputs.operator_ref || env.KUBERNAUT_OPERATOR_REF }}
          path: kubernaut-operator
          fetch-depth: 0
      - name: Resolve immutable candidate manifest or exact development SHA
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST_URL='${{ inputs.operator_candidate_manifest }}'
          if [[ -n "$MANIFEST_URL" ]]; then
            curl --fail --location --retry 3 "$MANIFEST_URL" -o operator-candidate.yaml
            test -s operator-candidate.yaml
            SHA=$(yq -r '.sha' operator-candidate.yaml)
            IMAGE=$(yq -r '.image.ref' operator-candidate.yaml)
            CHART=$(yq -r '.chart.ref' operator-candidate.yaml)
            [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::candidate SHA is not immutable"; exit 1; }
            [[ "$IMAGE" == *@sha256:* ]] || { echo "::error::candidate operator image must be digest-pinned"; exit 1; }
            [[ -n "$CHART" ]] || { echo "::error::candidate chart ref is missing"; exit 1; }
          else
            if [[ "${{ github.event_name }}" == "push" ]]; then
              echo "::error::release promotion requires operator_candidate_manifest"
              exit 1
            fi
            SHA='${{ inputs.operator_ref || env.KUBERNAUT_OPERATOR_REF }}'
            [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::operator_ref fallback must be an exact SHA"; exit 1; }
            IMAGE="localhost/kubernaut-operator:$SHA"
            cat > operator-candidate.yaml <<EOF
          schemaVersion: 1
          repository: jordigilh/kubernaut-operator
          sha: $SHA
          image:
            ref: $IMAGE
          chart:
            ref: development-source
          dependencyChart:
            ref: development-source
          qualificationProfile: generic-kind-v1.6
          EOF
          fi
          echo "operator_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "operator_image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "candidate_manifest=$GITHUB_WORKSPACE/operator-candidate.yaml" >> "$GITHUB_OUTPUT"

      - name: Upload operator candidate input
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: operator-candidate-${{ github.run_id }}
          path: operator-candidate.yaml
          retention-days: 90

      - name: Build development operator fallback artifact
        if: inputs.operator_candidate_manifest == ''
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: latest
      - name: Build development operator image and charts
        if: inputs.operator_candidate_manifest == ''
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(yq -r '.sha' operator-candidate.yaml)
          IMAGE="localhost/kubernaut-operator:${SHA}"
          docker build --pull=false -t "$IMAGE" -f kubernaut-operator/Dockerfile kubernaut-operator
          mkdir -p operator-development
          docker save -o operator-development/kubernaut-operator.tar "$IMAGE"
          helm package kubernaut-operator/charts/kubernaut-operator --destination operator-development
          helm package kubernaut-operator/charts/kubernaut-development-dependencies --destination operator-development
          cp operator-candidate.yaml operator-development/
      - name: Upload development operator artifact
        if: inputs.operator_candidate_manifest == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: operator-development-${{ github.run_id }}
          path: operator-development
          retention-days: 2

  operator-qualification:
    name: Operator FP/Fleet qualification
    needs: [prepare, prepare-operator-candidate, build-amd64, create-manifests]
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Checkout upstream
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true
      - name: Install yq
        run: |
          YQ_VERSION="v4.47.2"
          curl --fail --location --retry 3 "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" -o yq
          chmod +x yq
          sudo mv yq /usr/local/bin/yq
          yq --version
      - name: Download candidate manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: operator-candidate-${{ github.run_id }}
          path: /tmp/operator-candidate
      - name: Download development operator artifact
        if: inputs.operator_candidate_manifest == ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: operator-development-${{ github.run_id }}
          path: /tmp/operator-development
      - name: Install qualification tools
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: latest
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
      - name: Install Podman
        uses: ./.github/actions/install-podman
      - name: Install Kind
        run: |
          KIND_VERSION="v0.32.0"
          curl -Lo ./kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version
      - name: Run operator-managed FP and Fleet smoke lanes
        shell: bash
        env:
          OPERATOR_CANDIDATE: /tmp/operator-candidate/operator-candidate.yaml
          IMAGE_TAG: ${{ needs.prepare.outputs.qualification_tag }}
          IMAGE_REGISTRY: quay.io/kubernaut-ai
        run: |
          set -euo pipefail
           OPERATOR_IMAGE=$(yq -r '.image.ref' "$OPERATOR_CANDIDATE")
           OPERATOR_CHART=$(yq -r '.chart.ref' "$OPERATOR_CANDIDATE")
           DEPENDENCY_CHART=$(yq -r '.dependencyChart.ref // empty' "$OPERATOR_CANDIDATE")
           OPERATOR_SHA=$(yq -r '.sha' "$OPERATOR_CANDIDATE")
          test "$OPERATOR_SHA" = "${{ needs.prepare-operator-candidate.outputs.operator_sha }}"
          export KUBERNAUT_OPERATOR_IMAGE="$OPERATOR_IMAGE"
          export KUBERNAUT_OPERATOR_SHA="$OPERATOR_SHA"
          if [[ -z '${{ inputs.operator_candidate_manifest }}' ]]; then
            podman load -i /tmp/operator-development/kubernaut-operator.tar
            mkdir -p "$PWD/operator-charts"
            tar -xzf /tmp/operator-development/kubernaut-operator-*.tgz -C "$PWD/operator-charts"
            tar -xzf /tmp/operator-development/kubernaut-development-dependencies-*.tgz -C "$PWD/operator-charts"
            export KUBERNAUT_OPERATOR_CHART_PATH="$PWD/operator-charts/kubernaut-operator"
            export KUBERNAUT_DEPENDENCY_CHART_PATH="$PWD/operator-charts/kubernaut-development-dependencies"
           else
             export KUBERNAUT_OPERATOR_CHART_PATH="$OPERATOR_CHART"
             export KUBERNAUT_DEPENDENCY_CHART_PATH="${DEPENDENCY_CHART:-oci://quay.io/kubernaut-ai/kubernaut-development-dependencies@sha256:b68bb1f24c7e5dfb67107650995987681a156d7a34eea97744c91a88013a325a}"
           fi
          export KUBERNAUT_QUALIFICATION_DIR="$PWD/qualification-2492"
          export KUBERNAUT_BUILD_MOCK_LLM=true
          make test-e2e-fullpipeline
          FLEET_E2E=true make test-e2e-fleet
      - name: Upload operator qualification manifest
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: operator-qualification-release-${{ github.run_id }}
          path: qualification-2492
          retention-days: 90

  # ========================================
  # STAGE 1a: BUILD & PUSH amd64 IMAGES
  # 14 parallel jobs: one per service, amd64 only.
  # Helm smoke tests depend on this stage completing (Issue #569).
  #
  # Services (14):
  #   Go (13): gateway, signalprocessing, aianalysis, authwebhook,
  #            remediationorchestrator, workflowexecution, notification,
  #            datastorage, effectivenessmonitor, db-migrate, kubernautagent,
  #            apifrontend, fleetmetadatacache
  #   Bash (1): must-gather
  #
  # Strategy:
  #   - Go services: CGO_ENABLED=0 cross-compile via GOARCH (native speed)
  #   - Makefile image-build-% targets handle service-to-Dockerfile mapping
  # ========================================

  build-amd64:
    name: "${{ matrix.service }} (amd64)"
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - signalprocessing
          - aianalysis
          - authwebhook
          - remediationorchestrator
          - workflowexecution
          - notification
          - datastorage
          - effectivenessmonitor
          - kubernautagent
          - apifrontend
          - fleetmetadatacache
          - must-gather
          - db-migrate
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: true

      - name: Generate code
        run: |
          export PATH="${{ github.workspace }}/bin:$PATH"
          make generate

      - name: Login to Quay.io
        run: |
          podman login -u "${{ secrets.QUAY_ROBOT_USERNAME }}" \
                       -p "${{ secrets.QUAY_ROBOT_TOKEN }}" \
                       quay.io

      - name: Build image
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.qualification_tag }}
          IMAGE_ARCH: amd64
          IMAGE_TARGET: production
          CONTAINER_TOOL: podman
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          GIT_COMMIT: ${{ github.sha }}
          BUILD_DATE: ${{ needs.prepare.outputs.build_date }}
        run: |
          echo "Building ${{ matrix.service }} for amd64..."
          make image-build-${{ matrix.service }}

      # Development fallback uses a unique run-scoped tag so qualification can
      # consume the locally-built images without overwriting a release tag.
      - name: Push image
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.qualification_tag }}
        run: |
          IMAGE="${IMAGE_REGISTRY}/${{ matrix.service }}:${IMAGE_TAG}-amd64"
          echo "Pushing ${IMAGE}..."
          podman push "${IMAGE}"

  # ========================================
  # STAGE 1b: BUILD & PUSH arm64 IMAGES (Go services)
  # 11 parallel jobs: one per Go service, arm64 via host-native cross-compile.
  # No QEMU needed — CGO_ENABLED=0 GOARCH=arm64 runs natively on amd64.
  # Runtime images use FROM scratch with pre-built binary.
  #
  # Strategy:
  #   - Host cross-compile: go build with GOARCH=arm64 (native speed, ~25s)
  #   - Runtime image: scratch + certs from amd64 ubi-minimal (no QEMU, ~5s)
  # ========================================

  build-arm64:
    name: "${{ matrix.service }} (arm64)"
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - signalprocessing
          - aianalysis
          - authwebhook
          - remediationorchestrator
          - workflowexecution
          - notification
          - datastorage
          - effectivenessmonitor
          - kubernautagent
          - apifrontend
          - fleetmetadatacache
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: true

      - name: Generate code
        run: |
          export PATH="${{ github.workspace }}/bin:$PATH"
          make generate

      - name: Cross-compile binary (native, no QEMU)
        env:
          IMAGE_ARCH: arm64
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          GIT_COMMIT: ${{ github.sha }}
          BUILD_DATE: ${{ needs.prepare.outputs.build_date }}
        run: |
          echo "Cross-compiling ${{ matrix.service }} for arm64 (native)..."
          START=$(date +%s)
          make cross-build-${{ matrix.service }}
          END=$(date +%s)
          echo "Binary built in $(($END - $START))s"
          ls -lh bin/*-arm64

      - name: Login to Quay.io
        run: |
          podman login -u "${{ secrets.QUAY_ROBOT_USERNAME }}" \
                       -p "${{ secrets.QUAY_ROBOT_TOKEN }}" \
                       quay.io

      - name: Build runtime image (no QEMU)
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.qualification_tag }}
          IMAGE_ARCH: arm64
          CONTAINER_TOOL: podman
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          GIT_COMMIT: ${{ github.sha }}
          BUILD_DATE: ${{ needs.prepare.outputs.build_date }}
        run: |
          echo "Building runtime image ${{ matrix.service }} (arm64, no QEMU)..."
          START=$(date +%s)
          make image-runtime-${{ matrix.service }}
          END=$(date +%s)
          echo "Image built in $(($END - $START))s"

      - name: Push image
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.qualification_tag }}
        run: |
          IMAGE="${IMAGE_REGISTRY}/${{ matrix.service }}:${IMAGE_TAG}-arm64"
          echo "Pushing ${IMAGE}..."
          podman push "${IMAGE}"

  # ========================================
  # STAGE 1c: BUILD & PUSH arm64 IMAGES (non-Go services)
  # must-gather (Bash) and db-migrate (downloads goose binary) still need QEMU
  # for package installation in their respective base images.
  # ========================================

  build-arm64-qemu:
    name: "${{ matrix.service }} (arm64, QEMU)"
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        service:
          - must-gather
          - db-migrate
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          cache: true

      - name: Generate code
        run: |
          export PATH="${{ github.workspace }}/bin:$PATH"
          make generate

      - name: Install QEMU for arm64 emulation
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static
          if [ -f /proc/sys/fs/binfmt_misc/qemu-aarch64 ]; then
            echo "QEMU aarch64 registered successfully"
          else
            echo "::warning::QEMU aarch64 not registered in binfmt_misc"
          fi

      - name: Login to Quay.io
        run: |
          podman login -u "${{ secrets.QUAY_ROBOT_USERNAME }}" \
                       -p "${{ secrets.QUAY_ROBOT_TOKEN }}" \
                       quay.io

      - name: Build image
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.qualification_tag }}
          IMAGE_ARCH: arm64
          IMAGE_TARGET: production
          CONTAINER_TOOL: podman
          APP_VERSION: ${{ needs.prepare.outputs.version }}
          GIT_COMMIT: ${{ github.sha }}
          BUILD_DATE: ${{ needs.prepare.outputs.build_date }}
        run: |
          echo "::group::arm64 QEMU build for ${{ matrix.service }}"
          echo "Building ${{ matrix.service }} for arm64 (QEMU emulated)..."
          echo "Start: $(date -u '+%H:%M:%S UTC')"

          # Background heartbeat: prints elapsed time every 60s
          (
            LOOP_START=$SECONDS
            while true; do
              sleep 60
              ELAPSED=$(( (SECONDS - LOOP_START) / 60 ))
              BUILD_PID=$(pgrep -f "podman build" || echo "none")
              QEMU_PROCS=$(pgrep -c qemu-aarch64 2>/dev/null || echo "0")
              echo "[heartbeat +${ELAPSED}m] podman_pid=${BUILD_PID} qemu_procs=${QEMU_PROCS}"
            done
          ) &
          HEARTBEAT_PID=$!

          make image-build-${{ matrix.service }}
          BUILD_EXIT=$?

          kill $HEARTBEAT_PID 2>/dev/null || true
          echo "Finished: $(date -u '+%H:%M:%S UTC') (exit: $BUILD_EXIT)"
          echo "::endgroup::"
          exit $BUILD_EXIT

      - name: Push image
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.qualification_tag }}
        run: |
          IMAGE="${IMAGE_REGISTRY}/${{ matrix.service }}:${IMAGE_TAG}-arm64"
          echo "Pushing ${IMAGE}..."
          podman push "${IMAGE}"

  # ========================================
  # STAGE 1d: SECURITY SCAN (amd64)
  # Runs Trivy CVE scan and generates CycloneDX SBOM for each amd64 image.
  # Gates the GitHub Release — any CRITICAL/HIGH unfixed CVE blocks release.
  # Authority: Issue #1315 | FedRAMP RA-5, SA-12
  # ========================================

  security-scan-amd64:
    name: "Security Scan ${{ matrix.service }} (amd64)"
    needs: [prepare, build-amd64]
    if: github.event_name == 'push' || inputs.operator_candidate_manifest != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - signalprocessing
          - aianalysis
          - authwebhook
          - remediationorchestrator
          - workflowexecution
          - notification
          - datastorage
          - effectivenessmonitor
          - kubernautagent
          - apifrontend
          - fleetmetadatacache
          - must-gather
          - db-migrate
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Scan for CVEs (Trivy)
        uses: ./.github/actions/trivy-scan-with-retry
        with:
          image-ref: ${{ env.IMAGE_REGISTRY }}/${{ matrix.service }}:${{ needs.prepare.outputs.version }}-amd64
          # DD-PLATFORM-003 / BR-SECURITY-2493: user-approved kubectl risk
          # acceptance entries expire between 2027-04-11 and 2027-04-21,
          # scoped to must-gather (not service images).
          trivyignores: ${{ matrix.service == 'must-gather' && 'cmd/must-gather/.trivyignore' || '' }}

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE_REGISTRY }}/${{ matrix.service }}:${{ needs.prepare.outputs.version }}-amd64
          format: cyclonedx-json
          output-file: sbom-${{ matrix.service }}-amd64.cdx.json
          # anchore/sbom-action uploads the workflow artifact's file under
          # this exact name -- output-file only controls a local runner-disk
          # copy, it does NOT determine the uploaded artifact's filename (see
          # https://github.com/anchore/sbom-action/blob/main/src/github/SyftGithubAction.ts).
          # Must match the .cdx.json suffix sign-and-attest's
          # `cosign attest --predicate` expects after download (#2038).
          artifact-name: sbom-${{ matrix.service }}-amd64.cdx.json

  # ========================================
  # STAGE 1e: SECURITY SCAN (arm64)
  # Same as 1d but for arm64 images. Depends on both arm64 build stages.
  # Authority: Issue #1315 | FedRAMP RA-5, SA-12
  # ========================================

  security-scan-arm64:
    name: "Security Scan ${{ matrix.service }} (arm64)"
    needs: [prepare, build-arm64, build-arm64-qemu]
    if: github.event_name == 'push' || inputs.operator_candidate_manifest != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - signalprocessing
          - aianalysis
          - authwebhook
          - remediationorchestrator
          - workflowexecution
          - notification
          - datastorage
          - effectivenessmonitor
          - kubernautagent
          - apifrontend
          - fleetmetadatacache
          - must-gather
          - db-migrate
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Scan for CVEs (Trivy)
        uses: ./.github/actions/trivy-scan-with-retry
        with:
          image-ref: ${{ env.IMAGE_REGISTRY }}/${{ matrix.service }}:${{ needs.prepare.outputs.version }}-arm64
          # DD-PLATFORM-003 / BR-SECURITY-2493: user-approved kubectl risk
          # acceptance entries expire between 2027-04-11 and 2027-04-21,
          # scoped to must-gather (not service images).
          trivyignores: ${{ matrix.service == 'must-gather' && 'cmd/must-gather/.trivyignore' || '' }}

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE_REGISTRY }}/${{ matrix.service }}:${{ needs.prepare.outputs.version }}-arm64
          format: cyclonedx-json
          output-file: sbom-${{ matrix.service }}-arm64.cdx.json
          # See the amd64 job's identical comment above (#2038).
          artifact-name: sbom-${{ matrix.service }}-arm64.cdx.json

  # ========================================
  # STAGE 3: MULTI-ARCH MANIFESTS
  # After both architecture builds complete, create manifest
  # lists so a single tag (e.g., 1.0.0) resolves to the correct arch
  # automatically. Also tags every image as :latest for GA releases.
  # ========================================

  create-manifests:
    name: Create Multi-Arch Manifests
    needs: [prepare, build-amd64, build-arm64, build-arm64-qemu]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Login to Quay.io
        run: |
          podman login -u "${{ secrets.QUAY_ROBOT_USERNAME }}" \
                       -p "${{ secrets.QUAY_ROBOT_TOKEN }}" \
                       quay.io

      - name: Create and push multi-arch manifests
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.qualification_tag }}
          CONTAINER_TOOL: podman
        run: |
          echo "Creating multi-arch manifests (amd64 + arm64)..."
          make image-manifest

  tag-latest:
    name: Tag GA images as latest
    needs: [prepare, operator-qualification, create-manifests, security-scan-amd64, security-scan-arm64, sign-and-attest, provenance]
    if: >-
      always() &&
      (github.event_name == 'push' || inputs.operator_candidate_manifest != '') &&
      needs.operator-qualification.result == 'success' &&
      needs.create-manifests.result == 'success' &&
      needs.security-scan-amd64.result == 'success' &&
      needs.security-scan-arm64.result == 'success' &&
      needs.sign-and-attest.result == 'success' &&
      needs.provenance.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Login to Quay.io
        run: |
          podman login -u "${{ secrets.QUAY_ROBOT_USERNAME }}" \
                       -p "${{ secrets.QUAY_ROBOT_TOKEN }}" \
                       quay.io

      - name: Tag images as latest after qualification
        if: needs.prepare.outputs.is_prerelease == 'false'
        env:
          IMAGE_TAG: ${{ needs.prepare.outputs.version }}
        run: |
          for svc in datastorage gateway aianalysis authwebhook notification \
                     remediationorchestrator signalprocessing workflowexecution \
                     effectivenessmonitor kubernautagent apifrontend \
                     fleetmetadatacache must-gather db-migrate; do
            echo "  Tagging $svc:latest..."
            podman manifest rm ${IMAGE_REGISTRY}/$svc:latest 2>/dev/null || true
            podman manifest create ${IMAGE_REGISTRY}/$svc:latest \
              ${IMAGE_REGISTRY}/$svc:${IMAGE_TAG}-amd64 \
              ${IMAGE_REGISTRY}/$svc:${IMAGE_TAG}-arm64
            podman manifest push ${IMAGE_REGISTRY}/$svc:latest \
              docker://${IMAGE_REGISTRY}/$svc:latest
          done
          echo "All images tagged as latest"

  # ========================================
  # STAGE 3b: COSIGN SIGNING & SBOM ATTESTATION
  # Signs all arch-tagged images and manifest lists with Cosign (keyless),
  # and attests each arch's SBOM. SLSA build provenance is generated
  # separately by the `provenance` job below, via an isolated reusable
  # workflow (Build L3) -- see #1109.
  # Authority: Issue #1315, #1319 | FedRAMP CM-14, AU-3, SA-12
  # ========================================

  sign-and-attest:
    name: "Sign & Attest SBOM ${{ matrix.service }}"
    needs: [prepare, create-manifests, security-scan-amd64, security-scan-arm64]
    if: github.event_name == 'push' || inputs.operator_candidate_manifest != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write       # Cosign keyless signing via GitHub OIDC
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - signalprocessing
          - aianalysis
          - authwebhook
          - remediationorchestrator
          - workflowexecution
          - notification
          - datastorage
          - effectivenessmonitor
          - kubernautagent
          - apifrontend
          - fleetmetadatacache
          - must-gather
          - db-migrate
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Login to Quay.io (Cosign)
        run: |
          cosign login -u "${{ secrets.QUAY_ROBOT_USERNAME }}" \
                       -p "${{ secrets.QUAY_ROBOT_TOKEN }}" \
                       quay.io

      - name: Resolve image digests
        id: digests
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          SVC="${{ matrix.service }}"

          AMD64_DIGEST=$(skopeo inspect --format '{{.Digest}}' "docker://${IMAGE_REGISTRY}/${SVC}:${VERSION}-amd64")
          ARM64_DIGEST=$(skopeo inspect --format '{{.Digest}}' "docker://${IMAGE_REGISTRY}/${SVC}:${VERSION}-arm64")
          MANIFEST_DIGEST=$(skopeo inspect --format '{{.Digest}}' "docker://${IMAGE_REGISTRY}/${SVC}:${VERSION}")

          echo "amd64=${AMD64_DIGEST}" >> $GITHUB_OUTPUT
          echo "arm64=${ARM64_DIGEST}" >> $GITHUB_OUTPUT
          echo "manifest=${MANIFEST_DIGEST}" >> $GITHUB_OUTPUT

          echo "Digests for ${SVC}:"
          echo "  amd64:    ${AMD64_DIGEST}"
          echo "  arm64:    ${ARM64_DIGEST}"
          echo "  manifest: ${MANIFEST_DIGEST}"

      - name: Cosign sign images (keyless)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SVC: ${{ matrix.service }}
        run: |
          echo "Signing ${{ matrix.service }} images (keyless, GitHub OIDC)..."

          cosign sign --yes "${IMAGE_REGISTRY}/${SVC}@${{ steps.digests.outputs.amd64 }}"
          echo "  Signed ${SVC} amd64"

          cosign sign --yes "${IMAGE_REGISTRY}/${SVC}@${{ steps.digests.outputs.arm64 }}"
          echo "  Signed ${SVC} arm64"

          cosign sign --yes "${IMAGE_REGISTRY}/${SVC}@${{ steps.digests.outputs.manifest }}"
          echo "  Signed ${SVC} manifest list"

      - name: Download SBOM artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: sbom-${{ matrix.service }}-*
          path: sboms/
          merge-multiple: true

      - name: Cosign attest SBOM (amd64)
        run: |
          cosign attest --yes \
            --predicate "sboms/sbom-${{ matrix.service }}-amd64.cdx.json" \
            --type cyclonedx \
            "${IMAGE_REGISTRY}/${{ matrix.service }}@${{ steps.digests.outputs.amd64 }}"
          echo "  Attested ${{ matrix.service }} amd64 SBOM"

      - name: Cosign attest SBOM (arm64)
        run: |
          cosign attest --yes \
            --predicate "sboms/sbom-${{ matrix.service }}-arm64.cdx.json" \
            --type cyclonedx \
            "${IMAGE_REGISTRY}/${{ matrix.service }}@${{ steps.digests.outputs.arm64 }}"
          echo "  Attested ${{ matrix.service }} arm64 SBOM"

  # ========================================
  # STAGE 3c: SLSA BUILD L3 PROVENANCE
  # Generates SLSA v1.0 build provenance for each manifest list via an
  # isolated same-repo reusable workflow (slsa-provenance.yml). Running the
  # attestation step in a separate workflow_call job -- rather than inline,
  # as sign-and-attest did before -- gives it its own OIDC/Sigstore signer
  # identity that this job cannot influence or forge, which is what
  # upgrades provenance from Build L2 (self-asserted) to Build L3
  # (non-falsifiable). Verified empirically pre-merge (see #1109).
  #
  # Deliberately not slsa-framework/slsa-github-generator: that project is
  # no longer actively maintained (frozen at v2.1.0, Feb 2025) and its own
  # docs now point to this native-attestation + isolated-workflow pattern
  # instead. It also uploads its bundle as a GitHub Release asset, which
  # risks the "Cannot upload assets to an immutable release" failure mode
  # against our release job's own late asset uploads -- this approach
  # doesn't upload anything until the dedicated `release` job step below.
  #
  # Independently resolves the manifest digest (rather than reading it from
  # sign-and-attest's matrix outputs) because GitHub Actions does not
  # reliably scope a matrix job's outputs per matrix key to a downstream
  # matrix consumer.
  #
  # Authority: Issue #1109 | FedRAMP SA-12, CM-14, AU-3
  # ========================================

  provenance:
    name: "Attest ${{ matrix.service }}"
    needs: [prepare, create-manifests, security-scan-amd64, security-scan-arm64]
    if: github.event_name == 'push' || inputs.operator_candidate_manifest != ''
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - signalprocessing
          - aianalysis
          - authwebhook
          - remediationorchestrator
          - workflowexecution
          - notification
          - datastorage
          - effectivenessmonitor
          - kubernautagent
          - apifrontend
          - fleetmetadatacache
          - must-gather
          - db-migrate
    uses: ./.github/workflows/slsa-provenance.yml
    with:
      service: ${{ matrix.service }}
      # The `env` context (IMAGE_REGISTRY) is not available to the inputs of
      # a reusable workflow call, so the registry is spelled out here.
      image: quay.io/kubernaut-ai/${{ matrix.service }}
      version: ${{ needs.prepare.outputs.version }}
    secrets: inherit

  # ========================================
  # STAGE 6: GITHUB RELEASE
  # Creates a GitHub Release with auto-generated release notes.
  # Gated on manifests, security scans, signing, and provenance.
  # Downloads SBOMs from security scan jobs and attaches them
  # to the release for customer consumption.
  # Authority: Issue #569, #1315 | FedRAMP SA-12
  # ========================================

  release:
    name: Create GitHub Release
    needs: [prepare, prepare-operator-candidate, operator-qualification, create-manifests, security-scan-amd64, security-scan-arm64, sign-and-attest, provenance, tag-latest]
    if: >-
      always() &&
      (github.event_name == 'push' || inputs.operator_candidate_manifest != '') &&
      needs.prepare.result == 'success' &&
      needs.prepare-operator-candidate.result == 'success' &&
      needs.operator-qualification.result == 'success' &&
      needs.create-manifests.result == 'success' &&
      needs.security-scan-amd64.result == 'success' &&
      needs.security-scan-arm64.result == 'success' &&
      needs.sign-and-attest.result == 'success' &&
      needs.provenance.result == 'success' &&
      needs.tag-latest.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # Required for gh release create/upload
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Download all SBOM artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: sbom-*
          path: sboms/
          merge-multiple: true

      - name: Download all provenance bundle artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: provenance-*
          path: provenance/
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.is_prerelease }}
        run: |
          if gh release view "${TAG}" &>/dev/null; then
            echo "Release ${TAG} already exists — skipping creation."
          else
            PRERELEASE_FLAG=""
            if [ "$IS_PRERELEASE" = "true" ]; then
              PRERELEASE_FLAG="--prerelease"
            fi

            # #1721 follow-up: the previous-tag lookup must be ancestry-aware
            # (--merged "${TAG}"), not just the 2nd-most-recently-*created*
            # tag repo-wide. Kubernaut maintains diverging release lines
            # (e.g. release/v1.5 patches vs. main/v1.6 pre-releases), so a
            # tag like v1.6.0-rc1 can be created chronologically between two
            # v1.5.x patch tags while living on a completely different
            # branch. Plain --sort=-creatordate picked v1.6.0-rc1 as the
            # "previous" tag for v1.5.4 (it isn't even an ancestor of
            # release/v1.5), producing a wrong "Full Changelog: v1.6.0-rc1...
            # v1.5.4" comparison link. --merged "${TAG}" restricts the tag
            # list to commits actually reachable from this release's own
            # commit, so it always resolves to the true previous release in
            # the same lineage (e.g. v1.5.3 for v1.5.4).
            #
            # #2130 follow-up: for a GA release, the candidate list must ALSO
            # exclude pre-release tags (-rc*, -alpha*, -beta*, etc.).
            # Promoting an RC straight to GA (e.g. v1.5.6-rc6 -> v1.5.6) means
            # every rc tag for this release is an ancestor of the GA tag and
            # was created more recently than the last true GA release, so an
            # unfiltered --sort=-creatordate picked v1.5.6-rc6 as "previous"
            # for v1.5.6, producing a "Full Changelog: v1.5.6-rc6...v1.5.6"
            # link that only covered the final RC->GA diff instead of the
            # full v1.5.5...v1.5.6 release contents. GA tags are strict
            # semver (vX.Y.Z, no pre-release suffix); pre-release tags always
            # have a trailing "-something". When creating a pre-release
            # ourselves, no such filtering is needed -- rc-to-rc comparisons
            # are the correct, expected behavior.
            if [ "$IS_PRERELEASE" = "true" ]; then
              PREV_TAG_CANDIDATES="$(git tag --sort=-creatordate --merged "${TAG}" | grep '^v' | grep -v "^${TAG}$")"
            else
              PREV_TAG_CANDIDATES="$(git tag --sort=-creatordate --merged "${TAG}" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${TAG}$")"
            fi

            gh release create "${TAG}" \
              --title "Kubernaut ${TAG}" \
              --generate-notes \
              ${PRERELEASE_FLAG} \
              --notes-start-tag "$(echo "${PREV_TAG_CANDIDATES}" | head -1)" || \
            gh release create "${TAG}" \
              --title "Kubernaut ${TAG}" \
              --generate-notes \
              ${PRERELEASE_FLAG}

            echo ""
            echo "Release created: https://github.com/${{ github.repository }}/releases/tag/${TAG}"
          fi

      - name: Attach SBOMs to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          echo "Attaching SBOMs to release ${TAG}..."
          SBOM_COUNT=0
          for sbom in sboms/*.cdx.json; do
            if [ -f "$sbom" ]; then
              echo "  Uploading $(basename "$sbom")..."
              gh release upload "${TAG}" "$sbom" --clobber
              SBOM_COUNT=$((SBOM_COUNT + 1))
            fi
          done
          echo "Attached ${SBOM_COUNT} SBOMs to release ${TAG}"

      - name: Attach SLSA provenance bundles to release
        # Authority: OpenSSF Scorecard "Signed-Releases" check — requires
        # signature/provenance files attached to the release itself, not just
        # pushed to the image registry (see sign-and-attest job).
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          echo "Attaching SLSA provenance bundles to release ${TAG}..."
          PROVENANCE_COUNT=0
          for bundle in provenance/*.sigstore.json; do
            if [ -f "$bundle" ]; then
              echo "  Uploading $(basename "$bundle")..."
              gh release upload "${TAG}" "$bundle" --clobber
              PROVENANCE_COUNT=$((PROVENANCE_COUNT + 1))
            fi
          done
          echo "Attached ${PROVENANCE_COUNT} provenance bundles to release ${TAG}"
