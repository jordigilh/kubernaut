              sizeLimit: 8Mi

  - it: "kubernaut-agent mounts /tmp even when monitoring TLS is disabled (the exact must-gather-e2e failure scenario)"
    template: templates/kubernaut-agent/kubernaut-agent.yaml
    set:
      monitoring:
        prometheus:
          tlsCaFile: ""
        alertManager:
          tlsCaFile: ""
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tmp
