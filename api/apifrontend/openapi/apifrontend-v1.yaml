openapi: "3.1.0"
info:
  title: kubernaut API Frontend
  version: "1.5.0"
  description: |
    API surface for the kubernaut API Frontend service, including operational
    REST endpoints and protocol endpoints (MCP Streamable HTTP and A2A JSON-RPC 2.0).

    Supported Protocol Versions:
    - MCP: Streamable HTTP (2025-03-26)
    - A2A: v0.3.0 (JSON-RPC 2.0 over HTTPS)
  contact:
    name: kubernaut team
  license:
    name: Apache-2.0
    identifier: Apache-2.0

servers:
  - url: https://localhost:8443
    description: Local development

paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe
      description: Returns "ok" when the process is alive. Does not check downstream dependencies.
      tags: [operations]
      responses:
        "200":
          description: Process is alive
          content:
            text/plain:
              schema:
                type: string
                const: "ok"

  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness probe
      description: Returns "ok" when the service is ready to accept traffic (JWKS loaded, dependencies reachable). Returns 503 during drain.
      tags: [operations]
      responses:
        "200":
          description: Service is ready
          content:
            text/plain:
              schema:
                type: string
                const: "ok"
        "503":
          description: Service is not ready (draining or dependencies unavailable)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /metrics:
    get:
      operationId: getMetrics
      summary: Prometheus metrics endpoint
      description: Exposes all af_* Prometheus metrics in OpenMetrics format.
      tags: [operations]
      responses:
        "200":
          description: Prometheus scrape response
          content:
            application/openmetrics-text:
              schema:
                type: string
            text/plain:
              schema:
                type: string

  /.well-known/agent-card.json:
    get:
      operationId: getAgentCard
      summary: A2A Agent Card
      description: |
        Returns the agent's self-describing manifest per the A2A protocol specification.
        Unauthenticated callers receive a shell card (metadata only, empty skills array).
        Authenticated callers receive the full card including available skills scoped to
        their RBAC role.
      tags: [a2a]
      responses:
        "200":
          description: Agent Card JSON
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentCard"

  /.well-known/kubernaut-console-contract.json:
    get:
      operationId: getConsoleBackendContract
      summary: API Frontend backend-incarnation contract
      description: |
        Returns the opaque backend incarnation used by Console #168 to fence
        stale work after an API Frontend process replacement. This endpoint is
        public through the same-origin API path, contains no credentials or
        user identity, and is never cached.
      tags: [console]
      security: []
      responses:
        "200":
          description: Current process incarnation
          headers:
            Cache-Control:
              description: The contract must not be cached.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackendIncarnationContract"

  /a2a/invoke:
    post:
      operationId: postA2AInvoke
      summary: A2A JSON-RPC 2.0 endpoint
      description: |
        Accepts A2A protocol messages (JSON-RPC 2.0). Supported methods include
        message/send. Requires Bearer JWT authentication.
      tags: [a2a]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonRpcRequest"
      responses:
        "200":
          description: JSON-RPC 2.0 response. Authenticated responses include the backend-incarnation lifecycle header.
          headers:
            X-Kubernaut-Backend-Incarnation:
              $ref: "#/components/headers/BackendIncarnation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonRpcResponse"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "429":
          description: Rate limit exceeded. The lifecycle header is absent when the pre-authentication IP limiter rejects the request and present when authenticated post-authentication rate limiting rejects it.
          headers:
            X-Kubernaut-Backend-Incarnation:
              $ref: "#/components/headers/BackendIncarnationConditional429"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /:
    post:
      operationId: postA2ARoot
      summary: A2A JSON-RPC 2.0 root alias (issue #1268)
      description: |
        Compatibility alias for POST /a2a/invoke. Identical behavior, auth, and
        rate limiting. Added for kagenti and A2A ecosystem clients that POST
        JSON-RPC messages to the root path per de facto convention.
      tags: [a2a]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonRpcRequest"
      responses:
        "200":
          description: JSON-RPC 2.0 response. Authenticated responses include the backend-incarnation lifecycle header.
          headers:
            X-Kubernaut-Backend-Incarnation:
              $ref: "#/components/headers/BackendIncarnation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonRpcResponse"
        "401":
          description: Missing or invalid Bearer token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "429":
          description: Rate limit exceeded. The lifecycle header is absent when the pre-authentication IP limiter rejects the request and present when authenticated post-authentication rate limiting rejects it.
          headers:
            X-Kubernaut-Backend-Incarnation:
              $ref: "#/components/headers/BackendIncarnationConditional429"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /mcp:
    post:
      operationId: postMCP
      summary: MCP Streamable HTTP endpoint
      description: |
        Model Context Protocol endpoint (Streamable HTTP transport, spec 2025-03-26).
        Accepts JSON-RPC 2.0 requests for initialize, tools/list, tools/call, etc.
        Responds with application/json or text/event-stream depending on Accept header.
        Requires Bearer JWT authentication. Returns 501 when MCP is disabled.
      tags: [mcp]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonRpcRequest"
      responses:
        "200":
          description: JSON-RPC response (plain JSON or SSE stream). Authenticated responses include the backend-incarnation lifecycle header.
          headers:
            X-Kubernaut-Backend-Incarnation:
              $ref: "#/components/headers/BackendIncarnation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonRpcResponse"
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events stream
        "401":
          description: Missing or invalid Bearer token
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "429":
          description: Rate limit exceeded. The lifecycle header is absent when the pre-authentication IP limiter rejects the request and present when authenticated post-authentication rate limiting rejects it.
          headers:
            X-Kubernaut-Backend-Incarnation:
              $ref: "#/components/headers/BackendIncarnationConditional429"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "501":
          description: MCP not enabled
          headers:
            X-Kubernaut-Backend-Incarnation:
              $ref: "#/components/headers/BackendIncarnation"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

        "503":
          description: SSE connection cap reached after authentication
          headers:
            X-Kubernaut-Backend-Incarnation:
              $ref: "#/components/headers/BackendIncarnation"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /a2a/status:
    post:
      operationId: postA2AStatus
      summary: A2A status subscription
      description: |
        Authenticated status subscription endpoint. Successful subscriptions
        stream Server-Sent Events. Parse and body-limit failures remain HTTP
        400 JSON-RPC invalid_request responses; authenticated responses include
        the backend-incarnation lifecycle header.
      tags: [a2a]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonRpcRequest"
      responses:
        "200":
          description: Status Server-Sent Events stream
          headers:
            X-Kubernaut-Backend-Incarnation:
              $ref: "#/components/headers/BackendIncarnation"
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Invalid JSON-RPC request, including the status body-limit response; message is invalid_request.
          headers:
            X-Kubernaut-Backend-Incarnation:
              $ref: "#/components/headers/BackendIncarnation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonRpcResponse"
        "401":
          description: Missing or invalid Bearer token; no lifecycle header is returned.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "429":
          description: Rate limit exceeded. The lifecycle header is absent for pre-authentication IP rejection and present for authenticated post-authentication rejection.
          headers:
            X-Kubernaut-Backend-Incarnation:
              $ref: "#/components/headers/BackendIncarnationConditional429"
        "503":
          description: SSE connection cap reached after authentication
          headers:
            X-Kubernaut-Backend-Incarnation:
              $ref: "#/components/headers/BackendIncarnation"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"

  /api/v1/console/policies/scope:
    get:
      operationId: getConsolePolicyScope
      summary: Read sanitized policy and managed-scope metadata
      description: |
        Returns the authenticated Console projection of effective managed scope,
        configured policy identity/revision metadata, the operator-supplied
        AIAnalysis approval threshold, and bounded historical evaluations.
        Policy source, secrets, arbitrary labels, and full Kubernetes objects are
        never returned. `cluster_id=local` is the only supported list target for
        this release; non-local policy-scope requests return a state-only
        `unavailable` response. The endpoint is same-origin compatible and
        requires the verified interactive user identity from the Bearer token.
      tags: [console]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConsoleClusterID"
        - $ref: "#/components/parameters/ConsoleNamespace"
        - $ref: "#/components/parameters/ConsoleGroup"
        - $ref: "#/components/parameters/ConsoleVersion"
        - $ref: "#/components/parameters/ConsoleKind"
        - $ref: "#/components/parameters/ConsoleName"
        - $ref: "#/components/parameters/ConsoleResourceID"
        - $ref: "#/components/parameters/ConsoleLimit"
        - $ref: "#/components/parameters/ConsoleCursor"
      responses:
        "200":
          description: Complete policy/scope projection, including an empty page when no records match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyScopePage"
        "400":
          description: Invalid, duplicated, unsupported, or contradictory filter
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Missing or invalid authentication
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: Endpoint capability or requested list scope denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleStateEnvelope"
        "503":
          description: Required local source is unavailable or incomplete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleStateEnvelope"

  /api/v1/console/inventory/managed-resources:
    get:
      operationId: listConsoleManagedResources
      summary: List sanitized managed-resource inventory
      description: |
        Returns bounded, cursor-paginated managed-resource identity metadata for
        the API Frontend hub. `local` is the only supported list target for this
        release; non-local list requests return a state-only `unavailable`
        response and do not invoke a remote inventory list projection.
      tags: [console]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ConsoleClusterID"
        - $ref: "#/components/parameters/ConsoleNamespace"
        - $ref: "#/components/parameters/ConsoleGroup"
        - $ref: "#/components/parameters/ConsoleVersion"
        - $ref: "#/components/parameters/ConsoleKind"
        - $ref: "#/components/parameters/ConsoleName"
        - $ref: "#/components/parameters/ConsoleResourceID"
        - $ref: "#/components/parameters/ConsoleLimit"
        - $ref: "#/components/parameters/ConsoleCursor"
      responses:
        "200":
          description: Complete inventory page, including an empty page when no records match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedResourcePage"
        "400":
          description: Invalid, duplicated, unsupported, or contradictory filter
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Missing or invalid authentication
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: Endpoint capability or requested list scope denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleStateEnvelope"
        "503":
          description: Required local source is unavailable or incomplete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleStateEnvelope"

  /api/v1/console/inventory/managed-resources/{resourceID}:
    get:
      operationId: getConsoleManagedResource
      summary: Read one sanitized managed-resource identity
      description: |
        Resolves an opaque resource ID without decoding target identity from the
        URL. Local exact reads require a target-scope SAR; remote exact reads
        additionally require the existing managed-scope checker. Denial is
        intentionally indistinguishable from absence.
      tags: [console]
      security:
        - bearerAuth: []
      parameters:
        - name: resourceID
          in: path
          required: true
          description: Opaque canonical resource ID returned by the list operation
          schema:
            type: string
            pattern: "^[A-Za-z0-9._~-]+$"
            maxLength: 253
        - $ref: "#/components/parameters/ConsoleClusterID"
      responses:
        "200":
          description: Sanitized managed-resource identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManagedResource"
        "400":
          description: Invalid or contradictory exact-read filter
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: Missing or invalid authentication
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Resource is absent or exact target access is denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleStateEnvelope"
        "503":
          description: Required source is unavailable or incomplete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleStateEnvelope"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  headers:
    BackendIncarnation:
      description: Opaque canonical lowercase UUIDv4 identifying the current API Frontend process. Returned only after authentication on lifecycle routes.
      schema:
        type: string
        minLength: 36
        maxLength: 36
        pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
    BackendIncarnationConditional429:
      description: Present only when the authenticated post-authentication limiter rejects the request; absent when the pre-authentication IP limiter rejects it.
      schema:
        type: string
        minLength: 36
        maxLength: 36
        pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"

  parameters:
    ConsoleClusterID:
      name: cluster_id
      in: query
      required: true
      description: Explicit cluster identity; `local` is supported for list and
        policy-scope reads, while non-local identities remain supported for
        exact reads only
      schema:
        type: string
        minLength: 1
        maxLength: 253
        pattern: "^[A-Za-z0-9._:/-]+$"
    ConsoleNamespace:
      name: namespace
      in: query
      required: false
      schema:
        type: string
        maxLength: 253
        pattern: "^[A-Za-z0-9._:/-]+$"
    ConsoleGroup:
      name: group
      in: query
      required: false
      schema:
        type: string
        maxLength: 253
        pattern: "^[A-Za-z0-9._:/-]+$"
    ConsoleVersion:
      name: version
      in: query
      required: false
      schema:
        type: string
        maxLength: 253
        pattern: "^[A-Za-z0-9._:/-]+$"
    ConsoleKind:
      name: kind
      in: query
      required: false
      schema:
        type: string
        maxLength: 253
        pattern: "^[A-Za-z0-9._:/-]+$"
    ConsoleName:
      name: name
      in: query
      required: false
      schema:
        type: string
        maxLength: 253
        pattern: "^[A-Za-z0-9._:/-]+$"
    ConsoleResourceID:
      name: resource_id
      in: query
      required: false
      schema:
        type: string
        maxLength: 253
        pattern: "^[A-Za-z0-9._~-]+$"
    ConsoleLimit:
      name: limit
      in: query
      required: false
      description: Bounded page size; defaults to 50 and cannot exceed 100
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    ConsoleCursor:
      name: cursor
      in: query
      required: false
      description: Opaque continuation token returned by a previous list page
      schema:
        type: string
        maxLength: 512
        pattern: "^[A-Za-z0-9._~-]+$"

  schemas:
    AgentCard:
      type: object
      required: [name, url, version, skills, authentication, capabilities, protocolVersion]
      properties:
        name:
          type: string
        description:
          type: string
        url:
          type: string
          format: uri
        version:
          type: string
        protocolVersion:
          type: string
          description: A2A protocol version supported
        skills:
          type: array
          items:
            $ref: "#/components/schemas/AgentSkill"
        authentication:
          type: object
          properties:
            schemes:
              type: array
              items:
                type: object
                properties:
                  scheme:
                    type: string
        capabilities:
          type: object
          properties:
            streaming:
              type: boolean
            pushNotifications:
              type: boolean
            stateTransitionHistory:
              type: boolean
        provider:
          type: object
          properties:
            organization:
              type: string

    AgentSkill:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string

    BackendIncarnationContract:
      type: object
      additionalProperties: false
      required: [backend_incarnation]
      properties:
        backend_incarnation:
          type: string
          minLength: 36
          maxLength: 36
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
          description: Opaque canonical lowercase UUIDv4 stable for one API Frontend process.

    JsonRpcRequest:
      type: object
      required: [jsonrpc, method]
      properties:
        jsonrpc:
          type: string
          const: "2.0"
        id:
          oneOf:
            - type: string
            - type: integer
        method:
          type: string
        params:
          type: object

    JsonRpcResponse:
      type: object
      required: [jsonrpc]
      properties:
        jsonrpc:
          type: string
          const: "2.0"
        id:
          oneOf:
            - type: string
            - type: integer
        result:
          type: object
        error:
          type: object
          properties:
            code:
              type: integer
            message:
              type: string
            data: {}

    ConsoleReadState:
      type: string
      enum: [success, empty, partial, stale, unavailable, forbidden, not_found]
      description: |
        Server-emitted projection state. `loading` is a Console client state
        and is never emitted by API Frontend. The wire contract exposes no
        count, total, reload, or snapshot metadata. Successful and empty pages
        include the time observed and bounded freshness state for that read;
        these fields do not provide a cross-request snapshot or synchronization
        watermark. `stale` remains in the shared state vocabulary for qualified
        backends; a freshness value does not change the read state by itself.

    ConsoleStateEnvelope:
      type: object
      required: [state, message]
      additionalProperties: false
      properties:
        state:
          $ref: "#/components/schemas/ConsoleReadState"
        request_id:
          type: string
        message:
          type: string
          description: Safe generic message without source or target details

    ManagedScope:
      type: object
      required: [included, resource_label, namespace_label, source, cluster_scoped]
      additionalProperties: false
      properties:
        included:
          type: boolean
        resource_label:
          type: string
          enum: ["true", "false", absent, invalid]
        namespace_label:
          type: string
          enum: ["true", "false", absent, invalid]
        source:
          type: string
          enum: [resource-label, namespace-label, none, unavailable]
        cluster_scoped:
          type: boolean

    ManagedResource:
      type: object
      required: [id, cluster_id, group, version, kind, name, scope]
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: "^[A-Za-z0-9._~-]+$"
        cluster_id:
          type: string
        group:
          type: string
        version:
          type: string
        kind:
          type: string
        namespace:
          type: string
        name:
          type: string
        scope:
          $ref: "#/components/schemas/ManagedScope"
    ManagedResourcePage:
      type: object
      required: [state, observed_at, freshness, completeness]
      additionalProperties: false
      properties:
        state:
          $ref: "#/components/schemas/ConsoleReadState"
        observed_at:
          type: string
          format: date-time
          description: Time at which this page was observed by the backend read
        freshness:
          $ref: "#/components/schemas/ConsoleFreshness"
        completeness:
          type: string
          enum: [complete, partial]
        items:
          type: array
          items:
            $ref: "#/components/schemas/ManagedResource"
        next_cursor:
          type: string

    PolicyThreshold:
      type: object
      required: [value, source, kind]
      additionalProperties: false
      properties:
        value:
          type: number
          exclusiveMinimum: 0
          maximum: 1
        source:
          type: string
          const: runtime-config
        kind:
          type: string
          const: rego-approval

    PolicyMetadata:
      type: object
      required: [type, configMapName, configMapKey, revision]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [aiAnalysis, signalProcessing]
        configMapName:
          type: string
        configMapKey:
          type: string
          enum: [approval.rego, policy.rego]
        revision:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        threshold:
          $ref: "#/components/schemas/PolicyThreshold"

    HistoricalEvaluation:
      type: object
      required: [source, observedAt]
      additionalProperties: false
      properties:
        source:
          type: string
          enum: [AIAnalysis, SignalProcessing]
        observedAt:
          type: string
          format: date-time
          description: Source-record evaluation timestamp; not a Console freshness marker
        policyHash:
          type: string
        matchedRules:
          type: array
          maxItems: 16
          items:
            type: string
            maxLength: 128
        decision:
          type: string

    ConsoleFreshness:
      type: object
      required: [state, as_of]
      additionalProperties: false
      description: |
        Bounded freshness metadata for the completed backend read. This is not
        a transactional snapshot or a source synchronization watermark.
      properties:
        state:
          type: string
          enum: [fresh, stale]
        as_of:
          type: string
          format: date-time

    PolicyScopeItem:
      type: object
      required: [id, resource, currentPolicies, inventoryLink]
      additionalProperties: false
      properties:
        id:
          type: string
        resource:
          $ref: "#/components/schemas/ManagedResource"
        currentPolicies:
          type: array
          items:
            $ref: "#/components/schemas/PolicyMetadata"
        historicalEvaluations:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/HistoricalEvaluation"
        inventoryLink:
          type: string
          format: uri-reference

    PolicyScopePage:
      type: object
      required: [apiVersion, kind, state, observedAt, freshness, completeness]
      additionalProperties: false
      properties:
        apiVersion:
          type: string
          const: console.kubernaut.ai/v1
        kind:
          type: string
          const: PolicyScopeList
        state:
          $ref: "#/components/schemas/ConsoleReadState"
        observedAt:
          type: string
          format: date-time
          description: Time at which this page was observed by the backend read
        freshness:
