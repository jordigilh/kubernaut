kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
- role: control-plane
  extraMounts:
  - hostPath: ./coverdata
    containerPath: /coverdata
    readOnly: false
  extraPortMappings:
  - containerPort: 30088
    hostPort: 8088
    protocol: TCP
  - containerPort: 30188
    hostPort: 28088
    protocol: TCP
  - containerPort: 30988
    hostPort: 9088
    protocol: TCP
  - containerPort: 30089
    hostPort: 8089
    protocol: TCP
  - containerPort: 30281
    hostPort: 28089
    protocol: TCP
  - containerPort: 30439
    hostPort: 30439
    protocol: TCP
  - containerPort: 30387
    hostPort: 30387
    protocol: TCP
  - containerPort: 30443
    hostPort: 18443
    protocol: TCP
  - containerPort: 30081
    hostPort: 18081
    protocol: TCP
  - containerPort: 30190
    hostPort: 9190
    protocol: TCP
  - containerPort: 30191
    hostPort: 9193
    protocol: TCP
  - containerPort: 30556
    hostPort: 5556
    protocol: TCP
  # Fleet Keycloak OIDC + RFC 8693 token exchange.
  - containerPort: 30557
    hostPort: 30557
    protocol: TCP
  # Envoy AI Gateway MCP endpoint.
  - containerPort: 31976
    hostPort: 31976
    protocol: TCP
  kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    apiServer:
      extraArgs:
        max-requests-inflight: "800"
        max-mutating-requests-inflight: "400"
