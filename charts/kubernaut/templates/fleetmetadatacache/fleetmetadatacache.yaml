{{- /*
checksum/config (Issue #1737 gap) needs this content reachable from the
Deployment's pod template annotations, a separate `include` call site from
the ConfigMap below -- named templates don't inherit $-scoped variables from
their caller (and can't be `define`d inside this file's top-level `if`
below), so $fmcFleetPreamble must be recomputed here rather than reused.
*/}}
{{- define "kubernaut.fleetmetadatacache.configYAML" -}}
{{- $fmcFleetPreamble := include "kubernaut.fleet.preamble" (dict "root" . "fleet" .Values.fleetmetadatacache "oauth2" .Values.fleetmetadatacache.oauth2) | fromYaml -}}
server:
  apiAddr: ":8080"
  healthAddr: ":8081"
  metricsAddr: ":9090"
  tls:
    certDir: {{ include "kubernaut.interServiceTLS.certDir" . | quote }}
mcpGateway:
  endpoint: {{ $fmcFleetPreamble.config.mcpGatewayEndpoint | quote }}
  gatewayType: {{ $fmcFleetPreamble.config.mcpGatewayType | quote }}
  namespace: {{ .Values.fleetmetadatacache.namespace | quote }}
valkey:
  {{- /* values.yaml documents valkeyAddr: "" as "uses shared Valkey
  instance", but left unimplemented that default actually falls through to
  an empty string (Go binary's ServiceConfig.Validate() then rejects it with
  "valkey.addr is required" at startup, Issue #1737 DD-TEST-015 regression --
  same class of gap as global.fleet.backend above: a documented default that
  was never materialized in the template). kubernaut.valkey.addr already
  computes the chart's own shared Valkey Service address (or the BYO
  valkey.host when valkey.enabled=false) for postgresql/datastorage; reuse it
  here instead of requiring every fleetmetadatacache.enabled=true caller to
  redundantly pass --set fleetmetadatacache.valkeyAddr=valkey:6379. */}}
  addr: {{ .Values.fleetmetadatacache.valkeyAddr | default (include "kubernaut.valkey.addr" .) | quote }}
sync:
  interval: {{ .Values.fleetmetadatacache.syncInterval | quote }}
  keyTtl: {{ .Values.fleetmetadatacache.keyTTL | quote }}
oauth2:
  tokenUrl: {{ $fmcFleetPreamble.oauth2.tokenURL | quote }}
  credentialsDir: "/etc/fleetmetadatacache/fleet-oauth2"
{{- end }}
{{- if .Values.fleetmetadatacache.enabled }}
{{- $fmcFleetPreamble := include "kubernaut.fleet.preamble" (dict "root" $ "fleet" .Values.fleetmetadatacache "oauth2" .Values.fleetmetadatacache.oauth2) | fromYaml }}
{{- if not $fmcFleetPreamble.config.mcpGatewayEndpoint }}
{{- fail "global.fleet.mcpGatewayEndpoint is required when fleetmetadatacache.enabled=true — FleetMetadataCache polls remote clusters via the MCP Gateway" }}
{{- end }}
{{- if not $fmcFleetPreamble.oauth2.tokenURL }}
{{- fail "global.fleet.oauth2.tokenURL is required when fleetmetadatacache.enabled=true — MCP Gateway requires OAuth2 authentication" }}
{{- end }}
{{- if not $fmcFleetPreamble.oauth2.credentialsSecretRef }}
{{- fail "global.fleet.oauth2.credentialsSecretRef (or fleetmetadatacache.oauth2.credentialsSecretRef) is required when fleetmetadatacache.enabled=true (Secret must contain keys: client-id, client-secret)" }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fleetmetadatacache-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: fleetmetadatacache
    app.kubernetes.io/component: fleet-metadata-cache
    {{- include "kubernaut.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- include "kubernaut.fleetmetadatacache.configYAML" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleetmetadatacache
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: fleetmetadatacache
    app.kubernetes.io/component: fleet-metadata-cache
    {{- include "kubernaut.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.fleetmetadatacache.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: fleetmetadatacache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fleetmetadatacache
        app.kubernetes.io/component: fleet-metadata-cache
      annotations:
        checksum/config: {{ include "kubernaut.fleetmetadatacache.configYAML" . | sha256sum }}
    spec:
      serviceAccountName: fleetmetadatacache
      {{- include "kubernaut.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "kubernaut.podSecurityContext" .Values.fleetmetadatacache | nindent 8 }}
      {{- include "kubernaut.affinity" (dict "component" .Values.fleetmetadatacache "matchLabels" (dict "app.kubernetes.io/name" "fleetmetadatacache")) | nindent 6 }}
      {{- include "kubernaut.scheduling" (dict "component" .Values.fleetmetadatacache "global" .Values.global) | nindent 6 }}
      containers:
        - name: fleetmetadatacache
          image: "{{ .Values.fleetmetadatacache.image.repository }}:{{ .Values.fleetmetadatacache.image.tag }}"
          imagePullPolicy: {{ .Values.fleetmetadatacache.image.pullPolicy }}
          securityContext:
            {{- include "kubernaut.containerSecurityContext" .Values.fleetmetadatacache | nindent 12 }}
          args:
            - "--config=/etc/fleetmetadatacache/config.yaml"
          ports:
            - name: api
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          {{- /* DD-PLATFORM-008: FMC (always fleet-enabled by definition --
          this whole Deployment is gated on fleetmetadatacache.enabled=true)
          builds its OAuth2 token source and MCP Gateway connection
          synchronously at boot (main.go's "FMC starting" log precedes any
          successful sync), the same blocking-dependency shape already fixed
          for apifrontend/effectivenessmonitor/workflowexecution (confirmed
          via a liveness-probe-induced crash loop, "Readiness probe
          failed... connection refused" then "Liveness probe failed... will
          be restarted", during Issue #1737 Fleet E2E validation). Applying
          the shared helper here follows the DD's own "default remediation
          pattern going forward" guidance rather than reinventing probe
          tuning for this service. */}}
          {{- include "kubernaut.startupProbe" (dict "port" "health") | nindent 10 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.fleetmetadatacache.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/fleetmetadatacache
              readOnly: true
            - name: oauth2-credentials
              mountPath: /etc/fleetmetadatacache/fleet-oauth2
              readOnly: true
            - name: tls-certs
              mountPath: {{ include "kubernaut.interServiceTLS.certDir" . }}
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: fleetmetadatacache-config
        - name: oauth2-credentials
          secret:
            secretName: {{ $fmcFleetPreamble.oauth2.credentialsSecretRef }}
        - name: tls-certs
          secret:
            secretName: fleetmetadatacache-tls
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: fleetmetadatacache-service
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: fleetmetadatacache
    app.kubernetes.io/component: fleet-metadata-cache
    {{- include "kubernaut.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fleetmetadatacache
  ports:
    - name: api
      port: 8080
      targetPort: api
      protocol: TCP
    - name: health
      port: 8081
      targetPort: health
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fleetmetadatacache
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: fleetmetadatacache
    app.kubernetes.io/component: fleet-metadata-cache
    {{- include "kubernaut.labels" . | nindent 4 }}
{{- /*
#1686 (BR-RBAC-020): FMC's ClusterRole exists solely to grant its
ClusterRegistry's CRD watch (there is no other rule in this ClusterRole),
so when fleetmetadatacache.namespace scopes that watch to one namespace, the
ClusterRole/ClusterRoleBinding are skipped entirely in favor of the
namespace-scoped Role/RoleBinding below (least privilege) instead of
rendering a redundant empty ClusterRole.
*/}}
{{- if not .Values.fleetmetadatacache.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fleetmetadatacache
  labels:
    app.kubernetes.io/name: fleetmetadatacache
    {{- include "kubernaut.labels" . | nindent 4 }}
rules:
{{- if eq $fmcFleetPreamble.config.mcpGatewayType "kuadrant" }}
  - apiGroups: ["mcp.kuadrant.io"]
    resources: ["mcpserverregistrations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways", "httproutes"]
    verbs: ["get", "list", "watch"]
{{- else }}
  - apiGroups: ["gateway.envoyproxy.io"]
    resources: ["backends"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["aigateway.envoyproxy.io"]
    resources: ["mcproutes"]
    verbs: ["get", "list", "watch"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fleetmetadatacache
  labels:
    app.kubernetes.io/name: fleetmetadatacache
    {{- include "kubernaut.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fleetmetadatacache
subjects:
  - kind: ServiceAccount
    name: fleetmetadatacache
    namespace: {{ .Release.Namespace }}
{{- else }}
---
# #1686 (BR-RBAC-020): namespace-scoped equivalent of the ClusterRole rules
# above, granted instead of them when fleetmetadatacache.namespace is set.
{{ include "kubernaut.fleet.registryNsRBAC" (dict "name" "fleetmetadatacache" "serviceAccount" "fleetmetadatacache" "namespace" .Values.fleetmetadatacache.namespace "appLabels" "app.kubernetes.io/name: fleetmetadatacache" "mcpServerRegistrations" (eq $fmcFleetPreamble.config.mcpGatewayType "kuadrant") "kuadrantGateways" (eq $fmcFleetPreamble.config.mcpGatewayType "kuadrant") "eaigwBackends" (ne $fmcFleetPreamble.config.mcpGatewayType "kuadrant") "Release" .Release "labels" (include "kubernaut.labels" .)) }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fleetmetadatacache
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: fleetmetadatacache
    app.kubernetes.io/component: fleet-metadata-cache
    {{- include "kubernaut.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fleetmetadatacache
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: remediationorchestrator
      ports:
        - protocol: TCP
          port: 8080
    {{- include "kubernaut.np.metricsIngress" . | nindent 4 }}
  egress:
    - to:
        - podSelector:
            # Issue #1737 gap found: infrastructure/valkey.yaml's pod template only
            # carries the legacy "app: valkey" label (predates the
            # "app.kubernetes.io/name" convention used elsewhere in this file) --
            # the selector below never matched any pod, silently dropping all FMC
            # egress to Valkey (default-deny) and blocking FMC's readiness probe.
            matchLabels:
              app: valkey
      ports:
        - protocol: TCP
          port: 6379
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
{{- end }}
