apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
{{ include "kubernaut.np.metadata" (dict "root" $ "nameSuffix" "workflowexecution" "appLabel" "workflowexecution-controller") }}
spec:
  podSelector:
    matchLabels:
      app: workflowexecution-controller
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- include "kubernaut.np.metricsIngress" $ | nindent 4 }}
  egress:
    {{- include "kubernaut.np.commonEgress" . | nindent 4 }}
    {{- include "kubernaut.np.datastorageEgress" . | nindent 4 }}
    {{- if .Values.workflowexecution.config.ansible }}
    # BR-PLATFORM-005 (Kubernaut Operator parity): allow HTTPS egress to the
    # configured AWX/AAP endpoint (apiURL), which may be outside the cluster.
    - ports:
        - port: 443
          protocol: TCP
    {{- end }}
    {{- if .Values.global.fleet.enabled }}
    {{- /* #1755 DD-TEST-015 RCA: WE's fleet OAuth2 token fetch to
    global.fleet.oauth2.tokenURL was missing an egress rule entirely -- same
    gap as FMC's/Gateway's identical fix (see fleetmetadatacache.yaml's
    comment for the full RCA). */}}
    {{- include "kubernaut.np.idpEgress" . | nindent 4 }}
    {{- /* #1755 DD-TEST-015 RCA (5th finding): WE's own MCP client also
    needs direct egress to the MCP Gateway itself -- see
    kubernaut.np.mcpGatewayEgress's doc comment for the full RCA. */}}
    {{- include "kubernaut.np.mcpGatewayEgress" . | nindent 4 }}
    {{- end }}
