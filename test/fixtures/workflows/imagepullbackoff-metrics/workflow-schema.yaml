apiVersion: kubernaut.ai/v1alpha1
kind: RemediationWorkflow
metadata:
  name: imagepullbackoff-metrics-v1
spec:
  version: "1.0.0"
  description:
    what: "Restarts the test Pod after ImagePullBackOff workflow discovery"
    whenToUse: "Only in the AIAnalysis confidence histogram integration test"
    whenNotToUse: "Production remediation"
    preconditions: "The test Pod exists in the staging namespace"

  actionType: RestartPod

  labels:
    severity: [critical]
    environment: [production, staging, test, development]
    component: [v1/Pod]
    priority: P2
    cluster: ["*"]

  execution:
    engine: tekton
    bundle: quay.io/kubernaut-cicd/tekton-bundles/hello-world:v1.0.0@sha256:a663ba9ddf8a074025723a4fbbef5542f520deb4e5eaf9814e07775456ecd7e0

  parameters:
    - name: TARGET_RESOURCE_NAME
      type: string
      required: true
      description: "Name of the root managing resource (KA-injected)"
    - name: TARGET_RESOURCE_KIND
      type: string
      required: true
      description: "Kind of the root managing resource (KA-injected)"
    - name: TARGET_RESOURCE_NAMESPACE
      type: string
      required: true
      description: "Namespace of the root managing resource (KA-injected)"
    - name: NAMESPACE
      type: string
      required: true
      description: "Target namespace"
    - name: POD_NAME
      type: string
      required: true
      description: "Name of the Pod to restart"
