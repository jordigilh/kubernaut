name: E2E Test Template

# Reusable workflow for service E2E tests
# Usage: Call from main workflow with service name and configuration

on:
  workflow_call:
    inputs:
      service:
        description: 'Service name (e.g., datastorage, gateway, toolset)'
        required: true
        type: string
      timeout:
        description: 'Timeout in minutes'
        required: true
        type: number
      skip_on_draft:
        description: 'Skip E2E tests for draft PRs'
        required: false
        type: boolean
        default: true
    outputs:
      result:
        description: 'Test result (success/failure/skipped)'
        value: ${{ jobs.e2e.outputs.result }}

permissions:
  contents: read

env:
  # CRITICAL: Kind must use Podman (we don't have Docker in our CI)
  KIND_EXPERIMENTAL_PROVIDER: podman

jobs:
  e2e:
    name: e2e (${{ inputs.service }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout }}
    # Skip E2E for draft PRs if enabled
    if: |
      !inputs.skip_on_draft ||
      github.event.pull_request.draft == false ||
      github.event_name != 'pull_request'
    env:
      KIND_EXPERIMENTAL_PROVIDER: podman
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    outputs:
      result: ${{ steps.test.outcome }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      # ========================================
      # Infrastructure Setup
      # ========================================
      - name: Capture runner resource baseline
        shell: bash
        run: |
          {
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "hostname=$(hostname)"
            echo "kernel:"
            uname -a
            echo "os-release:"
            cat /etc/os-release
            echo "inotify:"
            sysctl fs.inotify.max_user_watches fs.inotify.max_user_instances fs.inotify.max_queued_events
            echo "file handles:"
            cat /proc/sys/fs/file-nr
            echo "process limits:"
            cat /proc/sys/kernel/pid_max
            cat /proc/sys/kernel/threads-max
            echo "cgroup PID limits:"
            for file in /sys/fs/cgroup/pids.max /sys/fs/cgroup/pids.current; do
              if [[ -r "${file}" ]]; then
                printf '%s=' "${file}"
                cat "${file}"
              fi
            done
            echo "ulimits:"
            printf 'nofile soft: '
            ulimit -Sn
            printf 'nofile hard: '
            ulimit -Hn
            printf 'nproc soft: '
            ulimit -Su
            printf 'nproc hard: '
            ulimit -Hu
            echo "process/thread count:"
            ps -eLf --no-headers | wc -l
            echo "memory:"
            free -h
            echo "disk:"
            df -h /
            echo "container runtime versions:"
            command -v podman >/dev/null && podman --version || echo "podman: unavailable"
            command -v crun >/dev/null && crun --version | head -1 || echo "crun: unavailable"
          } | tee /tmp/e2e-runner-resources-before.txt

      - name: Install Kind v0.32.0
        run: |
          # Install Kind v0.32.0 (required by E2E test infrastructure)
          # Authority: test/infrastructure/kind_cluster_helpers.go (version validation)
          # Uses GitHub releases URL (kind.sigs.k8s.io/dl/ returns HTML, not binary)
          KIND_VERSION="v0.32.0"
          echo "Installing Kind version: ${KIND_VERSION}"
          curl -Lo ./kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Install Podman
        uses: ./.github/actions/install-podman

      - name: Configure E2E runner resource limits
        shell: bash
        run: |
          set -euo pipefail

          set_sysctl_floor() {
            local key="$1"
            local target="$2"
            local current
            current="$(sysctl -n "${key}")"
            if (( current < target )); then
              sudo sysctl -w "${key}=${target}"
            else
              echo "${key} already ${current}; keeping it"
            fi
          }

          # These are ceilings, not allocations. Keep ubuntu-24.04 as the
          # active E2E baseline; the ubuntu-26.04 comparison is evaluated
          # separately so runner-image effects remain isolated.
          set_sysctl_floor fs.inotify.max_user_watches 1048576
          set_sysctl_floor fs.inotify.max_user_instances 8192
          set_sysctl_floor fs.inotify.max_queued_events 32768

          # Kind's Podman node contains the Kubernetes control plane and all
          # test workloads. Raise its process and descriptor ceilings without
          # changing application resource requests or test timing.
          mkdir -p "${HOME}/.config/containers/containers.conf.d"
          cat > "${HOME}/.config/containers/containers.conf.d/99-kubernaut-e2e-resources.conf" <<'EOF'
          [containers]
          pids_limit = 8192
          default_ulimits = [
            "nofile=1048576:1048576",
            "nproc=65536:65536",
          ]
          EOF

          {
            echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "effective inotify limits:"
            sysctl fs.inotify.max_user_watches fs.inotify.max_user_instances fs.inotify.max_queued_events
            echo "Podman defaults:"
            cat "${HOME}/.config/containers/containers.conf.d/99-kubernaut-e2e-resources.conf"
            echo "Podman version:"
            podman --version
            echo "crun version:"
            crun --version | head -1
            echo "Podman host info:"
            podman info --debug 2>&1 || true
          } | tee /tmp/e2e-runner-resources-after.txt

      # ========================================
      # Run E2E Tests
      # ========================================
      # Note: no retry wrapper. Retries mask flakes AND destroy diagnostics: a
      # retry tears down the failing attempt's cluster and stands up a fresh
      # one, so failure diagnostics below only ever see the LAST attempt's
      # (often mid-bootstrap) cluster instead of the one that actually failed.
      - name: Run ${{ inputs.service }} E2E tests
        id: test
        shell: bash
        run: |
          set -euo pipefail

          raise_process_limit() {
            local resource="$1"
            local value="$2"
            if ! sudo prlimit --pid "$$" "--${resource}=${value}:${value}"; then
              echo "warning: unable to raise ${resource} limit to ${value}" >&2
            fi
          }

          # prlimit targets this shell so the limits are inherited by make,
          # Kind, Podman, and the Kubernetes node container it creates.
          raise_process_limit nofile 1048576
          raise_process_limit nproc 65536
          ulimit -n 1048576 2>/dev/null || true
          ulimit -u 65536 2>/dev/null || true

          echo "effective E2E process limits:"
          printf 'nofile soft: '
          ulimit -Sn
          printf 'nofile hard: '
          ulimit -Hn
          printf 'nproc soft: '
          ulimit -Su
          printf 'nproc hard: '
          ulimit -Hu

          make test-e2e-${{ inputs.service }}

      - name: Capture failure cluster resource diagnostics
        if: failure() || cancelled()
        shell: bash
        run: |
          set +e
          output_dir="/tmp/e2e-cluster-resource-diagnostics"
          mkdir -p "${output_dir}"

          {
            echo "Runner process state"
            date -u
            ps -eLf
            echo "inotify:"
            sysctl fs.inotify.max_user_watches fs.inotify.max_user_instances fs.inotify.max_queued_events
            cat /proc/sys/fs/file-nr
            echo "process limits:"
            cat /proc/sys/kernel/pid_max
            cat /proc/sys/kernel/threads-max
            for file in /sys/fs/cgroup/pids.max /sys/fs/cgroup/pids.current; do
              if [[ -r "${file}" ]]; then
                printf '%s=' "${file}"
                cat "${file}"
              fi
            done
            echo "memory:"
            free -h
            echo "disk:"
            df -h /
          } > "${output_dir}/runner.txt"

          if command -v podman >/dev/null; then
            podman ps -a --no-trunc > "${output_dir}/podman-ps.txt" 2>&1
            podman stats --no-stream > "${output_dir}/podman-stats.txt" 2>&1
            podman info --debug > "${output_dir}/podman-info.txt" 2>&1
          fi

          if command -v kind >/dev/null && command -v kubectl >/dev/null; then
            clusters="$(kind get clusters 2>/dev/null || true)"
            while IFS= read -r cluster; do
              [[ -z "${cluster}" ]] && continue
              kubeconfig="${output_dir}/${cluster}.kubeconfig"
              kind get kubeconfig --name "${cluster}" > "${kubeconfig}" 2>&1
              kubectl --kubeconfig "${kubeconfig}" get nodes -o wide > "${output_dir}/${cluster}-nodes.txt" 2>&1
              kubectl --kubeconfig "${kubeconfig}" describe nodes > "${output_dir}/${cluster}-node-describe.txt" 2>&1
              kubectl --kubeconfig "${kubeconfig}" get pods --all-namespaces -o wide > "${output_dir}/${cluster}-pods.txt" 2>&1
              kubectl --kubeconfig "${kubeconfig}" get events --all-namespaces --sort-by=.lastTimestamp > "${output_dir}/${cluster}-events.txt" 2>&1
              kubectl --kubeconfig "${kubeconfig}" get pods --all-namespaces --no-headers | wc -l > "${output_dir}/${cluster}-pod-count.txt" 2>&1
            done <<< "${clusters}"
          fi

      # ========================================
      # Cleanup
      # ========================================
      - name: Cleanup Kind clusters
        if: always()
        run: |
          kind delete cluster --name ${{ inputs.service }}-e2e 2>/dev/null || true
          # Clean up any other Kind clusters from this test
          kind get clusters | grep "${{ inputs.service }}" | xargs -r -I {} kind delete cluster --name {}

      - name: Cleanup Podman resources
        if: always()
        run: |
          podman ps -a --filter "name=${{ inputs.service }}-" --format "{{.Names}}" | xargs -r podman rm -f
          podman network ls --filter "name=${{ inputs.service }}" --format "{{.Name}}" | xargs -r podman network rm

      # ========================================
      # Upload Artifacts
      # ========================================
      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ inputs.service }}-e2e-results
          path: |
            test-results/
            e2e-logs/
            /tmp/e2e-runner-resources-before.txt
            /tmp/e2e-runner-resources-after.txt
          retention-days: 7

      - name: Upload failure diagnostics (must-gather + Kind logs)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ inputs.service }}-e2e-diagnostics-${{ github.run_id }}
          path: |
            /tmp/kind-logs-*
            /tmp/${{ inputs.service }}-e2e-logs-*
            /tmp/e2e-runner-resources-before.txt
            /tmp/e2e-runner-resources-after.txt
            /tmp/e2e-cluster-resource-diagnostics/
          retention-days: 14
          if-no-files-found: warn
