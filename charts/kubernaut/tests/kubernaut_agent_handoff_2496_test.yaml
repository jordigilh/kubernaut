suite: "DD-KA-2496 / BR-KA-016: independent whole-packet evidence handoff budget"
templates:
  - templates/kubernaut-agent/kubernaut-agent.yaml
set:
  postgresql:
    auth:
      existingSecret: dummy
  valkey:
    existingSecret: dummy
  global:
    llmProfiles:
      primary:
        provider: openai
        model: gpt-4
        credentialsSecretName: llm-credentials-primary
  kubernautAgent:
    llmProfileRef: primary
  signalprocessing:
    policies:
      existingConfigMap: test-cm
  aianalysis:
    policies:
      existingConfigMap: test-cm
tests:
  - it: "IT-PLATFORM-2496-001: materializes the independent 65,536-byte default"
    documentSelector:
      path: metadata.name
      value: kubernaut-agent-config
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "(?m)^\\s*maxEvidenceHandoffBytes: 65536$"
  - it: "IT-PLATFORM-2496-001: renders an operator-configured whole-packet budget"
    set:
      kubernautAgent:
        investigation:
          maxEvidenceHandoffBytes: 131072
    documentSelector:
      path: metadata.name
      value: kubernaut-agent-config
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: "(?m)^\\s*maxEvidenceHandoffBytes: 131072$"
  - it: "IT-PLATFORM-2496-001: rejects an explicitly zero packet budget"
    set:
      kubernautAgent:
        investigation:
          maxEvidenceHandoffBytes: 0
    asserts:
      - failedTemplate: {}
  - it: "IT-PLATFORM-2496-001: rejects a negative packet budget"
    set:
      kubernautAgent:
        investigation:
          maxEvidenceHandoffBytes: -1
    asserts:
      - failedTemplate: {}
