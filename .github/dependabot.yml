version: 2
updates:
  # ============================================================
  # main (default branch)
  # ============================================================
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - security
    commit-message:
      prefix: "deps"
    ignore:
      - dependency-name: "k8s.io/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "sigs.k8s.io/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Tekton v1.17+ requires Go 1.27; keep the main branch on the
      # Go 1.26.11 security floor until the v1.6.0 toolchain migration.
      - dependency-name: "github.com/tektoncd/pipeline"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # google/adk-go#1356 (impacts v2.1.0+): pin to v2.0.x until upstream
      # fixes it. Remove this ignore rule once a fixed release is out.
      - dependency-name: "google.golang.org/adk/v2"
        versions: [">= 2.1.0"]
      # Same google/adk-go#1356 regression on the v1 module line (no "/v2"
      # suffix). Keep it pinned until upstream fixes it.
      - dependency-name: "google.golang.org/adk"
        versions: [">= 1.6.0"]
    groups:
      all-go-deps:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci"
    groups:
      all-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    # NOTE: "directory: /build" (previous config) only matched a Dockerfile
    # directly under /build, never recursed into subdirectories. Use
    # "directories" (plural, globbing) to recursively cover every Dockerfile
    # location in the repo.
    directories:
      - "/docker"
      - "/cmd/**"
      - "/test/**"
      - "/docs/architecture/spikes/**"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "docker"
    groups:
      all-docker:
        patterns:
          - "*"
