suite: "DD-PLATFORM-006 Decision Area 8: Valkey server-side TLS (TLS-only, plaintext port disabled)"
templates:
  - templates/infrastructure/valkey.yaml
  - templates/infrastructure/networkpolicy-valkey.yaml
  - templates/hooks/tls-cert-job.yaml
  - templates/datastorage/networkpolicy.yaml
  - templates/apifrontend/networkpolicy.yaml
  - templates/fleetmetadatacache/fleetmetadatacache.yaml
  - templates/datastorage/datastorage.yaml
set:
  postgresql:
    auth:
      existingSecret: dummy
  valkey:
    existingSecret: dummy
  global:
    llmProfiles:
      primary:
        provider: openai
        model: gpt-4
        credentialsSecretName: llm-credentials-primary
  kubernautAgent:
    llmProfileRef: primary
  tls:
    mode: hook
tests:
  # ── Valkey Deployment: plaintext port disabled, TLS port enabled ──────────
  - it: "Valkey Deployment disables the plaintext port and enables tls-port 6380"
    template: templates/infrastructure/valkey.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - "--port"
            - "0"
            - "--tls-port"
            - "6380"
            - "--tls-cert-file"
            - "/certs/tls.crt"
            - "--tls-key-file"
            - "/certs/tls.key"
            - "--tls-ca-cert-file"
            - "/certs/ca.crt"
            - "--tls-auth-clients"
            - "no"

  - it: "Valkey container no longer exposes a plaintext containerPort"
    template: templates/infrastructure/valkey.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 6380

  - it: "Valkey Deployment mounts the valkey-tls secret for its cert/key/ca"
    template: templates/infrastructure/valkey.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: valkey-tls
            mountPath: /certs
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: valkey-tls
            secret:
              secretName: valkey-tls

  - it: "Valkey readinessProbe/livenessProbe use TLS-aware valkey-cli against port 6380"
    template: templates/infrastructure/valkey.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.exec.command
          value: ["valkey-cli", "--tls", "--cacert", "/certs/ca.crt", "-p", "6380", "ping"]
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.exec.command
          value: ["valkey-cli", "--tls", "--cacert", "/certs/ca.crt", "-p", "6380", "ping"]

  - it: "Valkey Service exposes port 6380, not 6379"
    template: templates/infrastructure/valkey.yaml
    documentSelector:
      path: kind
      value: Service
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 6380
      - equal:
          path: spec.ports[0].targetPort
          value: 6380

  # ── kubernaut.valkey.addr helper: in-chart Valkey resolves to 6380 ────────
  - it: "kubernaut.valkey.addr resolves to port 6380 when valkey.enabled=true (in-chart Valkey)"
    template: templates/datastorage/datastorage.yaml
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data['config.yaml']
          pattern: "addr: valkey\\.[\\w-]+\\.svc\\.cluster\\.local:6380"

  # ── tls-cert-job.yaml: Valkey added to the per-service cert loop ──────────
  - it: "tls-cert-gen Job's inter-service cert loop includes valkey (valkey-tls secret, CA-signed like every other service)"
    template: templates/hooks/tls-cert-job.yaml
    documentIndex: 0
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "valkey-tls"
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "for SVC_NAME in [^\\n]*\\bvalkey\\b"

  # ── NetworkPolicies: all 4 egress/ingress rules to Valkey use 6380 ────────
  - it: "Valkey's own NetworkPolicy ingress rule allows port 6380, not 6379"
    template: templates/infrastructure/networkpolicy-valkey.yaml
    asserts:
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 6380
      - notEqual:
          path: spec.ingress[0].ports[0].port
          value: 6379

  - it: "DataStorage NetworkPolicy egress-to-Valkey rule targets port 6380"
    template: templates/datastorage/networkpolicy.yaml
    asserts:
      - equal:
          path: spec.egress[2].ports[0].port
          value: 6380

  - it: "APIFrontend NetworkPolicy egress-to-Valkey rule (replayCache) targets port 6380"
    template: templates/apifrontend/networkpolicy.yaml
    asserts:
      - equal:
          path: spec.egress[3].ports[0].port
          value: 6380

  - it: "FleetMetadataCache NetworkPolicy egress-to-Valkey rule targets port 6380"
    template: templates/fleetmetadatacache/fleetmetadatacache.yaml
    documentSelector:
      path: kind
      value: NetworkPolicy
    set:
      fleetmetadatacache:
        enabled: true
        oauth2:
          credentialsSecretRef: "fmc-creds"
      global:
        fleet:
          mcpGatewayEndpoint: "http://mcp.example.com"
          oauth2:
            tokenURL: "http://oauth.example.com"
    asserts:
      - equal:
          path: spec.egress[1].ports[0].port
          value: 6380

  # ── DataStorage client-side TLS: CA mount present, caFile defaults sanely ─
  - it: "DataStorage Deployment mounts the shared inter-service CA (tls-ca) so redis.tls.caFile can verify Valkey's cert"
    template: templates/datastorage/datastorage.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tls-ca
            mountPath: /etc/tls-ca
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tls-ca
            configMap:
              name: inter-service-ca
              optional: true

  - it: "DataStorage redis.tls.caFile defaults to the mounted inter-service CA (redis.tls is mandatory-on, DA6) when no override is set"
    template: templates/datastorage/datastorage.yaml
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data['config.yaml']
          pattern: 'caFile: "/etc/tls-ca/ca\.crt"'

  - it: "DataStorage redis.tls.caFile explicit override still wins over the default"
    template: templates/datastorage/datastorage.yaml
    set:
      datastorage:
        config:
          redis:
            tls:
              caFile: "/etc/custom-ca/ca.crt"
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data['config.yaml']
          pattern: 'caFile: "/etc/custom-ca/ca\.crt"'
