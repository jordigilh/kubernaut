suite: "DD-PLATFORM-006 Decision Area 11: kubernautAgent.interactive.enabled requires apifrontend.enabled"
templates:
  - templates/kubernaut-agent/kubernaut-agent.yaml
  - templates/NOTES.txt
set:
  postgresql:
    auth:
      existingSecret: dummy
  valkey:
    existingSecret: dummy
  global:
    llmProfiles:
      primary:
        provider: openai
        model: gpt-4
        credentialsSecretName: llm-credentials-primary
  kubernautAgent:
    llmProfileRef: primary
  signalprocessing:
    policies:
      existingConfigMap: test-cm
  aianalysis:
    policies:
      existingConfigMap: test-cm
tests:
  - it: "kubernautAgent.interactive.enabled=true + apifrontend.enabled=false fails the render -- APIFrontend's ka.NewSDKMCPClient is the only caller of KA's interactive endpoint (Phase C: schema-enforced, was a kubernaut-agent.yaml fail() guard)"
    template: templates/kubernaut-agent/kubernaut-agent.yaml
    set:
      kubernautAgent:
        interactive:
          enabled: true
      apifrontend:
        enabled: false
    asserts:
      - failedTemplate: {}

  - it: "IT-HELM-1984-205 (Phase C, BR-PLATFORM-010): kubernautAgent.interactive.enabled=true + apifrontend.enabled=false is schema-rejected even when only NOTES.txt is rendered, proving schema (not kubernaut-agent.yaml's own fail() guard) enforces it"
    template: templates/NOTES.txt
    set:
      kubernautAgent:
        interactive:
          enabled: true
      apifrontend:
        enabled: false
    asserts:
      - failedTemplate: {}

  - it: "kubernautAgent.interactive.enabled=true + apifrontend.enabled=true (default) renders successfully -- no new false-positive from the added guard"
    template: templates/kubernaut-agent/kubernaut-agent.yaml
    set:
      kubernautAgent:
        interactive:
          enabled: true
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - isKind:
          of: Deployment

  - it: "kubernautAgent.interactive.enabled=false (default) + apifrontend.enabled=false renders successfully -- the guard is scoped to interactive mode only"
    template: templates/kubernaut-agent/kubernaut-agent.yaml
    set:
      apifrontend:
        enabled: false
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - isKind:
          of: Deployment
