# Kubernetes RBAC for E2E users.
# ADR-022: All AF K8s operations (MCP bridge and A2A) use AF's ServiceAccount.
# E2E users do not need CRD permissions for kubernaut_* tools at runtime.
# These grants remain for E2E test fixture setup (admin kubectl).
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: e2e-user-k8s-tools
rules:
  # kubectl_list (kind: Pod) — AF SA reads; kept for E2E validation
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # kubectl_list_events — AF SA reads
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
  # kubectl_list (kind: Deployment/StatefulSet) — AF SA reads
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["list"]
  # kubectl_get (owner chain: Pod -> ReplicaSet -> Deployment) — AF SA reads
  - apiGroups: [""]
    resources: ["pods", "replicationcontrollers"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["replicasets", "deployments", "statefulsets", "daemonsets"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get"]
  # MCP tool authorization (SAR verb: "use" on kubernaut.ai/tools)
  - apiGroups: ["kubernaut.ai"]
    resources: ["tools"]
    resourceNames:
      - kubernaut_discover_workflows
      - kubernaut_investigate
      - kubernaut_select_workflow
      - kubernaut_present_decision
      - kubernaut_message
      - kubernaut_complete
      - kubernaut_cancel
      - kubernaut_status
      - kubernaut_reconnect
      - kubernaut_remediate
      - kubernaut_check_existing_remediation
      - kubernaut_cancel_remediation
      - kubernaut_watch
      - kubernaut_approve
      - kubernaut_list_remediations
      - kubernaut_get_remediation
      - kubernaut_list_workflows
      - kubernaut_get_remediation_history
      - kubernaut_get_effectiveness
      - kubernaut_get_audit_trail
      - kubernaut_list_alerts
      - kubernaut_complete_no_action
      - kubernaut_list_approval_requests
      - kubernaut_get_approval_request
      - kubernaut_await_session
    verbs: ["use"]
  # kubernaut_remediate / kubernaut_check_existing_remediation / kubernaut_cancel_remediation / kubernaut_watch
  - apiGroups: ["kubernaut.ai"]
    resources: ["remediationrequests"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["kubernaut.ai"]
    resources: ["remediationrequests/status"]
    verbs: ["get", "update", "patch"]
  # remediation approvals
  - apiGroups: ["kubernaut.ai"]
    resources: ["remediationapprovalrequests"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["kubernaut.ai"]
    resources: ["remediationapprovalrequests/status"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: e2e-sre-k8s-tools
subjects:
  - kind: Group
    name: sre
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: e2e-user-k8s-tools
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: e2e-ai-orchestrator-k8s-tools
subjects:
  - kind: Group
    name: ai-orchestrator
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: e2e-user-k8s-tools
  apiGroup: rbac.authorization.k8s.io
---
# Observability group uses a namespace-scoped RoleBinding (not ClusterRoleBinding)
# to verify that K8s RBAC correctly restricts access to specific namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: e2e-observability-k8s-tools
  namespace: kubernaut-system
subjects:
  - kind: Group
    name: observability
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: e2e-user-k8s-tools
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: e2e-remediation-approver-k8s-tools
subjects:
  - kind: Group
    name: remediation-approver
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: e2e-user-k8s-tools
  apiGroup: rbac.authorization.k8s.io
---
# #1919: coarse-grained console-access gate (kubernaut.ai/console, verb=use),
# now enforced server-side at every tool-invocation site
# (checkRBAC/newRBACGuard), not just the advisory GET /a2a/access endpoint --
# E2E personas need this grant or every existing MCP/A2A tool-call E2E test
# would fail the new check. Deliberately a SEPARATE ClusterRole from
# e2e-user-k8s-tools (not one more rule added to it): SARChecker.checkSAR
# (pkg/apifrontend/auth/sar.go) never sets ResourceAttributes.Namespace, so
# this is always a cluster-scoped check -- a namespace-scoped RoleBinding
# (like observability's e2e-observability-k8s-tools above, intentionally
# namespace-scoped to prove K8s RBAC namespace restriction for *those*
# unrelated pods/events/deployments/etc. rules) can never satisfy it.
# Mixing the two into one ClusterRole silently broke observability's console
# access the first time this was tried (RCA'd via CI must-gather on PR
# #1940) -- every persona below gets an unconditional ClusterRoleBinding
# instead, matching the "every persona with a tool grant needs console
# access too" default applied to charts/kubernaut/values.yaml's
# consoleAccessGroups.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: e2e-console-access
rules:
  - apiGroups: ["kubernaut.ai"]
    resources: ["console"]
    verbs: ["use"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: e2e-sre-console-access
subjects:
  - kind: Group
    name: sre
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: e2e-console-access
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: e2e-ai-orchestrator-console-access
subjects:
  - kind: Group
    name: ai-orchestrator
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: e2e-console-access
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: e2e-cicd-console-access
subjects:
  - kind: Group
    name: cicd
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: e2e-console-access
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: e2e-observability-console-access
subjects:
  - kind: Group
    name: observability
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: e2e-console-access
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: e2e-l3-audit-console-access
subjects:
  - kind: Group
    name: l3-audit
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: e2e-console-access
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: e2e-remediation-approver-console-access
subjects:
  - kind: Group
    name: remediation-approver
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: e2e-console-access
  apiGroup: rbac.authorization.k8s.io
