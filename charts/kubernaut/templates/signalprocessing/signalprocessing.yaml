{{- define "kubernaut.signalprocessing.policyYAML" -}}
{{ .Values.signalprocessing.policies.content }}
{{- end }}
{{- define "kubernaut.signalprocessing.proactiveSignalMappingsYAML" -}}
{{ .Values.signalprocessing.proactiveSignalMappings.content | default (.Files.Get "files/defaults/proactive-signal-mappings.yaml") }}
{{- end }}
{{- /*
Issue #1984 Phase D: oauth2.tokenURL/credentialsSecretRef required-when-enabled
guards (and the ADR-068 gap of oauth2.enabled itself being optional) moved to
values.schema.json if/then blocks gated on global.fleet.mcpGatewayEndpoint
being set (BR-PLATFORM-010).
*/}}
{{- $signalprocessingFleetPreamble := include "kubernaut.fleet.preamble" (dict "root" $ "fleet" .Values.signalprocessing.fleet "oauth2" .Values.signalprocessing.fleet.oauth2) | fromYaml }}
{{- if not .Values.signalprocessing.policies.existingConfigMap }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: signalprocessing-policy
  namespace: {{ .Release.Namespace }}
  labels:
    app: signalprocessing
    {{- include "kubernaut.labels" . | nindent 4 }}
data:
  policy.rego: |
    {{- include "kubernaut.signalprocessing.policyYAML" . | nindent 4 }}
{{- end }}
{{- if not .Values.signalprocessing.proactiveSignalMappings.existingConfigMap }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: signalprocessing-proactive-signal-mappings
  namespace: {{ .Release.Namespace }}
  labels:
    app: signalprocessing
    {{- include "kubernaut.labels" . | nindent 4 }}
data:
  proactive-signal-mappings.yaml: |
    {{- include "kubernaut.signalprocessing.proactiveSignalMappingsYAML" . | nindent 4 }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: signalprocessing-config
  namespace: {{ .Release.Namespace }}
  labels:
    app: signalprocessing
    {{- include "kubernaut.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- include "kubernaut.signalprocessing.configYAML" . | nindent 4 }}
{{- define "kubernaut.signalprocessing.configYAML" -}}
{{- $signalprocessingFleetPreamble := include "kubernaut.fleet.preamble" (dict "root" . "fleet" .Values.signalprocessing.fleet "oauth2" .Values.signalprocessing.fleet.oauth2) | fromYaml -}}
{{- $v := include "kubernaut.mergedValues" (dict "root" . "service" "signalprocessing") | fromYaml -}}
logging:
  level: {{ $v.logging.level | quote }}
controller:
  metricsAddr: ":9090"
  healthProbeAddr: ":8081"
  leaderElection: false
  leaderElectionId: "signalprocessing.kubernaut.ai"
enrichment:
  cacheTtl: "5m"
  timeout: "10s"
classifier:
  regoConfigMapName: "signalprocessing-policy"
  regoConfigMapKey: "policy.rego"
  hotReloadInterval: "30s"
datastorage:
  url: "{{ include "kubernaut.datastorage.url" . }}"
  healthUrl: "{{ include "kubernaut.datastorage.healthUrl" . }}"
  timeout: "10s"
  buffer:
    bufferSize: 10000
    batchSize: 100
    flushInterval: "1s"
    maxRetries: 3
{{- if $signalprocessingFleetPreamble.config.mcpGatewayEndpoint }}
fleet:
  endpoint: {{ $signalprocessingFleetPreamble.config.mcpGatewayEndpoint | quote }}
  {{- if $signalprocessingFleetPreamble.config.mcpGatewayType }}
  mcpGatewayType: {{ $signalprocessingFleetPreamble.config.mcpGatewayType | quote }}
  {{- end }}
  {{- if $signalprocessingFleetPreamble.config.namespace }}
  namespace: {{ $signalprocessingFleetPreamble.config.namespace | quote }}
  {{- end }}
  {{- if $signalprocessingFleetPreamble.oauth2.enabled }}
  oauth2:
    enabled: true
    tokenURL: {{ $signalprocessingFleetPreamble.oauth2.tokenURL | quote }}
    credentialsSecretRef: {{ $signalprocessingFleetPreamble.oauth2.credentialsSecretRef | quote }}
    {{- if $signalprocessingFleetPreamble.oauth2.scopes }}
    scopes:
      {{- range $signalprocessingFleetPreamble.oauth2.scopes }}
      - {{ . | quote }}
      {{- end }}
    {{- end }}
    tlsCAFile: {{ $signalprocessingFleetPreamble.oauth2.tlsCAFile | default (include "kubernaut.interServiceTLS.caFile" .) | quote }}
  {{- end }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: signalprocessing-controller
  namespace: {{ .Release.Namespace }}
  labels:
    app: signalprocessing-controller
    {{- include "kubernaut.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: signalprocessing-controller
  labels:
    {{- include "kubernaut.labels" . | nindent 4 }}
rules:
  - apiGroups: ["kubernaut.ai"]
    resources: ["signalprocessings", "remediationrequests"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["kubernaut.ai"]
    resources: ["signalprocessings/status", "signalprocessings/finalizers"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods", "services", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  {{- /*
  #1686 (BR-RBAC-020): the mcpserverregistrations rule is only granted
  cluster-wide here when no namespace scope is configured. When
  signalprocessing.fleet.namespace is set, the identical rule is granted
  instead via a namespace-scoped Role/RoleBinding below, matching what the
  ClusterRegistry informer actually watches (least privilege).
  */}}
  {{- if and (eq $signalprocessingFleetPreamble.config.mcpGatewayType "kuadrant") (not $signalprocessingFleetPreamble.config.namespace) }}
  # BR-FLEET-003 (#1511): SP's ClusterRegistry watches MCPServerRegistration
  # CRs directly via a dynamic informer to evaluate the `cluster`
  # classification dimension when the Kuadrant MCP Gateway is used.
  - apiGroups: ["mcp.kuadrant.io"]
    resources: ["mcpserverregistrations"]
    verbs: ["get", "list", "watch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: signalprocessing-controller
  labels:
    {{- include "kubernaut.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: signalprocessing-controller
subjects:
  - kind: ServiceAccount
    name: signalprocessing-controller
    namespace: {{ .Release.Namespace }}
{{- if and (eq $signalprocessingFleetPreamble.config.mcpGatewayType "kuadrant") $signalprocessingFleetPreamble.config.namespace }}
---
# #1686 (BR-RBAC-020): namespace-scoped equivalent of the ClusterRole rule
# above, granted instead of it when signalprocessing.fleet.namespace (or its
# global.fleet.mcpGatewayNamespace fallback, Issue #1730) is set.
{{ include "kubernaut.fleet.registryNsRBAC" (dict "name" "signalprocessing" "serviceAccount" "signalprocessing-controller" "namespace" $signalprocessingFleetPreamble.config.namespace "appLabels" "app: signalprocessing-controller" "mcpServerRegistrations" true "Release" .Release "labels" (include "kubernaut.labels" .)) }}
{{- end }}
---
# Role: namespace-scoped access to configmaps and secrets (#229)
{{ include "kubernaut.nsRoleForSecrets" (dict "name" "signalprocessing" "serviceAccount" "signalprocessing-controller" "Release" .Release "labels" (include "kubernaut.labels" .)) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signalprocessing-controller
  namespace: {{ .Release.Namespace }}
  labels:
    app: signalprocessing-controller
    {{- include "kubernaut.labels" . | nindent 4 }}
spec:
  {{- $v := include "kubernaut.mergedValues" (dict "root" $ "service" "signalprocessing") | fromYaml }}
  replicas: {{ $v.replicas }}
  selector:
    matchLabels:
      app: signalprocessing-controller
  template:
    metadata:
      labels:
        app: signalprocessing-controller
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
        checksum/config: {{ include "kubernaut.signalprocessing.configYAML" . | sha256sum }}
        {{- if not .Values.signalprocessing.policies.existingConfigMap }}
        checksum/policy: {{ include "kubernaut.signalprocessing.policyYAML" . | sha256sum }}
        {{- end }}
        {{- if not .Values.signalprocessing.proactiveSignalMappings.existingConfigMap }}
        checksum/proactive-signal-mappings: {{ include "kubernaut.signalprocessing.proactiveSignalMappingsYAML" . | sha256sum }}
        {{- end }}
    spec:
      serviceAccountName: signalprocessing-controller
      {{- include "kubernaut.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "kubernaut.podSecurityContext" .Values.signalprocessing | nindent 8 }}
      {{- include "kubernaut.affinity" (dict "component" .Values.signalprocessing "matchLabels" (dict "app" "signalprocessing-controller")) | nindent 6 }}
      {{- include "kubernaut.scheduling" (dict "component" .Values.signalprocessing "global" .Values.global) | nindent 6 }}
      containers:
        - name: signalprocessing-controller
          image: {{ include "kubernaut.image" (dict "service" "signalprocessing" "root" $ "appVersion" .Chart.AppVersion) }}
          imagePullPolicy: {{ include "kubernaut.imagePullPolicy" $ }}
          securityContext:
            {{- include "kubernaut.containerSecurityContext" .Values.signalprocessing | nindent 12 }}
          args:
            - "--config=/etc/signalprocessing/config.yaml"
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          {{- /* DD-PLATFORM-008: SP builds a registry.ClusterRegistry against
          the fleet MCP Gateway at boot, same shape as apifrontend/
          effectivenessmonitor/workflowexecution -- can legitimately stall
          well past the liveness probe's budget under load. Confirmed live
          during #1755 DD-TEST-015 fleet E2E re-validation: SP crash-looped
          (exit 137, "Liveness probe failed ... context deadline exceeded")
          without this startupProbe while its 6 sibling fleet-aware services
          already had it -- a gap in the original DD-PLATFORM-008 rollout.
          See apifrontend.yaml's identical comment for the confirmed
          incident details and _helpers.tpl's kubernaut.startupProbe doc for
          the failureThreshold=60 (305s) sizing rationale. */}}
          {{- include "kubernaut.startupProbe" (dict "port" "health") | nindent 10 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          env:
            - name: TLS_CA_FILE
              value: {{ include "kubernaut.interServiceTLS.caFile" . | quote }}
          volumeMounts:
            - name: config
              mountPath: /etc/signalprocessing/config.yaml
              subPath: config.yaml
            - name: policy
              mountPath: /etc/signalprocessing/policies
              readOnly: true
            - name: proactive-signal-mappings
              mountPath: /etc/signalprocessing/proactive-signal-mappings.yaml
              subPath: proactive-signal-mappings.yaml
            {{- include "kubernaut.tlsCaVolumeMount" . | nindent 12 }}
            {{- if $signalprocessingFleetPreamble.oauth2.enabled }}
            - name: oauth2-credentials
              mountPath: "/etc/signalprocessing/{{ $signalprocessingFleetPreamble.oauth2.credentialsSecretRef }}"
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.signalprocessing.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: signalprocessing-config
        - name: policy
          configMap:
            name: {{ .Values.signalprocessing.policies.existingConfigMap | default "signalprocessing-policy" }}
        - name: proactive-signal-mappings
          configMap:
            name: {{ .Values.signalprocessing.proactiveSignalMappings.existingConfigMap | default "signalprocessing-proactive-signal-mappings" }}
        {{- include "kubernaut.tlsCaVolume" . | nindent 8 }}
        {{- if $signalprocessingFleetPreamble.oauth2.enabled }}
        - name: oauth2-credentials
          secret:
            secretName: {{ $signalprocessingFleetPreamble.oauth2.credentialsSecretRef }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: signalprocessing-controller-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    app: signalprocessing-controller
    {{- include "kubernaut.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
  selector:
    app: signalprocessing-controller
