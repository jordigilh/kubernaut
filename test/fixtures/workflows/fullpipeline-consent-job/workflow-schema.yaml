apiVersion: kubernaut.ai/v1alpha1
kind: RemediationWorkflow
metadata:
  name: fullpipeline-consent-job-v1
spec:
  # FullPipeline consent-gate workflow. It is intentionally small: the Job
  # backend only needs the target fields injected by WorkflowExecution.
  version: "1.0.3"
  description:
    what: "Runs the FullPipeline consent-gate Job execution path"
    whenToUse: "For the FullPipeline A2A consent-gate E2E journey"
    whenNotToUse: "Not intended for production use"
    preconditions: "Kubernetes Job execution is available"

  actionType: RestartPod

  labels:
    severity: [warning]
    environment: [staging]
    component: [v1/Pod]
    priority: "*"
    cluster: ["*"]

  execution:
    engine: job
    bundle: quay.io/kubernaut-cicd/test-workflows/placeholder-execution:v1.0.0@sha256:377de4244cfeffcbb898a7e7cd388dd1266dd680cef43b17147b876845df29cd

  parameters:
    - name: TARGET_RESOURCE_NAME
      type: string
      required: true
      description: "Name of the root managing resource (KA-injected)"
    - name: TARGET_RESOURCE_KIND
      type: string
      required: true
      description: "Kind of the root managing resource (KA-injected)"
    - name: TARGET_RESOURCE_NAMESPACE
      type: string
      required: true
      description: "Namespace of the root managing resource (KA-injected)"
