name: Must-Gather Tests

# Must-Gather Diagnostic Tool CI Pipeline
# BR-PLATFORM-001: Production diagnostic collection tool
#
# Triggers:
#   - Pull requests to main (with must-gather file changes)
#   - Pushes to main (with must-gather file changes)
#   - Manual workflow dispatch (for on-demand testing)
#
# Test Strategy:
#   - Unit Tests: 45 bats tests in containerized environment
#   - Container Build: Validates Dockerfile for target architecture
#   - Architecture: amd64 on GitHub Actions, arm64 locally
#
# Optimization:
#   - Smart path filtering: Only runs when must-gather files change
#   - Single-arch build: amd64 for CI (multi-arch for releases)
#   - Containerized tests: Host-agnostic consistency
#
# Authority: BR-PLATFORM-001, cmd/must-gather/README.md

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'cmd/must-gather/**'
      - 'docs/development/must-gather/**'
      - 'docs/requirements/BR-PLATFORM-001*.md'
      - '.github/workflows/must-gather-tests.yml'
  push:
    branches: [ main ]
    paths:
      - 'cmd/must-gather/**'
      - 'docs/development/must-gather/**'
      - 'docs/requirements/BR-PLATFORM-001*.md'
      - '.github/workflows/must-gather-tests.yml'
  workflow_dispatch:
    inputs:
      skip-tests:
        description: 'Skip unit tests (build only)'
        required: false
        default: 'false'
        type: boolean
      skip-build:
        description: 'Skip container build (tests only)'
        required: false
        default: 'false'
        type: boolean
      chart-image-tag:
        description: 'Pre-built quay.io/kubernaut-ai/* chart image tag to install for the e2e-tests job (override the pinned default below)'
        required: false
        default: ''
        type: string
      operator-version:
        description: 'jordigilh/kubernaut-operator release tag to install for the e2e-tests job (override the pinned default below)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  # ========================================
  # UNIT TESTS: Containerized Bats Tests
  # 52 tests validating business outcomes
  # Duration: ~3-5 minutes
  # ========================================
  unit-tests:
    name: Unit Tests (52 bats tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ !inputs.skip-tests }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Podman
        run: |
          echo "📦 Podman version:"
          podman version

      - name: Run unit tests
        working-directory: cmd/must-gather
        run: |
          echo "🧪 Running 52 containerized unit tests..."
          echo "   - Checksum integrity: 8 tests"
          echo "   - CRD collection: 5 tests"
          echo "   - DataStorage API: 11 tests"
          echo "   - Orchestration: 12 tests"
          echo "   - Logs: 7 tests"
          echo "   - Sanitization: 9 tests"
          echo ""
          make test

      - name: Test results summary
        if: always()
        run: |
          if [ $? -eq 0 ]; then
            echo "✅ All 52 unit tests passed!"
          else
            echo "❌ Unit tests failed"
            exit 1
          fi

  # ========================================
  # CONTAINER BUILD: Validate Dockerfile
  # Single-arch build for CI (amd64)
  # Duration: ~2-3 minutes
  # ========================================
  container-build:
    name: Container Build (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ !inputs.skip-build }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Podman
        run: |
          echo "📦 Podman version:"
          podman version

      - name: Build must-gather container
        working-directory: cmd/must-gather
        run: |
          echo "🐳 Building must-gather container for amd64..."
          echo "   Base: UBI9 standard"
          echo "   Tools: kubectl, jq, tar, gzip"
          echo "   Scripts: collectors, sanitizers, utils"
          echo ""
          podman build \
            --platform linux/amd64 \
            --build-arg TARGETARCH=amd64 \
            -t localhost/must-gather:ci-test \
            -f Dockerfile \
            .

      - name: Verify container contents
        run: |
          echo "🔍 Verifying container structure..."

          # Verify main script
          podman run --rm --platform linux/amd64 \
            --entrypoint sh \
            localhost/must-gather:ci-test \
            -c "test -x /usr/bin/gather"
          echo "✅ Main script present"

          # Verify collectors
          COUNT=$(podman run --rm --platform linux/amd64 \
            --entrypoint sh \
            localhost/must-gather:ci-test \
            -c "ls /usr/share/must-gather/collectors/ | wc -l")
          if [ "$COUNT" -eq 9 ]; then
            echo "✅ All 9 collectors present"
          else
            echo "❌ Expected 9 collectors, found $COUNT"
            exit 1
          fi

          # Verify sanitizers
          podman run --rm --platform linux/amd64 \
            --entrypoint sh \
            localhost/must-gather:ci-test \
            -c "test -x /usr/share/must-gather/sanitizers/sanitize-all.sh"
          echo "✅ Sanitization framework present"

          # Verify tools
          echo "🔍 Verifying required tools..."
          podman run --rm --platform linux/amd64 \
            --entrypoint sh \
            localhost/must-gather:ci-test \
            -c "which kubectl"
          echo "✅ kubectl installed"

          podman run --rm --platform linux/amd64 \
            --entrypoint sh \
            localhost/must-gather:ci-test \
            -c "which jq"
          echo "✅ jq installed"

          echo ""
          echo "✅ Container build validation complete!"

      - name: Test container execution
        run: |
          echo "🧪 Testing container can execute..."
          OUTPUT=$(podman run --rm --platform linux/amd64 \
            localhost/must-gather:ci-test \
            --help)
          if echo "$OUTPUT" | grep -q "Kubernaut Must-Gather"; then
            echo "✅ Container executes successfully"
          else
            echo "❌ Container execution failed or help text not found"
            exit 1
          fi

  # ========================================
  # E2E TESTS: Deterministic Live-Cluster Drift Detection (Issue #2037)
  # Runs the containerized must-gather image's actual /usr/bin/gather
  # entrypoint against a real Kind cluster with the Kubernaut Helm chart
  # installed, asserting collected CRD/log counts match live-cluster truth
  # exactly (not a hardcoded number) -- this is the CI gate that catches
  # collector-script drift (stale CRD/service/namespace lists) going forward.
  #
  # Chart images are PULLED pre-built from quay.io/kubernaut-ai (a public
  # release, not built from source): this job validates must-gather's
  # collection logic, not each service's business logic -- it only needs
  # *some* running pods with *some* logs/CRDs to scrape, so building all ~12
  # service images from source on every PR (the previous approach) was pure
  # CI cost with no corresponding correctness signal. The must-gather image
  # itself IS built from source below, since that's the actual subject under
  # test. Trade-off: CHART_IMAGE_TAG can drift from current main's CRD/API
  # schema over time -- bump it (or override via workflow_dispatch
  # chart-image-tag) if the Helm install step starts failing.
  # Duration: ~5-8 minutes (was ~15-20 minutes when building images)
  # ========================================
  e2e-tests:
    name: E2E Tests (Live Cluster)
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Generous timeout for Kind setup + Helm install + tests
    if: ${{ !inputs.skip-tests }}
    env:
      KIND_EXPERIMENTAL_PROVIDER: podman
      KIND_CLUSTER_NAME: must-gather-e2e
      RELEASE_NAMESPACE: kubernaut-system
      WORKFLOW_NAMESPACE: kubernaut-workflows
      OPERATOR_NAMESPACE: kubernaut-operator-system
      # Pinned pre-built quay.io/kubernaut-ai/* release tag -- see job comment above.
      CHART_IMAGE_TAG: ${{ inputs.chart-image-tag != '' && inputs.chart-image-tag || '1.6.0-rc1' }}
      # Pinned jordigilh/kubernaut-operator release tag -- installs the real,
      # standalone operator (distinct from this Helm chart) so the e2e suite
      # can prove the optional kubernaut-operator-system log-collection path
      # (Issue #2037) against a genuine controller-manager pod, not a stub.
      OPERATOR_VERSION: ${{ inputs.operator-version != '' && inputs.operator-version || 'v1.5.7' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Install Podman
        uses: ./.github/actions/install-podman

      - name: Install Kind
        run: |
          KIND_VERSION="v0.32.0"
          curl -Lo ./kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: latest

      - name: Create Kind cluster
        run: |
          kind create cluster --name "$KIND_CLUSTER_NAME" --wait 120s
          kubectl cluster-info
          kubectl get nodes -o wide

      - name: Install Kubernaut Helm chart (pre-built images, pulled by Kind's nodes directly)
        run: |
          helm install kubernaut charts/kubernaut/ \
            --namespace "$RELEASE_NAMESPACE" --create-namespace \
            --set global.image.tag="${CHART_IMAGE_TAG}-amd64" \
            --wait --timeout 300s

      - name: Install kubernaut-operator (real controller-manager, for optional-namespace log collection coverage)
        run: |
          # The kubernaut-operator's controller-manager needs no external
          # deps (Postgres/Valkey/LLM) to become Ready -- those only matter
          # once a Kubernaut CR is reconciled, which this job never creates.
          # dist/install.yaml is a self-contained kubebuilder bundle
          # (Namespace, CRD, RBAC, Deployment) -- pulled directly, no OLM.
          kubectl apply -f "https://raw.githubusercontent.com/jordigilh/kubernaut-operator/${OPERATOR_VERSION}/dist/install.yaml"
          kubectl -n "$OPERATOR_NAMESPACE" rollout status deployment/kubernaut-operator-controller-manager --timeout=120s

      - name: Build must-gather image
        working-directory: cmd/must-gather
        run: make build-local

      - name: Generate in-cluster kubeconfig for containerized bats
        run: |
          # Issue #2037: --internal produces the in-Kind-network API server
          # address (not the host-mapped 127.0.0.1 one), so the containerized
          # bats suite -- joined to the Kind podman network below -- can reach it.
          kind get kubeconfig --internal --name "$KIND_CLUSTER_NAME" > /tmp/kubeconfig-e2e

      - name: Run must-gather E2E bats suite (containerized, against live cluster)
        working-directory: cmd/must-gather
        run: |
          make test-e2e-container \
            KUBECONFIG_PATH=/tmp/kubeconfig-e2e \
            KIND_NETWORK=kind \
            RELEASE_NAMESPACE="$RELEASE_NAMESPACE" \
            WORKFLOW_NAMESPACE="$WORKFLOW_NAMESPACE" \
            OPERATOR_NAMESPACE="$OPERATOR_NAMESPACE"

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          echo "=== Pod status ==="
          kubectl get pods -A --no-headers 2>/dev/null || true
          echo "=== CRDs ==="
          kubectl get crd -o name 2>/dev/null | grep kubernaut.ai || true
          echo "=== Events ==="
          kubectl get events -n "$RELEASE_NAMESPACE" --sort-by='.lastTimestamp' 2>/dev/null | tail -30 || true
          echo "=== kubernaut-operator status ==="
          kubectl get pods -n "$OPERATOR_NAMESPACE" 2>/dev/null || true
          kubectl get events -n "$OPERATOR_NAMESPACE" --sort-by='.lastTimestamp' 2>/dev/null | tail -20 || true
          echo "=== Kind logs ==="
          kind export logs /tmp/kind-e2e-logs --name "$KIND_CLUSTER_NAME" 2>/dev/null || true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: must-gather-e2e-diagnostics-${{ github.run_id }}
          path: /tmp/kind-e2e-logs/
          retention-days: 7
          if-no-files-found: warn

      - name: Cleanup Kind cluster
        if: always()
        run: |
          kind delete cluster --name "$KIND_CLUSTER_NAME" 2>/dev/null || true

      - name: Cleanup Podman
        if: always()
        run: |
          podman system prune -a -f 2>/dev/null || true

  # ========================================
  # FINAL STATUS: Overall test summary
  # ========================================
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, container-build, e2e-tests]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "📊 Must-Gather Test Results"
          echo "============================"
          echo ""

          if [ "${{ needs.unit-tests.result }}" == "success" ] || [ "${{ needs.unit-tests.result }}" == "skipped" ]; then
            echo "✅ Unit Tests: ${{ needs.unit-tests.result }}"
          else
            echo "❌ Unit Tests: ${{ needs.unit-tests.result }}"
            FAILED=true
          fi

          if [ "${{ needs.container-build.result }}" == "success" ] || [ "${{ needs.container-build.result }}" == "skipped" ]; then
            echo "✅ Container Build: ${{ needs.container-build.result }}"
          else
            echo "❌ Container Build: ${{ needs.container-build.result }}"
            FAILED=true
          fi

          if [ "${{ needs.e2e-tests.result }}" == "success" ] || [ "${{ needs.e2e-tests.result }}" == "skipped" ]; then
            echo "✅ E2E Tests: ${{ needs.e2e-tests.result }}"
          else
            echo "❌ E2E Tests: ${{ needs.e2e-tests.result }}"
            FAILED=true
          fi

          echo ""
          if [ "$FAILED" == "true" ]; then
            echo "❌ Must-Gather tests failed"
            exit 1
          else
            echo "✅ All must-gather tests passed!"
          fi

