suite: "Issue #1819: kubernaut-agent NetworkPolicy Egress hardening (last fleet/LLM-integrated service without an egress allowlist)"
# RCA: networkpolicy-agent.yaml declared only `policyTypes: [Ingress]` -- an
# omitted Egress policyType means Kubernetes allows ALL egress, not none.
# KA both calls an LLM provider directly (ai.llm.provider/ai.llm.endpoint)
# and, since #1729, calls the Fleet MCP Gateway + its OAuth2 IdP directly
# (registerFleetTools, cmd/kubernautagent/toolregistry.go) -- yet had no
# egress allowlist at all. Follow-up to #1729; mirrors the identical
# commonEgress/datastorageEgress/llmEgress/idpEgress/mcpGatewayEgress
# pattern already applied to apifrontend/workflowexecution/aianalysis/
# remediationorchestrator/signalprocessing/effectivenessmonitor/gateway.
templates:
  - templates/kubernaut-agent/networkpolicy-agent.yaml
set:
  postgresql:
    auth:
      existingSecret: dummy
  valkey:
    existingSecret: dummy
  global:
    llmProfiles:
      primary:
        provider: openai
        model: gpt-4
        credentialsSecretName: llm-credentials-primary
  kubernautAgent:
    llmProfileRef: primary
  signalprocessing:
    policies:
      existingConfigMap: test-cm
  aianalysis:
    policies:
      existingConfigMap: test-cm
  # Issue #1984 Phase D: workflowexecution.fleet.oauth2.credentialsSecretRef
  # is schema-required whenever global.fleet.mcpGatewayEndpoint is set.
  workflowexecution:
    fleet:
      oauth2:
        credentialsSecretRef: we-oauth2-creds
tests:
  - it: "declares both Ingress and Egress policyTypes (previously Ingress-only, meaning unrestricted egress)"
    asserts:
      - contains:
          path: spec.policyTypes
          content: Ingress
      - contains:
          path: spec.policyTypes
          content: Egress

  - it: "renders the DataStorage egress rule unconditionally (BR-AUDIT-005 audit events)"
    asserts:
      - contains:
          path: spec.egress
          content:
            ports:
              - port: 8080
                protocol: TCP
              - port: 8081
                protocol: TCP
            to:
              - podSelector:
                  matchLabels:
                    app: datastorage

  - it: "renders the LLM provider egress rule unconditionally (ai.llm.endpoint is mandatory KA config), defaulting to 443/0.0.0.0/0"
    asserts:
      - contains:
          path: spec.egress
          content:
            ports:
              - port: 443
                protocol: TCP
            to:
              - ipBlock:
                  cidr: "0.0.0.0/0"

  - it: "has no IdP or MCP Gateway egress rule by default (global.fleet.enabled unset)"
    asserts:
      - notContains:
          path: spec.egress
          content:
            ports:
              - port: 8080
                protocol: TCP
            to:
              - ipBlock:
                  cidr: "0.0.0.0/0"

  - it: "renders the IdP egress rule (fleet OAuth2 token fetch) when global.fleet.enabled=true, defaulting to 443/0.0.0.0/0"
    set:
      global:
        fleet:
          enabled: true
          mcpGatewayEndpoint: "http://mcp.example.com"
          mcpGatewayType: "kuadrant"
          oauth2:
            enabled: true
            tokenURL: "https://dex.example.com/token"
            credentialsSecretRef: "fleet-creds"
    asserts:
      - contains:
          path: spec.egress
          content:
            ports:
              - port: 443
                protocol: TCP
            to:
              - ipBlock:
                  cidr: "0.0.0.0/0"

  - it: "renders the MCP Gateway egress rule when global.fleet.enabled=true, defaulting to 8080/0.0.0.0/0"
    set:
      global:
        fleet:
          enabled: true
          mcpGatewayEndpoint: "http://mcp.example.com"
          mcpGatewayType: "kuadrant"
          oauth2:
            enabled: true
            tokenURL: "https://dex.example.com/token"
            credentialsSecretRef: "fleet-creds"
    asserts:
      - contains:
          path: spec.egress
          content:
            ports:
              - port: 8080
                protocol: TCP
            to:
              - ipBlock:
                  cidr: "0.0.0.0/0"

  - it: "MCP Gateway egress rule honors networkPolicies.mcpGateway.port/cidr override"
    set:
      global:
        fleet:
          enabled: true
          mcpGatewayEndpoint: "http://mcp.example.com"
          mcpGatewayType: "kuadrant"
          oauth2:
            enabled: true
            tokenURL: "https://dex.example.com/token"
            credentialsSecretRef: "fleet-creds"
      networkPolicies:
        mcpGateway:
          port: 9443
          cidr: "10.244.0.0/16"
    asserts:
      - contains:
          path: spec.egress
          content:
            ports:
              - port: 9443
                protocol: TCP
            to:
              - ipBlock:
                  cidr: "10.244.0.0/16"

  - it: "existing ingress rules (aianalysis-controller, apifrontend, ingressCIDRs, metrics) are unaffected by the egress hardening"
    asserts:
      - contains:
          path: spec.ingress
          content:
            ports:
              - port: 8443
                protocol: TCP
            from:
              - podSelector:
                  matchLabels:
                    app: aianalysis-controller
      - contains:
          path: spec.ingress
          content:
            ports:
              - port: 8443
                protocol: TCP
            from:
              - podSelector:
                  matchLabels:
                    app: apifrontend
