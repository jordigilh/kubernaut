name: Deprecated application chart checks (offline)

# The live application chart is no longer a qualification source. Operator
# bootstrap + Kubernaut CR qualification is owned by ci-pipeline.yml and the
# release operator FP/Fleet gate. This manual workflow retains only the
# temporarily allowed offline chart checks.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deprecated-chart-validation:
    name: Deprecated chart lint/render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: latest
      - name: Lint and render without installing
        run: |
          set -euo pipefail
          helm lint charts/kubernaut --strict
          helm template kubernaut charts/kubernaut >/tmp/deprecated-kubernaut-rendered.yaml
          test -s /tmp/deprecated-kubernaut-rendered.yaml
