                  cidr: "0.0.0.0/0"

  - it: "apifrontend NetworkPolicy renders the MCP Gateway egress rule when global.fleet.enabled=true"
    template: templates/apifrontend/networkpolicy.yaml
    set:
      global:
        fleet:
          enabled: true
