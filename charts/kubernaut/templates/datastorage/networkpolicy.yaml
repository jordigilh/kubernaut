apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
{{ include "kubernaut.np.metadata" (dict "root" $ "nameSuffix" "datastorage" "appLabel" "datastorage") }}
spec:
  podSelector:
    matchLabels:
      app: datastorage
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
      from:
        - podSelector:
            matchLabels:
              app: gateway
        - podSelector:
            matchLabels:
              app: aianalysis-controller
        - podSelector:
            matchLabels:
              app: signalprocessing-controller
        - podSelector:
            matchLabels:
              app: remediationorchestrator-controller
        - podSelector:
            matchLabels:
              app: workflowexecution-controller
        - podSelector:
            matchLabels:
              app: notification-controller
        - podSelector:
            matchLabels:
              app: effectivenessmonitor-controller
        - podSelector:
            matchLabels:
              app: authwebhook
        - podSelector:
            matchLabels:
              app: kubernaut-agent
    {{- include "kubernaut.np.ingressCIDRs" (dict "cidrs" .Values.networkPolicies.datastorage.ingressCIDRs "port" 8080) | nindent 4 }}
    {{- include "kubernaut.np.ingressNamespaceSelectors" (dict "selectors" .Values.networkPolicies.datastorage.ingressNamespaceSelectors "port" 8080) | nindent 4 }}
    {{- include "kubernaut.np.metricsIngress" $ | nindent 4 }}
  egress:
    {{- include "kubernaut.np.commonEgress" . | nindent 4 }}
    - ports:
        - port: 5432
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              app: postgresql
    - ports:
        # DD-PLATFORM-006 DA8: Valkey is TLS-only on 6380.
        - port: 6380
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              app: valkey
    {{- if .Values.networkPolicies.externalRegistry.cidr }}
    - ports:
        - port: {{ .Values.networkPolicies.externalRegistry.port | default 443 }}
          protocol: TCP
      to:
        - ipBlock:
            cidr: {{ .Values.networkPolicies.externalRegistry.cidr }}
    {{- end }}
