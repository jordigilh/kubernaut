# Optional fleet-demo dependency overrides.
# Built-in defaults remain in the Go infrastructure code when this file is omitted.
envoyGatewayVersion: v1.9.2
agentRouterVersion: v1.2.0

dependency:
  chart: oci://quay.io/kubernaut-ai/kubernaut-development-dependencies
  version: 0.1.0-run.1
  # Prefer chartDigest for qualification evidence.
  chartDigest: sha256:b68bb1f24c7e5dfb67107650995987681a156d7a34eea97744c91a88013a325a

# Optional prebuilt release inputs. Explicit values win over the selected
# published v1.6 line. Digests are preferred for qualification evidence.
operator:
  version: 1.6.0-rcN
  image: quay.io/kubernaut-ai/kubernaut-operator@sha256:<operator-image-digest>
  # imageRepository/imageTag are convenient for local immutable candidates;
  # image wins when both forms are supplied.
  # imageRepository: localhost/kubernaut-operator
  # imageTag: main-<operator-sha>
  imageDigest: sha256:<operator-image-digest>
  chart: oci://quay.io/kubernaut-ai/charts/kubernaut-operator
  chartDigest: sha256:<operator-chart-digest>
  ref: <operator-commit-sha>

kubernaut:
  version: 1.6.0-rcN
  image: quay.io/kubernaut-ai/gateway@sha256:<gateway-image-digest>
  imageDigest: sha256:<gateway-image-digest>
