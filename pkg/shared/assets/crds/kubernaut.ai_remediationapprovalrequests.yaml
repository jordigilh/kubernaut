---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: remediationapprovalrequests.kubernaut.ai
spec:
  group: kubernaut.ai
  names:
    kind: RemediationApprovalRequest
    listKind: RemediationApprovalRequestList
    plural: remediationapprovalrequests
    shortNames:
    - rar
    - rars
    singular: remediationapprovalrequest
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.aiAnalysisRef.name
      name: AIAnalysis
      type: string
    - jsonPath: .spec.confidence
      name: Confidence
      type: number
    - jsonPath: .status.decision
      name: Decision
      type: string
    - jsonPath: .status.expired
      name: Expired
      type: boolean
    - jsonPath: .spec.requiredBy
      name: RequiredBy
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          RemediationApprovalRequest is the Schema for the remediationapprovalrequests API.

          ADR-040: RemediationApprovalRequest CRD Architecture
          - Follows Kubernetes CertificateSigningRequest pattern (immutable spec, mutable status)
          - Owned by RemediationRequest (flat hierarchy per ADR-001)
          - AIAnalysis controller uses field index on spec.aiAnalysisRef.name for efficient lookup
          - Timeout expiration handled by dedicated controller

          Lifecycle:
          1. RO creates when AIAnalysis.status.approvalRequired=true
          2. Operator approves/rejects via status.conditions update
          3. Dedicated controller detects decision or timeout
          4. AIAnalysis controller watches and transitions phase accordingly
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              RemediationApprovalRequestSpec defines the desired state of RemediationApprovalRequest.

              ADR-040: Spec Immutability
              ALL spec fields are immutable after CRD creation (follows CertificateSigningRequest pattern).
              This provides a complete audit trail and prevents race conditions.
            properties:
              aiAnalysisRef:
                description: |-
                  Reference to the AIAnalysis that requires approval
                  Used by AIAnalysis controller for efficient field-indexed lookup (ADR-040)
                properties:
                  name:
                    description: Name of the referenced object
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              alternativesConsidered:
                description: Alternative approaches considered
                items:
                  description: ApprovalAlternative describes an alternative approach
                    with pros/cons
                  properties:
                    approach:
                      description: Alternative approach description
                      type: string
                    prosCons:
                      description: Pros and cons analysis
                      type: string
                  required:
                  - approach
                  - prosCons
                  type: object
                type: array
              clusterID:
                description: |-
                  ClusterID identifies the source cluster for fleet-scoped remediations (DD-AUDIT-003 v2.2).
                  Propagated from RemediationRequest.Spec.ClusterID for audit correlation (SOC2 CC8.1).
                type: string
              confidence:
                description: |-
                  Confidence score from AI analysis (0.0-1.0)
                  Typically 0.6-0.79 triggers approval (below auto-approve threshold)
                maximum: 1
                minimum: 0
                type: number
              confidenceLevel:
                description: Confidence level derived from score
                enum:
                - low
                - medium
                - high
                type: string
              evidenceCollected:
                description: Evidence collected during investigation
                items:
                  type: string
                type: array
              investigationSummary:
                description: Investigation summary from KA
                minLength: 1
                type: string
              parameterSchema:
                description: |-
                  ParameterSchema freezes the catalog-resolved constraints for review.
                  Nil denotes missing metadata; an empty list declares no parameters.
                items:
                  description: RemediationWorkflowParameter defines a workflow input
                    parameter
                  properties:
                    default:
                      x-kubernetes-preserve-unknown-fields: true
                    dependsOn:
                      items:
                        type: string
                      type: array
                    description:
                      type: string
                    enum:
                      items:
                        type: string
                      type: array
                    maximum:
                      type: number
                    minimum:
                      type: number
                    name:
                      type: string
                    pattern:
                      type: string
                    required:
                      type: boolean
                    type:
                      enum:
                      - string
                      - integer
                      - boolean
                      - array
                      - float
                      type: string
                  required:
                  - description
                  - name
                  - required
                  - type
                  type: object
                type: array
              parameters:
                additionalProperties:
                  type: string
                description: |-
                  Parameters freezes the original selected parameter values. An empty map is
                  distinct from missing data.
                type: object
              policyEvaluation:
                description: Policy evaluation results if Rego policy triggered approval
                properties:
                  decision:
                    description: Policy decision (PascalCase per K8s enum convention,
                      values from PolicyDecision type)
                    enum:
                    - Approved
                    - ManualReviewRequired
                    - Denied
                    - DegradedMode
                    type: string
                  matchedRules:
                    description: Rules that matched and triggered approval requirement
                    items:
                      type: string
                    type: array
                  policyHash:
                    description: |-
                      PolicyHash is the SHA256 hash of the Rego policy that produced this decision.
                      Pinned at approval-request creation time so the decision can be attributed,
                      after the fact, to the exact policy bundle revision that produced it, even if
                      the policy is later hot-reloaded (BR-AUDIT-006, BR-AI-030, Issue #1981).
                      Expected format: 64-character hexadecimal string (SHA256 hash); empty if no
                      policy was loaded when the decision was made.
                    type: string
                  policyName:
                    description: Policy name that was evaluated
                    type: string
                required:
                - decision
                - policyName
                type: object
              rcaConfidence:
                description: RCAConfidence is nil when the RCA score is unknown.
                maximum: 1
                minimum: 0
                type: number
              reason:
                description: Reason why approval is required
                minLength: 1
                type: string
              recommendedActions:
                description: Recommended actions with rationale
                items:
                  description: ApprovalRecommendedAction describes a recommended action
                    with rationale
                  properties:
                    action:
                      description: Action description
                      type: string
                    rationale:
                      description: Rationale for this action
                      type: string
                  required:
                  - action
                  - rationale
                  type: object
                minItems: 1
                type: array
              recommendedWorkflow:
                description: Recommended workflow from AI analysis
                properties:
                  executionBundle:
                    description: Execution bundle OCI reference (digest-pinned)
                    type: string
                  rationale:
                    description: Rationale for selecting this workflow
                    type: string
                  version:
                    description: Workflow version
                    type: string
                  workflowId:
                    description: Workflow identifier from catalog
                    type: string
                required:
                - executionBundle
                - rationale
                - version
                - workflowId
                type: object
              remediationRequestRef:
                description: |-
                  Reference to parent RemediationRequest CRD (owner)
                  RemediationRequest owns this CRD via ownerReferences (flat hierarchy per ADR-001)
                properties:
                  apiVersion:
                    description: API version of the referent.
                    type: string
                  fieldPath:
                    description: |-
                      If referring to a piece of an object instead of an entire object, this string
                      should contain a valid JSON/Go field access statement, such as desiredState.manifest.containers[2].
                      For example, if the object reference is to a container within a pod, this would take on a value like:
                      "spec.containers{name}" (where "name" refers to the name of the container that triggered
                      the event) or if no container name is specified "spec.containers[2]" (container with
                      index 2 in this pod). This syntax is chosen only to have some well-defined way of
                      referencing a part of an object.
                    type: string
                  kind:
                    description: |-
                      Kind of the referent.
                      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
                    type: string
                  name:
                    description: |-
                      Name of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                  namespace:
                    description: |-
                      Namespace of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/
                    type: string
                  resourceVersion:
                    description: |-
                      Specific resourceVersion to which this reference is made, if any.
                      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#concurrency-control-and-consistency
                    type: string
                  uid:
                    description: |-
                      UID of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#uids
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              requiredBy:
                description: |-
                  Deadline for approval decision (approval expires after this time)
                  Calculated by RO using hierarchy: per-request → policy → namespace → default (15m)
                format: date-time
                type: string
              targetContext:
                description: TargetContext freezes the target and cluster context
                  for this review.
                properties:
                  remediationTarget:
                    description: RemediationTarget is the AI-selected target, when
                      one was supplied.
                    properties:
                      apiVersion:
                        description: |-
                          APIVersion disambiguates the resource's API group when the Kind exists in
                          multiple groups (e.g. Route in route.openshift.io vs serving.knative.dev).
                          Format: "group/version" (e.g. "route.openshift.io/v1"). Issue #1040.
                        type: string
                      kind:
                        description: Kind of the Kubernetes resource (e.g., "Pod",
                          "Deployment", "Node", "StatefulSet")
                        type: string
                      name:
                        description: Name of the Kubernetes resource instance
                        type: string
                      namespace:
                        description: Namespace of the Kubernetes resource (empty for
                          cluster-scoped resources like Node)
                        type: string
                    required:
                    - kind
                    - name
                    type: object
                  signalClusterId:
                    description: SignalClusterID identifies the signal's source cluster.
                    type: string
                  signalTarget:
                    description: SignalTarget is the signal-derived resource from
                      the parent request.
                    properties:
                      apiVersion:
                        description: |-
                          APIVersion disambiguates the resource's API group when the Kind exists in
                          multiple groups (e.g. Route in route.openshift.io vs serving.knative.dev).
                          Format: "group/version" (e.g. "route.openshift.io/v1"). Issue #1040.
                        type: string
                      kind:
                        description: Kind of the Kubernetes resource (e.g., "Pod",
                          "Deployment", "Node", "StatefulSet")
                        type: string
                      name:
                        description: Name of the Kubernetes resource instance
                        type: string
                      namespace:
                        description: Namespace of the Kubernetes resource (empty for
                          cluster-scoped resources like Node)
                        type: string
                    required:
                    - kind
                    - name
                    type: object
                required:
                - signalTarget
                type: object
              whyApprovalRequired:
                description: Detailed explanation of why approval is required
                minLength: 1
                type: string
              workflow:
                description: Workflow freezes the catalog-resolved execution details
                  reviewed by the operator.
                properties:
                  actionType:
                    description: |-
                      ActionType is the DD-WORKFLOW-016 taxonomy action type (e.g.,
                      ScaleReplicas, RestartPod), resolved from the DS catalog at selection
                      time. Required here because the upstream source of truth,
                      RemediationWorkflow.Spec.ActionType, is itself
                      so it is always non-empty once a workflow has been resolved from the
                      catalog. Audit-readability only -- WorkflowID remains the
                      functional/join key for SOC2 CC8.1 reconstruction regardless
                      (IT-AW-1111-001).
                    type: string
                  declaredParameterNames:
                    additionalProperties:
                      type: boolean
                    description: |-
                      DeclaredParameterNames is the parameter-name allowlist WorkflowExecution
                      uses for defense-in-depth stripping of undeclared parameters (#243). Not
                      "omitempty": nil (missing schema, fail closed) and a non-nil empty map
                      (schema declares zero allowed parameters, strip everything) are
                      distinct, meaningful values (IT-WE-243-002 vs IT-WE-243-003) -- Go's
                      encoding/json "omitempty" treats a zero-length map the same as nil and
                      silently drops it from the wire payload, collapsing that distinction.
                    nullable: true
                    type: object
                  dependencies:
                    description: |-
                      Dependencies declares the Secrets/ConfigMaps the workflow's schema
                      requires in the execution namespace (DD-WE-006).
                    properties:
                      configMaps:
                        items:
                          description: |-
                            WorkflowResourceDependency identifies a required Kubernetes Secret or
                            ConfigMap by name in the execution namespace.
                          properties:
                            name:
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                      secrets:
                        items:
                          description: |-
                            WorkflowResourceDependency identifies a required Kubernetes Secret or
                            ConfigMap by name in the execution namespace.
                          properties:
                            name:
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                    type: object
                  engineConfig:
                    description: |-
                      EngineConfig holds engine-specific configuration (BR-WE-016).
                      For ansible: {"playbookPath": "...", "jobTemplateName": "...", "inventoryName": "..."}.
                      For tekton/job: nil.
                    x-kubernetes-preserve-unknown-fields: true
                  executionBundle:
                    description: |-
                      ExecutionBundle is the OCI execution bundle reference (digest-pinned),
                      resolved from the DS workflow catalog.
                    type: string
                  executionBundleDigest:
                    description: ExecutionBundleDigest is retained for audit trail
                      and reproducibility.
                    type: string
                  executionClusterId:
                    description: |-
                      ExecutionClusterID is the workflow-declared fleet cluster this
                      workflow's execution resource (Job/PipelineRun/Ansible run) runs on,
                      resolved from the DS workflow catalog at selection time (DD-FLEET-008,
                      BR-FLEET-004, Issue #2326). Empty means unset: execution runs on the
                      same cluster as the triggering signal, the pre-existing default
                      behavior. When set, RemediationOrchestrator's WorkflowExecutionCreator
                      uses this value in preference to RemediationRequest.Spec.ClusterID for
                      WorkflowExecution.Spec.ClusterID -- e.g. a GitOps-hub cluster, or an
                      aggregator cluster reaching a resource-constrained edge device.
                    type: string
                  executionEngine:
                    description: |-
                      ExecutionEngine specifies the backend engine for workflow execution,
                      resolved from the DS workflow catalog at selection time. Deliberately
                      NOT Required: unlike WorkflowID/WorkflowName/ActionType/Version/
                      ExecutionBundle (whose upstream sources guarantee non-empty values),
                      AIAnalysis legitimately persists a SelectedWorkflow with this field
                      empty on its partial/degenerate paths (e.g. workflow-resolution
                      failure, low-confidence preservation -- see
                      preservePartialSelectedWorkflow/preserveLowConfidenceWorkflow in
                      pkg/aianalysis/handlers/response_processor.go) before
                      RemediationOrchestrator's validateSelectedWorkflow ever runs its own
                      Go-level fail-closed check. Tightening this to Required+no-omitempty
                      broke exactly that: an empty string is present-but-invalid against the
                      Enum, not merely "missing" (#1661 Change 12 CI regression, confirmed
                      against IT-AA-344-001 and three sibling suites -- 100go.co "validate
                      at the right layer": RO's runtime check, not CRD admission, is the
                      correct gate here).
                    enum:
                    - tekton
                    - job
                    - ansible
                    type: string
                  resources:
                    description: |-
                      Resources declares the per-workflow Job container CPU/memory
                      requests/limits (BR-WE-019 / DD-WE-008). Nil preserves BestEffort QoS.
                    properties:
                      claims:
                        description: |-
                          Claims lists the names of resources, defined in spec.resourceClaims,
                          that are used by this container.

                          This field depends on the
                          DynamicResourceAllocation feature gate.

                          This field is immutable. It can only be set for containers.
                        items:
                          description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                          properties:
                            name:
                              description: |-
                                Name must match the name of one entry in pod.spec.resourceClaims of
                                the Pod where this field is used. It makes that resource available
                                inside a container.
                              type: string
                            request:
                              description: |-
                                Request is the name chosen for a request in the referenced claim.
                                If empty, everything from the claim is made available, otherwise
                                only the result of this request.
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                      limits:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Limits describes the maximum amount of compute resources allowed.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                      requests:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Requests describes the minimum amount of compute resources required.
                          If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                          otherwise to an implementation-defined value. Requests cannot exceed Limits.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                    type: object
                  serviceAccountName:
                    description: |-
                      ServiceAccountName is the pre-existing ServiceAccount resolved from
                      the DS workflow catalog at selection time (Issue #650), used for pod
                      execution.
                    type: string
                  version:
                    description: Version is the workflow's semantic version.
                    type: string
                  workflowId:
                    description: WorkflowID is the catalog lookup key (DS-assigned
                      UUID).
                    type: string
                  workflowName:
                    description: |-
                      WorkflowName is the human-readable workflow identifier, always equal
                      to RemediationWorkflow.metadata.name -- a Kubernetes-guaranteed
                      non-empty value on every object, making this Required safe on both
                      embedding CRDs. Surfaced for kubectl/operator readability so CRD
                      consumers aren't limited to the opaque WorkflowID UUID.
                      Catalog-authoritative: always sourced from DataStorage, never
                      LLM-suppliable (Issue #1661 Change 12).
                    type: string
                required:
                - actionType
                - executionBundle
                - version
                - workflowId
                - workflowName
                type: object
            required:
            - aiAnalysisRef
            - confidence
            - confidenceLevel
            - investigationSummary
            - reason
            - recommendedActions
            - recommendedWorkflow
            - remediationRequestRef
            - requiredBy
            - whyApprovalRequired
            type: object
            x-kubernetes-validations:
            - message: spec is immutable after creation (ADR-040)
              rule: self == oldSelf
          status:
            description: RemediationApprovalRequestStatus defines the observed state
              of RemediationApprovalRequest.
            properties:
              conditions:
                description: |-
                  Conditions represent the latest available observations
                  Standard condition types:
                  - "Approved" - Decision is Approved
                  - "Rejected" - Decision is Rejected
                  - "Expired" - Decision timed out
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              createdAt:
                description: Time when the approval request was created
                format: date-time
                type: string
              decidedAt:
                description: When the decision was made
                format: date-time
                type: string
              decidedBy:
                description: Who made the decision (username or "system" for timeout)
                type: string
              decidedVia:
                description: |-
                  Who facilitated the decision (trusted intermediary SA identity).
                  Empty for direct decisions (kubectl, CLI). Set by webhook when a trusted
                  intermediary (AF SA) delegates approval on behalf of a human user.
                  Operational visibility field — DS audit trail is authoritative.
                type: string
              decision:
                description: |-
                  Decision made by operator or system (timeout)
                  Empty string indicates pending decision
                enum:
                - ""
                - Approved
                - Rejected
                - Expired
                - Cancelled
                type: string
              decisionMessage:
                description: Optional message from the decision maker
                type: string
              expired:
                description: True if the approval request has expired
                type: boolean
              message:
                description: Human-readable message about current state
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed
                format: int64
                type: integer
              reason:
                description: Reason for current state (machine-readable)
                type: string
              timeRemaining:
                description: |-
                  Time remaining until expiration (human-readable, e.g., "5m30s")
                  Updated by controller periodically
                type: string
              workflowOverride:
                description: |-
                  Operator workflow/parameter override (#594, ADR-040).
                  Only valid when Decision is Approved. Webhook validates the referenced RW.
                properties:
                  parameters:
                    additionalProperties:
                      type: string
                    description: |-
                      Parameters contains partial changes to the original values. Omitted keys
                      are unchanged; nil and an explicitly empty map are both no-ops.
                    type: object
                  rationale:
                    description: Rationale for the override decision (audit trail).
                    type: string
                  workflowName:
                    description: WorkflowName is a legacy field. Parameter-only approvals
                      reject a non-empty value.
                    type: string
                type: object
            type: object
        type: object
    selectableFields:
    - jsonPath: .spec.remediationRequestRef.name
    - jsonPath: .spec.aiAnalysisRef.name
    served: true
    storage: true
    subresources:
      status: {}
