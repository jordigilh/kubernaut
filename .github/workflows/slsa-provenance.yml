name: SLSA Provenance Attestation

# Isolated reusable workflow: generates SLSA v1.0 Build L3 provenance for a
# single OCI image digest. Runs as its own job with its own OIDC identity, so
# the calling workflow (release.yml) cannot influence or forge the resulting
# attestation -- this isolation is what upgrades provenance from Build L2
# (self-asserted, generated inline in the same job that built the image) to
# Build L3 (non-falsifiable, generated by a trusted component the build
# cannot tamper with).
#
# Deliberately still uses actions/attest-build-provenance (the same,
# actively-maintained GitHub-native action already used for L2) rather than
# slsa-framework/slsa-github-generator: that project is no longer actively
# maintained (frozen at v2.1.0, Feb 2025) and its own docs now recommend this
# native-attestation + isolated-reusable-workflow pattern instead.
#
# Authority: Issue #1109 | FedRAMP SA-12, CM-14, AU-3

on:
  workflow_call:
    inputs:
      service:
        description: 'Service name, used for artifact naming (e.g., gateway, kubernautagent)'
        required: true
        type: string
      image:
        description: 'Fully-qualified image name, no tag/digest (e.g., quay.io/kubernaut-ai/gateway)'
        required: true
        type: string
      version:
        description: 'Tag to resolve and attest (e.g., 1.6.0). Resolved to a digest inside this isolated job, rather than trusting a digest computed by the caller, so the caller cannot influence which digest gets attested.'
        required: true
        type: string

jobs:
  attest:
    name: "Attest ${{ inputs.service }}"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write         # OIDC token for Sigstore signing
      attestations: write     # Persist the attestation via the GH attestations API
      artifact-metadata: write # Artifact storage record (push-to-registry: true)
    steps:
      - name: Resolve manifest digest
        id: digest
        run: |
          MANIFEST_DIGEST=$(skopeo inspect --format '{{.Digest}}' "docker://${{ inputs.image }}:${{ inputs.version }}")
          echo "manifest=${MANIFEST_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Manifest digest for ${{ inputs.service }}: ${MANIFEST_DIGEST}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Login to Quay.io (Cosign)
        run: |
          cosign login -u "${{ secrets.QUAY_ROBOT_USERNAME }}" \
                       -p "${{ secrets.QUAY_ROBOT_TOKEN }}" \
                       quay.io

      - name: SLSA build provenance attestation
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ inputs.image }}
          subject-digest: ${{ steps.digest.outputs.manifest }}
          push-to-registry: true

      - name: Stage provenance bundle for release upload
        # Scorecard's Signed-Releases check looks for signature/provenance files
        # attached directly to GitHub Release assets -- registry-level attestation
        # (push-to-registry above) isn't visible to it. Renaming and uploading the
        # bundle as an artifact here lets the release job attach it alongside SBOMs.
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" \
             "provenance-${{ inputs.service }}.sigstore.json"

      - name: Upload provenance bundle artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: provenance-${{ inputs.service }}
          path: provenance-${{ inputs.service }}.sigstore.json
          retention-days: 1
