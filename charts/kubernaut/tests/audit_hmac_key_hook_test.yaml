suite: "DD-PLATFORM-006 Decision Area 7: audit-HMAC key auto-generation hook (never-rotate)"
templates:
  - templates/hooks/tls-cert-job.yaml
set:
  postgresql:
    auth:
      existingSecret: dummy
  valkey:
    existingSecret: dummy
  global:
    llmProfiles:
      primary:
        provider: openai
        model: gpt-4
        credentialsSecretName: llm-credentials-primary
  kubernautAgent:
    llmProfileRef: primary
  tls:
    mode: hook
tests:
  - it: "default (auditHashKey.enabled=false): tls-cert-gen Job has no audit-HMAC key section"
    documentIndex: 0 # first document in this file is the tls-cert-gen Job
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "datastorage-audit-hmac-key"

  - it: "auditHashKey.enabled=true (default name): tls-cert-gen Job checks exists-only before creating -- never regenerates an existing key, since rotating it would silently corrupt hash-chain verification for every audit record hashed with the old key"
    set:
      datastorage:
        config:
          auditHashKey:
            enabled: true
    documentIndex: 0
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'AUDIT_HMAC_SECRET="datastorage-audit-hmac-key"'
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'kubectl get secret "\$AUDIT_HMAC_SECRET" -n "\$NAMESPACE" >/dev/null 2>&1'
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "openssl rand -base64 32"
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: 'kubectl create secret generic "\$AUDIT_HMAC_SECRET"'

  - it: "auditHashKey.enabled=true: never checks certificate expiry for the audit-HMAC key -- it is a static key, not a rotating certificate"
    set:
      datastorage:
        config:
          auditHashKey:
            enabled: true
    documentIndex: 0
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "audit-hmac-key[\\s\\S]{0,400}checkend"

  - it: "auditHashKey.enabled=true + existingSecret set (BYO): auto-gen is skipped for the custom-named secret, matching postgresql/valkey existingSecret semantics where the user manages the secret manually"
    set:
      datastorage:
        config:
          auditHashKey:
            enabled: true
            existingSecret: my-custom-hmac-secret
    documentIndex: 0
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "AUDIT_HMAC_SECRET="

  - it: "tls-cleanup Job (post-delete, hook mode) never deletes the audit-HMAC key -- it must survive helm uninstall/reinstall to preserve the audit hash chain's cryptographic integrity across the project's reinstall-not-upgrade model"
    documentSelector:
      path: metadata.name
      value: RELEASE-NAME-kubernaut-tls-cleanup
    set:
      datastorage:
        config:
          auditHashKey:
            enabled: true
    asserts:
      - notMatchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "kubectl delete secret datastorage-audit-hmac-key"
