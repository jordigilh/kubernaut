suite: "DD-PLATFORM-006 Decision Area 8: Valkey server-side TLS (TLS-only, plaintext port disabled)"
templates:
  - templates/infrastructure/valkey.yaml
  - templates/infrastructure/networkpolicy-valkey.yaml
  - templates/hooks/tls-cert-job.yaml
  - templates/datastorage/networkpolicy.yaml
  - templates/apifrontend/networkpolicy.yaml
  - templates/apifrontend/apifrontend.yaml
  - templates/fleetmetadatacache/fleetmetadatacache.yaml
  - templates/datastorage/datastorage.yaml
set:
  postgresql:
    auth:
      existingSecret: dummy
  valkey:
    existingSecret: dummy
  global:
    llmProfiles:
      primary:
        provider: openai
        model: gpt-4
        credentialsSecretName: llm-credentials-primary
  kubernautAgent:
    llmProfileRef: primary
  signalprocessing:
    policies:
      existingConfigMap: test-cm
  aianalysis:
    policies:
      existingConfigMap: test-cm
  tls:
    mode: hook
  # Issue #1984 Phase D: OAuth2 is schema-mandatory whenever
  # mcpGatewayEndpoint is set (all the FMC test cases below set it).
  workflowexecution:
    fleet:
      oauth2:
        credentialsSecretRef: we-oauth2-creds
tests:
  # ── Valkey Deployment: plaintext port disabled, TLS port enabled ──────────
  - it: "Valkey Deployment disables the plaintext port and enables tls-port 6380"
    template: templates/infrastructure/valkey.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - "--port"
            - "0"
            - "--tls-port"
            - "6380"
            - "--tls-cert-file"
            - "/certs/tls.crt"
            - "--tls-key-file"
            - "/certs/tls.key"
            - "--tls-ca-cert-file"
            - "/etc/tls-ca/ca.crt"
            - "--tls-auth-clients"
            - "yes"

  # ── DD-PLATFORM-006 DA19 (kubernaut#2269, BR-NET-002/AC-4): Valkey mTLS ───
  # Acceptance criterion: Valkey's own server configuration demands a client
  # certificate on every connection -- this is the single line whose absence
  # made #2269 a live gap. This helm-unittest proves the chart *renders* that
  # demand; it does not itself open a socket -- the actual "cert-less client
  # gets rejected" behavior was proven empirically this session against a
  # real valkey-server container (see the plan's Part 1 spike), and is
  # proven end-to-end by the existing E2E fullpipeline/fleet suites.
  - it: "Valkey Deployment requires client certificates (--tls-auth-clients yes), closing kubernaut#2269"
    template: templates/infrastructure/valkey.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args[11]
          value: "yes"
      - notEqual:
          path: spec.template.spec.containers[0].args[11]
          value: "no"

  - it: "Valkey container no longer exposes a plaintext containerPort"
    template: templates/infrastructure/valkey.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 6380

  - it: "Valkey Deployment mounts the valkey-tls secret for its own cert/key (not the CA)"
    template: templates/infrastructure/valkey.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: valkey-tls
            mountPath: /certs
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: valkey-tls
            secret:
              secretName: valkey-tls

  # PR #1790 round-9 RCA: valkey-tls's own Secret carries tls.crt/tls.key
  # only -- it must NOT be the source of ca.crt. In tls.mode=hook,
  # tls-cert-job.yaml's inter-service loop creates it via a plain `kubectl
  # create secret tls` (no ca.crt key; only authwebhook-tls gets that
  # patched in separately), so a ca.crt read from here always 404s in hook
  # mode -- it only ever appeared to work in tls.mode=cert-manager, where
  # cert-manager auto-populates ca.crt into every Certificate-issued Secret,
  # masking the gap. Valkey must source its CA from the same shared tls-ca
  # volume (inter-service-ca ConfigMap) as every other consumer instead.
  - it: "Valkey Deployment sources its CA from the shared tls-ca volume, not from within valkey-tls"
    template: templates/infrastructure/valkey.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tls-ca
            mountPath: /etc/tls-ca
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tls-ca
            configMap:
              name: inter-service-ca
              optional: true

  # DD-PLATFORM-006 DA19: since Valkey now requires client certs from every
  # connection (including its own healthcheck), the probes must present
  # valkey-tls's cert/key too or Valkey would fail its own liveness/
  # readiness checks -- acceptance criterion: "Valkey's own healthcheck
  # continues to function once it must authenticate to itself".
  - it: "Valkey readinessProbe/livenessProbe present a client cert (DA19) against port 6380 with the shared CA"
    template: templates/infrastructure/valkey.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.exec.command
          value: ["valkey-cli", "--tls", "--cacert", "/etc/tls-ca/ca.crt", "--cert", "/certs/tls.crt", "--key", "/certs/tls.key", "-p", "6380", "ping"]
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.exec.command
          value: ["valkey-cli", "--tls", "--cacert", "/etc/tls-ca/ca.crt", "--cert", "/certs/tls.crt", "--key", "/certs/tls.key", "-p", "6380", "ping"]

  - it: "Valkey Service exposes port 6380, not 6379"
    template: templates/infrastructure/valkey.yaml
    documentSelector:
      path: kind
      value: Service
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 6380
      - equal:
          path: spec.ports[0].targetPort
          value: 6380

  # ── kubernaut.valkey.addr helper: in-chart Valkey resolves to 6380 ────────
  - it: "kubernaut.valkey.addr resolves to port 6380 when valkey.enabled=true (in-chart Valkey)"
    template: templates/datastorage/datastorage.yaml
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data['config.yaml']
          pattern: "addr: valkey\\.[\\w-]+\\.svc\\.cluster\\.local:6380"

  # ── tls-cert-job.yaml: Valkey added to the per-service cert loop ──────────
  - it: "tls-cert-gen Job's inter-service cert loop includes valkey (valkey-tls secret, CA-signed like every other service)"
    template: templates/hooks/tls-cert-job.yaml
    documentIndex: 0
    asserts:
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "valkey-tls"
      - matchRegex:
          path: spec.template.spec.containers[0].command[2]
          pattern: "for SVC_NAME in [^\\n]*\\bvalkey\\b"

  # ── NetworkPolicies: all 4 egress/ingress rules to Valkey use 6380 ────────
  - it: "Valkey's own NetworkPolicy ingress rule allows port 6380, not 6379"
    template: templates/infrastructure/networkpolicy-valkey.yaml
    set:
      apifrontend:
        config:
          auth:
            replayCache:
              enabled: true
    asserts:
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 6380
      - notEqual:
          path: spec.ingress[0].ports[0].port
          value: 6379

  - it: "DataStorage NetworkPolicy egress-to-Valkey rule targets port 6380"
    template: templates/datastorage/networkpolicy.yaml
    asserts:
      - equal:
          path: spec.egress[2].ports[0].port
          value: 6380

  - it: "APIFrontend NetworkPolicy egress-to-Valkey rule (replayCache) targets port 6380"
    template: templates/apifrontend/networkpolicy.yaml
    set:
      apifrontend:
        config:
          auth:
            replayCache:
              enabled: true
    asserts:
      # Index shifted 3->4: issue #1795's AF->KA egress rule (networkpolicy.yaml)
      # was inserted ahead of the Valkey replay-cache rule in the egress list.
      - equal:
          path: spec.egress[4].ports[0].port
          value: 6380

  - it: "FleetMetadataCache NetworkPolicy egress-to-Valkey rule targets port 6380"
    template: templates/fleetmetadatacache/fleetmetadatacache.yaml
    documentSelector:
      path: kind
      value: NetworkPolicy
    set:
      fleetmetadatacache:
        enabled: true
        oauth2:
          credentialsSecretRef: "fmc-creds"
      global:
        fleet:
          mcpGatewayEndpoint: "http://mcp.example.com"
          oauth2:
            enabled: true
            tokenURL: "http://oauth.example.com"
            credentialsSecretRef: "fleet-oauth2-creds"
    asserts:
      - equal:
          path: spec.egress[1].ports[0].port
          value: 6380

  # ── DataStorage client-side TLS: CA mount present, caFile defaults sanely ─
  - it: "DataStorage Deployment mounts the shared inter-service CA (tls-ca) so redis.tls.caFile can verify Valkey's cert"
    template: templates/datastorage/datastorage.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tls-ca
            mountPath: /etc/tls-ca
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tls-ca
            configMap:
              name: inter-service-ca
              optional: true

  - it: "DataStorage redis.tls.caFile defaults to the mounted inter-service CA (redis.tls is mandatory-on, DA6) when no override is set"
    template: templates/datastorage/datastorage.yaml
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data['config.yaml']
          pattern: 'caFile: "/etc/tls-ca/ca\.crt"'

  - it: "DataStorage redis.tls.caFile explicit override still wins over the default"
    template: templates/datastorage/datastorage.yaml
    set:
      datastorage:
        config:
          redis:
            tls:
              caFile: "/etc/custom-ca/ca.crt"
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data['config.yaml']
          pattern: 'caFile: "/etc/custom-ca/ca\.crt"'

  # ── FMC client-side TLS: DD-PLATFORM-006 Decision Area 13 follow-up ────────
  # (round-16 RCA, PR #1790). FMC is a third Go Valkey client, missed by
  # Decision Area 13's original DataStorage/APIFrontend-only census -- these
  # mirror the DataStorage assertions above for the same reason (FMC's
  # dependency is load-bearing, not fail-open, so it follows DataStorage's
  # mandatory-on pattern rather than the replay cache's opt-in one).
  - it: "FMC valkey.tls is mandatory-on (enabled: true, no toggle) in the rendered ConfigMap"
    template: templates/fleetmetadatacache/fleetmetadatacache.yaml
    documentSelector:
      path: kind
      value: ConfigMap
    set:
      fleetmetadatacache:
        enabled: true
        oauth2:
          credentialsSecretRef: "fmc-creds"
      global:
        fleet:
          mcpGatewayEndpoint: "http://mcp.example.com"
          oauth2:
            enabled: true
            tokenURL: "http://oauth.example.com"
            credentialsSecretRef: "fleet-oauth2-creds"
    asserts:
      - matchRegex:
          path: data['config.yaml']
          pattern: "tls:\\n\\s+enabled: true"

  - it: "FMC valkey.tls.caFile defaults to the mounted inter-service CA when no override is set"
    template: templates/fleetmetadatacache/fleetmetadatacache.yaml
    documentSelector:
      path: kind
      value: ConfigMap
    set:
      fleetmetadatacache:
        enabled: true
        oauth2:
          credentialsSecretRef: "fmc-creds"
      global:
        fleet:
          mcpGatewayEndpoint: "http://mcp.example.com"
          oauth2:
            enabled: true
            tokenURL: "http://oauth.example.com"
            credentialsSecretRef: "fleet-oauth2-creds"
    asserts:
      - matchRegex:
          path: data['config.yaml']
          pattern: 'caFile: "/etc/tls-ca/ca\.crt"'

  - it: "FMC valkey.tls.caFile explicit override still wins over the default"
    template: templates/fleetmetadatacache/fleetmetadatacache.yaml
    documentSelector:
      path: kind
      value: ConfigMap
    set:
      fleetmetadatacache:
        enabled: true
        oauth2:
          credentialsSecretRef: "fmc-creds"
        valkeyTLS:
          caFile: "/etc/custom-ca/ca.crt"
      global:
        fleet:
          mcpGatewayEndpoint: "http://mcp.example.com"
          oauth2:
            enabled: true
            tokenURL: "http://oauth.example.com"
            credentialsSecretRef: "fleet-oauth2-creds"
    asserts:
      - matchRegex:
          path: data['config.yaml']
          pattern: 'caFile: "/etc/custom-ca/ca\.crt"'

  - it: "FMC Deployment mounts the shared inter-service CA (tls-ca) so valkeyTLS.caFile can verify Valkey's cert"
    template: templates/fleetmetadatacache/fleetmetadatacache.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      fleetmetadatacache:
        enabled: true
        oauth2:
          credentialsSecretRef: "fmc-creds"
      global:
        fleet:
          mcpGatewayEndpoint: "http://mcp.example.com"
          oauth2:
            enabled: true
            tokenURL: "http://oauth.example.com"
            credentialsSecretRef: "fleet-oauth2-creds"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tls-ca
            mountPath: /etc/tls-ca
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tls-ca
            configMap:
              name: inter-service-ca
              optional: true

  # ── DD-PLATFORM-006 DA19: client certFile/keyFile default to each ────────
  # service's own already-mounted cert -- acceptance criterion: "each
  # service presents a cert by default, with no operator action required"
  # (BR-NET-002, matching BR-PLATFORM-007's minimal-configuration mandate).
  - it: "DataStorage redis.tls.certFile/keyFile default to DataStorage's own mounted datastorage-tls cert"
    template: templates/datastorage/datastorage.yaml
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data['config.yaml']
          pattern: 'certFile: "/etc/tls/tls\.crt"'
      - matchRegex:
          path: data['config.yaml']
          pattern: 'keyFile: "/etc/tls/tls\.key"'

  - it: "DataStorage redis.tls.certFile/keyFile explicit override still wins over the default"
    template: templates/datastorage/datastorage.yaml
    set:
      datastorage:
        config:
          redis:
            tls:
              certFile: "/etc/custom-cert/tls.crt"
              keyFile: "/etc/custom-cert/tls.key"
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data['config.yaml']
          pattern: 'certFile: "/etc/custom-cert/tls\.crt"'
      - matchRegex:
          path: data['config.yaml']
          pattern: 'keyFile: "/etc/custom-cert/tls\.key"'

  - it: "FMC valkey.certFile/keyFile default to FMC's own mounted fleetmetadatacache-tls cert"
    template: templates/fleetmetadatacache/fleetmetadatacache.yaml
    documentSelector:
      path: kind
      value: ConfigMap
    set:
      fleetmetadatacache:
        enabled: true
        oauth2:
          credentialsSecretRef: "fmc-creds"
      global:
        fleet:
          mcpGatewayEndpoint: "http://mcp.example.com"
          oauth2:
            enabled: true
            tokenURL: "http://oauth.example.com"
            credentialsSecretRef: "fleet-oauth2-creds"
    asserts:
      - matchRegex:
          path: data['config.yaml']
          pattern: 'certFile: "/etc/tls/tls\.crt"'
      - matchRegex:
          path: data['config.yaml']
          pattern: 'keyFile: "/etc/tls/tls\.key"'

  - it: "FMC valkeyTLS.certFile/keyFile explicit override still wins over the default"
    template: templates/fleetmetadatacache/fleetmetadatacache.yaml
    documentSelector:
      path: kind
      value: ConfigMap
    set:
      fleetmetadatacache:
        enabled: true
        oauth2:
          credentialsSecretRef: "fmc-creds"
        valkeyTLS:
          certFile: "/etc/custom-cert/tls.crt"
          keyFile: "/etc/custom-cert/tls.key"
      global:
        fleet:
          mcpGatewayEndpoint: "http://mcp.example.com"
          oauth2:
            enabled: true
            tokenURL: "http://oauth.example.com"
            credentialsSecretRef: "fleet-oauth2-creds"
    asserts:
      - matchRegex:
          path: data['config.yaml']
          pattern: 'certFile: "/etc/custom-cert/tls\.crt"'
      - matchRegex:
          path: data['config.yaml']
          pattern: 'keyFile: "/etc/custom-cert/tls\.key"'

  - it: "APIFrontend replayCache.tls.certFile/keyFile default to APIFrontend's own mounted apifrontend-tls cert when replayCache is enabled"
    template: templates/apifrontend/apifrontend.yaml
    documentSelector:
      path: kind
      value: ConfigMap
    set:
      apifrontend:
        config:
          auth:
            replayCache:
              enabled: true
              tls:
                enabled: true
    asserts:
      - matchRegex:
          path: data['config.yaml']
          pattern: 'certFile: "/etc/apifrontend/tls/tls\.crt"'
      - matchRegex:
          path: data['config.yaml']
          pattern: 'keyFile: "/etc/apifrontend/tls/tls\.key"'

  - it: "APIFrontend replayCache.tls.certFile/keyFile explicit override still wins over the default"
    template: templates/apifrontend/apifrontend.yaml
    documentSelector:
      path: kind
      value: ConfigMap
    set:
      apifrontend:
        config:
          auth:
            replayCache:
              enabled: true
              tls:
                enabled: true
                certFile: "/etc/custom-cert/tls.crt"
                keyFile: "/etc/custom-cert/tls.key"
    asserts:
      - matchRegex:
          path: data['config.yaml']
          pattern: 'certFile: "/etc/custom-cert/tls\.crt"'
      - matchRegex:
          path: data['config.yaml']
          pattern: 'keyFile: "/etc/custom-cert/tls\.key"'
