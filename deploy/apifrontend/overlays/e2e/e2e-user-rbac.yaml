# Kubernetes RBAC for E2E users.
# ADR-022: All AF K8s operations (MCP bridge and A2A) use AF's ServiceAccount.
# E2E users do not need CRD permissions for kubernaut_* tools at runtime.
# These grants remain for E2E test fixture setup (admin kubectl).
#
# Removed 2026-08-04 (#1827 persona ACL-matrix E2E, incident found in CI on
# PR #1914): this file used to also carry a broad "MCP tool authorization"
# rule (kubernaut.ai/tools, verb=use) listing ~25 resourceNames, bound to
# sre/ai-orchestrator/observability/remediation-approver via the
# ClusterRoleBindings below. Because Kubernetes RBAC is additive (a SAR
# Allowed=true from ANY matching ClusterRole/Binding wins), that block
# silently granted every one of those 4 groups access to tools far beyond
# what charts/kubernaut/values.yaml's apifrontend.config.rbac.personas
# actually authorizes for them -- e.g. ai-orchestrator could call
# kubernaut_get_effectiveness, kubernaut_get_audit_trail, kubernaut_approve,
# etc. even though its persona entry never lists them. This defeated the
# exact per-persona least-privilege model persona_acl_matrix_test.go
# (TC-E2E-ACL-001) exists to prove, and went undetected because no prior
# test asserted a *negative* (denied) case for those (persona, tool) pairs
# through AF's real /mcp endpoint using a genuine Dex-issued token.
#
# The block was removed rather than reconciled with values.yaml because it
# had already drifted from it (e.g. "kubernaut_list_alerts" here vs.
# "list_alerts" in values.yaml's persona lists -- see the compat grant
# below) and duplicated authority PersonaToolClusterRolesYAML already
# derives correctly from values.yaml (afDeployE2ERBAC applies both). Removal
# impact was verified by grepping every kubernaut_* raw MCP tool call in
# test/e2e/apifrontend for the persona token used; the only dependency found
# was sre's alert_prioritization_e2e_test.go calls to "kubernaut_list_alerts"
# -- preserved narrowly below instead of restoring the full broad grant.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: e2e-user-k8s-tools
rules:
  # kubectl_list (kind: Pod) — AF SA reads; kept for E2E validation
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # kubectl_list_events — AF SA reads
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list"]
  # kubectl_list (kind: Deployment/StatefulSet) — AF SA reads
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["list"]
  # kubectl_get (owner chain: Pod -> ReplicaSet -> Deployment) — AF SA reads
  - apiGroups: [""]
    resources: ["pods", "replicationcontrollers"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["replicasets", "deployments", "statefulsets", "daemonsets"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get"]
  # kubernaut_remediate / kubernaut_check_existing_remediation / kubernaut_cancel_remediation / kubernaut_watch
  - apiGroups: ["kubernaut.ai"]
    resources: ["remediationrequests"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["kubernaut.ai"]
    resources: ["remediationrequests/status"]
    verbs: ["get", "update", "patch"]
  # remediation approvals
  - apiGroups: ["kubernaut.ai"]
    resources: ["remediationapprovalrequests"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["kubernaut.ai"]
    resources: ["remediationapprovalrequests/status"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: e2e-sre-k8s-tools
subjects:
  - kind: Group
    name: sre
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: e2e-user-k8s-tools
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: e2e-ai-orchestrator-k8s-tools
subjects:
  - kind: Group
    name: ai-orchestrator
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: e2e-user-k8s-tools
  apiGroup: rbac.authorization.k8s.io
---
# Observability group uses a namespace-scoped RoleBinding (not ClusterRoleBinding)
# to verify that K8s RBAC correctly restricts access to specific namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: e2e-observability-k8s-tools
  namespace: kubernaut-system
subjects:
  - kind: Group
    name: observability
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: e2e-user-k8s-tools
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: e2e-remediation-approver-k8s-tools
subjects:
  - kind: Group
    name: remediation-approver
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: e2e-user-k8s-tools
  apiGroup: rbac.authorization.k8s.io
---
# #1919: coarse-grained console-access gate (kubernaut.ai/console, verb=use),
# now enforced server-side at every tool-invocation site
# (checkRBAC/newRBACGuard), not just the advisory GET /a2a/access endpoint --
# E2E personas need this grant or every existing MCP/A2A tool-call E2E test
# would fail the new check. Deliberately a SEPARATE ClusterRole from
# e2e-user-k8s-tools (not one more rule added to it): SARChecker.checkSAR
# (pkg/apifrontend/auth/sar.go) never sets ResourceAttributes.Namespace, so
# this is always a cluster-scoped check -- a namespace-scoped RoleBinding
# (like observability's e2e-observability-k8s-tools below, intentionally
# namespace-scoped to prove K8s RBAC namespace restriction for *those*
# unrelated pods/events/deployments/etc. rules) can never satisfy it.
# Mixing the two into one ClusterRole silently broke observability's console
# access the first time this was tried (RCA'd via CI must-gather on PR
# #1940) -- every persona below gets an unconditional ClusterRoleBinding
# instead, matching the "every persona with a tool grant needs console
# access too" default applied to charts/kubernaut/values.yaml's
# consoleAccessGroups.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: e2e-console-access
rules:
  - apiGroups: ["kubernaut.ai"]
    resources: ["console"]
    verbs: ["use"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: e2e-sre-console-access
subjects:
  - kind: Group
    name: sre
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: e2e-console-access
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: e2e-ai-orchestrator-console-access
subjects:
  - kind: Group
    name: ai-orchestrator
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: e2e-console-access
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: e2e-cicd-console-access
subjects:
  - kind: Group
    name: cicd
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: e2e-console-access
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: e2e-observability-console-access
subjects:
  - kind: Group
    name: observability
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: e2e-console-access
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: e2e-l3-audit-console-access
subjects:
  - kind: Group
    name: l3-audit
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: e2e-console-access
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: e2e-remediation-approver-console-access
subjects:
  - kind: Group
    name: remediation-approver
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: e2e-console-access
  apiGroup: rbac.authorization.k8s.io
---
# Narrow compat grant for sre only: values.yaml's sre persona list carries
# "list_alerts" (the internal name AF's own ADK agent uses for the A2A tool
# -- pkg/apifrontend/agent/root.go), but the raw /mcp endpoint registers the
# same capability under a different resourceName, "kubernaut_list_alerts"
# (pkg/apifrontend/handler/mcp_bridge.go, mcptools.go). This pre-existing
# naming mismatch means PersonaToolClusterRolesYAML (which derives strictly
# from values.yaml) cannot itself authorize sre's direct-MCP
# alert_prioritization_e2e_test.go calls. Scoped to sre + this single
# resourceName only -- see the removal note above for why the broader grant
# this replaced was deleted rather than kept for all 4 groups.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: e2e-sre-list-alerts-compat
rules:
  - apiGroups: ["kubernaut.ai"]
    resources: ["tools"]
    resourceNames:
      - kubernaut_list_alerts
    verbs: ["use"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: e2e-sre-list-alerts-compat
subjects:
  - kind: Group
    name: sre
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: e2e-sre-list-alerts-compat
  apiGroup: rbac.authorization.k8s.io
