suite: Owner-chain RBAC extensibility (#1069, DD-GATEWAY-018)
templates:
  - templates/gateway/gateway.yaml
  - templates/effectivenessmonitor/effectivenessmonitor.yaml
  - templates/kubernaut-agent/kubernaut-agent.yaml
set:
  postgresql:
    auth:
      existingSecret: dummy
  valkey:
    existingSecret: dummy
  global:
    llmProfiles:
      primary:
        provider: openai
        model: gpt-4
        credentialsSecretName: llm-credentials-primary
  kubernautAgent:
    llmProfileRef: primary
  signalprocessing:
    policies:
      existingConfigMap: test-cm
  aianalysis:
    policies:
      existingConfigMap: test-cm
tests:
  # ---------------------------------------------------------------------
  # Primary fix (IT-HELM-1069-001): Gateway binds to built-in `view`
  # ClusterRole, matching the #545 pattern already used by RO/EM. This
  # resolves the reported poddisruptionbudgets.policy Forbidden error via
  # K8s RBAC aggregation (view includes PDB by default).
  # ---------------------------------------------------------------------
  - it: "IT-HELM-1069-001: Gateway binds to built-in view ClusterRole (fixes PDB owner-chain gap)"
    template: templates/gateway/gateway.yaml
    documentSelector:
      path: metadata.name
      value: gateway-view
    asserts:
      - isKind:
          of: ClusterRoleBinding
      - equal:
          path: roleRef.apiGroup
          value: rbac.authorization.k8s.io
      - equal:
          path: roleRef.kind
          value: ClusterRole
      - equal:
          path: roleRef.name
          value: view
      - equal:
          path: subjects[0].kind
          value: ServiceAccount
      - equal:
          path: subjects[0].name
          value: gateway

  # ---------------------------------------------------------------------
  # Bring-your-own-ClusterRole knob (IT-HELM-1069-002..004): generalizes
  # kubernaut-operator's KA-only AdditionalClusterRoleBindings mechanism to
  # Gateway, EM, and KA in the Helm chart, for ecosystems `view` cannot
  # cover via aggregation (OLM, ArgoCD, Kafka/Strimzi, custom CRDs, ...).
  # ---------------------------------------------------------------------
  - it: "IT-HELM-1069-002: Gateway renders no additionalClusterRoles by default"
    template: templates/gateway/gateway.yaml
    documentSelector:
      path: metadata.name
      value: gateway-ext-my-olm-reader
      skipEmptyTemplates: true
    asserts:
      - hasDocuments:
          count: 0
          filterAware: true

  - it: "IT-HELM-1069-003: Gateway renders a ClusterRoleBinding per name in additionalClusterRoles"
    set:
      gateway:
        additionalClusterRoles: ["my-olm-reader"]
    template: templates/gateway/gateway.yaml
    documentSelector:
      path: metadata.name
      value: gateway-ext-my-olm-reader
    asserts:
      - isKind:
          of: ClusterRoleBinding
      - equal:
          path: roleRef.kind
          value: ClusterRole
      - equal:
          path: roleRef.name
          value: my-olm-reader
      - equal:
          path: subjects[0].kind
          value: ServiceAccount
      - equal:
          path: subjects[0].name
          value: gateway

  - it: "IT-HELM-1069-004: Gateway renders one ClusterRoleBinding per entry when multiple names are given"
    set:
      gateway:
        additionalClusterRoles: ["role-a", "role-b"]
    template: templates/gateway/gateway.yaml
    documentSelector:
      path: metadata.name
      value: gateway-ext-role-b
    asserts:
      - isKind:
          of: ClusterRoleBinding
      - equal:
          path: roleRef.name
          value: role-b

  - it: "IT-HELM-1069-005: EM renders a ClusterRoleBinding per name in additionalClusterRoles"
    set:
      effectivenessmonitor:
        additionalClusterRoles: ["my-argocd-reader"]
    template: templates/effectivenessmonitor/effectivenessmonitor.yaml
    documentSelector:
      path: metadata.name
      value: effectivenessmonitor-ext-my-argocd-reader
    asserts:
      - isKind:
          of: ClusterRoleBinding
      - equal:
          path: roleRef.name
          value: my-argocd-reader
      - equal:
          path: subjects[0].name
          value: effectivenessmonitor-controller

  - it: "IT-HELM-1069-006: KA renders a ClusterRoleBinding per name in additionalClusterRoles"
    set:
      kubernautAgent:
        additionalClusterRoles: ["my-kafka-reader"]
    template: templates/kubernaut-agent/kubernaut-agent.yaml
    documentSelector:
      path: metadata.name
      value: kubernaut-agent-ext-my-kafka-reader
    asserts:
      - isKind:
          of: ClusterRoleBinding
      - equal:
          path: roleRef.name
          value: my-kafka-reader
      - equal:
          path: subjects[0].name
          value: kubernaut-agent-sa

  # ---------------------------------------------------------------------
  # global.additionalClusterRoles (write once, applies to all 3
  # services -- the common case, since Gateway/EM/KA usually need identical
  # ecosystem visibility). Per-service fields remain for asymmetric cases
  # (e.g. withholding a grant from kubernautAgent, BR-PLATFORM-005).
  # ---------------------------------------------------------------------
  - it: "IT-HELM-1069-007: global.additionalClusterRoles applies to Gateway without a per-service entry"
    set:
      global:
        additionalClusterRoles: ["my-shared-reader"]
    template: templates/gateway/gateway.yaml
    documentSelector:
      path: metadata.name
      value: gateway-ext-my-shared-reader
    asserts:
      - isKind:
          of: ClusterRoleBinding
      - equal:
          path: roleRef.name
          value: my-shared-reader
      - equal:
          path: subjects[0].name
          value: gateway

  - it: "IT-HELM-1069-008: global.additionalClusterRoles applies to EM without a per-service entry"
    set:
      global:
        additionalClusterRoles: ["my-shared-reader"]
    template: templates/effectivenessmonitor/effectivenessmonitor.yaml
    documentSelector:
      path: metadata.name
      value: effectivenessmonitor-ext-my-shared-reader
    asserts:
      - isKind:
          of: ClusterRoleBinding
      - equal:
          path: roleRef.name
          value: my-shared-reader
      - equal:
          path: subjects[0].name
          value: effectivenessmonitor-controller

  - it: "IT-HELM-1069-009: global.additionalClusterRoles applies to KA without a per-service entry"
    set:
      global:
        additionalClusterRoles: ["my-shared-reader"]
    template: templates/kubernaut-agent/kubernaut-agent.yaml
    documentSelector:
      path: metadata.name
      value: kubernaut-agent-ext-my-shared-reader
    asserts:
      - isKind:
          of: ClusterRoleBinding
      - equal:
          path: roleRef.name
          value: my-shared-reader
      - equal:
          path: subjects[0].name
          value: kubernaut-agent-sa

  - it: "IT-HELM-1069-010a: global + per-service additionalClusterRoles both render (global entry present)"
    set:
      global:
        additionalClusterRoles: ["my-shared-reader"]
      gateway:
        additionalClusterRoles: ["my-gateway-only-reader"]
    template: templates/gateway/gateway.yaml
    documentSelector:
      path: metadata.name
      value: gateway-ext-my-shared-reader
    asserts:
      - isKind:
          of: ClusterRoleBinding
      - equal:
          path: roleRef.name
          value: my-shared-reader

  - it: "IT-HELM-1069-010b: global + per-service additionalClusterRoles both render (per-service entry present, no clobbering)"
    set:
      global:
        additionalClusterRoles: ["my-shared-reader"]
      gateway:
        additionalClusterRoles: ["my-gateway-only-reader"]
    template: templates/gateway/gateway.yaml
    documentSelector:
      path: metadata.name
      value: gateway-ext-my-gateway-only-reader
    asserts:
      - isKind:
          of: ClusterRoleBinding
      - equal:
          path: roleRef.name
          value: my-gateway-only-reader

  - it: "IT-HELM-1069-011: the same name in global and per-service lists renders exactly once (dedup)"
    set:
      global:
        additionalClusterRoles: ["my-shared-reader"]
      gateway:
        additionalClusterRoles: ["my-shared-reader"]
    template: templates/gateway/gateway.yaml
    documentSelector:
      path: metadata.name
      value: gateway-ext-my-shared-reader
      skipEmptyTemplates: true
    asserts:
      - hasDocuments:
          count: 1
          filterAware: true
