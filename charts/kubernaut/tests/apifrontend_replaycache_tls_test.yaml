suite: "DD-PLATFORM-006 Decision Area 9: APIFrontend replay-cache Valkey TLS client"
templates:
  - templates/apifrontend/apifrontend.yaml
set:
  postgresql:
    auth:
      existingSecret: dummy
  valkey:
    existingSecret: dummy
  global:
    llmProfiles:
      primary:
        provider: openai
        model: gpt-4
        credentialsSecretName: llm-credentials-primary
  kubernautAgent:
    llmProfileRef: primary
  apifrontend:
    config:
      auth:
        issuerURL: "https://sso.example.com/realms/kubernaut"
tests:
  # NOTE: replayCache and replayCache.tls are both mandatory (no enabled gate)
  # as of DD-PLATFORM-006 DA6 -- see tests/mandatory_security_toggles_test.yaml
  # for the "always renders" assertions. This file covers the caFile/certFile/
  # keyFile override behavior on top of that mandatory-on default.

  - it: "no caFile override: caFile defaults to the already-mounted inter-service-ca path so it works out of the box against the chart's own TLS-only Valkey (DA8)"
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data['config.yaml']
          pattern: 'replayCache:[\s\S]{0,800}tls:\s*\n\s*enabled: true\s*\n\s*caFile: "/etc/tls-ca/ca\.crt"'

  - it: "explicit caFile override: uses the override instead of the default (BYO CA)"
    set:
      apifrontend:
        config:
          auth:
            replayCache:
              tls:
                caFile: "/etc/custom-ca/ca.crt"
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data['config.yaml']
          pattern: 'replayCache:[\s\S]{0,800}tls:\s*\n\s*enabled: true\s*\n\s*caFile: "/etc/custom-ca/ca\.crt"'

  - it: "optional mTLS certFile/keyFile: both render alongside caFile"
    set:
      apifrontend:
        config:
          auth:
            replayCache:
              tls:
                certFile: "/etc/certs/client.crt"
                keyFile: "/etc/certs/client.key"
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data['config.yaml']
          pattern: 'certFile: "/etc/certs/client\.crt"'
      - matchRegex:
          path: data['config.yaml']
          pattern: 'keyFile: "/etc/certs/client\.key"'

  - it: "schema rejects unknown replayCache.tls fields (additionalProperties: false)"
    set:
      apifrontend:
        config:
          auth:
            replayCache:
              tls:
                bogusField: nope
    asserts:
      - failedTemplate: {}
