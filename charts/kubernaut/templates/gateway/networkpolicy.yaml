{{- /* Issue #2162: mirrors apifrontend/networkpolicy.yaml's $v.enabled gate. */}}
{{- $v := include "kubernaut.mergedValues" (dict "root" . "service" "gateway") | fromYaml }}
{{- if $v.enabled }}
{{- $explicitIngressNamespaces := .Values.networkPolicies.gateway.ingressNamespaces | default list }}
{{- $explicitIngressNamespaceSelectors := .Values.networkPolicies.gateway.ingressNamespaceSelectors | default list }}
{{- $explicitIngressCIDRs := .Values.networkPolicies.gateway.ingressCIDRs | default list }}
{{- $monitoringNamespace := .Values.networkPolicies.monitoring.namespace | default "" }}
{{- $derivedAlertManagerNamespace := "" }}
{{- if and (eq (len $explicitIngressNamespaces) 0) (eq (len $explicitIngressNamespaceSelectors) 0) (eq (len $explicitIngressCIDRs) 0) }}
{{- $derivedAlertManagerNamespace = include "kubernaut.monitoring.alertManager.inClusterNamespace" . | trim }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
{{ include "kubernaut.np.metadata" (dict "root" $ "nameSuffix" "gateway" "appLabel" "gateway") }}
spec:
  podSelector:
    matchLabels:
      app: gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- range $explicitIngressNamespaces }}
    - ports:
        - port: 8080
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
    {{- end }}
    {{- if and $derivedAlertManagerNamespace (ne $derivedAlertManagerNamespace $monitoringNamespace) }}
    - ports:
        - port: 8080
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $derivedAlertManagerNamespace }}
    {{- end }}
    {{- include "kubernaut.np.ingressCIDRs" (dict "cidrs" $explicitIngressCIDRs "port" 8080) | nindent 4 }}
    {{- include "kubernaut.np.ingressNamespaceSelectors" (dict "selectors" $explicitIngressNamespaceSelectors "port" 8080) | nindent 4 }}
    {{- if .Values.networkPolicies.monitoring.namespace }}
    # Issue #673 H-1: Gateway serves metrics on 8080 (not 9090 like controller-runtime services)
    - ports:
        - port: 8080
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicies.monitoring.namespace }}
    {{- end }}
  egress:
    {{- include "kubernaut.np.commonEgress" . | nindent 4 }}
    {{- include "kubernaut.np.datastorageEgress" . | nindent 4 }}
    {{- include "kubernaut.np.fleetmetadatacacheEgress" . | nindent 4 }}
    {{- if .Values.global.fleet.enabled }}
    {{- /* #1755 DD-TEST-015 RCA: Gateway's own wireFleetOwnerResolution
    (mcpclient.NewResilient) fetches an OAuth2 token from the fleet IdP
    (global.fleet.oauth2.tokenURL) before it can call the MCP Gateway --
    same missing-egress gap as FMC's identical fix above (see that file's
    comment for the full RCA). */}}
    {{- include "kubernaut.np.idpEgress" . | nindent 4 }}
    {{- /* #1755 DD-TEST-015 RCA (5th finding): Gateway's own MCP client
    (mcpclient.NewResilient, same wireFleetOwnerResolution call above) also
    needs direct egress to the MCP Gateway itself, independent of the IdP
    token fetch and of the FMC scope-check API -- see
    kubernaut.np.mcpGatewayEgress's doc comment for the full RCA (confirmed
    live via remediationorchestrator's /proc/net/tcp showing an identical
    SYN_SENT-stuck connection to the same target). */}}
    {{- include "kubernaut.np.mcpGatewayEgress" . | nindent 4 }}
    {{- end }}
{{- end }}
