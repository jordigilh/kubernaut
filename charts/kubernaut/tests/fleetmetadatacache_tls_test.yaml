suite: FleetMetadataCache TLS + 3-port standard alignment (Issue #1683)
templates:
  - templates/fleetmetadatacache/fleetmetadatacache.yaml
set:
  # Issue #1707 follow-up: mcpGatewayEndpoint/mcpGatewayType/oauth2.tokenURL
  # moved to global.fleet.* (see fleet_config_consolidation_test.yaml) --
  # only oauth2.credentialsSecretRef stays per-service overridable.
  global:
    fleet:
      mcpGatewayEndpoint: "http://mcp.example.com"
      mcpGatewayType: "eaigw"
      oauth2:
        enabled: true
        tokenURL: "http://oauth.example.com"
        credentialsSecretRef: "fleet-oauth2-creds"
  fleetmetadatacache:
    enabled: true
    oauth2:
      credentialsSecretRef: "fmc-creds"
  signalprocessing:
    policies:
      existingConfigMap: test-cm
  aianalysis:
    policies:
      existingConfigMap: test-cm
  workflowexecution:
    fleet:
      oauth2:
        credentialsSecretRef: we-oauth2-creds
tests:
  # ── ConfigMap: 3-port layout + TLS cert dir ─────────────────────────────
  - it: "ConfigMap renders the 3-port standard (api/health/metrics) and server.tls.certDir"
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'apiAddr:\s*":8080"'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'healthAddr:\s*":8081"'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'metricsAddr:\s*":9090"'
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'tls:\s*\n\s*certDir:'

  # ── Deployment: 3 container ports ───────────────────────────────────────
  - it: "Deployment exposes api(8080)/health(8081)/metrics(9090) container ports"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0]
          value:
            name: api
            containerPort: 8080
            protocol: TCP
      - equal:
          path: spec.template.spec.containers[0].ports[1]
          value:
            name: health
            containerPort: 8081
            protocol: TCP
      - equal:
          path: spec.template.spec.containers[0].ports[2]
          value:
            name: metrics
            containerPort: 9090
            protocol: TCP

  - it: "Deployment mounts the fleetmetadatacache-tls secret at the inter-service TLS cert dir"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tls-certs
            mountPath: /etc/tls
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tls-certs
            secret:
              secretName: fleetmetadatacache-tls
              optional: true

  - it: "ConfigMap's oauth2 block renders tlsCaFile so token fetches trust the inter-service CA (#1755 DD-TEST-015 regression: FMC was the only fleet-integration-capable service whose chart template never rendered this field -- unlike gateway/effectivenessmonitor/workflowexecution, which all default it from the same $fleetPreamble.oauth2.tlsCAFile -- so its OAuth2 client fell back to the system CA trust store and every client_credentials token fetch against Keycloak's self-signed inter-service-ca-signed cert failed TLS verification, permanently blocking FMC's API port from ever listening)"
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'oauth2:[\s\S]*tlsCaFile:\s*"/etc/tls-ca/ca\.crt"'

  - it: "ConfigMap's oauth2 block renders scopes from global.fleet.oauth2.scopes (#1755 DD-TEST-015 2nd regression, surfaced only after the tlsCaFile fix above let the TLS handshake succeed: FMC's ConfigMap never rendered a scopes field at all -- unlike gateway/effectivenessmonitor/workflowexecution -- so pkg/fleet/fmc/config/config.go's DefaultServiceConfig Go-code default of [openid, groups] silently won instead of the intended kube-mcp-server-audience scope, and Keycloak's kubernaut-fleet-read client rejected every client_credentials token request with oauth2: \"invalid_scope\" \"Invalid scopes: openid groups\")"
    set:
      global:
        fleet:
          oauth2:
            scopes: ["kube-mcp-server-audience"]
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data["config.yaml"]
          pattern: 'oauth2:[\s\S]*scopes:\s*\n\s*-\s*"kube-mcp-server-audience"'
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: 'oauth2:[\s\S]*(openid|groups)'

  - it: "Deployment mounts the inter-service-ca ConfigMap at /etc/tls-ca so oauth2.tlsCaFile's default path actually exists in the container"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tls-ca
            mountPath: /etc/tls-ca
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tls-ca
            configMap:
              name: inter-service-ca
              optional: true

  - it: "Deployment's liveness and readiness probes both target the dedicated health port, not the API port"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: health
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.port
          value: health
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /readyz

  # ── Service: 3 ports ─────────────────────────────────────────────────────
  - it: "Service exposes api(8080)/health(8081)/metrics(9090) ports"
    documentSelector:
      path: kind
      value: Service
    asserts:
      - equal:
          path: spec.ports[0]
          value:
            name: api
            port: 8080
            targetPort: api
            protocol: TCP
      - equal:
          path: spec.ports[1]
          value:
            name: health
            port: 8081
            targetPort: health
            protocol: TCP
      - equal:
          path: spec.ports[2]
          value:
            name: metrics
            port: 9090
            targetPort: metrics
            protocol: TCP

  # ── NetworkPolicy: API port scoped to GW/RO; metrics port for scraping ──
  - it: "NetworkPolicy restricts port 8080 ingress to gateway/remediationorchestrator only"
    documentSelector:
      path: kind
      value: NetworkPolicy
    asserts:
      - equal:
          path: spec.ingress[0].ports[0].port
          value: 8080
      - contains:
          path: spec.ingress[0].from
          content:
            podSelector:
              matchLabels:
                app.kubernetes.io/name: gateway
      - contains:
          path: spec.ingress[0].from
          content:
            podSelector:
              matchLabels:
                app.kubernetes.io/name: remediationorchestrator

  - it: "NetworkPolicy no longer opens the health port (8081) cluster-wide"
    documentSelector:
      path: kind
      value: NetworkPolicy
    asserts:
      - notContains:
          path: spec.ingress
          content:
            from:
              - namespaceSelector: {}
            ports:
              - protocol: TCP
                port: 8081
