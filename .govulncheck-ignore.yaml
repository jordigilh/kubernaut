GO-2026-4730:
  reason: "FALSE POSITIVE — fixed in Tekton v1.10.2+; kubernaut uses v1.13.1. Go vuln DB entry has incorrect version ranges (UNREVIEWED). Correction requested: https://github.com/golang/vulndb/issues/5797"
  date: 2026-10-01T00:00:00Z

GO-2023-1901:
  reason: "No fix available (all Tekton versions). Tekton does not validate child TaskRun UIDs against parent PipelineRun. Low severity (CVSS 3.7); requires cluster-level RBAC to forge child runs. Kubernaut monitors PipelineRun status holistically."
  date: 2026-10-01T00:00:00Z

GO-2026-5662:
  reason: "FALSE POSITIVE — fixed in Prometheus 3.11.2; kubernaut uses v0.312.0 (= 3.12.0). Go vuln DB cannot map Prometheus non-standard module versioning (noted in report itself). Web UI XSS; kubernaut does not expose Prometheus UI to end users."
  date: 2026-10-01T00:00:00Z

# 2026-08-18: batch disclosure of 7 CVEs against github.com/lib/pq (CVE-2026-56868
# through 56874), all "all versions, no known fixed" per pkg.go.dev/vuln. Kubernaut
# is already on v1.12.3, the latest release (Apr 2026); lib/pq's own README states
# it is in maintenance mode ("maintainers usually do not resolve reported issues";
# recommends pgx for new work) so no patched release is expected soon. All 7 require
# either a malicious/compromised PostgreSQL server or an active network attacker on
# the unauthenticated wire between client and server -- Kubernaut's DataStorage
# connects only to its own in-cluster PostgreSQL over the internal service network,
# not to an attacker-controlled or externally-reachable endpoint. Re-assess at expiry
# for an upstream fix or a driver migration (lib/pq -> pgx) decision.
GO-2026-6166:
  reason: "CVE-2026-56868 (no fix available). GSS auth completes without verifying mutual cryptographic proof; only exploitable if GSS/Kerberos auth is negotiated with a malicious/compromised Postgres server. Kubernaut's DataStorage uses password/TLS auth to its own in-cluster Postgres, not GSSAPI."
  date: 2026-09-17T00:00:00Z

GO-2026-6168:
  reason: "CVE-2026-56869 (no fix available). SCRAM client accepts unbounded attacker-controlled iteration count, causing CPU exhaustion; requires a malicious/compromised Postgres server sending a crafted SCRAM server-first message. Not reachable from an untrusted external client of Kubernaut's own APIs."
  date: 2026-09-17T00:00:00Z

GO-2026-6169:
  reason: "CVE-2026-56870 (no fix available). Wrong .pgpass credential disclosed via hostaddr-without-host misconfiguration. Kubernaut's DataStorage config always sets host explicitly (never hostaddr-only), so this misconfiguration pattern does not apply to our deployment."
  date: 2026-09-17T00:00:00Z

GO-2026-6170:
  reason: "CVE-2026-56871 (no fix available). Malformed backend frame length (<4 bytes) causes a client-side panic; requires a malicious/compromised Postgres server or on-path attacker on the unauthenticated transport. Kubernaut's Postgres traffic stays within the cluster's internal service network."
  date: 2026-09-17T00:00:00Z

GO-2026-6171:
  reason: "CVE-2026-56872 (no fix available). Malformed RowDescription/DataRow payloads cause a client-side panic; same malicious-server/on-path-attacker precondition as GO-2026-6170. Not reachable from Kubernaut's own external API surface."
  date: 2026-09-17T00:00:00Z

GO-2026-6172:
  reason: "CVE-2026-56873 (no fix available). Backend-declared frame length is used to pre-allocate memory before validation, allowing a malicious server to force OOM; same malicious-server/on-path-attacker precondition as GO-2026-6170/6171."
  date: 2026-09-17T00:00:00Z

GO-2026-6173:
  reason: "CVE-2026-56874 (no fix available). Pre-protocol plain-text error reader has no byte limit, allowing a malicious server to force unbounded memory growth; same malicious-server/on-path-attacker precondition as GO-2026-6170/6171/6172."
  date: 2026-09-17T00:00:00Z
