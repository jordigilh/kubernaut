name: Deprecated application chart checks (offline)

# Application chart publication is retired by issue #2492. The operator
# bootstrap chart and Kubernaut CR are the supported deployment contract.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deprecated-chart-validation:
    name: Deprecated chart lint/render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: latest
      - name: Lint and render without publication
        run: |
          set -euo pipefail
          helm lint charts/kubernaut --strict
          helm template kubernaut charts/kubernaut >/tmp/deprecated-kubernaut-rendered.yaml
          test -s /tmp/deprecated-kubernaut-rendered.yaml
