suite: "startupProbe for slow-cold-start fleet-aware services (DD-PLATFORM-008)"
templates:
  - templates/apifrontend/apifrontend.yaml
  - templates/effectivenessmonitor/effectivenessmonitor.yaml
  - templates/workflowexecution/workflowexecution.yaml
  - templates/gateway/gateway.yaml
  - templates/remediationorchestrator/remediationorchestrator.yaml
  - templates/fleetmetadatacache/fleetmetadatacache.yaml
  - templates/signalprocessing/signalprocessing.yaml
set:
  postgresql:
    auth:
      existingSecret: dummy
  valkey:
    existingSecret: dummy
  global:
    llmProfiles:
      primary:
        provider: openai
        model: gpt-4
        credentialsSecretName: llm-credentials-primary
  kubernautAgent:
    llmProfileRef: primary
  signalprocessing:
    policies:
      existingConfigMap: test-cm
  aianalysis:
    policies:
      existingConfigMap: test-cm
tests:
  - it: "apifrontend Deployment has a generous startupProbe ahead of its liveness/readiness probes"
    template: templates/apifrontend/apifrontend.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.port
          value: health
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 60
      - equal:
          path: spec.template.spec.containers[0].startupProbe.periodSeconds
          value: 5
      # steady-state liveness/readiness thresholds must stay untouched by
      # this addition -- the startupProbe only defers their enforcement,
      # it does not replace or loosen them.
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.initialDelaySeconds
          value: 30
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.initialDelaySeconds
          value: 10

  - it: "effectivenessmonitor-controller Deployment has a generous startupProbe ahead of its liveness/readiness probes"
    template: templates/effectivenessmonitor/effectivenessmonitor.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.port
          value: health
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 60
      - equal:
          path: spec.template.spec.containers[0].startupProbe.periodSeconds
          value: 5
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.initialDelaySeconds
          value: 10
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.initialDelaySeconds
          value: 5

  - it: "workflowexecution-controller Deployment has a generous startupProbe ahead of its liveness/readiness probes"
    template: templates/workflowexecution/workflowexecution.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.port
          value: health
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 60
      - equal:
          path: spec.template.spec.containers[0].startupProbe.periodSeconds
          value: 5
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.initialDelaySeconds
          value: 15
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.initialDelaySeconds
          value: 5

  - it: "gateway Deployment has a generous startupProbe ahead of its liveness/readiness probes (Issue #1737 Fleet E2E: gateway.NewScopeChecker + ClusterRegistry.Start block at boot when global.fleet.enabled=true, same shape as AF/EM/WE)"
    template: templates/gateway/gateway.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.port
          value: health
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 60
      - equal:
          path: spec.template.spec.containers[0].startupProbe.periodSeconds
          value: 5
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.initialDelaySeconds
          value: 10
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.initialDelaySeconds
          value: 30

  - it: "remediationorchestrator-controller Deployment has a generous startupProbe ahead of its liveness/readiness probes (same fleet-boot blocking shape as gateway above)"
    template: templates/remediationorchestrator/remediationorchestrator.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.port
          value: health
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 60
      - equal:
          path: spec.template.spec.containers[0].startupProbe.periodSeconds
          value: 5
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.initialDelaySeconds
          value: 15
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.initialDelaySeconds
          value: 5

  - it: "fleetmetadatacache Deployment has a generous startupProbe ahead of its liveness/readiness probes (FMC's OAuth2 token source + MCP Gateway connection block at boot unconditionally, since this Deployment only renders when fleetmetadatacache.enabled=true)"
    set:
      fleetmetadatacache:
        enabled: true
        oauth2:
          credentialsSecretRef: "fmc-creds"
      global:
        fleet:
          mcpGatewayEndpoint: "http://mcp.example.com"
          mcpGatewayType: "kuadrant"
          oauth2:
            tokenURL: "http://oauth.example.com"
    template: templates/fleetmetadatacache/fleetmetadatacache.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.port
          value: health
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 60
      - equal:
          path: spec.template.spec.containers[0].startupProbe.periodSeconds
          value: 5
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.initialDelaySeconds
          value: 5
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.initialDelaySeconds
          value: 3

  - it: "signalprocessing-controller Deployment has a generous startupProbe ahead of its liveness/readiness probes (#1755 DD-TEST-015 fleet E2E re-validation: SP was missing from the original DD-PLATFORM-008 rollout and crash-looped under load exactly like AF/EM/WE did before their fix)"
    template: templates/signalprocessing/signalprocessing.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.port
          value: health
      - equal:
          path: spec.template.spec.containers[0].startupProbe.failureThreshold
          value: 60
      - equal:
          path: spec.template.spec.containers[0].startupProbe.periodSeconds
          value: 5
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.initialDelaySeconds
          value: 15
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.initialDelaySeconds
          value: 5
