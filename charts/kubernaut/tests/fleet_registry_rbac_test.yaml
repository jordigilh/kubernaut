suite: Fleet ClusterRegistry RBAC least-privilege split (#1686, BR-RBAC-020)
templates:
  - templates/signalprocessing/signalprocessing.yaml
  - templates/fleetmetadatacache/fleetmetadatacache.yaml
  - templates/apifrontend/apifrontend.yaml
  - templates/effectivenessmonitor/effectivenessmonitor.yaml
set:
  postgresql:
    auth:
      existingSecret: dummy
  valkey:
    existingSecret: dummy
  global:
    llmProfiles:
      primary:
        provider: openai
        model: gpt-4
        credentialsSecretName: llm-credentials-primary
    # Issue #1984 Phase D: OAuth2 is schema-mandatory whenever
    # mcpGatewayEndpoint is set (the FMC/AF/EM cases below all set it).
    fleet:
      oauth2:
        enabled: true
        tokenURL: "https://dex.example.com/token"
        credentialsSecretRef: fleet-oauth2-creds
  kubernautAgent:
    llmProfileRef: primary
  signalprocessing:
    policies:
      existingConfigMap: test-cm
  aianalysis:
    policies:
      existingConfigMap: test-cm
  workflowexecution:
    fleet:
      oauth2:
        credentialsSecretRef: we-oauth2-creds
  # values.yaml ships a default "sre" persona, which renders a second,
  # unrelated ClusterRole (kubernaut-tool-sre) for SAR-based tool
  # authorization. Cleared once here (suite-level) rather than in every AF
  # test case below, so the `documentSelector: {path: kind, value:
  # ClusterRole}` used by the AF tests stays unambiguous (exactly one
  # ClusterRole document) without repeating this override per test.
  apifrontend:
    config:
      rbac:
        personas: null
tests:
  # ---------------------------------------------------------------------
  # SP (IT-HELM-020-001/002)
  # ---------------------------------------------------------------------
  - it: "IT-HELM-020-001: SP namespace-scoped Role replaces the ClusterRole rule when namespace is set"
    set:
      global:
        fleet:
          mcpGatewayType: kuadrant
      signalprocessing:
        fleet:
          namespace: team-a
    template: templates/signalprocessing/signalprocessing.yaml
    documentSelector:
      path: metadata.name
      value: signalprocessing-fleet-registry
    asserts:
      - isKind:
          of: Role
      - equal:
          path: metadata.namespace
          value: team-a
      - contains:
          path: rules
          content:
            apiGroups: ["mcp.kuadrant.io"]
            resources: ["mcpserverregistrations"]
            verbs: ["get", "list", "watch"]

  - it: "IT-HELM-020-001b: SP ClusterRole does NOT contain the fleet rule when namespace is set"
    set:
      global:
        fleet:
          mcpGatewayType: kuadrant
      signalprocessing:
        fleet:
          namespace: team-a
    template: templates/signalprocessing/signalprocessing.yaml
    documentSelector:
      path: kind
      value: ClusterRole
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: ["mcp.kuadrant.io"]
            resources: ["mcpserverregistrations"]
            verbs: ["get", "list", "watch"]

  - it: "IT-HELM-020-002: SP retains the ClusterRole rule when namespace is unset (regression guard)"
    set:
      global:
        fleet:
          mcpGatewayType: kuadrant
      signalprocessing:
        fleet:
          namespace: ""
    template: templates/signalprocessing/signalprocessing.yaml
    documentSelector:
      path: kind
      value: ClusterRole
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["mcp.kuadrant.io"]
            resources: ["mcpserverregistrations"]
            verbs: ["get", "list", "watch"]

  - it: "IT-HELM-020-002b: SP does not render a Role for the fleet registry when namespace is unset"
    set:
      global:
        fleet:
          mcpGatewayType: kuadrant
      signalprocessing:
        fleet:
          namespace: ""
    template: templates/signalprocessing/signalprocessing.yaml
    documentSelector:
      path: metadata.name
      value: signalprocessing-fleet-registry
      skipEmptyTemplates: true
    asserts:
      - hasDocuments:
          count: 0
          filterAware: true

  # ---------------------------------------------------------------------
  # FMC — kuadrant branch (IT-HELM-020-003/004)
  # ---------------------------------------------------------------------
  - it: "IT-HELM-020-003: FMC (kuadrant) namespace-scoped Role replaces the ClusterRole rules when namespace is set"
    set:
      fleetmetadatacache:
        enabled: true
        namespace: team-a
        oauth2:
          credentialsSecretRef: "fmc-creds"
      global:
        fleet:
          mcpGatewayEndpoint: "http://mcp.example.com"
          mcpGatewayType: kuadrant
          oauth2:
            tokenURL: "http://oauth.example.com"
    template: templates/fleetmetadatacache/fleetmetadatacache.yaml
    documentSelector:
      path: kind
      value: Role
    asserts:
      - isKind:
          of: Role
      - equal:
          path: metadata.namespace
          value: team-a
      - contains:
          path: rules
          content:
            apiGroups: ["mcp.kuadrant.io"]
            resources: ["mcpserverregistrations"]
            verbs: ["get", "list", "watch"]
      - contains:
          path: rules
          content:
            apiGroups: ["gateway.networking.k8s.io"]
            resources: ["gateways", "httproutes"]
            verbs: ["get", "list", "watch"]

  - it: "IT-HELM-020-003b: FMC ClusterRole/ClusterRoleBinding are not rendered at all when namespace is set (kuadrant)"
    set:
      fleetmetadatacache:
        enabled: true
        namespace: team-a
        oauth2:
          credentialsSecretRef: "fmc-creds"
      global:
        fleet:
          mcpGatewayEndpoint: "http://mcp.example.com"
          mcpGatewayType: kuadrant
          oauth2:
            tokenURL: "http://oauth.example.com"
    template: templates/fleetmetadatacache/fleetmetadatacache.yaml
    documentSelector:
      path: kind
      value: ClusterRole
      skipEmptyTemplates: true
    asserts:
      - hasDocuments:
          count: 0
          filterAware: true

  - it: "IT-HELM-020-004: FMC (kuadrant) retains the ClusterRole rules when namespace is unset (regression guard)"
    set:
      fleetmetadatacache:
        enabled: true
        namespace: ""
        oauth2:
          credentialsSecretRef: "fmc-creds"
      global:
        fleet:
          mcpGatewayEndpoint: "http://mcp.example.com"
          mcpGatewayType: kuadrant
          oauth2:
            tokenURL: "http://oauth.example.com"
    template: templates/fleetmetadatacache/fleetmetadatacache.yaml
    documentSelector:
      path: kind
      value: ClusterRole
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["mcp.kuadrant.io"]
            resources: ["mcpserverregistrations"]
            verbs: ["get", "list", "watch"]
      - contains:
          path: rules
          content:
            apiGroups: ["gateway.networking.k8s.io"]
            resources: ["gateways", "httproutes"]
            verbs: ["get", "list", "watch"]

  - it: "IT-HELM-020-004b: FMC does not render a Role for the fleet registry when namespace is unset"
    set:
      fleetmetadatacache:
        enabled: true
        namespace: ""
        oauth2:
          credentialsSecretRef: "fmc-creds"
      global:
        fleet:
          mcpGatewayEndpoint: "http://mcp.example.com"
          mcpGatewayType: kuadrant
          oauth2:
            tokenURL: "http://oauth.example.com"
    template: templates/fleetmetadatacache/fleetmetadatacache.yaml
    documentSelector:
      path: metadata.name
      value: fleetmetadatacache-fleet-registry
      skipEmptyTemplates: true
    asserts:
      - hasDocuments:
          count: 0
          filterAware: true

  # ---------------------------------------------------------------------
  # FMC — eaigw branch (IT-HELM-020-005/006)
  # ---------------------------------------------------------------------
  - it: "IT-HELM-020-005: FMC (eaigw) namespace-scoped Role replaces the ClusterRole rules when namespace is set"
    set:
      fleetmetadatacache:
        enabled: true
        namespace: team-a
        oauth2:
          credentialsSecretRef: "fmc-creds"
      global:
        fleet:
          mcpGatewayEndpoint: "http://mcp.example.com"
          mcpGatewayType: eaigw
          oauth2:
            tokenURL: "http://oauth.example.com"
    template: templates/fleetmetadatacache/fleetmetadatacache.yaml
    documentSelector:
      path: kind
      value: Role
    asserts:
      - isKind:
          of: Role
      - equal:
          path: metadata.namespace
          value: team-a
      - contains:
          path: rules
          content:
            apiGroups: ["gateway.envoyproxy.io"]
            resources: ["backends"]
            verbs: ["get", "list", "watch"]
      - contains:
          path: rules
          content:
            apiGroups: ["aigateway.envoyproxy.io"]
            resources: ["mcproutes"]
            verbs: ["get", "list", "watch"]

  - it: "IT-HELM-020-005b: FMC ClusterRole/ClusterRoleBinding are not rendered at all when namespace is set (eaigw)"
    set:
      fleetmetadatacache:
        enabled: true
        namespace: team-a
        oauth2:
          credentialsSecretRef: "fmc-creds"
      global:
        fleet:
          mcpGatewayEndpoint: "http://mcp.example.com"
          mcpGatewayType: eaigw
          oauth2:
            tokenURL: "http://oauth.example.com"
    template: templates/fleetmetadatacache/fleetmetadatacache.yaml
    documentSelector:
      path: kind
      value: ClusterRole
      skipEmptyTemplates: true
    asserts:
      - hasDocuments:
          count: 0
          filterAware: true

  - it: "IT-HELM-020-006: FMC (eaigw) retains the ClusterRole rules when namespace is unset (regression guard)"
    set:
      fleetmetadatacache:
        enabled: true
        namespace: ""
        oauth2:
          credentialsSecretRef: "fmc-creds"
      global:
        fleet:
          mcpGatewayEndpoint: "http://mcp.example.com"
          mcpGatewayType: eaigw
          oauth2:
            tokenURL: "http://oauth.example.com"
    template: templates/fleetmetadatacache/fleetmetadatacache.yaml
    documentSelector:
      path: kind
      value: ClusterRole
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["gateway.envoyproxy.io"]
            resources: ["backends"]
            verbs: ["get", "list", "watch"]
      - contains:
          path: rules
          content:
            apiGroups: ["aigateway.envoyproxy.io"]
            resources: ["mcproutes"]
            verbs: ["get", "list", "watch"]

  # ---------------------------------------------------------------------
  # AF (IT-HELM-020-007/008)
  # ---------------------------------------------------------------------
  - it: "IT-HELM-020-007: AF namespace-scoped Role replaces the ClusterRole rule when namespace is set"
    set:
      global:
        fleet:
          mcpGatewayEndpoint: "http://mcp.example.com"
          mcpGatewayType: kuadrant
      apifrontend:
        fleet:
          namespace: team-a
    template: templates/apifrontend/apifrontend.yaml
    documentSelector:
      path: kind
      value: Role
    asserts:
      - isKind:
          of: Role
      - equal:
          path: metadata.namespace
          value: team-a
      - contains:
          path: rules
          content:
            apiGroups: ["mcp.kuadrant.io"]
            resources: ["mcpserverregistrations"]
            verbs: ["get", "list", "watch"]

  - it: "IT-HELM-020-007b: AF ClusterRole does NOT contain the fleet rule when namespace is set"
    set:
      global:
        fleet:
          mcpGatewayEndpoint: "http://mcp.example.com"
          mcpGatewayType: kuadrant
      apifrontend:
        fleet:
          namespace: team-a
    template: templates/apifrontend/apifrontend.yaml
    # #1919 added a second, unconditional ClusterRole (kubernaut-console-access)
    # to this template that `personas: null` (suite-level set above) cannot
    # clear, so neither `path: kind, value: ClusterRole` (2 ClusterRoles) nor
    # `path: metadata.name, value: apifrontend` (shared by the ServiceAccount/
    # ConfigMap/ClusterRoleBinding/RoleBinding/Service/Deployment in this same
    # template) is unique anymore. rules[0].resources[0] is: the fleet-registry
    # ClusterRole's first rule is always investigationsessions, vs.
    # kubernaut-console-access's only rule being resources=["console"].
    documentSelector:
      path: rules[0].resources[0]
      value: investigationsessions
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: ["mcp.kuadrant.io"]
            resources: ["mcpserverregistrations"]
            verbs: ["get", "list", "watch"]

  - it: "IT-HELM-020-008: AF retains the ClusterRole rule when namespace is unset (regression guard)"
    set:
      global:
        fleet:
          mcpGatewayEndpoint: "http://mcp.example.com"
          mcpGatewayType: kuadrant
      apifrontend:
        fleet:
          namespace: ""
    template: templates/apifrontend/apifrontend.yaml
    # #1919: see IT-HELM-020-007b comment above -- select by rules[0].resources[0]
    # to disambiguate from the also-unconditional kubernaut-console-access ClusterRole.
    documentSelector:
      path: rules[0].resources[0]
      value: investigationsessions
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ["mcp.kuadrant.io"]
            resources: ["mcpserverregistrations"]
            verbs: ["get", "list", "watch"]

  - it: "IT-HELM-020-008b: AF does not render a Role for the fleet registry when namespace is unset"
    set:
      global:
        fleet:
          mcpGatewayEndpoint: "http://mcp.example.com"
          mcpGatewayType: kuadrant
      apifrontend:
        fleet:
          namespace: ""
    template: templates/apifrontend/apifrontend.yaml
    documentSelector:
      path: metadata.name
      value: apifrontend-fleet-registry
      skipEmptyTemplates: true
    asserts:
      - hasDocuments:
          count: 0
          filterAware: true

  # ---------------------------------------------------------------------
  # EM (IT-HELM-020-009/010)
  # ---------------------------------------------------------------------
  - it: "IT-HELM-020-009: EM namespace-scoped Role replaces the ClusterRole rule when namespace is set"
    set:
      global:
        fleet:
          mcpGatewayEndpoint: "http://mcp.example.com"
          mcpGatewayType: kuadrant
      effectivenessmonitor:
        fleet:
          namespace: team-a
