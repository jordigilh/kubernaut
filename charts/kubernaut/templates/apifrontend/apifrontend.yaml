{{- /*
checksum/config (Issue #1737 gap) needs this content reachable from the
Deployment's pod template annotations, a separate `include` call site from
the ConfigMap below -- named templates don't inherit $-scoped variables from
their caller, so the whole preamble above (llm profile resolution, fleet
preamble) must be recomputed here rather than reused from the file-top
declarations.
*/}}
{{- define "kubernaut.apifrontend.configYAML" -}}
{{- /*
DD-PLATFORM-006 Decision Area 14 (PR9): $v carries every apifrontend field
that has a values.schema.json default, merged with this release's own
values.yaml/--set overrides (explicit false/0/"" always wins -- see
kubernaut.mergedValues' doc comment in _helpers.tpl). Recomputed here (not
inherited from the file-top declarations) because named templates don't
share $-scoped variables with their caller -- same reason the fleet/llm
preamble below is already duplicated.
*/}}
{{- $v := include "kubernaut.mergedValues" (dict "root" . "service" "apifrontend") | fromYaml }}
{{- $apifrontendFleetPreamble := include "kubernaut.fleet.preamble" (dict "root" . "fleet" .Values.apifrontend.fleet "oauth2" .Values.apifrontend.fleet.oauth2) | fromYaml }}
{{- $kaV := include "kubernaut.mergedValues" (dict "root" . "service" "kubernautAgent") | fromYaml }}
{{- $kaEffectiveRef := include "kubernaut.llm.effectiveKALLMProfileRef" (dict "root" . "ref" $kaV.llmProfileRef) }}
{{- $afProfileRefName := $v.llmProfileRef | default $kaEffectiveRef }}
{{- $afProfile := include "kubernaut.llm.resolveProfile" (dict "root" . "name" $afProfileRefName) | fromYaml }}
{{- $afAPIKeyFile := include "kubernaut.llm.mountedKeyFile" (dict "dir" "/etc/apifrontend/llm-credentials" "provider" $afProfile.provider) }}
{{- $stCfg := $v.config.severityTriage }}
{{- $stLLMEnabled := $stCfg.llmEnabled }}
{{- $stProfileRefName := $stCfg.llmProfileRef }}
{{- $stProfile := $afProfile }}
{{- if and $stLLMEnabled $stProfileRefName }}
{{- $stProfile = include "kubernaut.llm.resolveProfile" (dict "root" . "name" $stProfileRefName) | fromYaml }}
{{- end }}
{{- $stHasDedicatedSecret := and $stLLMEnabled (ne $stProfile.credentialsSecretName $afProfile.credentialsSecretName) }}
{{- $stAPIKeyFile := "" }}
{{- if $stHasDedicatedSecret }}
{{- $stAPIKeyFile = include "kubernaut.llm.mountedKeyFile" (dict "dir" "/etc/apifrontend/severity-triage-credentials" "provider" $stProfile.provider) }}
{{- else if $stLLMEnabled }}
{{- $stAPIKeyFile = $afAPIKeyFile }}
{{- end -}}
server:
  port: {{ $v.config.server.httpPort }}
  metricsPort: {{ $v.config.server.metricsPort }}
  healthPort: {{ $v.config.server.healthPort }}
  # Issue #1737: wire the apifrontend-tls Secret (generated by the chart's
  # tls-cert-job.yaml hook, same as gateway-tls/datastorage-tls/
  # kubernautagent-tls) into cmd/apifrontend's ServerTLSConfig -- the
  # tls-certs volume was already mounted at this path but nothing told
  # the binary to look here, so AF silently served plain HTTP on 8443
  # regardless of the Secret's presence (F-006 fallback in
  # configureServerTLS). No production deployments exist yet, so there is
  # no HTTP-compatibility concern in defaulting this on (matches
  # datastorage/kubernaut-agent, which are also TLS-on-by-default).
  tls:
    certDir: "/etc/apifrontend/tls"
agent:
  kaBaseURL: "https://kubernaut-agent.{{ .Release.Namespace }}.svc:8443"
  # Issue #1737 gap found: kaMCPEndpoint/dsBaseURL/kaBearerTokenFile/
  # kaTlsCaFile/dsTlsCaFile were never wired into the chart -- AF fell back
  # to Config.Validate()'s dev-only zero-value defaults (dsBaseURL
  # defaulting to AF's own metrics port, http://localhost:9090, silently
  # black-holing every DataStorage audit write) and left the KA/DS client
  # TLS transports without a trusted CA (tlswiring.CAReloadableTransport
  # returns a nil transport when the CaFile is empty, which falls back to
  # Go's http.DefaultTransport / the system trust store -- unable to
  # validate the chart's own self-signed inter-service certs).
  kaMCPEndpoint: "https://kubernaut-agent.{{ .Release.Namespace }}.svc:8443/api/v1/mcp/"
  dsBaseURL: "https://data-storage-service.{{ .Release.Namespace }}.svc:8080"
  dsBearerTokenFile: "/var/run/secrets/kubernetes.io/serviceaccount/token"
  kaBearerTokenFile: "/var/run/secrets/kubernetes.io/serviceaccount/token"
  kaTlsCaFile: {{ include "kubernaut.interServiceTLS.caFile" . | quote }}
  dsTlsCaFile: {{ include "kubernaut.interServiceTLS.caFile" . | quote }}
  llm:
    {{- include "kubernaut.llm.afBlock" (dict "profile" $afProfile "apiKeyFile" $afAPIKeyFile) | nindent 4 }}
session:
  namespace: {{ .Release.Namespace }}
  disconnectTTL: {{ $v.config.session.disconnectTTL }}
  retentionTTL: {{ $v.config.session.retentionTTL }}
# Issue #1737 gap found: mcp.enabled was never wired into the chart.
# Config.DefaultConfig() defaults MCP.Enabled=false (unlike
# Interactive.Enabled, which already defaults true and is only made
# explicit here for clarity/documentation -- not a behavior change), so
# AF's own /mcp protocol endpoint always 501'd ("MCP protocol is
# disabled") for any external MCP client, regardless of KA connectivity
# being otherwise correctly configured.
# DD-PLATFORM-006 DA14 (PR9): was `| default true`, which silently
# discarded an explicit `enabled: false` override (Sprig's `default`
# treats any falsy input, including a deliberate `false`, as "use the
# default") -- one of 3 confirmed live bugs this PR fixes.
mcp:
  enabled: {{ $v.config.mcp.enabled }}
  sessionIdleTimeout: {{ $v.config.mcp.sessionIdleTimeout | quote }}
# DD-PLATFORM-006 DA14 (PR9): was `| default true` -- same bug as mcp.enabled
# above.
interactive:
  enabled: {{ $v.config.interactive.enabled }}
  awaitSessionTimeout: {{ $v.config.interactive.awaitSessionTimeout | quote }}
  bridgeInactivityTimeout: {{ $v.config.interactive.bridgeInactivityTimeout | quote }}
# Issue #1737 gap found: the A2A agent card (served at GET / for agent
# discovery) never had its own external URL configured, defaulting to the
# Go zero value "".
agentCard:
  url: "https://apifrontend.{{ .Release.Namespace }}.svc:{{ $v.config.server.httpPort }}"
severityTriage:
  {{- /* Issue #1737 gap found: severityTriage.enabled/prometheusURL were
  never wired into the chart, so AF always ran with triage disabled
  (Config.SeverityTriage.Enabled zero value) even when Prometheus is
  available -- Config.Validate() requires prometheusURL whenever
  enabled=true, so this is only safe to turn on when a Prometheus URL is
  actually resolvable; a bare install without monitoring.prometheus wiring
  keeps today's disabled behavior unchanged. */}}
  {{- if include "kubernaut.monitoring.prometheus.enabled" . }}
  enabled: true
  prometheusURL: {{ include "kubernaut.monitoring.prometheus.url" . | quote }}
  {{- if include "kubernaut.monitoring.prometheus.tlsCaFile" . }}
  prometheusTlsCaFile: {{ include "kubernaut.monitoring.prometheus.tlsCaFile" . | quote }}
  {{- end }}
  maxQueriesPerCall: {{ $v.config.severityTriage.maxQueriesPerCall }}
  maxRulesEvaluated: {{ $v.config.severityTriage.maxRulesEvaluated }}
  {{- else }}
  enabled: false
  {{- end }}
  cacheTTLSeconds: {{ $v.config.severityTriage.cacheTTLSeconds }}
  llmConfidence: {{ $v.config.severityTriage.llmConfidence }}
  {{- if $stLLMEnabled }}
  llm:
    {{- include "kubernaut.llm.afBlock" (dict "profile" $stProfile "apiKeyFile" $stAPIKeyFile) | nindent 4 }}
  {{- else }}
  llm: {}
  {{- end }}
resilience:
  prometheus:
    connectTimeout: {{ $v.config.resilience.prometheus.connectTimeout | quote }}
    requestTimeout: {{ $v.config.resilience.prometheus.requestTimeout | quote }}
auth:
  {{- with .Values.apifrontend.config.auth.issuerURL }}
  issuerURL: {{ . | quote }}
  {{- end }}
  {{- with .Values.apifrontend.config.auth.jwksURL }}
  jwksURL: {{ . | quote }}
  {{- end }}
  {{- with .Values.apifrontend.config.auth.audience }}
  audience: {{ . | quote }}
  {{- end }}
  {{- with .Values.apifrontend.config.auth.oidcCaFile }}
  oidcCaFile: {{ . | quote }}
  {{- end }}
  {{- if .Values.apifrontend.config.auth.allowInsecureIssuers }}
  allowInsecureIssuers: true
  {{- end }}
  {{- with .Values.apifrontend.config.auth.jwtProviders }}
  jwtProviders:
  {{- range . }}
    - name: {{ .name | quote }}
      issuerURL: {{ .issuerURL | quote }}
      {{- with .jwksURL }}
      jwksURL: {{ . | quote }}
      {{- end }}
      audiences:
      {{- range .audiences }}
        - {{ . | quote }}
      {{- end }}
      {{- with .claimMappings }}
      claimMappings:
        {{- with .username }}
        username: {{ . | quote }}
        {{- end }}
        {{- with .groups }}
        groups: {{ . | quote }}
        {{- end }}
      {{- end }}
  {{- end }}
  {{- end }}
  {{- if $v.config.auth.replayCache.enabled }}
  # GAP-08 (Issue #1505): distributed jti replay cache shared across all
  # APIFrontend replicas via the cluster's Valkey instance. Reverted from
  # DD-PLATFORM-006 DA6's brief "mandatory, no enabled gate" stance (round-13
  # RCA, PR #1790): jti-uniqueness-based replay detection rejects any second
  # presentation of the same token within the cache TTL, which is exactly how
  # a legitimate client is expected to reuse an OAuth2 Bearer token across
  # multiple requests -- mandating it on broke every multi-call session, not
  # just the multi-replica HA gap this control was meant to close. Opt-in,
  # per BR-SECURITY-1505's original design.
  replayCache:
    backend: redis
    redisAddr: {{ include "kubernaut.valkey.addr" . }}
    redisDB: {{ $v.config.auth.replayCache.redisDB }}
    credentialsPath: "/etc/apifrontend/valkey/valkey-secrets.yaml"
    {{- if $v.config.auth.replayCache.tls.enabled }}
    # DD-PLATFORM-006 DA9: the chart's own Valkey is TLS-only by default
    # (Decision Area 8), so this connection needs TLS too -- caFile defaults
    # to the already-mounted inter-service CA (see the tls-ca volume/mount
    # below) so this works without extra configuration against the chart's
    # own Valkey; override only for a BYO Valkey/Redis signed by another CA.
    tls:
      enabled: true
      caFile: {{ .Values.apifrontend.config.auth.replayCache.tls.caFile | default (include "kubernaut.interServiceTLS.caFile" .) | quote }}
      {{- with .Values.apifrontend.config.auth.replayCache.tls.certFile }}
      certFile: {{ . | quote }}
      {{- end }}
      {{- with .Values.apifrontend.config.auth.replayCache.tls.keyFile }}
      keyFile: {{ . | quote }}
      {{- end }}
    {{- end }}
    {{- with .Values.apifrontend.config.auth.replayCache.trustedProxyCIDRs }}
    # DD-PLATFORM-006 DA18 (#1999): trusted-proxy CIDRs for jti replay-cache
    # source binding. Only set this to CIDRs that actually terminate/rewrite
    # client-IP headers before reaching apifrontend (e.g. the cluster
    # ingress) -- an untrusted or misconfigured entry here would let a
    # replayed token spoof its way past source binding.
    trustedProxyCIDRs:
      {{- range . }}
      - {{ . | quote }}
      {{- end }}
    {{- end }}
  {{- end }}
# Issue #1737 gap found: never wired into the chart, so AF silently ran
# with cmd/apifrontend/main.go's buildRateLimiters() package-level
# fallback (ratelimit.DefaultConfig(): only 3 concurrent sessions, 60
# tool calls/minute) instead of these values -- confirmed via E2E to
# cause "max_sessions: Maximum concurrent sessions reached" / MCP 429s
# under any meaningful concurrent session load.
rateLimit:
  ipRequestsPerSec: {{ $v.config.rateLimit.ipRequestsPerSec }}
  userRequestsPerSec: {{ $v.config.rateLimit.userRequestsPerSec }}
  maxConcurrentSessions: {{ $v.config.rateLimit.maxConcurrentSessions }}
  toolCallsPerMinute: {{ $v.config.rateLimit.toolCallsPerMinute }}
rbac:
  sarCacheTTL: {{ $v.config.rbac.sarCacheTTL }}
  consoleAccessAuthOnly: {{ $v.config.rbac.consoleAccessAuthOnly }}
logging:
  level: {{ $v.logging.level }}
  format: json
{{- if .Values.global.fleet.enabled }}
fleet:
  enabled: true
  {{- /* Issue #2059/E2E-FLEET-018 RCA: this backend/endpoint pair was
  missing here entirely (not just defaulted wrong) -- AF's own
  fleet.NewScopeChecker call (cmd/apifrontend/backend_deps.go) always saw
  Backend="" + Endpoint="", so pkg/fleet/config.go's EffectiveEndpoint()
  returned "" (auto-derivation for the fmc backend is itself gated on
  Backend==BackendFMC, never true for an empty Backend) and
  pkg/fleet/scope_factory.go's NewScopeChecker silently returned the bare
  local scope.Manager instead of a FederatedScopeChecker -- even with
  global.fleet.enabled=true. Every kubernaut_remediate/investigate call
  carrying a non-empty ClusterID then fail-closed with "local Manager
  cannot resolve remote cluster", identical in shape to the GW/RO
  Backend=""+auto-derived-Endpoint gap fixed for Issue #1737/DD-TEST-015
  below (mirrors gateway.yaml/remediationorchestrator.yaml's identical
  block verbatim). global.fleet.backend="" documented default is
  "fleetmetadatacache" (README.md, values.yaml) -- must be MATERIALIZED
  here, not just implied by the values.yaml comment, else
  effectiveBackend() (which deliberately does NOT itself default an
  empty Backend, see UT-FLEET-FAC-007) sees Backend="" + a non-empty
  auto-derived Endpoint and fails startup with "fleet: unsupported
  backend \"\"". */}}
  backend: {{ $apifrontendFleetPreamble.config.backend | default "fleetmetadatacache" | quote }}
  {{- if $apifrontendFleetPreamble.config.endpoint }}
  endpoint: {{ $apifrontendFleetPreamble.config.endpoint | quote }}
  {{- else if eq (default "fleetmetadatacache" $apifrontendFleetPreamble.config.backend) "fleetmetadatacache" }}
  endpoint: {{ include "kubernaut.fleetmetadatacache.url" . | quote }}
  {{- end }}
  mcpGatewayEndpoint: {{ $apifrontendFleetPreamble.config.mcpGatewayEndpoint | quote }}
  {{- if $apifrontendFleetPreamble.config.mcpGatewayType }}
  mcpGatewayType: {{ $apifrontendFleetPreamble.config.mcpGatewayType | quote }}
  {{- end }}
  tlsCAFile: {{ $apifrontendFleetPreamble.config.tlsCAFile | default (include "kubernaut.interServiceTLS.caFile" .) | quote }}
  {{- if $apifrontendFleetPreamble.oauth2.enabled }}
  oauth2:
    enabled: true
    tokenURL: {{ $apifrontendFleetPreamble.oauth2.tokenURL | quote }}
    credentialsSecretRef: {{ $apifrontendFleetPreamble.oauth2.credentialsSecretRef | quote }}
    {{- if $apifrontendFleetPreamble.oauth2.scopes }}
    scopes:
      {{- range $apifrontendFleetPreamble.oauth2.scopes }}
      - {{ . | quote }}
      {{- end }}
    {{- end }}
    tlsCAFile: {{ $apifrontendFleetPreamble.oauth2.tlsCAFile | default (include "kubernaut.interServiceTLS.caFile" .) | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- /*
DD-PLATFORM-006 Decision Area 14 (PR9): recomputed here (not shared with
kubernaut.apifrontend.configYAML above) since this is a separate top-level
scope in the same file, not a nested named-template call.
*/}}
{{- $v := include "kubernaut.mergedValues" (dict "root" $ "service" "apifrontend") | fromYaml }}
{{- if $v.enabled }}
{{- /*
Issue #1984 Phase D: oauth2.tokenURL/credentialsSecretRef required-when-enabled
guards (and the ADR-068 gap of oauth2.enabled itself being optional) moved to
values.schema.json if/then blocks gated on global.fleet.mcpGatewayEndpoint
being set (BR-PLATFORM-010).
*/}}
{{- $apifrontendFleetPreamble := include "kubernaut.fleet.preamble" (dict "root" $ "fleet" .Values.apifrontend.fleet "oauth2" .Values.apifrontend.fleet.oauth2) | fromYaml }}
{{- /*
DD-PLATFORM-007 / BR-PLATFORM-008: resolve AF's own agent.llm profile
(apifrontend.llmProfileRef, defaulting to kubernautAgent.llmProfileRef) and
severityTriage's independent llm profile (empty ref/nil inherits AF's own;
llmEnabled=false disables it entirely, forcing rule-based-only triage).
*/}}
{{- $kaV := include "kubernaut.mergedValues" (dict "root" $ "service" "kubernautAgent") | fromYaml }}
{{- $kaEffectiveRef := include "kubernaut.llm.effectiveKALLMProfileRef" (dict "root" $ "ref" $kaV.llmProfileRef) }}
{{- $afProfileRefName := $v.llmProfileRef | default $kaEffectiveRef }}
{{- $afProfile := include "kubernaut.llm.resolveProfile" (dict "root" $ "name" $afProfileRefName) | fromYaml }}
{{- $afAPIKeyFile := include "kubernaut.llm.mountedKeyFile" (dict "dir" "/etc/apifrontend/llm-credentials" "provider" $afProfile.provider) }}
{{- $stCfg := $v.config.severityTriage }}
{{- $stLLMEnabled := $stCfg.llmEnabled }}
{{- $stProfileRefName := $stCfg.llmProfileRef }}
{{- $stProfile := $afProfile }}
{{- if and $stLLMEnabled $stProfileRefName }}
{{- $stProfile = include "kubernaut.llm.resolveProfile" (dict "root" $ "name" $stProfileRefName) | fromYaml }}
{{- end }}
{{- $stHasDedicatedSecret := and $stLLMEnabled (ne $stProfile.credentialsSecretName $afProfile.credentialsSecretName) }}
{{- /*
kubernaut#1861 (lifts kubernaut#1731's guard): AF's own connection and
severityTriage's may now both resolve to vertex_ai with different
credentialsSecretName values. Previously blocked here because
GOOGLE_APPLICATION_CREDENTIALS is a single process-wide ambient-credential
env var and both cmd/apifrontend severityTriage constructors
(newAnthropicTriagerForVertex, newGenAITriagerForVertex) relied on it via
pkg/apifrontend/launcher.InjectAmbientGoogleCredentials. As of kubernaut#1861,
both constructors resolve credentials explicitly from this profile's own
apiKeyFile/apiKey (below) instead -- mirroring AF's own agent.llm
Gemini-on-Vertex path (kubernaut#1801's newVertexGeminiModel) and the
identical release/v1.5 fix (kubernaut#1870) -- so there is no longer a
shared-mutable-state collision between the two connections. AF's own
agent.llm Claude-on-Vertex connection (newVertexAnthropicModel) still
relies on ambient ADC due to an adk-anthropic-go v1.0.0 SDK limitation, but
that's no longer a collision risk either: severityTriage never touches the
env var now, so nothing else in the process depends on what that one
remaining call site sets it to.
*/}}
{{- $stAPIKeyFile := "" }}
{{- if $stHasDedicatedSecret }}
{{- $stAPIKeyFile = include "kubernaut.llm.mountedKeyFile" (dict "dir" "/etc/apifrontend/severity-triage-credentials" "provider" $stProfile.provider) }}
{{- else if $stLLMEnabled }}
{{- $stAPIKeyFile = $afAPIKeyFile }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: apifrontend
  namespace: {{ .Release.Namespace }}
  labels:
    app: apifrontend
    {{- include "kubernaut.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: apifrontend
  labels:
    app: apifrontend
    {{- include "kubernaut.labels" . | nindent 4 }}
rules:
  - apiGroups: ["kubernaut.ai"]
    resources: ["investigationsessions"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["kubernaut.ai"]
    resources: ["investigationsessions/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["kubernaut.ai"]
    resources: ["remediationrequests"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["kubernaut.ai"]
    resources: ["remediationrequests/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["kubernaut.ai"]
    resources: ["remediationapprovalrequests"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["kubernaut.ai"]
    resources: ["remediationapprovalrequests/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "create", "patch"]
  - apiGroups: [""]
    resources: ["pods", "replicationcontrollers", "services", "endpoints", "configmaps", "secrets", "namespaces", "nodes", "persistentvolumeclaims"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kubernaut.ai"]
    resources: ["aianalyses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  {{- /*
  #1686 (BR-RBAC-020): the mcpserverregistrations rule is only granted
  cluster-wide here when no namespace scope is configured. When
  apifrontend.fleet.namespace is set, the identical rule is granted instead
  via a namespace-scoped Role/RoleBinding below, matching what the
  ClusterRegistry informer actually watches (least privilege).
  */}}
  {{- if and (eq $apifrontendFleetPreamble.config.mcpGatewayType "kuadrant") (not .Values.apifrontend.fleet.namespace) }}
  # BR-FLEET-054: AF's ClusterRegistry watches MCPServerRegistration CRs
  # directly via a dynamic informer when the Kuadrant MCP Gateway is used.
  - apiGroups: ["mcp.kuadrant.io"]
    resources: ["mcpserverregistrations"]
    verbs: ["get", "list", "watch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: apifrontend
  labels:
    app: apifrontend
    {{- include "kubernaut.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: apifrontend
subjects:
  - kind: ServiceAccount
    name: apifrontend
    namespace: {{ .Release.Namespace }}
{{- if and (eq $apifrontendFleetPreamble.config.mcpGatewayType "kuadrant") .Values.apifrontend.fleet.namespace }}
---
# #1686 (BR-RBAC-020): namespace-scoped equivalent of the ClusterRole rule
# above, granted instead of it when apifrontend.fleet.namespace is set.
{{ include "kubernaut.fleet.registryNsRBAC" (dict "name" "apifrontend" "serviceAccount" "apifrontend" "namespace" .Values.apifrontend.fleet.namespace "appLabels" "app: apifrontend" "mcpServerRegistrations" true "Release" .Release "labels" (include "kubernaut.labels" .)) }}
{{- end }}
---
# RoleBinding granting AF SA access to KA service (trusted intermediary, #1287)
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: apifrontend-kubernaut-agent-access
  namespace: {{ .Release.Namespace }}
  labels:
    app: apifrontend
    {{- include "kubernaut.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubernaut-agent-client
subjects:
  - kind: ServiceAccount
    name: apifrontend
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: apifrontend-config
  namespace: {{ .Release.Namespace }}
  labels:
    app: apifrontend
    {{- include "kubernaut.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- include "kubernaut.apifrontend.configYAML" . | nindent 4 }}
---
# Per-persona ClusterRoles for SAR-based tool authorization.
# The AF performs SubjectAccessReview checks against verb=use, group=kubernaut.ai,
# resource=tools, name=<toolName>. Bind these ClusterRoles to OIDC groups via
# ClusterRoleBindings to grant tool access per persona.
{{- range $persona, $tools := .Values.apifrontend.config.rbac.personas }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubernaut-tool-{{ $persona }}
  labels:
    kubernaut.ai/component: tool-authorization
    {{- include "kubernaut.labels" $ | nindent 4 }}
rules:
  - apiGroups: ["kubernaut.ai"]
    resources: ["tools"]
    verbs: ["use"]
    resourceNames:
      {{- range $tools }}
      - {{ . }}
      {{- end }}
{{- end }}
---
# #1919 (AC-3/AC-6): coarse-grained console-access gate, deliberately a
# separate, independently-auditable grant from the per-tool ClusterRoles
# above (not derived from them) -- operators grant "console access" and
# "tool access" as two explicit steps. Enforced server-side at every
# tool-invocation site (checkRBAC/newRBACGuard), not just the advisory
# GET /a2a/access endpoint.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubernaut-console-access
  labels:
    kubernaut.ai/component: console-authorization
    {{- include "kubernaut.labels" . | nindent 4 }}
rules:
  - apiGroups: ["kubernaut.ai"]
    resources: ["console"]
    verbs: ["use"]
{{- range .Values.apifrontend.config.rbac.consoleAccessGroups }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubernaut-console-access-{{ . }}
  labels:
    kubernaut.ai/component: console-authorization
    {{- include "kubernaut.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubernaut-console-access
subjects:
  - kind: Group
    name: {{ . }}
    apiGroup: rbac.authorization.k8s.io
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apifrontend
  namespace: {{ .Release.Namespace }}
  labels:
    app: apifrontend
    {{- include "kubernaut.labels" . | nindent 4 }}
spec:
  replicas: {{ $v.replicas }}
  # PR #1790 round-13 RCA: see gateway.yaml's progressDeadlineSeconds comment
  # -- K8s's Deployment controller enforces this SERVER-SIDE (default 600s)
  # independently of `kubectl rollout status --timeout`, which is why round-12's
  # 480s->720s CLI timeout bump had no effect. 750s makes that 720s CLI
  # timeout the real ceiling again.
  progressDeadlineSeconds: 750
  selector:
    matchLabels:
      app: apifrontend
  template:
    metadata:
      labels:
        app: apifrontend
      annotations:
        checksum/config: {{ include "kubernaut.apifrontend.configYAML" . | sha256sum }}
    spec:
      serviceAccountName: apifrontend
      automountServiceAccountToken: true
      {{- include "kubernaut.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "kubernaut.podSecurityContext" .Values.apifrontend | nindent 8 }}
      {{- include "kubernaut.affinity" (dict "component" .Values.apifrontend "matchLabels" (dict "app" "apifrontend")) | nindent 6 }}
      {{- include "kubernaut.scheduling" (dict "component" .Values.apifrontend "global" .Values.global) | nindent 6 }}
      containers:
        - name: apifrontend
          image: {{ include "kubernaut.image" (dict "service" "apifrontend" "root" $ "appVersion" .Chart.AppVersion) }}
          imagePullPolicy: {{ include "kubernaut.imagePullPolicy" $ }}
          securityContext:
            {{- include "kubernaut.containerSecurityContext" .Values.apifrontend | nindent 12 }}
          ports:
            - name: https
              containerPort: {{ $v.config.server.httpPort }}
            - name: metrics
              containerPort: {{ $v.config.server.metricsPort }}
            - name: health
              containerPort: {{ $v.config.server.healthPort }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- /* kubernaut#1801: GOOGLE_APPLICATION_CREDENTIALS is deliberately
            NOT declared here. It's now injected in-process by cmd/apifrontend
            at construction time for the vertex_ai model families whose SDK
            requires ambient ADC (pkg/apifrontend/launcher.
            InjectAmbientGoogleCredentials), reading the same apiKeyFile path
            rendered into config.yaml by kubernaut.llm.afBlock below --
            avoiding a static, credential-adjacent env var in the pod spec
            (mirrors Kubernaut Agent's and HAPI's precedent). */}}
          volumeMounts:
            - name: config
              mountPath: /etc/apifrontend
              readOnly: true
            - name: tls-certs
              mountPath: /etc/apifrontend/tls
              readOnly: true
            - name: llm-credentials
              mountPath: /etc/apifrontend/llm-credentials
              readOnly: true
            {{- if $stHasDedicatedSecret }}
            - name: severity-triage-credentials
              mountPath: /etc/apifrontend/severity-triage-credentials
              readOnly: true
            {{- end }}
            {{- if $v.config.auth.replayCache.enabled }}
            - name: valkey-secrets
              mountPath: /etc/apifrontend/valkey
              readOnly: true
            {{- end }}
            {{- /* Issue #1737: mount the inter-service CA unconditionally (matches
            gateway.yaml/kubernaut-agent.yaml) -- agent.kaTlsCaFile/dsTlsCaFile above
            always reference it now, so AF's KA/DS client transports can validate
            those services' chart-generated self-signed leaf certs. Previously this
            was gated on fleet.enabled/auth.oidcCaFile, which left kaTlsCaFile/
            dsTlsCaFile pointing at a path with nothing mounted there, silently
            falling back to Go's http.DefaultTransport/system trust store (unable to
            validate the chart's own CA) for every AF->KA and AF->DS HTTPS call. */}}
            {{- include "kubernaut.tlsCaVolumeMount" . | nindent 12 }}
            {{- if and .Values.global.fleet.enabled $apifrontendFleetPreamble.oauth2.enabled }}
            - name: oauth2-credentials
              mountPath: "/etc/apifrontend/{{ $apifrontendFleetPreamble.oauth2.credentialsSecretRef }}"
              readOnly: true
            {{- end }}
          {{- /* DD-PLATFORM-008: AF builds a registry.ClusterRegistry against
          the fleet MCP Gateway at boot (buildFleetReaderDeps ->
          mcpclient.NewResilient + ClusterRegistry.Start's blocking
          cache.WaitForCacheSync), which can legitimately stall well past the
          liveness probe's budget under load -- confirmed via a 10+ minute
          crash loop in a resource-constrained E2E cluster. */}}
          {{- include "kubernaut.startupProbe" (dict "port" "health") | nindent 10 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml .Values.apifrontend.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: apifrontend-config
            items:
              - key: config.yaml
                path: config.yaml
        - name: tls-certs
          secret:
            secretName: apifrontend-tls
            optional: true
        - name: llm-credentials
          secret:
            secretName: {{ $afProfile.credentialsSecretName }}
        {{- if $stHasDedicatedSecret }}
        - name: severity-triage-credentials
          secret:
            secretName: {{ $stProfile.credentialsSecretName }}
        {{- end }}
        {{- if $v.config.auth.replayCache.enabled }}
        - name: valkey-secrets
          secret:
            secretName: {{ include "kubernaut.valkey.secretName" . }}
            items:
              - key: valkey-secrets.yaml
                path: valkey-secrets.yaml
        {{- end }}
        {{- /* Issue #1737: unconditional, see volumeMounts comment above. */}}
        {{- include "kubernaut.tlsCaVolume" . | nindent 8 }}
        {{- if and .Values.global.fleet.enabled $apifrontendFleetPreamble.oauth2.enabled }}
        - name: oauth2-credentials
          secret:
            secretName: {{ $apifrontendFleetPreamble.oauth2.credentialsSecretRef }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: apifrontend
  namespace: {{ .Release.Namespace }}
  labels:
    app: apifrontend
    {{- include "kubernaut.labels" . | nindent 4 }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "{{ $v.config.server.metricsPort }}"
spec:
  type: {{ $v.service.type }}
  ports:
    - name: https
      port: {{ $v.config.server.httpPort }}
      targetPort: https
      {{- if and (eq $v.service.type "NodePort") $v.service.nodePort }}
      nodePort: {{ $v.service.nodePort }}
      {{- end }}
    - name: metrics
      port: {{ $v.config.server.metricsPort }}
      targetPort: metrics
    - name: health
      port: {{ $v.config.server.healthPort }}
      targetPort: health
  selector:
    app: apifrontend
{{- end }}
