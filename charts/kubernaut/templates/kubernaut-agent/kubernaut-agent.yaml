{{- /*
LLM profile resolution (DD-PLATFORM-007 / BR-PLATFORM-008). Computed once
at the top of this multi-document template so every ConfigMap/Deployment
section below shares identical resolution -- avoids re-deriving (and
potentially drifting) the same lookups per-section.
*/}}
{{- /*
DD-PLATFORM-006 DA4: llmProfileRef defaults to "primary" (values.yaml/schema),
so there is no separate "field is required" fail() here anymore -- an
undefined profile (including an explicit empty-string override) is caught by
kubernaut.llm.resolveProfile's own fail() below, with a message naming the
actual (possibly empty) reference.
*/}}
{{- /*
DD-PLATFORM-006 Decision Area 11: APIFrontend's ka.NewSDKMCPClient
(pkg/apifrontend/ka/) is the only MCP client anywhere in the codebase that
connects to KA's interactive /api/v1/mcp endpoint (verified: zero other
callers). Issue #1984 Phase C: this dependency (kubernautAgent.interactive.enabled=true
requires apifrontend.enabled != false) moved from a fail() guard here to a
values.schema.json if/then block (BR-PLATFORM-010).
*/}}
{{- $kaV := include "kubernaut.mergedValues" (dict "root" $ "service" "kubernautAgent") | fromYaml }}
{{- /*
Issue #1729: KA's fleet MCP Gateway client (cmd/kubernautagent/toolregistry.go
registerFleetTools) was fully wired in Go but had no Helm-exposed
kubernautAgent.fleet block at all, so a fleet-tagged investigation always
fell back to hub-local tools regardless of global.fleet.enabled. Computed
once here (used by the guard below and the Deployment's fleet-oauth2
volume/volumeMount further down); configYAML recomputes its own copy since
named templates don't inherit file-top variables (see the comment above
kubernaut.kubernautAgent.configYAML's define).
*/}}
{{- $kaFleetPreamble := include "kubernaut.fleet.preamble" (dict "root" $ "fleet" .Values.kubernautAgent.fleet "oauth2" .Values.kubernautAgent.fleet.oauth2) | fromYaml }}
{{- /*
Issue #1984 Phase D: oauth2.tokenURL/credentialsSecretRef required-when-enabled
guards (and the ADR-068 gap of oauth2.enabled itself being optional) moved to
values.schema.json if/then blocks gated on global.fleet.mcpGatewayEndpoint
being set (BR-PLATFORM-010).
*/}}
{{- $kaProfile := include "kubernaut.llm.resolveProfile" (dict "root" $ "name" $kaV.llmProfileRef) | fromYaml }}
{{- $validPhases := list "rca" "workflow_discovery" "validation" }}
{{- $kaPhaseProfiles := dict }}
{{- range $phase, $profileName := .Values.kubernautAgent.phaseModels }}
{{- if not (has $phase $validPhases) }}
{{- fail (printf "kubernautAgent.phaseModels: unrecognized phase name %q (valid: %s)" $phase (join ", " $validPhases)) }}
{{- end }}
{{- $p := include "kubernaut.llm.resolveProfile" (dict "root" $ "name" $profileName) | fromYaml }}
{{- $_ := set $kaPhaseProfiles $phase $p }}
{{- end }}
{{- $kaAlignmentProfileRef := .Values.kubernautAgent.alignmentCheck.llmProfileRef | default $kaV.llmProfileRef }}
{{- $kaAlignmentProfile := dict }}
{{- if .Values.kubernautAgent.alignmentCheck.enabled }}
{{- $kaAlignmentProfile = include "kubernaut.llm.resolveProfile" (dict "root" $ "name" $kaAlignmentProfileRef) | fromYaml }}
{{- end }}
{{- /*
Multi-Secret-volume mounting (DD-PLATFORM-007): a phaseModels/alignmentCheck
override only gets its own dedicated mount when its resolved
credentialsSecretName differs from KA's base profile -- otherwise it
inherits the base's already-mounted "llm-credentials-file" path. Sorted
iteration keeps the rendered Deployment deterministic (mirrors the
Operator's sort.Strings(phases)).
*/}}
{{- $kaPhaseMounts := list }}
{{- range $phase := (keys $kaPhaseProfiles | sortAlpha) }}
{{- $p := index $kaPhaseProfiles $phase }}
{{- if ne $p.credentialsSecretName $kaProfile.credentialsSecretName }}
{{- $kaPhaseMounts = append $kaPhaseMounts (dict "phase" $phase "profile" $p) }}
{{- end }}
{{- end }}
{{- $kaAlignmentNeedsMount := and .Values.kubernautAgent.alignmentCheck.enabled (ne $kaAlignmentProfile.credentialsSecretName $kaProfile.credentialsSecretName) }}
{{- $kaAlignmentAPIKeyFile := "" }}
{{- if $kaAlignmentNeedsMount }}
{{- $kaAlignmentAPIKeyFile = include "kubernaut.llm.mountedKeyFile" (dict "dir" "/etc/kubernaut-agent/alignment-check-credentials" "provider" $kaAlignmentProfile.provider) }}
{{- end }}
{{- /*
checksum/config + checksum/llm-runtime (Issue #1737 gap) need this content
reachable from the Deployment's pod template annotations, a separate
`include` call site from the two ConfigMaps below -- named templates don't
inherit $-scoped variables from their caller, so the LLM profile resolution
above must be recomputed here rather than reused from the file-top
declarations.
*/}}
{{- define "kubernaut.kubernautAgent.configYAML" -}}
{{- $v := include "kubernaut.mergedValues" (dict "root" . "service" "kubernautAgent") | fromYaml }}
{{- $kaFleetPreamble := include "kubernaut.fleet.preamble" (dict "root" . "fleet" .Values.kubernautAgent.fleet "oauth2" .Values.kubernautAgent.fleet.oauth2) | fromYaml }}
{{- $kaProfile := include "kubernaut.llm.resolveProfile" (dict "root" $ "name" $v.llmProfileRef) | fromYaml }}
{{- $kaAlignmentProfileRef := .Values.kubernautAgent.alignmentCheck.llmProfileRef | default $v.llmProfileRef }}
{{- $kaAlignmentProfile := dict }}
{{- if .Values.kubernautAgent.alignmentCheck.enabled }}
{{- $kaAlignmentProfile = include "kubernaut.llm.resolveProfile" (dict "root" $ "name" $kaAlignmentProfileRef) | fromYaml }}
{{- end }}
{{- $kaAlignmentNeedsMount := and .Values.kubernautAgent.alignmentCheck.enabled (ne $kaAlignmentProfile.credentialsSecretName $kaProfile.credentialsSecretName) }}
{{- $kaAlignmentAPIKeyFile := "" }}
{{- if $kaAlignmentNeedsMount }}
{{- $kaAlignmentAPIKeyFile = include "kubernaut.llm.mountedKeyFile" (dict "dir" "/etc/kubernaut-agent/alignment-check-credentials" "provider" $kaAlignmentProfile.provider) }}
{{- end -}}
runtime:
  logging:
    level: {{ $v.logging.level | quote }}
  server:
    address: "0.0.0.0"
    port: 8443
    healthAddr: ":8081"
    metricsAddr: ":9090"
    tls:
      certDir: {{ include "kubernaut.interServiceTLS.certDir" . | quote }}
  audit:
    flushIntervalSeconds: 1.0
    bufferSize: 10000
    batchSize: 50
ai:
  llm:
    provider: {{ $kaProfile.provider | quote }}
{{- $kaOAuth2 := $kaProfile.oauth2 | default dict }}
{{- if $kaOAuth2.enabled }}
    oauth2:
      enabled: true
      tokenURL: {{ $kaOAuth2.tokenURL | quote }}
      credentialsDir: "/etc/kubernaut-agent/oauth2"
{{- if $kaOAuth2.scopes }}
      scopes:
{{- range (splitList " " $kaOAuth2.scopes) }}
        - {{ . | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- if $kaProfile.vertexProject }}
    vertexProject: {{ $kaProfile.vertexProject | quote }}
{{- end }}
{{- if $kaProfile.vertexLocation }}
    vertexLocation: {{ $kaProfile.vertexLocation | quote }}
{{- end }}
{{- if $kaProfile.azureApiVersion }}
    azureApiVersion: {{ $kaProfile.azureApiVersion | quote }}
{{- end }}
{{- if $kaProfile.tlsCaFile }}
    tlsCaFile: {{ $kaProfile.tlsCaFile | quote }}
{{- end }}
{{- $kaReasoning := $kaProfile.reasoning | default dict }}
{{- if or $kaReasoning.enabled $kaReasoning.capabilityOverride $kaReasoning.effort }}
    reasoning:
{{- if $kaReasoning.enabled }}
      enabled: true
{{- end }}
{{- if $kaReasoning.budgetTokens }}
      budgetTokens: {{ $kaReasoning.budgetTokens }}
{{- end }}
{{- if $kaReasoning.effort }}
      effort: {{ $kaReasoning.effort | quote }}
{{- end }}
{{- if $kaReasoning.capabilityOverride }}
      capabilityOverride: {{ $kaReasoning.capabilityOverride | quote }}
{{- end }}
{{- end }}
  investigation:
    maxTurns: 40
    resolvedConfidenceThreshold: {{ $v.investigation.resolvedConfidenceThreshold }}
    inconclusiveConfidenceThreshold: {{ $v.investigation.inconclusiveConfidenceThreshold }}
    safety:
      anomaly:
        maxTotalToolCalls: {{ $v.ai.safety.anomaly.maxTotalToolCalls }}
{{- if .Values.kubernautAgent.alignmentCheck.enabled }}
  alignmentCheck:
    enabled: true
    timeout: {{ $v.alignmentCheck.timeout }}
    maxStepTokens: {{ $v.alignmentCheck.maxStepTokens }}
    llm:
      {{- include "kubernaut.llm.overrideBlock" (dict "profile" $kaAlignmentProfile "apiKeyFile" $kaAlignmentAPIKeyFile) | nindent 6 }}
{{- end }}
{{- if .Values.kubernautAgent.interactive.enabled }}
interactive:
  enabled: true
  sessionTTL: {{ $v.interactive.sessionTTL | quote }}
  inactivityTimeout: {{ $v.interactive.inactivityTimeout | quote }}
  # Issue #1737 gap found: default of 5 was too low even for realistic
  # production use, confirmed via full-suite E2E failing nearly every
  # interactive/MCP spec with "max_sessions: Maximum concurrent sessions
  # reached" from Ginkgo's own test parallelism alone (see values.yaml
  # comment for kubernautAgent.interactive.maxConcurrentSessions).
  maxConcurrentSessions: {{ $v.interactive.maxConcurrentSessions }}
  rateLimitPerUser: {{ $v.interactive.rateLimitPerUser }}
  maxAnalyzingTimeout: {{ $v.interactive.maxAnalyzingTimeout | quote }}
{{- with .Values.kubernautAgent.interactive.jwtProviders }}
  jwtProviders:
{{- range . }}
    - name: {{ .name | quote }}
      issuer: {{ .issuer | quote }}
      jwksURL: {{ .jwksURL | quote }}
      audience: {{ .audience | quote }}
{{- if .claimMappings }}
      claimMappings:
        username: {{ .claimMappings.username | default "preferred_username" | quote }}
        groups: {{ .claimMappings.groups | default "groups" | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
integrations:
  dataStorage:
    url: "{{ include "kubernaut.datastorage.url" . }}"
{{- if include "kubernaut.agent.tlsEnabled" . }}
    tls:
      caFile: "{{ include "kubernaut.agent.tlsCaDir" . }}/{{ include "kubernaut.agent.tlsCaKey" . }}"
{{- end }}
{{- if or (include "kubernaut.monitoring.prometheus.enabled" .) (include "kubernaut.monitoring.alertManager.enabled" .) }}
  tools:
{{- if include "kubernaut.monitoring.prometheus.enabled" . }}
    prometheus:
      url: {{ include "kubernaut.monitoring.prometheus.url" . | quote }}
{{- if include "kubernaut.monitoring.prometheus.tlsCaFile" . }}
      tlsCaFile: {{ include "kubernaut.monitoring.prometheus.tlsCaFile" . | quote }}
{{- end }}
{{- end }}
{{- if include "kubernaut.monitoring.alertManager.enabled" . }}
    alertmanager:
      url: {{ include "kubernaut.monitoring.alertManager.url" . | quote }}
{{- if include "kubernaut.monitoring.alertManager.tlsCaFile" . }}
      tlsCaFile: {{ include "kubernaut.monitoring.alertManager.tlsCaFile" . | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- /*
Issue #1729: closes the Helm-wiring parity gap versus apifrontend.fleet/
effectivenessmonitor.fleet -- kubernautAgent.fleet.{endpoint,gatewayType}
map directly onto FleetConfig.{Endpoint,GatewayType}'s yaml tags
(internal/kubernautagent/config/config_types.go), which registerFleetTools
(cmd/kubernautagent/toolregistry.go) requires BOTH non-empty to connect to
the MCP Gateway at all. Rendered unconditionally (not only when both are
set) so an operator who enables global.fleet but leaves mcpGatewayType
unset gets the same graceful "fleet disabled" fallback already built into
registerFleetTools, rather than a materially different (and undocumented)
Helm-side behavior.
*/}}
{{- if .Values.global.fleet.enabled }}
  fleet:
    endpoint: {{ $kaFleetPreamble.config.mcpGatewayEndpoint | quote }}
    gatewayType: {{ $kaFleetPreamble.config.mcpGatewayType | quote }}
{{- if $kaFleetPreamble.oauth2.enabled }}
    oauth2:
      enabled: true
      tokenURL: {{ $kaFleetPreamble.oauth2.tokenURL | quote }}
      credentialsSecretRef: {{ $kaFleetPreamble.oauth2.credentialsSecretRef | quote }}
{{- if $kaFleetPreamble.oauth2.scopes }}
      scopes:
{{- range $kaFleetPreamble.oauth2.scopes }}
        - {{ . | quote }}
{{- end }}
{{- end }}
      {{- /*
      PR #1820 CI RCA (E2E-FLEET-017, run 30712261367): without this, KA's
      OAuth2 token-fetch HTTP client fell back to the system CA trust store
      and failed to verify a cluster-local IdP's cert-manager-issued
      certificate ("x509: certificate signed by unknown authority"),
      leaving the fleet readiness gate permanently NotReady. Mirrors
      apifrontend/effectivenessmonitor's fleet oauth2.tlsCAFile rendering:
      $kaFleetPreamble.oauth2.tlsCAFile already resolves from the
      global-only global.fleet.oauth2.tlsCAFile (kubernaut.fleet.oauth2
      helper) -- defaulting to the same CA bundle already mounted for
      inter-service mTLS trust when unset.
      */}}
      tlsCaFile: {{ $kaFleetPreamble.oauth2.tlsCAFile | default (include "kubernaut.interServiceTLS.caFile" .) | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- define "kubernaut.kubernautAgent.llmRuntimeYAML" -}}
{{- $v := include "kubernaut.mergedValues" (dict "root" . "service" "kubernautAgent") | fromYaml }}
{{- $kaProfile := include "kubernaut.llm.resolveProfile" (dict "root" $ "name" $v.llmProfileRef) | fromYaml }}
{{- $validPhases := list "rca" "workflow_discovery" "validation" }}
{{- $kaPhaseProfiles := dict }}
{{- range $phase, $profileName := .Values.kubernautAgent.phaseModels }}
{{- if not (has $phase $validPhases) }}
{{- fail (printf "kubernautAgent.phaseModels: unrecognized phase name %q (valid: %s)" $phase (join ", " $validPhases)) }}
{{- end }}
{{- $p := include "kubernaut.llm.resolveProfile" (dict "root" $ "name" $profileName) | fromYaml }}
{{- $_ := set $kaPhaseProfiles $phase $p }}
{{- end -}}
model: {{ $kaProfile.model | quote }}
endpoint: {{ $kaProfile.endpoint | default "" | quote }}
{{- /* #1749: only render temperature when explicitly set. Some models
   (e.g. claude-opus-4-8) reject the parameter outright with a 400 if
   it is present at all — omit it by default rather than forcing 0.7.
   hasKey (not a truthy `if`) so an explicit `temperature: 0` still
   renders (BR-HAPI-199 — explicit zero must still be sent). */}}
{{- if hasKey $kaProfile "temperature" }}
temperature: {{ $kaProfile.temperature }}
{{- end }}
maxRetries: {{ $kaProfile.maxRetries | default 3 }}
timeoutSeconds: {{ $kaProfile.timeoutSeconds | default 120 }}
{{- if $kaPhaseProfiles }}
phaseModels:
{{- range $phase := (keys $kaPhaseProfiles | sortAlpha) }}
{{- $p := index $kaPhaseProfiles $phase }}
{{- $phaseAPIKeyFile := "" }}
{{- if ne $p.credentialsSecretName $kaProfile.credentialsSecretName }}
{{- $phaseAPIKeyFile = include "kubernaut.llm.mountedKeyFile" (dict "dir" (printf "/etc/kubernaut-agent/phase-credentials/%s" $phase) "provider" $p.provider) }}
{{- end }}
  {{ $phase }}:
    {{- include "kubernaut.llm.overrideBlock" (dict "profile" $p "apiKeyFile" $phaseAPIKeyFile) | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubernaut-agent-sa
  namespace: {{ .Release.Namespace }}
  labels:
    app: kubernaut-agent
    {{- include "kubernaut.labels" . | nindent 4 }}
# BR-PLATFORM-005: kubernaut-agent is the highest-risk component (LLM-driven,
# broadest investigative RBAC). Disable the default long-lived (~1yr) SA token
# automount; the Deployment instead mounts a short-TTL projected token below.
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubernaut-agent-investigator
  labels:
    app: kubernaut-agent
    component: investigation
    {{- include "kubernaut.labels" . | nindent 4 }}
rules:
  # ── Core Kubernetes ──────────────────────────────────────────────────────
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - endpoints
      - configmaps
      - secrets
      - nodes
      - namespaces
      - replicationcontrollers
      - persistentvolumeclaims
      - persistentvolumes
      - resourcequotas
      - serviceaccounts
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch", "create", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies", "ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  # ── Storage (#872) ─────────────────────────────────────────────────────────
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csidrivers", "csinodes", "volumeattachments"]
    verbs: ["get", "list", "watch"]
  # ── Discovery (#872) ───────────────────────────────────────────────────────
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  # ── cert-manager ─────────────────────────────────────────────────────────
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates", "clusterissuers", "certificaterequests"]
    verbs: ["get", "list", "watch"]
  # ── ArgoCD ───────────────────────────────────────────────────────────────
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "watch"]
  # ── Linkerd ──────────────────────────────────────────────────────────────
  - apiGroups: ["policy.linkerd.io"]
    resources: ["servers", "authorizationpolicies", "meshtlsauthentications"]
    verbs: ["get", "list", "watch"]
  # ── Istio ───────────────────────────────────────────────────────────────
  - apiGroups: ["security.istio.io"]
    resources: ["authorizationpolicies", "peerauthentications", "requestauthentications"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.istio.io"]
    resources: ["virtualservices", "destinationrules", "gateways", "serviceentries"]
    verbs: ["get", "list", "watch"]
  # ── Metrics API (#770) ────────────────────────────────────────────────────
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
  # ── Prometheus Operator ──────────────────────────────────────────────────
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["prometheusrules", "servicemonitors", "podmonitors", "probes"]
    verbs: ["get", "list", "watch"]
  # ── Kubernaut CRDs (#1287) ──────────────────────────────────────────────
  - apiGroups: ["kubernaut.ai"]
    resources: ["remediationrequests"]
    verbs: ["get", "list"]
  # ── Workflow catalog (#1677, DD-WORKFLOW-019): KA owns discovery directly
  # via its own informer-backed cache instead of proxying through DataStorage.
  - apiGroups: ["kubernaut.ai"]
    resources: ["remediationworkflows", "actiontypes"]
    verbs: ["get", "list", "watch"]
  # ── KubeVirt (BR-PLATFORM-005: VM-backed workload investigation) ──────────
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines", "virtualmachineinstances", "virtualmachineinstancemigrations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["datavolumes"]
    verbs: ["get", "list", "watch"]
  # ── Scheduling (BR-PLATFORM-005: priority/preemption investigation) ──────
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["priorityclasses"]
    verbs: ["get", "list", "watch"]
  # #1288: Impersonation RBAC removed — KA uses its own SA for all K8s API
  # calls. User identity is passed in MCP tool arguments for audit only.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubernaut-agent-investigator-binding
  labels:
    {{- include "kubernaut.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubernaut-agent-investigator
subjects:
  - kind: ServiceAccount
    name: kubernaut-agent-sa
    namespace: {{ .Release.Namespace }}
---
# Issue #1069 (DD-GATEWAY-018): operator-supplied ClusterRole references,
# generalizing kubernaut-operator's KA-only AdditionalClusterRoleBindings
# mechanism to the Helm chart, for resource kinds not already covered above.
# global.additionalClusterRoleBindings covers the common case (same grant
# across Gateway/EM/KA); merged here with KA's own list (deduplicated). Use
# kubernautAgent.additionalClusterRoleBindings alone (leave global unset) to
# withhold an ecosystem grant from KA specifically -- the highest-risk,
# LLM-driven component (BR-PLATFORM-005).
{{- include "kubernaut.additionalClusterRoleBindings" (dict "prefix" "kubernaut-agent" "serviceAccount" "kubernaut-agent-sa" "names" (concat .Values.global.additionalClusterRoleBindings .Values.kubernautAgent.additionalClusterRoleBindings | uniq) "Release" .Release "labels" (include "kubernaut.labels" .)) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubernaut-agent-auth-middleware
  labels:
    {{- include "kubernaut.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: data-storage-auth-middleware
subjects:
  - kind: ServiceAccount
    name: kubernaut-agent-sa
    namespace: {{ .Release.Namespace }}
{{- if .Values.kubernautAgent.interactive.enabled }}
---
# HELM-03 (#703): Lease RBAC is namespace-scoped (least privilege).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubernaut-agent-interactive-leases
  namespace: {{ .Release.Namespace }}
  labels:
    app: kubernaut-agent
    component: interactive
    {{- include "kubernaut.labels" . | nindent 4 }}
rules:
  # list required by ReconcileOrphanedLeases startup loop
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubernaut-agent-interactive-leases-binding
  namespace: {{ .Release.Namespace }}
  labels:
    app: kubernaut-agent
    component: interactive
    {{- include "kubernaut.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubernaut-agent-interactive-leases
subjects:
  - kind: ServiceAccount
    name: kubernaut-agent-sa
    namespace: {{ .Release.Namespace }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubernaut-agent-config
  namespace: {{ .Release.Namespace }}
  labels:
    app: kubernaut-agent
    {{- include "kubernaut.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- include "kubernaut.kubernautAgent.configYAML" . | nindent 4 }}
{{- $kaBaseOAuth2 := $kaProfile.oauth2 | default dict }}
{{- if $kaBaseOAuth2.enabled }}
{{- if not $kaBaseOAuth2.tokenURL }}
{{- fail (printf "global.llmProfiles[%q].oauth2.tokenURL is required when oauth2.enabled=true" $kaV.llmProfileRef) }}
{{- end }}
{{- if not $kaBaseOAuth2.credentialsSecretRef }}
{{- fail (printf "global.llmProfiles[%q].oauth2.credentialsSecretRef is required when oauth2.enabled=true (Secret must contain keys: client-id, client-secret)" $kaV.llmProfileRef) }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubernaut-agent-llm-runtime
  namespace: {{ .Release.Namespace }}
  labels:
    app: kubernaut-agent
    {{- include "kubernaut.labels" . | nindent 4 }}
data:
  llm-runtime.yaml: |
    {{- include "kubernaut.kubernautAgent.llmRuntimeYAML" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernaut-agent
  namespace: {{ .Release.Namespace }}
  labels:
    app: kubernaut-agent
    {{- include "kubernaut.labels" . | nindent 4 }}
spec:
  replicas: {{ $kaV.replicas }}
  # PR #1790 round-13 RCA: see gateway.yaml's progressDeadlineSeconds comment
  # -- K8s's Deployment controller enforces this SERVER-SIDE (default 600s)
  # independently of `kubectl rollout status --timeout`, which is why round-12's
  # 480s->720s CLI timeout bump had no effect. 750s makes that 720s CLI
  # timeout the real ceiling again.
  progressDeadlineSeconds: 750
  selector:
    matchLabels:
      app: kubernaut-agent
  template:
    metadata:
      labels:
        app: kubernaut-agent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
        checksum/config: {{ include "kubernaut.kubernautAgent.configYAML" . | sha256sum }}
        checksum/llm-runtime: {{ include "kubernaut.kubernautAgent.llmRuntimeYAML" . | sha256sum }}
    spec:
      serviceAccountName: kubernaut-agent-sa
      {{- include "kubernaut.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "kubernaut.podSecurityContext" .Values.kubernautAgent | nindent 8 }}
      {{- include "kubernaut.affinity" (dict "component" .Values.kubernautAgent "matchLabels" (dict "app" "kubernaut-agent")) | nindent 6 }}
      {{- include "kubernaut.scheduling" (dict "component" .Values.kubernautAgent "global" .Values.global) | nindent 6 }}
      containers:
        - name: kubernaut-agent
          image: {{ include "kubernaut.image" (dict "service" "kubernautagent" "root" $ "appVersion" .Chart.AppVersion) }}
          imagePullPolicy: {{ include "kubernaut.imagePullPolicy" $ }}
          securityContext:
            {{- include "kubernaut.containerSecurityContext" .Values.kubernautAgent | nindent 12 }}
          ports:
            - name: https
              containerPort: 8443
            - name: health
              containerPort: 8081
            - name: metrics
              containerPort: 9090
          env:
            - name: TLS_CA_FILE
              value: {{ include "kubernaut.interServiceTLS.caFile" . | quote }}
          args:
            - "-config"
            - "/etc/kubernaut-agent/config.yaml"
            - "-llm-runtime"
            - "/etc/kubernaut-agent/llm-runtime/llm-runtime.yaml"
          volumeMounts:
            - name: llm-runtime
              mountPath: /etc/kubernaut-agent/llm-runtime
              readOnly: true
            - name: config
              mountPath: /etc/kubernaut-agent
              readOnly: true
            - name: llm-credentials-file
              mountPath: /etc/kubernaut-agent/credentials
              readOnly: true
{{- if $kaBaseOAuth2.enabled }}
            - name: oauth2-credentials
              mountPath: /etc/kubernaut-agent/oauth2
              readOnly: true
{{- end }}
{{- if $kaFleetPreamble.oauth2.enabled }}
            - name: fleet-oauth2-credentials
              mountPath: "/etc/kubernaut-agent/{{ $kaFleetPreamble.oauth2.credentialsSecretRef }}"
              readOnly: true
{{- end }}
{{- range $kaPhaseMounts }}
            - name: phase-credentials-{{ .phase }}
              mountPath: /etc/kubernaut-agent/phase-credentials/{{ .phase }}
              readOnly: true
{{- end }}
{{- if $kaAlignmentNeedsMount }}
            - name: alignment-check-credentials
              mountPath: /etc/kubernaut-agent/alignment-check-credentials
              readOnly: true
{{- end }}
            {{- if include "kubernaut.agent.tlsEnabled" . }}
            - name: service-ca
              mountPath: {{ include "kubernaut.agent.tlsCaDir" . }}
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- end }}
            - name: tls-certs
              mountPath: {{ include "kubernaut.interServiceTLS.certDir" . }}
              readOnly: true
            {{- include "kubernaut.tlsCaVolumeMount" . | nindent 12 }}
            # BR-PLATFORM-005: short-TTL projected token, replacing the SA's
            # disabled default automount (see ServiceAccount above).
            - name: sa-token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml (.Values.kubernautAgent.resources | default dict) | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: kubernaut-agent-config
        - name: llm-runtime
          configMap:
            name: kubernaut-agent-llm-runtime
        - name: llm-credentials-file
          secret:
            secretName: {{ $kaProfile.credentialsSecretName }}
{{- if $kaBaseOAuth2.enabled }}
        - name: oauth2-credentials
          secret:
            secretName: {{ $kaBaseOAuth2.credentialsSecretRef }}
{{- end }}
{{- if $kaFleetPreamble.oauth2.enabled }}
        - name: fleet-oauth2-credentials
          secret:
            secretName: {{ $kaFleetPreamble.oauth2.credentialsSecretRef }}
{{- end }}
{{- range $kaPhaseMounts }}
        - name: phase-credentials-{{ .phase }}
          secret:
            secretName: {{ .profile.credentialsSecretName }}
{{- end }}
{{- if $kaAlignmentNeedsMount }}
        - name: alignment-check-credentials
          secret:
            secretName: {{ $kaAlignmentProfile.credentialsSecretName }}
{{- end }}
        {{- if include "kubernaut.agent.tlsEnabled" . }}
        {{/* BYO ConfigMap (Issue #848 v1.5): the chart no longer auto-creates this ConfigMap
             (it previously relied on an OCP-only service-ca auto-injection annotation, which
             never populated real CA data on non-OCP clusters). When monitoring.prometheus.tlsCaFile
             or monitoring.alertManager.tlsCaFile is set, pre-create a ConfigMap named
             kubernaut-agent-service-ca in this namespace containing the CA bundle. */}}
        - name: service-ca
          configMap:
            name: {{ include "kubernaut.agent.tlsCaConfigMapName" . }}
        - name: tmp
          emptyDir:
            sizeLimit: 1Mi
        {{- end }}
        - name: tls-certs
          secret:
            secretName: kubernautagent-tls
            optional: true
        {{- include "kubernaut.tlsCaVolume" . | nindent 8 }}
        # BR-PLATFORM-005: 1-hour TTL projected token replacing the default
        # (much longer-lived) automounted SA token for this high-risk component.
        #
        # #1677 hardening fix: audience MUST match the cluster's actual
        # --service-account-issuer (which --api-audiences defaults to when
        # unset -- see kube-apiserver docs), not an assumed literal. kubeadm
        # (and therefore Kind, which every Helm smoke test in CI runs
        # against) defaults --service-account-issuer to
        # "https://kubernetes.default.svc.cluster.local" (WITH the
        # .cluster.local suffix). The previous value here
        # ("https://kubernetes.default.svc", no suffix) didn't match that
        # audience, so the apiserver's ServiceAccount token authenticator
        # rejected every token this Deployment presented with 401
        # Unauthorized -- for every K8s API call KA itself makes (discovery,
        # the #1677 workflow catalog informer's List/Watch, etc.), 100% of
        # the time, on every retry, with no window in which it ever
        # succeeded. This was masked pre-#1677 because KA never needed to
        # make its own K8s API calls during startup (workflow discovery
        # went through DataStorage's REST API instead); the #1677 informer
        # cache was the first code path to depend on it, and readinessHandler
        # gating /readyz on wfCatalog.Ready() is what surfaced it as a hard
        # CI failure (Helm Smoke Tests, both tls=cert-manager and tls=hook
        # variants) instead of a silent no-op. RCA: PR #1718 CI run
        # 30081410278 must-gather (helm-smoke-must-gather-cert-manager /
        # -hook), confirmed reproducible with Restart Count: 0 (i.e. not a
        # startup-timing race) -- the token is rejected identically on every
        # single attempt for the pod's entire lifetime.
        - name: sa-token
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
                  audience: https://kubernetes.default.svc.cluster.local
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
---
apiVersion: v1
kind: Service
metadata:
  name: kubernaut-agent
  namespace: {{ .Release.Namespace }}
  labels:
    app: kubernaut-agent
    {{- include "kubernaut.labels" . | nindent 4 }}
spec:
  type: {{ $kaV.service.type }}
  ports:
    - name: https
      port: 8443
      targetPort: 8443
      {{- if and (eq $kaV.service.type "NodePort") $kaV.service.nodePort }}
      nodePort: {{ $kaV.service.nodePort }}
      {{- end }}
    - name: health
      port: 8081
      targetPort: 8081
    - name: metrics
      port: 9090
      targetPort: 9090
  selector:
    app: kubernaut-agent
