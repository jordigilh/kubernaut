suite: "DD-PLATFORM-006 Decision Area 6: security-relevant toggles are unconditional (no enabled gate)"
templates:
  - templates/datastorage/datastorage.yaml
  - templates/apifrontend/apifrontend.yaml
  - templates/apifrontend/networkpolicy.yaml
  - templates/infrastructure/networkpolicy-valkey.yaml
set:
  postgresql:
    auth:
      existingSecret: dummy
  valkey:
    existingSecret: dummy
  global:
    llmProfiles:
      primary:
        provider: openai
        model: gpt-4
        credentialsSecretName: llm-credentials-primary
  kubernautAgent:
    llmProfileRef: primary
  apifrontend:
    config:
      auth:
        issuerURL: "https://sso.example.com/realms/kubernaut"
tests:
  # ── datastorage.config.server.rateLimit: always enabled, no schema toggle ─
  - it: "DataStorage rateLimit is always enabled, with no --set override needed"
    template: templates/datastorage/datastorage.yaml
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data['config.yaml']
          pattern: 'rateLimit:\s*\n\s*enabled: true'

  - it: "schema rejects datastorage.config.server.rateLimit.enabled -- the gate is fully removed, not just defaulted true"
    template: templates/datastorage/datastorage.yaml
    set:
      datastorage:
        config:
          server:
            rateLimit:
              enabled: false
    asserts:
      - failedTemplate: {}

  # ── datastorage.config.redis.tls: always enabled, no schema toggle ────────
  - it: "DataStorage redis.tls is always enabled, with no --set override needed"
    template: templates/datastorage/datastorage.yaml
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data['config.yaml']
          pattern: 'redis:[\s\S]{0,200}tls:\s*\n\s*enabled: true'
      - matchRegex:
          path: data['config.yaml']
          pattern: 'caFile: "/etc/tls-ca/ca\.crt"'

  - it: "schema rejects datastorage.config.redis.tls.enabled -- the gate is fully removed"
    template: templates/datastorage/datastorage.yaml
    set:
      datastorage:
        config:
          redis:
            tls:
              enabled: false
    asserts:
      - failedTemplate: {}

  # ── datastorage.config.auditHashKey: always enabled, no schema toggle ─────
  - it: "DataStorage always renders the audit hash-chain block, with no --set override needed"
    template: templates/datastorage/datastorage.yaml
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data['config.yaml']
          pattern: 'audit:\s*\n\s*hashKeySecretsFile: "/etc/datastorage/secrets/audit-hmac-key\.yaml"'

  - it: "DataStorage Deployment always projects the audit-HMAC key secret"
    template: templates/datastorage/datastorage.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.volumes[1].projected.sources
          content:
            secret:
              name: datastorage-audit-hmac-key
              items:
                - key: audit-hmac-key.yaml
                  path: audit-hmac-key.yaml

  - it: "schema rejects datastorage.config.auditHashKey.enabled -- the gate is fully removed"
    template: templates/datastorage/datastorage.yaml
    set:
      datastorage:
        config:
          auditHashKey:
            enabled: false
    asserts:
      - failedTemplate: {}

  # ── apifrontend.config.auth.replayCache: always enabled, no schema toggle ─
  - it: "APIFrontend always renders the replayCache block, with no --set override needed"
    template: templates/apifrontend/apifrontend.yaml
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data['config.yaml']
          pattern: 'replayCache:\s*\n\s*backend: redis'

  - it: "APIFrontend replayCache.tls is always enabled too -- Valkey is TLS-only (DA8), so a mandatory replayCache with plaintext TLS could never connect"
    template: templates/apifrontend/apifrontend.yaml
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data['config.yaml']
          pattern: 'replayCache:[\s\S]{0,800}tls:\s*\n\s*enabled: true'

  - it: "APIFrontend Deployment always mounts the valkey-secrets volume"
    template: templates/apifrontend/apifrontend.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: valkey-secrets
            mountPath: /etc/apifrontend/valkey
            readOnly: true

  - it: "APIFrontend NetworkPolicy always allows egress to Valkey"
    template: templates/apifrontend/networkpolicy.yaml
    asserts:
      - equal:
          path: spec.egress[3].ports[0].port
          value: 6380

  - it: "Valkey's own NetworkPolicy always allows ingress from apifrontend"
    template: templates/infrastructure/networkpolicy-valkey.yaml
    asserts:
      - contains:
          path: spec.ingress[0].from
          content:
            podSelector:
              matchLabels:
                app: apifrontend

  - it: "schema rejects apifrontend.config.auth.replayCache.enabled -- the gate is fully removed"
    template: templates/apifrontend/apifrontend.yaml
    set:
      apifrontend:
        config:
          auth:
            replayCache:
              enabled: false
    asserts:
      - failedTemplate: {}

  - it: "schema rejects apifrontend.config.auth.replayCache.tls.enabled -- the gate is fully removed"
    template: templates/apifrontend/apifrontend.yaml
    set:
      apifrontend:
        config:
          auth:
            replayCache:
              tls:
                enabled: false
    asserts:
      - failedTemplate: {}
