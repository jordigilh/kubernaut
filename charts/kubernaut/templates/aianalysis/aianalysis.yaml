{{- if not .Values.aianalysis.policies.existingConfigMap }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aianalysis-policies
  namespace: {{ .Release.Namespace }}
  labels:
    app: aianalysis
    {{- include "kubernaut.labels" . | nindent 4 }}
data:
  approval.rego: |
{{ .Values.aianalysis.policies.content | indent 4 }}
{{- end }}
{{- define "kubernaut.aianalysis.configYAML" -}}
{{- $v := include "kubernaut.mergedValues" (dict "root" . "service" "aianalysis") | fromYaml -}}
logging:
  level: {{ $v.logging.level | quote }}
controller:
  metricsAddr: ":9090"
  healthProbeAddr: ":8081"
  leaderElection: false
  leaderElectionId: "aianalysis.kubernaut.ai"
datastorage:
  url: "{{ include "kubernaut.datastorage.url" . }}"
  healthUrl: "{{ include "kubernaut.datastorage.healthUrl" . }}"
  timeout: "10s"
  buffer:
    bufferSize: 20000
    batchSize: 1000
    flushInterval: "1s"
    maxRetries: 3
rego:
  policyPath: "/etc/aianalysis/policies/approval.rego"
  {{- if .Values.aianalysis.rego.confidenceThreshold }}
  confidenceThreshold: {{ .Values.aianalysis.rego.confidenceThreshold }}
  {{- end }}
  {{- if .Values.aianalysis.rego.lowConfidenceFloor }}
  lowConfidenceFloor: {{ .Values.aianalysis.rego.lowConfidenceFloor }}
  {{- end }}
# BR-PLATFORM-012, Issue #2275: secure-by-default pprof toggle.
debug:
  pprofEnabled: {{ $v.debug.pprofEnabled }}
# Issue #2276: ambient CA trust is now sourced from resolved config
# (bootstrapAmbientCATrust, called before any outbound TLS handshake)
# instead of a static Pod-spec env: TLS_CA_FILE entry -- eliminating the
# class of bug where two independently chart-rendered components declare
# the same env var name and the Pod spec is rejected.
tlsCaFile: {{ include "kubernaut.interServiceTLS.caFile" . | quote }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aianalysis-config
  namespace: {{ .Release.Namespace }}
  labels:
    app: aianalysis
    {{- include "kubernaut.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- include "kubernaut.aianalysis.configYAML" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aianalysis-controller
  namespace: {{ .Release.Namespace }}
  labels:
    app: aianalysis-controller
    {{- include "kubernaut.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aianalysis-controller
  labels:
    {{- include "kubernaut.labels" . | nindent 4 }}
rules:
  - apiGroups: ["kubernaut.ai"]
    resources: ["aianalyses"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["kubernaut.ai"]
    resources: ["aianalyses/status"]
    verbs: ["get", "update", "patch"]
  # #2214 / DD-AA-KA-001 Amendment: AA no longer interacts with
  # InvestigationSession at all (RBAC narrowing) -- AF's
  # AgentSessionTerminalCloseReconciler now owns IS terminal-phase closure
  # exclusively, driven by watching AgentSession (see below).
  # AgentSessionCreator.GetOrCreate (DD-AA-KA-001, BR-AA-KA-065.1): "create"
  # for the initial dispatch write; "get"/"list"/"watch" because AgentSession
  # is namespace-scoped in this controller's mgr.GetCache() ByObject config
  # (cmd/aianalysis/main.go), so Get() reads go through the informer cache,
  # not a direct API call. "delete" (BR-AI-009, DD-AA-KA-001 amendment) is for
  # AgentSessionCreator.DeleteForRetry, called from
  # InvestigatingHandler.retryCapacityExceeded to discard a stale
  # Failed+CapacityExceeded AgentSession so the retry attempt gets a fresh
  # one; also used by DeleteForCascadeCancel (#2214) on external
  # ParentCancelled. "update" (#2214 finalizer fix, CI run 32525130330
  # "E2E (aianalysis)": DeleteForRetry strips TerminalCloseFinalizer itself
  # before deleting, which needs Update, not just Delete -- missed when the
  # finalizer was introduced). No "agentsessions/status" grant -- AA never
  # writes Status, only KA does (BR-AA-KA-065.9).
  - apiGroups: ["kubernaut.ai"]
    resources: ["agentsessions"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # controller-runtime leader election requires lease RBAC (#687)
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
# DD-AA-KA-001: AA no longer calls KA's HTTP endpoint (retired in favor of the
# AgentSession CRD dispatch above), so AA no longer binds to this ClusterRole.
# It is defined here (rather than in apifrontend.yaml) for historical reasons
# but is now solely consumed by APIFrontend's binding to KA's surviving
# /api/v1/mcp endpoint (DD-AUTH-MCP-001) -- see
# charts/kubernaut/templates/apifrontend/apifrontend.yaml's RoleBinding.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubernaut-agent-client
  labels:
    {{- include "kubernaut.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: ["kubernaut-agent"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aianalysis-controller
  labels:
    {{- include "kubernaut.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aianalysis-controller
subjects:
  - kind: ServiceAccount
    name: aianalysis-controller
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aianalysis-controller-datastorage-access
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kubernaut.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: data-storage-client
subjects:
  - kind: ServiceAccount
    name: aianalysis-controller
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aianalysis-controller
  namespace: {{ .Release.Namespace }}
  labels:
    app: aianalysis-controller
    {{- include "kubernaut.labels" . | nindent 4 }}
spec:
  {{- $v := include "kubernaut.mergedValues" (dict "root" $ "service" "aianalysis") | fromYaml }}
  replicas: {{ $v.replicas }}
  selector:
    matchLabels:
      app: aianalysis-controller
  template:
    metadata:
      labels:
        app: aianalysis-controller
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
        checksum/config: {{ include "kubernaut.aianalysis.configYAML" . | sha256sum }}
    spec:
      serviceAccountName: aianalysis-controller
      {{- include "kubernaut.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "kubernaut.podSecurityContext" .Values.aianalysis | nindent 8 }}
      {{- include "kubernaut.affinity" (dict "component" .Values.aianalysis "matchLabels" (dict "app" "aianalysis-controller")) | nindent 6 }}
      {{- include "kubernaut.scheduling" (dict "component" .Values.aianalysis "global" .Values.global) | nindent 6 }}
      containers:
        - name: aianalysis
          image: {{ include "kubernaut.image" (dict "service" "aianalysis" "root" $ "appVersion" .Chart.AppVersion) }}
          imagePullPolicy: {{ include "kubernaut.imagePullPolicy" $ }}
          securityContext:
            {{- include "kubernaut.containerSecurityContext" .Values.aianalysis | nindent 12 }}
          env:
            - name: CONFIG_PATH
              value: /etc/aianalysis/config.yaml
          args:
            - "-config"
            - "$(CONFIG_PATH)"
          ports:
            - containerPort: 8080
            - containerPort: 9090
            - containerPort: 8081
            {{- /* BR-PLATFORM-012, Issue #2275: ctrl.Options.PprofBindAddress
            (internal/config.PprofBindAddress) only starts a listener when
            debug.pprofEnabled is true -- declare the container port to match. */}}
            {{- if $v.debug.pprofEnabled }}
            - name: pprof
              containerPort: 6060
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              # #1985 (BR-AUDIT-005 v2.0): was /healthz (liveness), a bug that
              # silently defeated this service's DataStorage readiness gate --
              # /healthz.AlwaysReadyLiveness always returns 200 regardless of
              # dsGate's state, so AIAnalysis's pod reported Ready even while
              # its own readiness gate logs showed DataStorage permanently
              # unreachable (confirmed via CI must-gather: every other
              # service's readinessProbe already correctly targets /readyz).
              path: /readyz
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/aianalysis
              readOnly: true
            - name: rego-policies
              mountPath: /etc/aianalysis/policies
              readOnly: true
            {{- include "kubernaut.tlsCaVolumeMount" . | nindent 12 }}
            {{- include "kubernaut.tmpVolumeMount" . | nindent 12 }}
          resources:
            {{- toYaml .Values.aianalysis.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: aianalysis-config
        - name: rego-policies
          configMap:
            name: {{ .Values.aianalysis.policies.existingConfigMap | default "aianalysis-policies" }}
        {{- include "kubernaut.tlsCaVolume" . | nindent 8 }}
        {{- include "kubernaut.tmpVolume" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: aianalysis-controller
  namespace: {{ .Release.Namespace }}
  labels:
    app: aianalysis-controller
    {{- include "kubernaut.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: aianalysis-controller
  ports:
    - name: api
      port: 8080
      targetPort: 8080
    - name: metrics
      port: 9090
      targetPort: 9090
    - name: health
      port: 8081
      targetPort: 8081
