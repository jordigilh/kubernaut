name: "[SPIKE] SLSA3 isolation validation (throwaway - do not merge)"

# Validates the core assumption behind #1109's revised approach: that moving
# an actions/attest-build-provenance call from an inline step into a
# same-repo workflow_call reusable workflow actually changes the recorded
# signer identity (proving isolation), without needing to run the full
# 14-service release.yml pipeline or push a real version tag.
#
# Builds one throwaway image, pushed under two tags, and attests each one a
# different way:
#   - "control"  : attested inline in THIS file (mimics today's L2 pattern)
#   - "isolated" : attested via a call to ./slsa-provenance.yml (proposed L3)
#
# Then verifies with `gh attestation verify --signer-workflow` that each
# image's attestation is signed by the expected workflow file, and NOT by
# the other one.
#
# Triggers on push to its own spike branch only (workflow_dispatch requires
# the workflow file to already exist on the default branch to be dispatchable
# via API/CLI, which defeats the point of a throwaway feature-branch spike).
# Not part of the real release pipeline. Delete this file once validated.

on:
  push:
    branches: ['spike/1109-slsa3-provenance']

permissions:
  contents: read

env:
  IMAGE_REGISTRY: quay.io/kubernaut-ai
  IMAGE_NAME: slsa3-spike

jobs:
  build:
    name: Build + push spike image (2 tags)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      digest_control: ${{ steps.digest.outputs.control }}
      digest_isolated: ${{ steps.digest.outputs.isolated }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Login to Quay.io
        run: |
          podman login -u "${{ secrets.QUAY_ROBOT_USERNAME }}" \
                       -p "${{ secrets.QUAY_ROBOT_TOKEN }}" \
                       quay.io

      - name: Build & push spike image (both tags)
        # NOTE: content must differ between the two images (tag name baked
        # into the file), not just the tag -- `podman tag` on identical
        # content produces the SAME digest, which would make both tags
        # resolve to one shared attestation set and defeat the comparison.
        run: |
          RUNID="${{ github.run_id }}"
          cat > Containerfile.spike <<'DOCKERFILE'
          FROM scratch
          COPY spike.txt /spike.txt
          DOCKERFILE

          echo "slsa3 isolation spike run=${RUNID} variant=control $(date -u '+%Y-%m-%dT%H:%M:%SZ')" > spike.txt
          podman build -f Containerfile.spike -t "${IMAGE_REGISTRY}/${IMAGE_NAME}:${RUNID}-control" .
          podman push "${IMAGE_REGISTRY}/${IMAGE_NAME}:${RUNID}-control"

          echo "slsa3 isolation spike run=${RUNID} variant=isolated $(date -u '+%Y-%m-%dT%H:%M:%SZ')" > spike.txt
          podman build -f Containerfile.spike -t "${IMAGE_REGISTRY}/${IMAGE_NAME}:${RUNID}-isolated" .
          podman push "${IMAGE_REGISTRY}/${IMAGE_NAME}:${RUNID}-isolated"

      - name: Resolve digests
        id: digest
        run: |
          RUNID="${{ github.run_id }}"
          CONTROL=$(skopeo inspect --format '{{.Digest}}' "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${RUNID}-control")
          ISOLATED=$(skopeo inspect --format '{{.Digest}}' "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${RUNID}-isolated")
          echo "control=${CONTROL}" >> "$GITHUB_OUTPUT"
          echo "isolated=${ISOLATED}" >> "$GITHUB_OUTPUT"
          echo "control digest:  ${CONTROL}"
          echo "isolated digest: ${ISOLATED}"

  attest-control-inline:
    name: "Control: inline attest (mimics today's release.yml L2 pattern)"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Login to Quay.io (Cosign)
        run: |
          cosign login -u "${{ secrets.QUAY_ROBOT_USERNAME }}" \
                       -p "${{ secrets.QUAY_ROBOT_TOKEN }}" \
                       quay.io

      - name: SLSA build provenance attestation (inline, control)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-name: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ needs.build.outputs.digest_control }}
          push-to-registry: true

  attest-isolated-via-reusable-workflow:
    name: "Proposed: isolated attest via workflow_call"
    needs: build
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/slsa-provenance.yml
    with:
      service: slsa3-spike
      image: quay.io/kubernaut-ai/slsa3-spike
      digest: ${{ needs.build.outputs.digest_isolated }}
    secrets: inherit

  verify:
    name: Compare builder identities
    needs: [attest-control-inline, attest-isolated-via-reusable-workflow]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Login to Quay.io (for OCI attestation fetch)
        # `gh attestation verify oci://...` fetches via go-containerregistry's
        # default keychain (~/.docker/config.json), not podman's own auth
        # file location -- `podman login` alone left it unable to
        # authenticate ("remote registry authorization failed"). `cosign
        # login` writes to the same Docker-config location, matching the
        # pattern already used before actions/attest-build-provenance in
        # slsa-provenance.yml.
        run: |
          cosign login -u "${{ secrets.QUAY_ROBOT_USERNAME }}" \
                       -p "${{ secrets.QUAY_ROBOT_TOKEN }}" \
                       quay.io

      - name: Verify identities and report PASS/FAIL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUNID="${{ github.run_id }}"
          CONTROL_IMG="oci://${IMAGE_REGISTRY}/${IMAGE_NAME}:${RUNID}-control"
          ISOLATED_IMG="oci://${IMAGE_REGISTRY}/${IMAGE_NAME}:${RUNID}-isolated"
          CONTROL_SIGNER="jordigilh/kubernaut/.github/workflows/_spike_slsa3.yml"
          ISOLATED_SIGNER="jordigilh/kubernaut/.github/workflows/slsa-provenance.yml"

          check() {
            local label="$1" image="$2" signer="$3" expect="$4"
            if gh attestation verify "${image}" --owner jordigilh --signer-workflow "${signer}" >/tmp/out_$$.log 2>&1; then
              result="PASS"
            else
              result="FAIL"
            fi
            echo "${label} (expect ${expect}): verify --signer-workflow ${signer} -> ${result}"
            cat /tmp/out_$$.log
            rm -f /tmp/out_$$.log
            if [ "$result" != "$expect" ]; then
              echo "::error::${label} did not match expectation (expected ${expect}, got ${result})"
              echo "MISMATCH" >> /tmp/spike_result
            fi
          }

          echo "=== CONTROL image: attested inline in _spike_slsa3.yml ==="
          check "control vs its own signer"     "$CONTROL_IMG"  "$CONTROL_SIGNER"  "PASS"
          check "control vs isolated's signer"  "$CONTROL_IMG"  "$ISOLATED_SIGNER" "FAIL"

          echo ""
          echo "=== ISOLATED image: attested via workflow_call to slsa-provenance.yml ==="
          check "isolated vs its own signer"    "$ISOLATED_IMG" "$ISOLATED_SIGNER" "PASS"
          check "isolated vs control's signer"  "$ISOLATED_IMG" "$CONTROL_SIGNER"  "FAIL"

          echo ""
          if [ -f /tmp/spike_result ]; then
            echo "SPIKE RESULT: MISMATCH -- isolation hypothesis NOT confirmed"
            exit 1
          else
            echo "SPIKE RESULT: CONFIRMED -- workflow_call isolates the attestation signer identity as expected"
          fi

  cleanup:
    name: Delete throwaway spike images from Quay
    needs: verify
    if: always() && needs.verify.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Login to Quay.io
        run: |
          podman login -u "${{ secrets.QUAY_ROBOT_USERNAME }}" \
                       -p "${{ secrets.QUAY_ROBOT_TOKEN }}" \
                       quay.io

      - name: Delete every tag under the slsa3-spike repo
        run: |
          for tag in $(skopeo list-tags "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}" | jq -r '.Tags[]'); do
            echo "Deleting ${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}..."
            skopeo delete "docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}" || \
              echo "::warning::Could not delete ${tag} (robot account may lack delete permission -- needs manual cleanup)"
          done
