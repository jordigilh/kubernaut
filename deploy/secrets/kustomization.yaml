apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Authority: DD-AUTH-008 (Secret Management Strategy)
# Purpose: Generate optional OAuth2-proxy cookie Secret fixtures for DataStorage
# and HolmesGPT API

namespace: kubernaut-system

secretGenerator:
  # DataStorage OAuth2-Proxy Cookie Secret
  # Authority: DD-AUTH-007 (OAuth2-Proxy Migration), DD-AUTH-004 (DataStorage OAuth)
  # The source file is administrator-created and ignored by Git. Kustomize does
  # not execute shell substitution in `literals`.
  - name: data-storage-oauth-proxy-secret
    files:
      - cookie-secret=local/data-storage-cookie-secret
    options:
      # Disable name suffix hash to keep the stable Secret name used by fixtures.
      disableNameSuffixHash: true
    type: Opaque

  # HolmesGPT API OAuth2-Proxy Cookie Secret
  # Authority: DD-AUTH-007 (OAuth2-Proxy Migration), DD-AUTH-006 (HAPI OAuth)
  - name: kubernaut-agent-oauth-proxy-secret
    files:
      - cookie-secret=local/kubernaut-agent-cookie-secret
    options:
      disableNameSuffixHash: true
    type: Opaque

# ========================================
# USAGE
# ========================================
#
# Prepare local files and deploy optional fixtures (see README):
#   umask 077
#   openssl rand -base64 32 | tr -d '\n' > deploy/secrets/local/data-storage-cookie-secret
#   openssl rand -base64 32 | tr -d '\n' > deploy/secrets/local/kubernaut-agent-cookie-secret
#   kubectl apply -k deploy/secrets/
#
# Verify secrets:
#   kubectl get secrets -n kubernaut-system | grep oauth-proxy
#
# View secret (base64 encoded):
#   kubectl get secret data-storage-oauth-proxy-secret -n kubernaut-system -o yaml
#
# Decode secret value:
#   kubectl get secret data-storage-oauth-proxy-secret -n kubernaut-system \
#     -o jsonpath='{.data.cookie-secret}' | base64 -d
#
# ========================================
# SECURITY NOTES
# ========================================
#
# 1. Cookie Secret Requirements:
#    - MUST be 32 bytes (base64 encoded = ~44 characters)
#    - MUST be randomly generated (NOT hardcoded)
#    - MUST be kept confidential
#
# 2. Secret Lifecycle:
#    - Generated: By the administrator before `kubectl apply -k`
#    - Stored: Kubernetes Secret (etcd, base64 encoded)
#    - Accessed: Only by workloads explicitly configured to reference the Secret
#    - Rotated: Manual deletion + redeployment
#
# 3. Production Considerations:
#    - Use deploy/secrets/production/ for file-based secrets
#    - Secrets should be generated once, stored securely
#    - Consider External Secrets Operator for advanced scenarios
#
# ========================================
# INTEGRATION WITH THE OPERATOR
# ========================================
#
# The application Helm chart is retired. These are optional administrator/test
# Secret fixtures; use them only when the current Kubernaut CR explicitly
# references them. Install the operator bootstrap and apply the Kubernaut CR per
# the operator installation guide.
#
# Deployment Order:
#   1. Install the operator bootstrap chart in kubernaut-operator-system.
#   2. Create kubernaut-system for the application operands and Kubernaut CR.
#   3. Create the ignored local/* files and apply these fixtures if referenced.
#   4. Apply the user-owned Kubernaut CR.
#
# Authority: DD-AUTH-008 (Separation of Concerns)
# ========================================
