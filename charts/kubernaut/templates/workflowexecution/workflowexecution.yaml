{{/*
BR-FLEET-054 / ADR-068 Phase 3 gap: WE is the only fleet-integration-capable
service that calls MCP *write* tools (resources_create_or_update/
resources_delete, pkg/workflowexecution/executor/client_factory.go) instead
of the read-only resources_get/resources_list every other service uses --
so, unlike gateway/remediationorchestrator/apifrontend/effectivenessmonitor/
signalprocessing/fleetmetadatacache, its oauth2.credentialsSecretRef does
NOT fall back to global.fleet.oauth2.credentialsSecretRef (least privilege,
AC-6). Issue #1984 Phase D: the tokenURL-required-when-enabled guard and this
dedicated non-fallback-able credentialsSecretRef requirement both moved to
values.schema.json if/then blocks gated on global.fleet.mcpGatewayEndpoint
being set (BR-PLATFORM-010).
*/}}
{{- $weFleetCredsRef := .Values.workflowexecution.fleet.oauth2.credentialsSecretRef }}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "kubernaut.workflowNamespace" . }}
  labels:
    {{- include "kubernaut.labels" . | nindent 4 }}
    # BR-WE-018: Pod Security Admission backstop. Spawned Job/PipelineRun pods are
    # already hardened to "restricted" in code (pkg/workflowexecution/executor); this
    # label provides an independent, API-server-enforced guarantee in case that code
    # ever regresses. Not configurable -- see BR-WE-018 for rationale.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workflowexecution-controller
  namespace: {{ .Release.Namespace }}
  labels:
    app: workflowexecution-controller
    {{- include "kubernaut.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: workflowexecution-controller
  labels:
    {{- include "kubernaut.labels" . | nindent 4 }}
rules:
  - apiGroups: ["kubernaut.ai"]
    resources: ["workflowexecutions"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["kubernaut.ai"]
    resources: ["workflowexecutions/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["kubernaut.ai"]
    resources: ["workflowexecutions/finalizers"]
    verbs: ["update"]
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["tekton.dev"]
    resources: ["taskruns"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # BR-WORKFLOW-008 (Issue #1481): "watch" is required even though the
  # reconciler only calls List() on Events (to enrich WFE failure messages
  # from FailedMount/CreateContainerConfigError Events) -- the manager's
  # cached client establishes an Informer for any type it reads, and that
  # Informer needs list+watch to sync, regardless of which verb application
  # code exercises directly.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "get", "list", "watch"]
  # Issue #637: TokenRequest API for per-workflow SA tokens (Ansible engine)
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # ── Istio (#373) ────────────────────────────────────────────────────────
  - apiGroups: ["security.istio.io"]
    resources: ["authorizationpolicies", "peerauthentications", "requestauthentications"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.istio.io"]
    resources: ["virtualservices", "destinationrules", "gateways", "serviceentries"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubernaut-workflow-runner
  labels:
    {{- include "kubernaut.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete", "watch"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "patch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "create", "update", "patch"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "create", "delete", "patch", "update"]
  # Issue #501: TokenRequest API for per-workflow SA tokens (Ansible executor)
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list"]
  - apiGroups: ["cert-manager.io"]
    resources: ["clusterissuers"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  - apiGroups: ["policy.linkerd.io"]
    resources: ["authorizationpolicies", "servers", "meshtlsauthentications"]
    verbs: ["get", "list", "delete"]
  - apiGroups: ["security.istio.io"]
    resources: ["authorizationpolicies", "peerauthentications", "requestauthentications"]
    verbs: ["get", "list", "delete"]
  - apiGroups: ["networking.istio.io"]
    resources: ["virtualservices", "destinationrules", "gateways", "serviceentries"]
    verbs: ["get", "list", "create", "update", "patch", "delete"]
  # ── Ansible playbook requirements (#551) ──────────────────────────────
  - apiGroups: ["kubernaut.ai"]
    resources: ["workflowexecutions"]
    verbs: ["get"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["endpoints"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: workflowexecution-controller
  labels:
    {{- include "kubernaut.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: workflowexecution-controller
subjects:
  - kind: ServiceAccount
    name: workflowexecution-controller
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: workflowexecution-config
  namespace: {{ .Release.Namespace }}
  labels:
    app: workflowexecution
    {{- include "kubernaut.labels" . | nindent 4 }}
data:
  workflowexecution.yaml: |
    {{- include "kubernaut.workflowexecution.configYAML" . | nindent 4 }}
{{- define "kubernaut.workflowexecution.configYAML" -}}
{{- $weFleetCredsRef := .Values.workflowexecution.fleet.oauth2.credentialsSecretRef -}}
{{- $v := include "kubernaut.mergedValues" (dict "root" . "service" "workflowexecution") | fromYaml -}}
logging:
  level: {{ $v.logging.level | quote }}
controller:
  metricsAddr: ":9090"
  healthProbeAddr: ":8081"
  leaderElection: false
  leaderElectionId: workflowexecution.kubernaut.ai
execution:
  namespace: {{ include "kubernaut.workflowNamespace" . }}
  cooldownPeriod: {{ $v.config.execution.cooldownPeriod }}
datastorage:
  url: "{{ include "kubernaut.datastorage.url" . }}"
  healthUrl: "{{ include "kubernaut.datastorage.healthUrl" . }}"
  timeout: 10s
  buffer:
    bufferSize: 10000
    batchSize: 50
    flushInterval: 100ms
    maxRetries: 3
{{- if .Values.workflowexecution.config.ansible }}
ansible:
  apiURL: {{ .Values.workflowexecution.config.ansible.apiURL | quote }}
  organizationID: {{ $v.config.ansible.organizationID }}
  {{- if .Values.workflowexecution.config.ansible.tokenSecretRef }}
  tokenSecretRef:
    name: {{ .Values.workflowexecution.config.ansible.tokenSecretRef.name | quote }}
    key: {{ $v.config.ansible.tokenSecretRef.key | quote }}
    {{- if .Values.workflowexecution.config.ansible.tokenSecretRef.namespace }}
    namespace: {{ .Values.workflowexecution.config.ansible.tokenSecretRef.namespace | quote }}
    {{- end }}
  {{- end }}
{{- end }}
{{- if .Values.global.fleet.enabled }}
fleet:
  endpoint: {{ .Values.global.fleet.mcpGatewayEndpoint | quote }}
  {{- if .Values.global.fleet.oauth2.enabled }}
  oauth2:
    enabled: true
    tokenURL: {{ .Values.global.fleet.oauth2.tokenURL | quote }}
    credentialsSecretRef: {{ $weFleetCredsRef | quote }}
    {{- if .Values.global.fleet.oauth2.scopes }}
    scopes:
      {{- range .Values.global.fleet.oauth2.scopes }}
      - {{ . | quote }}
      {{- end }}
    {{- end }}
    tlsCAFile: {{ .Values.global.fleet.oauth2.tlsCAFile | default (include "kubernaut.interServiceTLS.caFile" .) | quote }}
  {{- end }}
  {{- /* Issue #2262 Phase 2: WE has no per-service fleet.resilience override
  (unlike GW/RO/SP/EM/KA/AF/FMC) -- it reads global.fleet.* directly with no
  per-service fleet block at all (see file-top comment), so this reads
  global.fleet.resilience directly too, with no merge needed. Only rendered
  when the operator actually set it -- an unset field keeps
  mcpclient.DefaultResilienceConfig()'s pre-#2262 default unchanged. */}}
  {{- if .Values.global.fleet.resilience }}
  resilience:
    {{- .Values.global.fleet.resilience | toYaml | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflowexecution-controller
  namespace: {{ .Release.Namespace }}
  labels:
    app: workflowexecution-controller
    {{- include "kubernaut.labels" . | nindent 4 }}
spec:
  {{- $v := include "kubernaut.mergedValues" (dict "root" $ "service" "workflowexecution") | fromYaml }}
  replicas: {{ $v.replicas }}
  selector:
    matchLabels:
      app: workflowexecution-controller
  template:
    metadata:
      labels:
        app: workflowexecution-controller
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
        checksum/config: {{ include "kubernaut.workflowexecution.configYAML" . | sha256sum }}
    spec:
      serviceAccountName: workflowexecution-controller
      {{- include "kubernaut.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "kubernaut.podSecurityContext" .Values.workflowexecution | nindent 8 }}
      {{- include "kubernaut.affinity" (dict "component" .Values.workflowexecution "matchLabels" (dict "app" "workflowexecution-controller")) | nindent 6 }}
      {{- include "kubernaut.scheduling" (dict "component" .Values.workflowexecution "global" .Values.global) | nindent 6 }}
      {{- if and .Values.workflowexecution.config.ansible .Values.workflowexecution.config.ansible.caCertSecretRef }}
      # BR-PLATFORM-005 (Kubernaut Operator parity): combine the inter-service CA
      # with the AAP/AWX private CA into one bundle, since TLS_CA_FILE accepts a
      # single file. Gracefully skips the inter-service CA half when TLS is
      # disabled (inter-service-ca ConfigMap absent/empty).
      initContainers:
        - name: build-ca-bundle
          image: {{ (include "kubernaut.mergedValues" (dict "root" $ "service" "hooks") | fromYaml).tlsCerts.image }}
          imagePullPolicy: {{ include "kubernaut.imagePullPolicy" $ }}
          securityContext:
            {{- include "kubernaut.containerSecurityContext" .Values.workflowexecution | nindent 12 }}
          command: ["sh", "-c"]
          args:
            - |
              { [ -s /etc/tls-ca/ca.crt ] && cat /etc/tls-ca/ca.crt; cat /etc/aap-ca/aap-ca.crt; } > /etc/combined-ca/ca-bundle.crt
          volumeMounts:
            {{- include "kubernaut.tlsCaVolumeMount" . | nindent 12 }}
            - name: aap-ca
              mountPath: /etc/aap-ca
              readOnly: true
            - name: combined-ca
              mountPath: /etc/combined-ca
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      {{- end }}
      containers:
        - name: workflowexecution-controller
          image: {{ include "kubernaut.image" (dict "service" "workflowexecution" "root" $ "appVersion" .Chart.AppVersion) }}
          imagePullPolicy: {{ include "kubernaut.imagePullPolicy" $ }}
          securityContext:
            {{- include "kubernaut.containerSecurityContext" .Values.workflowexecution | nindent 12 }}
          args:
            - "--config=/etc/config/workflowexecution.yaml"
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          {{- /* DD-PLATFORM-008: WE connects to the fleet MCP Gateway (OAuth2
          token fetch + registry.ClusterRegistry) at boot, same shape as
          apifrontend/effectivenessmonitor -- can legitimately stall well
          past the liveness probe's budget under load. Confirmed via live
          debugging: WE's process was unresponsive to even a trivial,
          dependency-free healthz.Ping handler for 5+ seconds at a time
          during a multi-service restart under a CPU-constrained E2E
          cluster, causing a self-inflicted, non-self-resolving crash loop.
          See apifrontend.yaml's identical comment for further details. */}}
          {{- include "kubernaut.startupProbe" (dict "port" "health") | nindent 10 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          env:
            - name: TLS_CA_FILE
              {{- if and .Values.workflowexecution.config.ansible .Values.workflowexecution.config.ansible.caCertSecretRef }}
              value: "/etc/combined-ca/ca-bundle.crt"
              {{- else }}
              value: {{ include "kubernaut.interServiceTLS.caFile" . | quote }}
              {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/config
              readOnly: true
            {{- include "kubernaut.tlsCaVolumeMount" . | nindent 12 }}
            {{- if and .Values.workflowexecution.config.ansible .Values.workflowexecution.config.ansible.caCertSecretRef }}
            - name: combined-ca
              mountPath: /etc/combined-ca
              readOnly: true
            {{- end }}
            {{- if and .Values.global.fleet.enabled .Values.global.fleet.oauth2.enabled }}
            - name: oauth2-credentials
              mountPath: "/etc/workflowexecution/{{ $weFleetCredsRef }}"
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.workflowexecution.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: workflowexecution-config
        {{- include "kubernaut.tlsCaVolume" . | nindent 8 }}
        {{- if and .Values.workflowexecution.config.ansible .Values.workflowexecution.config.ansible.caCertSecretRef }}
        - name: aap-ca
          secret:
            secretName: {{ .Values.workflowexecution.config.ansible.caCertSecretRef.name }}
            items:
              - key: {{ $v.config.ansible.caCertSecretRef.key }}
                path: aap-ca.crt
        - name: combined-ca
          emptyDir:
            sizeLimit: 1Mi
        {{- end }}
        {{- if and .Values.global.fleet.enabled .Values.global.fleet.oauth2.enabled }}
        - name: oauth2-credentials
          secret:
            secretName: {{ $weFleetCredsRef }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: workflowexecution-controller-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    app: workflowexecution-controller
    {{- include "kubernaut.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
  selector:
    app: workflowexecution-controller
{{- if .Values.workflowexecution.config.ansible }}
---
# Issue #478: Namespace-scoped secret access for the AWX token.
# Least-privilege: only allows get on secrets in the release namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workflowexecution-awx-token-reader
  namespace: {{ .Release.Namespace }}
  labels:
    app: workflowexecution-controller
    {{- include "kubernaut.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workflowexecution-awx-token-reader
  namespace: {{ .Release.Namespace }}
  labels:
    app: workflowexecution-controller
    {{- include "kubernaut.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workflowexecution-awx-token-reader
subjects:
  - kind: ServiceAccount
    name: workflowexecution-controller
    namespace: {{ .Release.Namespace }}
---
# BR-WORKFLOW-008 (Issue #1481): the Ansible engine reads schema-declared
# Secret/ConfigMap dependencies from the execution namespace to build
# ephemeral AWX credentials and extra_vars (see AnsibleExecutor.Create in
# pkg/workflowexecution/executor/ansible.go). This is independent of the
# removed pre-flight DependencyValidator -- Kubernetes now validates
# dependency existence at runtime, but the Ansible engine still needs to
# read the *content* of declared Secrets/ConfigMaps to inject them. list+watch
# are required (not just get) because the manager's cached client establishes
# a namespace-scoped Informer for these types.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workflowexecution-dependency-reader
  namespace: {{ include "kubernaut.workflowNamespace" . }}
  labels:
    app: workflowexecution-controller
    {{- include "kubernaut.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workflowexecution-dependency-reader
  namespace: {{ include "kubernaut.workflowNamespace" . }}
  labels:
    app: workflowexecution-controller
    {{- include "kubernaut.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workflowexecution-dependency-reader
subjects:
  - kind: ServiceAccount
    name: workflowexecution-controller
    namespace: {{ .Release.Namespace }}
{{- end }}
