{{- include "kubernaut.monitoring.validate" . -}}
{{- /*
Issue #1984 Phase D: oauth2.tokenURL/credentialsSecretRef required-when-enabled
guards (and the ADR-068 gap of oauth2.enabled itself being optional) moved to
values.schema.json if/then blocks gated on global.fleet.mcpGatewayEndpoint
being set (BR-PLATFORM-010).
*/}}
{{- $effectivenessmonitorFleetPreamble := include "kubernaut.fleet.preamble" (dict "root" $ "fleet" .Values.effectivenessmonitor.fleet "oauth2" .Values.effectivenessmonitor.fleet.oauth2) | fromYaml }}
{{- /*
checksum/config (Issue #1737 gap) needs this content reachable from the
Deployment's pod template annotations, a separate `include` call site from
the ConfigMap below -- named templates don't inherit $-scoped variables from
their caller, so $effectivenessmonitorFleetPreamble must be recomputed here
rather than reused from the file-top declaration above.
*/}}
{{- define "kubernaut.effectivenessmonitor.configYAML" -}}
{{- $effectivenessmonitorFleetPreamble := include "kubernaut.fleet.preamble" (dict "root" . "fleet" .Values.effectivenessmonitor.fleet "oauth2" .Values.effectivenessmonitor.fleet.oauth2) | fromYaml -}}
{{- $v := include "kubernaut.mergedValues" (dict "root" . "service" "effectivenessmonitor") | fromYaml -}}
logging:
  level: {{ $v.logging.level | quote }}
assessment:
  stabilizationWindow: {{ $v.config.assessment.stabilizationWindow }}
  validityWindow: {{ $v.config.assessment.validityWindow }}
datastorage:
  url: {{ include "kubernaut.datastorage.url" . }}
  healthUrl: {{ include "kubernaut.datastorage.healthUrl" . }}
  timeout: 10s
  buffer:
    bufferSize: 100
    batchSize: 10
    flushInterval: 1s
    maxRetries: 3
controller:
  metricsAddr: ":9090"
  healthProbeAddr: ":8081"
  leaderElection: false
  leaderElectionId: "effectivenessmonitor.kubernaut.ai"
external:
  prometheusUrl: {{ include "kubernaut.monitoring.prometheus.url" . | default "" | quote }}
  prometheusEnabled: {{ if include "kubernaut.monitoring.prometheus.enabled" . }}true{{ else }}false{{ end }}
  alertManagerUrl: {{ include "kubernaut.monitoring.alertManager.url" . | default "" | quote }}
  alertManagerEnabled: {{ if include "kubernaut.monitoring.alertManager.enabled" . }}true{{ else }}false{{ end }}
  connectionTimeout: 10s
  {{- if include "kubernaut.monitoring.prometheus.tlsCaFile" . }}
  tlsCaFile: /etc/ssl/em/service-ca.crt
  {{- end }}
{{- if .Values.global.fleet.enabled }}
fleet:
  enabled: true
  mcpGatewayEndpoint: {{ $effectivenessmonitorFleetPreamble.config.mcpGatewayEndpoint | quote }}
  {{- if $effectivenessmonitorFleetPreamble.config.mcpGatewayType }}
  mcpGatewayType: {{ $effectivenessmonitorFleetPreamble.config.mcpGatewayType | quote }}
  {{- end }}
  tlsCAFile: {{ $effectivenessmonitorFleetPreamble.config.tlsCAFile | default (include "kubernaut.interServiceTLS.caFile" .) | quote }}
  {{- if $effectivenessmonitorFleetPreamble.oauth2.enabled }}
  oauth2:
    enabled: true
    tokenURL: {{ $effectivenessmonitorFleetPreamble.oauth2.tokenURL | quote }}
    credentialsSecretRef: {{ $effectivenessmonitorFleetPreamble.oauth2.credentialsSecretRef | quote }}
    {{- if $effectivenessmonitorFleetPreamble.oauth2.scopes }}
    scopes:
      {{- range $effectivenessmonitorFleetPreamble.oauth2.scopes }}
      - {{ . | quote }}
      {{- end }}
    {{- end }}
    tlsCAFile: {{ $effectivenessmonitorFleetPreamble.oauth2.tlsCAFile | default (include "kubernaut.interServiceTLS.caFile" .) | quote }}
  {{- end }}
  {{- /* Issue #2262 Phase 2: only render keys the operator actually set --
  an unset field keeps mcpclient.DefaultResilienceConfig()'s pre-#2262
  default unchanged (see mcpclient.ResilienceConfigFromFleet). */}}
  {{- if $effectivenessmonitorFleetPreamble.resilience }}
  resilience:
    {{- $effectivenessmonitorFleetPreamble.resilience | toYaml | nindent 4 }}
  {{- end }}
{{- end }}
# BR-PLATFORM-012, Issue #2275: secure-by-default pprof toggle.
debug:
  pprofEnabled: {{ $v.debug.pprofEnabled }}
{{- end }}
{{/* BYO ConfigMap (Issue #848 v1.5): the chart no longer auto-creates this ConfigMap (it
     previously relied on an OCP-only service-ca auto-injection annotation, which never
     populated real CA data on non-OCP clusters). Pre-create effectivenessmonitor-service-ca
     in this namespace with the CA bundle when monitoring.prometheus.tlsCaFile is set. */}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: effectivenessmonitor-config
  namespace: {{ .Release.Namespace }}
  labels:
    app: effectivenessmonitor
    {{- include "kubernaut.labels" . | nindent 4 }}
data:
  effectivenessmonitor.yaml: |
    {{- include "kubernaut.effectivenessmonitor.configYAML" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: effectivenessmonitor-controller
  namespace: {{ .Release.Namespace }}
  labels:
    app: effectivenessmonitor-controller
    {{- include "kubernaut.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: effectivenessmonitor-controller
  labels:
    {{- include "kubernaut.labels" . | nindent 4 }}
rules:
  - apiGroups: ["kubernaut.ai"]
    resources: ["effectivenessassessments"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["kubernaut.ai"]
    resources: ["effectivenessassessments/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["kubernaut.ai"]
    resources: ["remediationrequests"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "nodes", "services", "persistentvolumeclaims", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list"]
  # ── Istio (#373) ────────────────────────────────────────────────────────
  - apiGroups: ["security.istio.io"]
    resources: ["authorizationpolicies", "peerauthentications", "requestauthentications"]
    verbs: ["get", "list"]
  - apiGroups: ["networking.istio.io"]
    resources: ["virtualservices", "destinationrules", "gateways", "serviceentries"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # controller-runtime leader election requires lease RBAC (#687)
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  {{- /*
  #1686 (BR-RBAC-020): the mcpserverregistrations rule is only granted
  cluster-wide here when no namespace scope is configured. When
  effectivenessmonitor.fleet.namespace is set, the identical rule is
  granted instead via a namespace-scoped Role/RoleBinding below, matching
  what the ClusterRegistry informer actually watches (least privilege).
  */}}
  {{- if and (eq $effectivenessmonitorFleetPreamble.config.mcpGatewayType "kuadrant") (not .Values.effectivenessmonitor.fleet.namespace) }}
  # BR-FLEET-054: EM's ClusterRegistry watches MCPServerRegistration CRs
  # directly via a dynamic informer when the Kuadrant MCP Gateway is used.
  - apiGroups: ["mcp.kuadrant.io"]
    resources: ["mcpserverregistrations"]
    verbs: ["get", "list", "watch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: effectivenessmonitor-controller
  labels:
    {{- include "kubernaut.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: effectivenessmonitor-controller
subjects:
  - kind: ServiceAccount
    name: effectivenessmonitor-controller
    namespace: {{ .Release.Namespace }}
{{- if and (eq $effectivenessmonitorFleetPreamble.config.mcpGatewayType "kuadrant") .Values.effectivenessmonitor.fleet.namespace }}
---
# #1686 (BR-RBAC-020): namespace-scoped equivalent of the ClusterRole rule
# above, granted instead of it when effectivenessmonitor.fleet.namespace is set.
{{ include "kubernaut.fleet.registryNsRBAC" (dict "name" "effectivenessmonitor" "serviceAccount" "effectivenessmonitor-controller" "namespace" .Values.effectivenessmonitor.fleet.namespace "appLabels" "app: effectivenessmonitor-controller" "mcpServerRegistrations" true "Release" .Release "labels" (include "kubernaut.labels" .)) }}
{{- end }}
---
# Issue #545: Bind to built-in view ClusterRole for broad read access to CRDs
# (cert-manager, Istio, etc.) needed for post-remediation hash capture (DD-EM-002).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: effectivenessmonitor-view
  labels:
    {{- include "kubernaut.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: effectivenessmonitor-controller
    namespace: {{ .Release.Namespace }}
---
# Issue #1069 (DD-GATEWAY-018): operator-supplied ClusterRole references for
# ecosystems the `view` binding above cannot cover via aggregation (e.g. OLM
# Subscription, ArgoCD Application, which manages its own RBAC internally).
# global.additionalClusterRoles covers the common case (same grant
# across Gateway/EM/KA); merged here with EM's own list (deduplicated) for
# the asymmetric case.
{{- include "kubernaut.additionalClusterRoleBindings" (dict "prefix" "effectivenessmonitor" "serviceAccount" "effectivenessmonitor-controller" "names" (concat .Values.global.additionalClusterRoles .Values.effectivenessmonitor.additionalClusterRoles | uniq) "Release" .Release "labels" (include "kubernaut.labels" .)) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: effectivenessmonitor-controller
  namespace: {{ .Release.Namespace }}
  labels:
    app: effectivenessmonitor-controller
    {{- include "kubernaut.labels" . | nindent 4 }}
spec:
  {{- $v := include "kubernaut.mergedValues" (dict "root" $ "service" "effectivenessmonitor") | fromYaml }}
  replicas: {{ $v.replicas }}
  selector:
    matchLabels:
      app: effectivenessmonitor-controller
  template:
    metadata:
      labels:
        app: effectivenessmonitor-controller
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
        checksum/config: {{ include "kubernaut.effectivenessmonitor.configYAML" . | sha256sum }}
    spec:
      serviceAccountName: effectivenessmonitor-controller
      {{- include "kubernaut.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "kubernaut.podSecurityContext" .Values.effectivenessmonitor | nindent 8 }}
      {{- include "kubernaut.affinity" (dict "component" .Values.effectivenessmonitor "matchLabels" (dict "app" "effectivenessmonitor-controller")) | nindent 6 }}
      {{- include "kubernaut.scheduling" (dict "component" .Values.effectivenessmonitor "global" .Values.global) | nindent 6 }}
      containers:
        - name: controller
          image: {{ include "kubernaut.image" (dict "service" "effectivenessmonitor" "root" $ "appVersion" .Chart.AppVersion) }}
          imagePullPolicy: {{ include "kubernaut.imagePullPolicy" $ }}
          securityContext:
            {{- include "kubernaut.containerSecurityContext" .Values.effectivenessmonitor | nindent 12 }}
          args:
            - "--config=/etc/effectivenessmonitor/effectivenessmonitor.yaml"
          env:
            - name: TLS_CA_FILE
              value: {{ include "kubernaut.interServiceTLS.caFile" . | quote }}
          ports:
            - containerPort: 9090
              name: metrics
            - containerPort: 8081
              name: health
            {{- /* BR-PLATFORM-012, Issue #2275: ctrl.Options.PprofBindAddress
            (internal/config.PprofBindAddress) only starts a listener when
            debug.pprofEnabled is true -- declare the container port to match. */}}
            {{- if $v.debug.pprofEnabled }}
            - containerPort: 6060
              name: pprof
            {{- end }}
          {{- /* DD-PLATFORM-008: EM builds a registry.ClusterRegistry against
          the fleet MCP Gateway at boot, same shape as apifrontend -- can
          legitimately stall well past the liveness probe's budget under
          load. See apifrontend.yaml's identical comment for the confirmed
          incident details. */}}
          {{- include "kubernaut.startupProbe" (dict "port" "health") | nindent 10 }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/effectivenessmonitor
            {{- if include "kubernaut.monitoring.prometheus.tlsCaFile" . }}
            - name: service-ca
              mountPath: /etc/ssl/em
              readOnly: true
            {{- end }}
            {{- include "kubernaut.tlsCaVolumeMount" . | nindent 12 }}
            {{- if and .Values.global.fleet.enabled $effectivenessmonitorFleetPreamble.oauth2.enabled }}
            - name: oauth2-credentials
              mountPath: "/etc/effectivenessmonitor/{{ $effectivenessmonitorFleetPreamble.oauth2.credentialsSecretRef }}"
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.effectivenessmonitor.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: effectivenessmonitor-config
        {{- if include "kubernaut.monitoring.prometheus.tlsCaFile" . }}
        - name: service-ca
          configMap:
            name: effectivenessmonitor-service-ca
        {{- end }}
        {{- include "kubernaut.tlsCaVolume" . | nindent 8 }}
        {{- if and .Values.global.fleet.enabled $effectivenessmonitorFleetPreamble.oauth2.enabled }}
        - name: oauth2-credentials
          secret:
            secretName: {{ $effectivenessmonitorFleetPreamble.oauth2.credentialsSecretRef }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: effectivenessmonitor-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    app: effectivenessmonitor-controller
    {{- include "kubernaut.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 9090
      targetPort: 9090
      name: metrics
  selector:
    app: effectivenessmonitor-controller
