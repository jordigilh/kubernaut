{{- $globalV := include "kubernaut.mergedValues" (dict "root" $ "service" "global") | fromYaml }}
{{- range $name, $entry := dict
  "gateway" (dict "values" $.Values.gateway "selectorLabel" "app")
  "datastorage" (dict "values" $.Values.datastorage "selectorLabel" "app")
  "kubernaut-agent" (dict "values" $.Values.kubernautAgent "selectorLabel" "app")
  "notification-controller" (dict "values" $.Values.notification "selectorLabel" "app")
  "authwebhook" (dict "values" $.Values.authwebhook "selectorLabel" "app")
  "signalprocessing-controller" (dict "values" $.Values.signalprocessing "selectorLabel" "app")
  "remediationorchestrator-controller" (dict "values" $.Values.remediationorchestrator "selectorLabel" "app")
  "workflowexecution-controller" (dict "values" $.Values.workflowexecution "selectorLabel" "app")
  "effectivenessmonitor-controller" (dict "values" $.Values.effectivenessmonitor "selectorLabel" "app")
  "aianalysis-controller" (dict "values" $.Values.aianalysis "selectorLabel" "app")
  "console" (dict "values" $.Values.console "selectorLabel" "app")
  "apifrontend" (dict "values" $.Values.apifrontend "selectorLabel" "app")
  "fleetmetadatacache" (dict "values" $.Values.fleetmetadatacache "selectorLabel" "app.kubernetes.io/name")
}}
{{- $component := $entry.values }}
{{/* DD-PLATFORM-006 Decision Area 1: per-service pdb.* falls back to
global.podDefaults.pdb when unset. hasKey (not coalesce) for "enabled"
specifically, since coalesce/default treat an explicit `false` as empty and
would silently re-enable a service that opted out -- coalesce is fine for
minAvailable/maxUnavailable since those aren't booleans. */}}
{{- $pdb := $component.pdb | default dict }}
{{- $pdbEnabled := $globalV.podDefaults.pdb.enabled }}
{{- if hasKey $pdb "enabled" }}{{- $pdbEnabled = $pdb.enabled }}{{- end }}
{{/* "console" and "fleetmetadatacache" are opt-in (enabled defaults false); "gateway" and
"apifrontend" (Issue #2162) default to enabled=true instead -- skip their PDB entirely when
disabled, same as console/fleetmetadatacache, but resolve via kubernaut.mergedValues (not a raw
$component.enabled read) since a raw read of an unset field is nil/falsy regardless of the
service's actual schema default, which would incorrectly skip gateway/apifrontend's PDB by
default. fleetmetadatacache's opt-in state must additionally go through DD-PLATFORM-006 Decision
Area 10's derived-default helper, since global.fleet.enabled=true + a "fleetmetadatacache"
backend implicitly turns FMC on even when fleetmetadatacache.enabled is never set explicitly. */}}
{{- $effectiveEnabled := $component.enabled }}
{{- if eq $name "fleetmetadatacache" }}{{- $effectiveEnabled = eq (include "kubernaut.fleetmetadatacache.effectiveEnabled" $) "true" }}{{- end }}
{{- if eq $name "gateway" }}{{- $effectiveEnabled = (include "kubernaut.mergedValues" (dict "root" $ "service" "gateway") | fromYaml).enabled }}{{- end }}
{{- if eq $name "apifrontend" }}{{- $effectiveEnabled = (include "kubernaut.mergedValues" (dict "root" $ "service" "apifrontend") | fromYaml).enabled }}{{- end }}
{{- if and $pdbEnabled (or (not (has $name (list "console" "fleetmetadatacache" "gateway" "apifrontend"))) $effectiveEnabled) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ $name }}
    {{- include "kubernaut.labels" $ | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{ $entry.selectorLabel }}: {{ $name }}
  {{- with (coalesce $pdb.minAvailable $.Values.global.podDefaults.pdb.minAvailable) }}
  minAvailable: {{ . }}
  {{- end }}
  {{- with (coalesce $pdb.maxUnavailable $.Values.global.podDefaults.pdb.maxUnavailable) }}
  maxUnavailable: {{ . }}
  {{- end }}
{{- end }}
{{- end }}
