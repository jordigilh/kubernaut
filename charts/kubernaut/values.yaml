global:
  # -- Issue #1069 (DD-GATEWAY-018): names of pre-existing ClusterRoles to bind
  # to ALL THREE of gateway/effectivenessmonitor/kubernautAgent's ServiceAccounts
  # -- the common case, since all three inspect the same owner-chain/target
  # resources at different pipeline stages. Use the per-service
  # additionalClusterRoleBindings field instead when you want asymmetric access
  # (e.g. withholding a grant from kubernautAgent, BR-PLATFORM-005).
  additionalClusterRoleBindings: []
  # -- Container image registry/namespace/pullPolicy for all Kubernaut-published
  # services (DD-PLATFORM-006 DA14: non-zero schema defaults quay.io/kubernaut-ai/
  # "/"/IfNotPresent -- omit entirely to use them, override only what you need).
  # image:
  #   registry: quay.io
  #   namespace: kubernaut-ai
  #   separator: "/"  # "/" for nested registries, "-" for flat registries (quay.io, Docker Hub)
  #   pullPolicy: IfNotPresent
  imagePullSecrets: []
  # -- Shared MCP Gateway + fleet-backend configuration, the SOLE source of
  # truth for every fleet-integration-capable service (gateway,
  # signalprocessing, remediationorchestrator, effectivenessmonitor,
  # apifrontend, fleetmetadatacache). All of these point at the *same*
  # physical MCP Gateway instance and (for gateway/remediationorchestrator)
  # the *same* scope-check backend, so in practice they share one
  # backend/endpoint/mcpGatewayType/CA/OAuth2 client -- there is no known
  # deployment that needs a different value per service (Issue #1707
  # follow-up). The single per-service exception is
  # `fleet.oauth2.credentialsSecretRef` (still overridable per service, see
  # each service's own `fleet.oauth2` block) -- everything else below was
  # removed from every per-service schema entirely; setting it there now
  # fails schema validation instead of being silently ignored.
  fleet:
    # -- Multi-cluster fleet federation on/off (Issue #1707), consolidated
    # from what used to be four independent toggles
    # (gateway/remediationorchestrator/apifrontend/effectivenessmonitor
    # `fleet.enabled`). No known deployment (including the Kubernaut
    # Operator, ADR-068) has ever needed to enable fleet federation on some
    # of those four services while leaving it off on others -- it is
    # conceptually one feature spanning the request pipeline (GW/RO's
    # federated scope check) and the read pipeline (AF/EM's remote reads).
    enabled: false
    # -- Shared MCP Gateway endpoint URL for remote-cluster reads (GW/RO/AF/EM/SP/FMC).
    # NOTE: intentionally NOT trimmed even though its default is "" -- unlike
    # GW/RO/FMC (which `fail()`-guard this as mandatory once fleet.enabled=true),
    # WorkflowExecution treats an empty value as a valid "stay local-only" state
    # with no upstream guard. Sprig's `quote` silently drops nil arguments (unlike
    # explicit ""), so an absent key renders `endpoint:` (YAML null) instead of
    # `endpoint: ""` for WE's un-guarded read -- a real behavioral gap, not just
    # cosmetic (see workflowexecution_fleet_wiring_test.yaml).
    mcpGatewayEndpoint: ""  # e.g., "http://envoy-ai-gateway.kubernaut-system.svc:8080/mcp"
    # -- Shared MCP Gateway type ("eaigw" or "kuadrant").
    # NOTE: intentionally NOT trimmed even though its default is "" -- FMC's
    # `gatewayType:` field (fleetmetadatacache.yaml) quotes this directly with
    # no `if`/`default` guard (unlike every other consumer, which wraps it in
    # `{{- if ... }}`), so the same Sprig `quote`-drops-nil gap as
    # mcpGatewayEndpoint applies here too: absent key -> `gatewayType:` (YAML
    # null) instead of `gatewayType: ""`.
    mcpGatewayType: ""
    # -- Issue #1730: shared fallback for signalprocessing.fleet.namespace and
    # fleetmetadatacache.namespace (both restrict that service's own
    # ClusterRegistry CRD watch to a single namespace, BR-RBAC-020 #1686).
    # Every per-service override still wins when explicitly set -- this only
    # de-duplicates the common case where both point at the same namespace.
    mcpGatewayNamespace: ""
    oauth2:
      # -- OAuth2 client_credentials auth on/off for MCP Gateway authentication.
      enabled: false
  # -- Named LLM provider profiles (DD-PLATFORM-007), referenced by name from
  # kubernautAgent.llmProfileRef (required), kubernautAgent.phaseModels,
  # kubernautAgent.alignmentCheck.llmProfileRef, apifrontend.llmProfileRef,
  # and apifrontend.config.severityTriage.llmProfileRef. Mirrors the
  # Kubernaut Operator's spec.llmProfiles -- a profile defined once is
  # reusable by any consumer without re-deriving its field set. At least one
  # profile is required (kubernautAgent.llmProfileRef has no default).
  llmProfiles: {}
    # primary:
    #   provider: "openai"   # openai | anthropic | gemini | vertex_ai | openai_compatible
    #   model: "gpt-4o"
    #   credentialsSecretName: "llm-credentials"
    #   endpoint: ""
    #   temperature: 0.7
    #   maxRetries: 3
    #   timeoutSeconds: 120
    #   vertexProject: ""
    #   vertexLocation: ""
    #   azureApiVersion: ""
    #   tlsCaFile: ""
    #   oauth2:
    #     enabled: false
    #     tokenURL: ""
    #     credentialsSecretRef: ""
    #     scopes: ""
    #   reasoning:
    #     enabled: false
    #     budgetTokens: 0
    #     effort: ""
    #     capabilityOverride: ""
  # -- DD-PLATFORM-006 Decision Area 1: cluster-wide PDB default, applied to
  # any service whose own `pdb` block is unset. Per-service `pdb.enabled` /
  # `pdb.minAvailable` / `pdb.maxUnavailable` still take precedence when set.
  podDefaults:
    pdb:
      # enabled: true  # non-zero schema default; set false to disable PDBs cluster-wide
      maxUnavailable: 1

# -- TLS certificate management for the AuthWebhook admission controller.
# Three modes are supported:
#   hook         - Self-signed certificates generated by Helm hooks (default, suitable for dev/testing).
#                  No external dependencies. Certs are stored in authwebhook-tls Secret.
#   cert-manager - Certificates managed by cert-manager (recommended for production).
#                  Requires cert-manager installed and an Issuer/ClusterIssuer configured.
#                  Also auto-provisions DataStorage's AU-9 audit-signing key
#                  (datastorage-signing-cert Certificate/Secret) -- #334. In addition,
#                  auto-provisions a dedicated internal CA (decoupled from
#                  tls.certManager.issuerRef) for inter-service mTLS: leaf certs
#                  (gateway-tls/datastorage-tls/kubernautagent-tls) and the
#                  inter-service-ca ConfigMap that ~11 services trust -- DD-PLATFORM-001.
#   manual       - User-managed certificates. The chart creates no TLS resources or hooks.
#                  The user must create the authwebhook-tls Secret and patch webhook caBundle,
#                  AND create the datastorage-signing-cert Secret (type kubernetes.io/tls,
#                  RSA 2048) -- DataStorage fails to start without it, no fallback (#334).
#                  AND create gateway-tls/datastorage-tls/kubernautagent-tls Secrets (type
#                  kubernetes.io/tls) plus an inter-service-ca ConfigMap (key ca.crt) for
#                  inter-service mTLS -- DD-PLATFORM-001. Without these, inter-service
#                  HTTP clients/servers silently fall back to plain HTTP (SC-8 gap),
#                  by design of pkg/shared/tls.ConfigureConditionalTLS/DefaultBaseTransport.
#                  Suitable for service meshes, external PKI, or CI environments.
# mode/certManager.issuerRef.{kind,group}/interService.{certDir,caFile} all
# have non-zero schema defaults (hook/ClusterIssuer/cert-manager.io//etc/tls/
# /etc/tls-ca/ca.crt) -- omitted here, override only what you need, e.g.:
#   mode: hook
#   certManager:
#     issuerRef:
#       kind: ClusterIssuer
#       group: cert-manager.io
#   # Issue #753: Inter-service TLS is always enabled (mandatory).
#   # Certs generated by the tls-cert-job hook (same CA as authwebhook).
#   interService:
#     certDir: /etc/tls
#     caFile: /etc/tls-ca/ca.crt
# Present as an empty map (not omitted) because kubernaut.tls.issuerName
# reads .Values.tls.certManager.issuerRef.name directly -- an absent tls key
# would nil-pointer.
tls: {}

# -- Gateway service (AlertManager webhook target + external signal ingestion)
# DD-PLATFORM-006 DA14: replicas/logging.level/config.server.*/config.cors.*/
# config.deduplication.cooldownPeriod/service.type all have non-zero schema
# defaults (1/"INFO"/100,30s,30s,15s/["https://no-browser-clients.invalid"],300/
# 5m/ClusterIP) -- omitted here, override only what you need, e.g.:
#   replicas: 2
#   config:
#     cors:
#       allowedOrigins: ["https://console.example.com"]  # if a browser client needs Gateway directly
gateway:
  # -- Issue #1069 (DD-GATEWAY-018): names of pre-existing ClusterRoles to bind
  # to the Gateway ServiceAccount, for ecosystem resource kinds not already
  # covered by the built-in `view` ClusterRole binding (e.g. OLM Subscription,
  # ArgoCD Application). The operator creates and owns the referenced
  # ClusterRole; Kubernaut only binds it.
  additionalClusterRoleBindings: []
  config:
    middleware: {}
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m
  # -- Ingress for external access (BR-PLATFORM-009, Kubernaut Operator parity
  # with GatewayRoute). Opt-in and disabled by default: Gateway is a machine-
  # facing pipeline entry point (webhook/signal ingestion), so exposing it
  # externally is a deliberate choice, not a default. Unlike console.ingress,
  # no field here is required -- Gateway has no internal component (e.g. an
  # OIDC redirect URL) that depends on the hostname being set, so leaving
  # `host` empty renders a catch-all rule instead of failing the render.
  ingress:
    enabled: false
    tls: {}
  # BR-GATEWAY-036/037: Auth middleware configuration
  auth:
    # External signal sources that need RBAC to call the Gateway.
    # Each entry creates a ClusterRoleBinding granting services/gateway-service/create.
    # To enable AlertManager integration, install kube-prometheus-stack and add:
    #   signalSources:
    #     - name: alertmanager
    #       serviceAccount: alertmanager-kube-prometheus-stack-alertmanager
    #       namespace: monitoring
    signalSources: []
  # -- Multi-cluster fleet configuration (BR-INTEGRATION-065, ADR-068, DD-FLEET-003).
  # Gated by global.fleet.enabled (Issue #1707) -- when true, GW includes
  # clusterID in signal fingerprints and populates spec.clusterID on
  # RemediationRequests. The backend adapter handles federated scope checks.
  # GW MUST also be able to reach the MCP Gateway (mcpGatewayEndpoint) for
  # the federated scope check to complete — see DD-FLEET-003 for why both
  # are mandatory together when global.fleet.enabled=true
  # (fleet.ValidateFullFederation()).
  # backend/endpoint/mcpGatewayEndpoint/mcpGatewayType/tlsCAFile/
  # tokenSecretRef/oauth2.{enabled,tokenURL,scopes,tlsCAFile} all moved to
  # global.fleet.* (Issue #1707 follow-up) -- every fleet-integration-capable
  # service shares the same MCP Gateway and scope-check backend. Only
  # oauth2.credentialsSecretRef remains overridable here.
  fleet:
    oauth2: {}

# -- DataStorage service (audit trail, workflow catalog)
# DD-PLATFORM-006 DA14: replicas/logging.level/service.type/autoscaling.{min,max}
# Replicas/{cpu,memory}Target/config.server.{maxBodySize,signerCertDir,
# rateLimit.*}/config.database.*/config.redis.dlqMaxLen/
# config.retention.{interval,batchSize,defaultDays}/
# config.auditHashKey.secretKey all have non-zero schema defaults -- omitted
# here, override only what you need.
datastorage:
  # -- HorizontalPodAutoscaler (BR-PLATFORM-003, Issue #1589). autoscaling/v2 is a stable core
  # API — no CRD gate needed, unlike ServiceMonitor/PrometheusRule. Ported from the Kubernaut
  # Operator's DataStorageHPA (kubernaut-operator/internal/resources/hpa.go).
  autoscaling:
    enabled: false
  config:
    redis:
      # #1048 Phase 5 / AU-9: Redis TLS client configuration.
      # DD-PLATFORM-006 DA6: mandatory (no enabled gate) -- the chart's own
      # Valkey is TLS-only (Decision Area 8).
      tls: {}
    # FED-C2 / AU-11: Retention enabled by default for compliance -- unlike its
    # schema default (false), this chart hardens to true and stays explicit
    # here so removing it can never silently regress the AU-11 floor (DD-
    # PLATFORM-006 DA14). Set enabled: false explicitly for dev environments.
    retention:
      enabled: true
    # -- Present as an empty map (not omitted) because kubernaut.datastorage
    # .auditHashKeySecretName reads .Values.datastorage.config.auditHashKey
    # .existingSecret directly -- an absent auditHashKey key would nil-pointer.
    auditHashKey: {}
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m

# -- AIAnalysis controller
# DD-PLATFORM-006 DA14: replicas (1) / logging.level ("INFO") have non-zero
# schema defaults -- omitted here, override only what you need.
aianalysis:
  rego: {}
  # -- Approval policy externalization.
  # Option A: provide policy content via --set-file (chart creates ConfigMap).
  # Option B: reference a pre-existing ConfigMap.
  # One of the two is required; the chart will fail at install if neither is set.
  policies:
    content: ""           # --set-file aianalysis.policies.content=approval.rego
    existingConfigMap: "" # name of pre-existing ConfigMap with key "approval.rego"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# -- SignalProcessing controller
# DD-PLATFORM-006 DA14: replicas (1) / logging.level ("INFO") have non-zero
# schema defaults -- omitted here, override only what you need.
signalprocessing:
  # -- Unified Rego policy externalization (ADR-060, #415).
  # Single policy.rego file containing all classification rules
  # (environment, severity, priority, custom labels).
  # Option A: provide raw .rego content via --set-file (chart creates ConfigMap).
  #   helm install ... --set-file signalprocessing.policies.content=policy.rego
  # Option B: reference a pre-existing ConfigMap with key "policy.rego".
  # One of the two is required; the chart will fail at install if neither is set.
  policies:
    content: ""            # --set-file signalprocessing.policies.content=policy.rego
    existingConfigMap: ""  # name of pre-existing ConfigMap with key "policy.rego"
  # -- Proactive signal mappings (YAML, not Rego).
  # Maps proactive signal names to their reactive equivalents (ADR-054).
  # Optional: when neither is set, all signals default to reactive mode.
  proactiveSignalMappings: {}
  # -- Multi-cluster fleet configuration (BR-INTEGRATION-054/BR-FLEET-003, ADR-068).
  # When global.fleet.mcpGatewayEndpoint is set, SP connects to the MCP
  # Gateway for remote cluster resource reads during enrichment.
  # global.fleet.mcpGatewayType is additionally required to evaluate the
  # `cluster` Rego classification dimension (#1511), since SP then watches
  # MCPServerRegistration CRs directly via a ClusterRegistry informer (see
  # the RBAC grant below). endpoint/mcpGatewayType/
  # oauth2.{enabled,tokenURL,scopes,tlsCAFile} moved to global.fleet.* (Issue
  # #1707 follow-up) -- this also fixes a pre-existing gap where SP's own
  # `endpoint` field had no global fallback at all. Only
  # oauth2.credentialsSecretRef remains overridable here.
  fleet:
    oauth2: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# -- RemediationOrchestrator controller
# DD-PLATFORM-006 DA14: replicas/logging.level/config.timeouts.*/
# config.routing.*/config.effectivenessAssessment.stabilizationWindow/
# config.asyncPropagation.*/config.retention.period all have non-zero schema
# defaults -- omitted here, override only what you need, e.g.:
#   config:
#     retention:
#       period: "24h"  # Issue #265: CRD retention TTL before automatic cleanup
remediationorchestrator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  config:
    notifications: {}
  # -- Multi-cluster fleet configuration (BR-INTEGRATION-065, ADR-068, DD-FLEET-003).
  # Gated by global.fleet.enabled (Issue #1707) -- when true, RO performs
  # federated scope checks before accepting RemediationRequests with
  # non-empty clusterID, and reads remote resource specs (spec hash) via the
  # MCP Gateway. RO MUST have both the scope-check backend AND
  # mcpGatewayEndpoint configured together — see DD-FLEET-003
  # (fleet.ValidateFullFederation()).
  # backend/endpoint/mcpGatewayEndpoint/mcpGatewayType/tlsCAFile/
  # tokenSecretRef/oauth2.{enabled,tokenURL,scopes,tlsCAFile} all moved to
  # global.fleet.* (Issue #1707 follow-up) -- every fleet-integration-capable
  # service shares the same MCP Gateway and scope-check backend. Only
  # oauth2.credentialsSecretRef remains overridable here.
  fleet:
    oauth2: {}

# -- WorkflowExecution controller
# DD-PLATFORM-006 DA14: workflowNamespace ("kubernaut-workflows") / replicas (1)
# / logging.level ("INFO") / config.execution.cooldownPeriod ("1m") all have
# non-zero schema defaults -- omitted here, override only what you need.
workflowexecution:
  # -- config.execution.cooldownPeriod has a non-zero schema default ("1m",
  # DD-PLATFORM-006 DA14) -- omitted here. config.tekton/config.ansible are
  # optional feature blocks (no default; presence-gated). Present as an empty
  # map (not omitted) because the template reads .Values.workflowexecution
  # .config.ansible directly in several places without going through
  # kubernaut.mergedValues -- an absent config key would nil-pointer.
  # e.g.:
  # config:
  #   tekton:                             # Issue #868: Tekton Pipelines engine (optional)
  #     enabled: true                     # nil/true = auto-discover CRDs; false = disable
  #   ansible:                            # Issue #478: AWX/AAP connectivity (optional)
  #     apiURL: "https://awx.example.com" # required when ansible block is present
  #     organizationID: 1
  #     tokenSecretRef:
  #       name: awx-token                 # Secret name containing AWX API token
  #       key: token                      # Key within the Secret
  #       namespace: ""                   # empty = release namespace
  #     caCertSecretRef:                  # BR-PLATFORM-005: set when AAP/AWX uses a
  #       name: aap-ca-secret              # self-signed or private-CA certificate.
  #       key: ca.crt                     # Combined with the inter-service CA into
  #                                        # one trust bundle (Kubernaut Operator parity).
  config: {}
  # -- Multi-cluster fleet configuration for remote workflow execution
  # (BR-FLEET-054, ADR-068). Gated by global.fleet.enabled -- when true,
  # the Job/Tekton/Ansible executors route Create/Delete calls for a
  # ClusterID-tagged workflow to the remote managed cluster via the MCP
  # Gateway's write tools (resources_create_or_update/resources_delete),
  # using global.fleet.mcpGatewayEndpoint. Unlike GW/RO/FMC, an empty
  # mcpGatewayEndpoint is a valid, supported state even with fleet enabled
  # globally -- WE simply stays in local-only execution (a deployer may
  # want fleet reads/scope-checks on other services without granting WE
  # remote write capability at all). WE has no ClusterRegistry/CRD-watch
  # capability (it discovers MCP tool prefixes dynamically via tools/list,
  # pkg/fleet/mcpclient/discover.go) so, unlike AF/EM/SP/FMC, there is no
  # mcpGatewayType or namespace field here.
  fleet:
    oauth2: {}
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# -- Notification controller
# DD-PLATFORM-006 DA14: replicas/logging.level/slack.{secretKey,channel} have
# non-zero schema defaults -- omitted here, override only what you need.
notification:
  # -- Slack quickstart shortcut.
  # Set secretName to auto-generate Slack routing and credential projection.
  # For advanced routing (multiple receivers, custom routes), use routing.content or routing.existingConfigMap.
  slack:
    secretName: ""        # K8s Secret containing the Slack webhook URL; empty = no Slack
  # -- Notification routing externalization (#405).
  # Precedence: routing.existingConfigMap > routing.content > slack.* shortcut > console-only default.
  routing: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# -- EffectivenessMonitor controller
# DD-PLATFORM-006 DA14: replicas/logging.level/config.assessment.{
# stabilizationWindow,validityWindow} all have non-zero schema defaults --
# omitted here, override only what you need.
effectivenessmonitor:
  # -- Issue #1069 (DD-GATEWAY-018): names of pre-existing ClusterRoles to bind
  # to the EffectivenessMonitor ServiceAccount, for ecosystem resource kinds
  # not already covered by the built-in `view` ClusterRole binding (#545).
  additionalClusterRoleBindings: []
  # -- Multi-cluster fleet configuration (BR-FLEET-054, ADR-068).
  # Gated by global.fleet.enabled (Issue #1707) -- when true and
  # global.fleet.mcpGatewayEndpoint is set, EM reads the remediation's target
  # cluster state via the MCP Gateway instead of silently falling back to
  # the local hub cluster. global.fleet.mcpGatewayType is additionally
  # required when using the Kuadrant gateway, since EM then watches
  # MCPServerRegistration CRs directly via a ClusterRegistry informer (see
  # the RBAC grant below). mcpGatewayEndpoint/mcpGatewayType/tlsCAFile/
  # oauth2.{enabled,tokenURL,scopes,tlsCAFile} moved to global.fleet.* (Issue
  # #1707 follow-up). Only oauth2.credentialsSecretRef remains overridable here.
  fleet:
    oauth2: {}
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 500m

# -- Kubernaut Agent (Go LLM investigation service)
# DD-PLATFORM-006 DA14: replicas/logging.level/service.type/llmProfileRef/
# alignmentCheck.{timeout,maxStepTokens} all have non-zero schema defaults --
# omitted here, override only what you need.
kubernautAgent:
  # -- Issue #1069 (DD-GATEWAY-018): names of pre-existing ClusterRoles to bind
  # to the Kubernaut Agent ServiceAccount, for resource kinds not already
  # covered by its investigator ClusterRole. Generalizes kubernaut-operator's
  # equivalent KA-only mechanism to the Helm chart.
  additionalClusterRoleBindings: []
  # -- MCP interactive mode (#703): human-in-the-loop investigation sessions.
  # When enabled, KA exposes a Streamable HTTP MCP endpoint at POST /api/v1/mcp
  # and provisions Lease RBAC. (#1288: impersonate ClusterRole removed).
  interactive:
    # -- Enable MCP interactive mode endpoint and Lease-based session management.
    enabled: false
    # -- Maximum duration for an interactive session before auto-release (Go duration).
    # sessionTTL: "30m"
    # -- Session timeout after last operator activity (Go duration).
    # inactivityTimeout: "10m"
    # -- Maximum concurrent interactive sessions per agent replica. Issue
    # #1737 gap found: the template's fallback of 5 (matching this
    # commented-out value) is too low even for realistic production use (a
    # handful of SREs running concurrent investigations already exhausts
    # it) -- confirmed via full-suite E2E, which failed nearly every
    # interactive/MCP spec with "max_sessions: Maximum concurrent sessions
    # reached" purely from Ginkgo's own parallelism (12 procs), well before
    # any application-level concurrency. Chart default raised to 50 in the
    # template (see kubernaut-agent.yaml) -- override lower here for a
    # genuinely single-operator deployment.
    # maxConcurrentSessions: 50
    # -- Maximum MCP requests per second per authenticated user.
    # rateLimitPerUser: 20
    # -- Extended analyzing timeout for RO when an interactive session is active (Go duration).
    # Prevents RO from timing out a RemediationRequest while an operator is investigating.
    # maxAnalyzingTimeout: "45m"
    # -- JWT providers for Pattern B authentication (DD-AUTH-MCP-001 v2.0).
    # When configured, KA validates JWT signatures via JWKS endpoints and extracts
    # user identity from verified claims. Multiple providers support multi-issuer
    # architecture (v1.5: Keycloak, v1.6: + SPIRE).
    # jwtProviders:
    #   - name: "keycloak"
    #     issuer: "https://keycloak.example.com/realms/kubernaut"
    #     jwksURL: "https://keycloak.example.com/realms/kubernaut/protocol/openid-connect/certs"
    #     audience: "kubernaut-agent"
    #     claimMappings:
    #       username: "preferred_username"
    #       groups: "groups"
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  # -- Name of an entry in global.llmProfiles used for KA's investigator LLM
  # calls (DD-PLATFORM-007). Defaults to "primary" (DD-PLATFORM-006 DA4),
  # matching the universal convention used across this repo's own README/
  # quickstart/CI examples -- a profile named "primary" must still be defined
  # under global.llmProfiles (or whatever name this is overridden to); an
  # undefined profile fails the render with an actionable message either way.
  # llmProfileRef: "primary"
  # -- Shadow agent alignment check (#601): parallel audit for prompt injection detection.
  alignmentCheck:
    enabled: false
  # -- AI investigation behavior and safety guardrails.
  ai:
    safety:
      anomaly:
        # -- Maximum total tool calls allowed per investigation phase before the
        # investigation aborts as budget-exhausted (I7 anomaly detector,
        # DD-KA-019-003). Raise this if legitimate investigations are hitting
        # the ceiling; for interactive sessions this surfaces as the MCPError
        # code tool_budget_exhausted (#1889).
        maxTotalToolCalls: 30
  # -- Multi-cluster fleet configuration (BR-FLEET-054, ADR-068, issue #1729).
  # Gated by global.fleet.enabled (Issue #1707) -- when true and
  # global.fleet.mcpGatewayEndpoint/mcpGatewayType are set, KA's investigator
  # additionally advertises the fleet MCP Gateway's remote-cluster tools
  # (e.g. resources_get) for fleet-tagged investigations, alongside its
  # local kubectl_* tools (DD-FLEET-004). Before this, KA's Go-side fleet
  # client (cmd/kubernautagent/toolregistry.go registerFleetTools) was fully
  # wired but never reachable via Helm at all -- a fleet-tagged investigation
  # would silently fall back to hub-local tools regardless of
  # global.fleet.enabled (#1729). No namespace field here (unlike
  # apifrontend.fleet/effectivenessmonitor.fleet): KA has no ClusterRegistry
  # informer/watch. mcpGatewayEndpoint/mcpGatewayType/
  # oauth2.{enabled,tokenURL,scopes} come from global.fleet.* (Issue #1707
  # follow-up); only oauth2.credentialsSecretRef remains overridable here.
  fleet:
    oauth2: {}
  # -- Investigation-outcome confidence bands (BR-KA-213, Issue #1826), templated
  # into the Phase 3 workflow-selection prompt's "resolved"/"inconclusive"
  # thresholds. Defaults (0.7/0.5, applied by the Go binary when unset here)
  # match the values previously hardcoded directly in the prompt template.
  # investigation:
  #   resolvedConfidenceThreshold: 0.7
  #   inconclusiveConfidenceThreshold: 0.5
  investigation: {}

# -- AuthWebhook admission controller
# DD-PLATFORM-006 DA14: replicas (1) / logging.level ("INFO") have non-zero
# schema defaults -- omitted here, override only what you need.
authwebhook:
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 200m

# -- PostgreSQL (DataStorage backend)
# Credentials: MUST be pre-created before install (#557).
#   The secret must contain keys: POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB,
#   and db-secrets.yaml (YAML with username + password for DataStorage).
#   BYO (#256): Set postgresql.enabled=false and provide postgresql.host.
#
# PSA-oriented defaults (#1685): runAsNonRoot + explicit runAsUser/fsGroup.
# Do NOT drop ALL capabilities (postgres entrypoint needs gosu/chown caps).
# Override via podSecurityContext / containerSecurityContext if needed.
#
# DD-PLATFORM-006 DA14: enabled(true)/port(5432)/image/auth.{username,database}/
# replicas(1)/storage.size(10Gi) all have non-zero schema defaults -- omitted
# here, override only what you need, e.g.:
#   enabled: false  # use an external PostgreSQL instance (also set postgresql.host)
postgresql:
  # -- Present as an empty map (not omitted) because kubernaut.postgresql
  # .secretName reads .Values.postgresql.auth.existingSecret directly --
  # an absent auth key would nil-pointer.
  auth: {}
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m
  # Defaults keep postgres:16-alpine runnable under restricted-oriented settings.
  # Image entrypoint needs CAP_CHOWN/SETUID/SETGID (gosu), so we do NOT drop ALL.
  # UID 70 = postgres user in postgres:16-alpine; fsGroup fixes PVC ownership.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 70
    fsGroup: 70
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    runAsNonRoot: true
    runAsUser: 70

# -- Valkey (DataStorage DLQ)
# Valkey is a BSD-licensed Redis-compatible in-memory data store.
# Credentials: MUST be pre-created before install (#557).
#   The secret must contain key: valkey-secrets.yaml (YAML with password).
#   BYO (#256): Set valkey.enabled=false and provide valkey.host.
#
# PSA-oriented defaults (#1685): same pattern as postgresql — runAsUser/fsGroup,
# no capabilities.drop ALL (setpriv needs SETUID/SETGID).
#
# DD-PLATFORM-006 DA14: enabled(true)/port(6379)/image/replicas(1)/
# storage.size(512Mi) all have non-zero schema defaults -- omitted here,
# override only what you need, e.g.:
#   enabled: false  # use an external Valkey/Redis instance (also set valkey.host)
valkey:
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 200m
  # Defaults for valkey/valkey:8-alpine (UID 999). Do not drop ALL capabilities —
  # setpriv needs SETUID/SETGID. fsGroup keeps PVC writable without root entrypoint chown.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    runAsNonRoot: true
    runAsUser: 999

# -- FleetMetadataCache: Fleet Metadata Cache service (BR-INTEGRATION-065, ADR-068).
# Polls remote clusters via MCP Gateway and caches managed resource metadata in Valkey.
# Serves an HTTP API for federated scope checking consumed by GW and RO.
# DD-PLATFORM-006 Decision Area 10: `enabled` is deliberately left unset here (not `enabled:
# false`) so its effective value can be derived from global.fleet.enabled + global.fleet.backend
# when a user hasn't set it explicitly -- see kubernaut.fleetmetadatacache.effectiveEnabled in
# _helpers.tpl. Set fleetmetadatacache.enabled explicitly (true or false) to override the
# derived default.
# DD-PLATFORM-006 DA14: replicas/image.*/syncInterval/keyTTL/namespace all have
# non-zero schema defaults -- omitted here, override only what you need.
fleetmetadatacache:
  oauth2: {}
  # DD-PLATFORM-006 Decision Area 13 follow-up (round-16 RCA): mandatory Valkey
  # TLS (no enabled gate) -- the chart's own Valkey is TLS-only (Decision Area 8).
  valkeyTLS: {}
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 200m

# -- Hooks (post-install Jobs)
# DD-PLATFORM-006 DA14: hooks.tlsCerts.image has a non-zero schema default
# (shared kubectl image for all hook Jobs -- TLS cert gen, CRD upgrade) --
# omitted here, override only if you need a different kubectl image, e.g.:
#   tlsCerts:
#     image: docker.io/bitnami/kubectl:latest@sha256:6e2cdb22d6ab7264ea198c717f555e30536b54029d26c8781b9f25f78951b564
# DD-PLATFORM-006 DA17: hooks.tlsCerts.extraSANs defaults to [] (no effect on
# a real cluster, which is never accessed via localhost). Only needed for
# host-based test/dev access to the chart's own NodePort services with full
# TLS hostname verification, e.g.:
#   tlsCerts:
#     extraSANs: ["localhost"]   # IP:127.0.0.1 is added automatically
# Present as an empty map (not omitted) because kubernaut.scheduling/
# kubernaut.podSecurityContext read .Values.hooks.{nodeSelector,tolerations,
# affinity,...} directly -- an absent hooks key would nil-pointer.
hooks: {}

# -- Unified monitoring configuration (Issue #463).
# Single source of truth for Prometheus/AlertManager endpoints.
# Propagated to both EffectivenessMonitor and Kubernaut Agent.
monitoring:
  prometheus:
    enabled: false
    url: ""
    tlsCaFile: ""
  alertManager:
    enabled: false
    url: ""
    tlsCaFile: ""
  # -- ServiceMonitor for scraping each service's /metrics endpoint (BR-PLATFORM-003, Issue #1589).
  # Requires monitoring.coreos.com/v1 CRD (kube-prometheus-stack). No-op (renders nothing) when
  # the CRD isn't installed, even if enabled=true — see kubernaut.monitoring.crdsPresent.
  # Not rendered for authwebhook: metrics are intentionally disabled for that service.
  serviceMonitor:
    enabled: false
  # -- PrometheusRule for interactive session SLO alerting (Issue #1005), and for DataStorage /
  # APIFrontend availability/latency/error alerting (BR-PLATFORM-003, Issue #1589).
  # Requires monitoring.coreos.com/v1 CRD (kube-prometheus-stack).
  # DD-PLATFORM-006 DA14: thresholds.* all have non-zero schema defaults --
  # omitted here, override only what you need, e.g.:
  #   thresholds:
  #     activeSessionsMax: 10       # Max concurrent interactive sessions before alerting
  #     activeSessionsFor: "5m"
  #     leaseContentionRateMax: 0.1 # Lease contention rate (events/sec over 5m window)
  #     leaseContentionFor: "5m"
  #     commandDurationP99Max: 30   # MCP tool call p99 latency SLO (seconds)
  #     commandDurationFor: "10m"
  #     takeoverRateMax: 0.05       # Takeover rate (events/sec over 5m window)
  #     takeoverRateFor: "15m"
  prometheusRule:
    enabled: false

# -- NetworkPolicies: default-deny with explicit allow rules (Issue #285).
# Unconditionally mandatory for every service (DD-PLATFORM-006 Decision Area
# 3) -- there is no enabled toggle, top-level or per-service. The 4 policies
# for optional services (apifrontend/console/postgresql/valkey) are still a
# no-op when that service itself is disabled -- see each service's own
# `enabled` field, not a NetworkPolicy-specific one.
# DD-PLATFORM-006 DA14: monitoring.{prometheusPort,alertManagerPort}/
# externalWebhooks.{cidr,port}/externalRegistry.{cidr,port}/idp.{cidr,port}/
# llm.{cidr,port}/mcpGateway.{cidr,port}/prometheus.{cidr,port} all have
# non-zero schema defaults -- omitted here, override only what you need, e.g.
# a non-standard-port IdP/LLM/MCP Gateway/Prometheus, or a narrower CIDR than
# "anywhere" (0.0.0.0/0). prometheus.port defaults to 9090 (Prometheus's
# standard port) and is only rendered on AF's NetworkPolicy when
# monitoring.prometheus.enabled=true (#1839 -- see kubernaut.np.
# prometheusEgress's doc comment in _helpers.tpl for the full RCA):
#   idp:
#     cidr: "10.0.0.0/8"
#     port: 8443
# idp.extraPorts (zero-value default []) additively opens egress on further
# IdP ports against the same cidr -- e.g. when APIFrontend must validate
# end-user JWTs against one IdP while also fetching its own fleet-MCP OAuth2
# token from a second, differently-ported IdP (issue #1782):
#   idp:
#     extraPorts: [8443]
networkPolicies:
  # -- Present as an empty map (not omitted) because kubernaut.np.metricsIngress
  # in _helpers.tpl reads .Values.networkPolicies.monitoring.namespace directly
  # (zero default "") without going through kubernaut.mergedValues -- an absent
  # parent key would nil-pointer rather than resolve to "".
  monitoring: {}
  gateway: {}
  datastorage: {}
  kubernautAgent: {}
  apifrontend: {}
  console: {}

# API Frontend - MCP bridge between users and Kubernaut Agent
# DD-PLATFORM-006 DA14: enabled(true)/replicas(1)/service.type(ClusterIP)/
# autoscaling.{min,max}Replicas/{cpu,memory}Target/image.{repository,pullPolicy}/
# logging.level/config.server.*Port/config.session.*TTL/config.mcp.*/
# config.interactive.*/config.severityTriage.{maxQueriesPerCall,
# maxRulesEvaluated,cacheTTLSeconds,llmConfidence,llmEnabled}/
# config.rateLimit.*/config.rbac.sarCacheTTL all have non-zero schema defaults
# -- omitted here, override only what you need, e.g.:
#   enabled: false  # set false only if you don't need AF at all (Console/KA MCP depend on it)
apifrontend:
  # -- Ingress for external access (BR-PLATFORM-009, Kubernaut Operator parity
  # with APIFrontendRoute). Opt-in and disabled by default, same as Gateway:
  # AF is a machine-facing pipeline entry point (MCP/API), so exposing it
  # externally is a deliberate choice. AF serves HTTPS internally with a
  # self-signed inter-service certificate, so unlike Console/Gateway's plain-
  # HTTP backend, a controller-specific backend-protocol/TLS-passthrough
  # annotation is required (e.g. nginx-ingress:
  # `nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"` plus
  # `nginx.ingress.kubernetes.io/proxy-ssl-verify: "off"` since the backend
  # cert isn't signed by a CA the controller trusts). This chart does not
  # hardcode one controller's annotation syntax -- set it via `annotations`.
  ingress:
    enabled: false
    tls: {}
  # -- HorizontalPodAutoscaler (BR-PLATFORM-003, Issue #1589). autoscaling/v2 is a stable core
  # API — no CRD gate needed, unlike ServiceMonitor/PrometheusRule. Ported from the Kubernaut
  # Operator's APIFrontendHPA (kubernaut-operator/internal/resources/hpa.go).
  autoscaling:
    enabled: false
  # -- Multi-cluster fleet configuration (BR-FLEET-054, ADR-068).
  # Gated by global.fleet.enabled (Issue #1707) -- when true and
  # global.fleet.mcpGatewayEndpoint is set, kubectl_get/kubectl_list/
  # list_clusters tools route to remote managed clusters via the MCP
  # Gateway. global.fleet.mcpGatewayType is additionally required when
  # using the Kuadrant gateway, since AF then watches MCPServerRegistration
  # CRs directly via a ClusterRegistry informer (see the RBAC grant below).
  # mcpGatewayEndpoint/mcpGatewayType/tlsCAFile/
  # oauth2.{enabled,tokenURL,scopes,tlsCAFile} moved to global.fleet.* (Issue
  # #1707 follow-up). Only oauth2.credentialsSecretRef remains overridable here.
  fleet:
    oauth2: {}
  config:
    # -- MCP protocol server (AF's own /mcp endpoint for external MCP clients,
    # distinct from AF-as-a-client-of-KA's-MCP-server). Issue #1737 gap found:
    # never exposed via Helm, so mcp.enabled defaulted false
    # (Config.DefaultConfig()) and every /mcp request 501'd ("MCP protocol is
    # disabled in configuration") regardless of the tls-certs/RBAC wiring
    # being otherwise correct. Schema default is now true (non-zero, DD-
    # PLATFORM-006 DA14) -- omitted here; set false explicitly to disable.
    # mcp:
    #   enabled: true
    #   sessionIdleTimeout: "5m"
    # -- A2A/MCP session-dependent tool registration (kubernaut_investigate,
    # discover_workflows, select_workflow, message, complete, cancel, status,
    # reconnect, await_session -- see pkg/apifrontend/tools/tool_categories.go).
    # Config.DefaultConfig() already defaults this true, so exposing it here
    # is for documentation/override clarity, not a behavior-changing fix
    # (unlike mcp.enabled above, which defaults false). Non-zero schema
    # default (DD-PLATFORM-006 DA14) -- omitted here; set false to disable.
    # interactive:
    #   enabled: true
    #   awaitSessionTimeout: "3m"
    #   bridgeInactivityTimeout: "180s"
    # -- Issue #1737 gap found: severityTriage.enabled/prometheusURL were never
    # exposed via Helm, so the chart always silently ran with triage disabled
    # (Config.SeverityTriage.Enabled defaults false) even though this is a core
    # feature that IS configured in the pre-#1737 Go-native E2E harness
    # (deploy/apifrontend/overlays/e2e/config.yaml). Rendered conditionally on
    # monitoring.prometheus.enabled below (prometheusURL is a hard requirement
    # of Config.Validate() whenever enabled=true) so a bare chart install
    # without Prometheus wiring is unaffected.
    # maxQueriesPerCall/maxRulesEvaluated/cacheTTLSeconds/llmConfidence all
    # have non-zero schema defaults (10/100/30/0.7, DD-PLATFORM-006 DA14).
    # -- Whether LLM-based severity-triage tiers are active. When false, no
    # llm block is rendered, forcing rule-based-only triage. Non-zero schema
    # default (true, DD-PLATFORM-006 DA14) -- omitted here; set false to
    # force rule-based-only triage.
    # severityTriage:
    #   llmEnabled: true
      # llmEnabled: true
    # -- #1839: per-dependency resilience timeouts (pkg/apifrontend/config.
    # ResilienceConfig). Only prometheus is chart-exposed today; connectTimeout/
    # requestTimeout have non-zero schema defaults (5s/10s, matching the Go
    # defaults) -- omitted here, override only if Prometheus is known to be
    # slower than usual in a given environment.
    # resilience:
    #   prometheus:
    #     requestTimeout: "10s"
    auth:
      # Simple single-provider (dev/test convenience, backward compat)
      issuerURL: ""
      # Multi-provider JWT configuration (production, #1436)
      # jwtProviders:
      #   - name: "keycloak"
      #     issuerURL: "https://keycloak.example.com/realms/kagenti"
      #     jwksURL: "http://keycloak-service.keycloak:8080/realms/kagenti/protocol/openid-connect/certs"
      #     audiences: ["kubernaut-apifrontend"]
      #     claimMappings:
      #       username: "preferred_username"
      #       groups: "groups"
      #   - name: "spire"
      #     issuerURL: "https://oidc-discovery-provider.example.com"
      #     jwksURL: "https://spire-spiffe-oidc-discovery-provider.zero-trust-workload-identity-manager.svc:443/keys"
      #     audiences: ["spiffe://trust-domain/ns/kubernaut-system/sa/apifrontend"]
      # GAP-08 (Issue #1505): jti replay-detection backend. When disabled
      # (default), APIFrontend uses the legacy in-memory cache -- a token
      # replayed against a different replica in a multi-replica deployment is
      # not detected. Enable to share replay state across all replicas via the
      # cluster's shared Valkey instance (same instance/secret used by
      # DataStorage). Reverted from DD-PLATFORM-006 DA6's brief "mandatory, no
      # enabled gate" stance (round-13 RCA, PR #1790): jti-uniqueness-based
      # replay detection rejects any second presentation of the same token
      # within the cache TTL -- exactly how a legitimate client is expected to
      # reuse an OAuth2 Bearer token across multiple requests -- so mandating
      # it on broke every multi-call session, not just the multi-replica HA
      # gap this control was meant to close.
      replayCache:
        enabled: false
        # DD-PLATFORM-006 DA9: TLS for this connection. Required once the
        # target Valkey is TLS-only (the chart's own bundled Valkey, per
        # Decision Area 8's default) -- leaving caFile empty defaults to the
        # already-distributed inter-service CA at render time.
        tls:
          enabled: false
    # -- Issue #1737 gap found: never wired into the chart, so AF silently ran
    # with cmd/apifrontend/main.go's buildRateLimiters() package-level fallback
    # (ratelimit.DefaultConfig(): only 3 concurrent sessions, 60 tool
    # calls/minute -- cfg.RateLimit.MaxConcurrentSessions/ToolCallsPerMinute
    # only override that fallback when > 0) instead of these values, which are
    # generous enough for realistic concurrent MCP/A2A session load (confirmed
    # via E2E: a cap of 3 causes "max_sessions: Maximum concurrent sessions
    # reached" / MCP 429s under any meaningful concurrency).
    rbac:
      personas:
        sre:
          - kubernaut_list_remediations
          - kubernaut_get_remediation
          - kubernaut_approve
          - kubernaut_cancel_remediation
          - kubernaut_watch
          - kubernaut_await_session
          - kubernaut_investigate
          - kubernaut_discover_workflows
          - kubernaut_select_workflow
          - kubernaut_present_decision
          - kubernaut_list_workflows
          - kubernaut_get_remediation_history
          - kubernaut_get_effectiveness
          - kubernaut_get_audit_trail
          - kubernaut_message
          - kubernaut_complete
          - kubernaut_cancel
          - kubernaut_status
          - kubernaut_reconnect
          # A2A internal tools (ADR-022: AF SA runs these on behalf of the user)
          - kubectl_get
          - kubectl_list
          - kubectl_list_events
          - kubernaut_check_existing_remediation
          - kubernaut_remediate
          # Alert observation tools (#1367)
          - list_alerts
          - get_alert_details
          # Alert-driven investigation (#1372)
          - kubernaut_investigate_alert
          # Approval-gate visibility (#1869): sre already has kubernaut_approve
          # (it's expected to decide on a pending approval) but lacked
          # kubernaut_get_approval_request to fetch the RAR details needed to
          # render the decision, and kubernaut_complete_no_action to resolve
          # a no-action outcome -- confirmed via live reproduction that this
          # left the approval gate silently unusable end-to-end for the only
          # interactive-chat-capable persona. remediation-approver already
          # had kubernaut_get_approval_request; sre did not.
          - kubernaut_get_approval_request
          - kubernaut_complete_no_action
        ai-orchestrator:
          - kubernaut_list_remediations
          - kubernaut_get_remediation
          - kubernaut_watch
          - kubernaut_await_session
          - kubernaut_investigate
          - kubernaut_discover_workflows
          - kubernaut_select_workflow
          - kubernaut_present_decision
          - kubernaut_message
          - kubernaut_complete
          - kubernaut_cancel
          - kubernaut_status
          - kubernaut_reconnect
          # A2A internal tools (ADR-022: AF SA runs these on behalf of the user)
          - kubectl_get
          - kubectl_list
          - kubectl_list_events
          - kubernaut_check_existing_remediation
          - kubernaut_remediate
          # Alert observation tools (#1367)
          - list_alerts
          - get_alert_details
          # Alert-driven investigation (#1372)
          - kubernaut_investigate_alert
        cicd:
          - kubernaut_list_remediations
          - kubernaut_get_remediation
          - kubernaut_watch
          - kubernaut_await_session
        observability:
          - kubernaut_list_remediations
          - kubernaut_get_remediation
          - kubernaut_watch
          - kubernaut_await_session
          - kubernaut_get_effectiveness
          - kubernaut_list_workflows
        l3-audit:
          - kubernaut_list_remediations
          - kubernaut_get_remediation
          - kubernaut_list_workflows
          - kubernaut_get_remediation_history
          - kubernaut_get_effectiveness
          - kubernaut_get_audit_trail
        remediation-approver:
          - kubernaut_approve
          - kubernaut_list_approval_requests
          - kubernaut_get_approval_request
          - kubernaut_list_remediations
          - kubernaut_get_remediation
          - kubernaut_watch
          - kubernaut_await_session
  resources:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 500m

# -- Standalone web console (A2A chat UI), opt-in (BR-PLATFORM-006, Kubernaut Operator
# parity). A static SPA fronted by an oauth2-proxy sidecar that authenticates users via
# the same OIDC provider as APIFrontend, then reverse-proxies to APIFrontend.
# Requires: console.auth.secretName (pre-created Secret with client-id/client-secret/
# cookie-secret) AND an OIDC issuer configured on APIFrontend (apifrontend.config.auth
# .issuerURL or .jwtProviders[0].issuerURL) — the chart fails fast if either is missing
# while console.enabled=true.
# DD-PLATFORM-006 DA14: replicas(1)/oauth2Proxy.image both have non-zero
# schema defaults -- omitted here, override only what you need.
console:
  enabled: false
  auth: {}
  # -- Ingress for external (browser) access. console.ingress.host is REQUIRED
  # whenever console.enabled=true — even if you set console.ingress.enabled=false
  # to manage external access with your own Ingress/Route — because oauth2-proxy
  # needs the browser-facing hostname for its OIDC redirect URL.
  # Opt-in and disabled by default (BR-PLATFORM-009), consistent with
  # Gateway/APIFrontend: Console is optional browser-facing UI tooling in
  # front of APIFrontend that users may replace with their own UI, or front
  # with their own Ingress/Route/mesh gateway -- not something the chart
  # should expose externally without an explicit choice. This is a deviation
  # from the Kubernaut Operator's ConsoleRouteSpec (which defaults to
  # enabled=true, opt-out), made deliberately for this reason.
  ingress:
    enabled: false
    tls: {}
  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 64Mi
