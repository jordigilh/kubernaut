          mcpGatewayEndpoint: "http://mcp.example.com"
    asserts:
      - contains:
          path: spec.egress
          content:
            ports:
              - port: 8080
                protocol: TCP
            to:
              - ipBlock:
                  cidr: "0.0.0.0/0"

  - it: "effectivenessmonitor NetworkPolicy renders the MCP Gateway egress rule when global.fleet.enabled=true"
    template: templates/effectivenessmonitor/networkpolicy.yaml
    set:
      global:
        fleet:
          enabled: true
          mcpGatewayEndpoint: "http://mcp.example.com"
    asserts:
      - contains:
          path: spec.egress
          content:
            ports:
              - port: 8080
                protocol: TCP
            to:
