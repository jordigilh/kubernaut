{{- /*
Issue #1984 Phase D: oauth2.tokenURL/credentialsSecretRef required-when-enabled
guards (and the ADR-068 gap of oauth2.enabled itself being optional) moved to
values.schema.json if/then blocks gated on global.fleet.mcpGatewayEndpoint
being set (BR-PLATFORM-010).
*/}}
{{- $gatewayFleetPreamble := include "kubernaut.fleet.preamble" (dict "root" $ "fleet" .Values.gateway.fleet "oauth2" .Values.gateway.fleet.oauth2) | fromYaml }}
{{- define "kubernaut.gateway.configYAML" }}
{{- /* checksum/config (Issue #1737 gap) needs this content reachable from the
Deployment's pod template annotations, which is a separate `include` call site
from the ConfigMap below -- named templates don't inherit $-scoped variables
from their caller, so $gatewayFleetPreamble must be recomputed here rather than
reused from the file-top declaration below. */}}
{{- $gatewayFleetPreamble := include "kubernaut.fleet.preamble" (dict "root" . "fleet" .Values.gateway.fleet "oauth2" .Values.gateway.fleet.oauth2) | fromYaml -}}
{{- $v := include "kubernaut.mergedValues" (dict "root" . "service" "gateway") | fromYaml -}}
logging:
  level: {{ $v.logging.level | quote }}
server:
  listenAddr: ":8080"
  healthAddr: ":8081"
  metricsAddr: ":9090"
  maxConcurrentRequests: {{ $v.config.server.maxConcurrentRequests }}
  readTimeout: {{ $v.config.server.readTimeout }}
  writeTimeout: {{ $v.config.server.writeTimeout }}
  idleTimeout: 120s
  k8sRequestTimeout: {{ $v.config.server.k8sRequestTimeout }}
cors:
  allowedOrigins:
  {{- range $v.config.cors.allowedOrigins }}
    - {{ . | quote }}
  {{- end }}
  allowedMethods:
    - "GET"
    - "POST"
    - "PUT"
    - "PATCH"
    - "DELETE"
    - "OPTIONS"
  allowCredentials: {{ $v.config.cors.allowCredentials }}
  maxAge: {{ $v.config.cors.maxAge }}
middleware:
  trustedProxyCIDRs:
  {{- range .Values.gateway.config.middleware.trustedProxyCIDRs }}
    - {{ . | quote }}
  {{- end }}
datastorage:
  url: "{{ include "kubernaut.datastorage.url" . }}"
  timeout: 10s
  buffer:
    bufferSize: 10000
    batchSize: 100
    flushInterval: 1s
    maxRetries: 3
processing:
  deduplication:
    cooldownPeriod: {{ $v.config.deduplication.cooldownPeriod }}
  retry:
    maxAttempts: 3
    initialBackoff: 100ms
    maxBackoff: 5s
{{- if .Values.global.fleet.enabled }}
fleet:
  enabled: true
  {{- /* global.fleet.backend="" documented default is "fleetmetadatacache"
  (README.md, values.yaml) -- must be MATERIALIZED here, not just implied by
  the endpoint auto-derivation below, otherwise pkg/fleet/config.go's
  effectiveBackend() (which deliberately does NOT itself default an empty
  Backend, see UT-FLEET-FAC-007) sees Backend="" + a non-empty auto-derived
  Endpoint and fails startup with "fleet: unsupported backend \"\"" (Issue
  #1737 DD-TEST-015 regression: the old Go-native E2E harness's kubectl-patch
  fleet config always wrote `backend: fleetmetadatacache` explicitly, masking
  this chart gap until the Helm-native fleet deploy path was exercised for
  the first time). */}}
  backend: {{ $gatewayFleetPreamble.config.backend | default "fleetmetadatacache" | quote }}
  {{- if $gatewayFleetPreamble.config.endpoint }}
  endpoint: {{ $gatewayFleetPreamble.config.endpoint | quote }}
  {{- else if eq (default "fleetmetadatacache" $gatewayFleetPreamble.config.backend) "fleetmetadatacache" }}
  endpoint: {{ include "kubernaut.fleetmetadatacache.url" . | quote }}
  {{- end }}
  mcpGatewayEndpoint: {{ $gatewayFleetPreamble.config.mcpGatewayEndpoint | quote }}
  {{- if $gatewayFleetPreamble.config.mcpGatewayType }}
  mcpGatewayType: {{ $gatewayFleetPreamble.config.mcpGatewayType | quote }}
  {{- end }}
  tlsCAFile: {{ $gatewayFleetPreamble.config.tlsCAFile | default (include "kubernaut.interServiceTLS.caFile" .) | quote }}
  {{/* ACM bearer-token wiring (BR-PLATFORM-003, Issue #1589). FleetConfig.TokenPath
       consumes this (Issue #1556) and Validate() hard-requires it when backend=acm. */}}
  {{- if $gatewayFleetPreamble.config.tokenSecretRef }}
  tokenPath: "/etc/gateway/{{ $gatewayFleetPreamble.config.tokenSecretRef }}/token"
  {{- end }}
  {{- if $gatewayFleetPreamble.oauth2.enabled }}
  oauth2:
    enabled: true
    tokenURL: {{ $gatewayFleetPreamble.oauth2.tokenURL | quote }}
    credentialsSecretRef: {{ $gatewayFleetPreamble.oauth2.credentialsSecretRef | quote }}
    {{- if $gatewayFleetPreamble.oauth2.scopes }}
    scopes:
      {{- range $gatewayFleetPreamble.oauth2.scopes }}
      - {{ . | quote }}
      {{- end }}
    {{- end }}
    tlsCAFile: {{ $gatewayFleetPreamble.oauth2.tlsCAFile | default (include "kubernaut.interServiceTLS.caFile" .) | quote }}
  {{- end }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: {{ .Release.Namespace }}
  labels:
    app: gateway
    {{- include "kubernaut.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- include "kubernaut.gateway.configYAML" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app: gateway
    {{- include "kubernaut.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gateway-role
  labels:
    {{- include "kubernaut.labels" . | nindent 4 }}
rules:
  - apiGroups: ["kubernaut.ai"]
    resources: ["remediationrequests"]
    verbs: ["create", "get", "list", "watch", "update", "patch"]
  - apiGroups: ["kubernaut.ai"]
    resources: ["remediationrequests/status"]
    verbs: ["update", "patch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes", "pods", "services", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  # controller-runtime leader election requires list+watch for reflector cache sync (#687)
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # BR-GATEWAY-036/037: TokenReview and SAR for auth middleware
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gateway-rolebinding
  labels:
    {{- include "kubernaut.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gateway-role
subjects:
  - kind: ServiceAccount
    name: gateway
    namespace: {{ .Release.Namespace }}
---
# Issue #1069 (DD-GATEWAY-018): bind to the built-in `view` ClusterRole for
# owner-chain resolution of ecosystem resource kinds via K8s RBAC aggregation
# — the same pattern already used by RO/EM (#545). `poddisruptionbudgets` is
# included in `view` by default, fixing the reported Forbidden error;
# cert-manager, Istio, KubeVirt, etc. are covered automatically on clusters
# where those operators are installed (they publish aggregate-to-view
# labels), with no unconditional grant on clusters that don't run them.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gateway-view
  labels:
    {{- include "kubernaut.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: gateway
    namespace: {{ .Release.Namespace }}
---
# Issue #1069 (DD-GATEWAY-018): operator-supplied ClusterRole references for
# ecosystems `view` cannot cover via aggregation (e.g. OLM Subscription,
# ArgoCD Application, which manages its own RBAC internally). The operator
# creates and owns the referenced ClusterRole; Kubernaut only binds it.
# global.additionalClusterRoleBindings covers the common case (same grant
# across Gateway/EM/KA); merged here with gateway's own list (deduplicated)
# for the asymmetric case.
{{- include "kubernaut.additionalClusterRoleBindings" (dict "prefix" "gateway" "serviceAccount" "gateway" "names" (concat .Values.global.additionalClusterRoleBindings .Values.gateway.additionalClusterRoleBindings | uniq) "Release" .Release "labels" (include "kubernaut.labels" .)) }}
---
# Role: namespace-scoped access to configmaps and secrets (#229)
{{ include "kubernaut.nsRoleForSecrets" (dict "name" "gateway" "serviceAccount" "gateway" "Release" .Release "labels" (include "kubernaut.labels" .)) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
  labels:
    app: gateway
    {{- include "kubernaut.labels" . | nindent 4 }}
spec:
  {{- $v := include "kubernaut.mergedValues" (dict "root" $ "service" "gateway") | fromYaml }}
  replicas: {{ $v.replicas }}
  # PR #1790 round-13 RCA: K8s's own Deployment controller enforces
  # spec.progressDeadlineSeconds (default 600s) SERVER-SIDE, independently of
  # any `kubectl rollout status --timeout` value passed client-side -- once
  # exceeded, the Deployment is marked `Progressing=False,
  # reason=ProgressDeadlineExceeded` and `kubectl rollout status` exits
  # immediately with "deployment exceeded its progress deadline" regardless
  # of a larger --timeout (see kubernetes/kubernetes#129959 for the identical
  # symptom, and https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#progress-deadline-seconds).
  # This is why round-12's bump of the E2E harness's `kubectl rollout status
  # --timeout` from 480s->720s (test/infrastructure/fullpipeline_e2e_helm.go)
  # had zero effect: the 600s default fired first every time. 750s (+30s
  # margin over that 720s client-side timeout) makes the client-side timeout
  # the actual effective ceiling again, restoring round-12's intended
  # tolerance for the confirmed node-wide kubelet starvation under this
  # suite's load (see that commit's cgroup/kubelet-log evidence).
  progressDeadlineSeconds: 750
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
        checksum/config: {{ include "kubernaut.gateway.configYAML" . | sha256sum }}
    spec:
      serviceAccountName: gateway
      {{- include "kubernaut.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "kubernaut.podSecurityContext" .Values.gateway | nindent 8 }}
      {{- include "kubernaut.affinity" (dict "component" .Values.gateway "matchLabels" (dict "app" "gateway")) | nindent 6 }}
      {{- include "kubernaut.scheduling" (dict "component" .Values.gateway "global" .Values.global) | nindent 6 }}
      containers:
        - name: gateway
          image: {{ include "kubernaut.image" (dict "service" "gateway" "root" $ "appVersion" .Chart.AppVersion) }}
          imagePullPolicy: {{ include "kubernaut.imagePullPolicy" $ }}
          securityContext:
            {{- include "kubernaut.containerSecurityContext" .Values.gateway | nindent 12 }}
          args:
            - "--config=/etc/gateway/config.yaml"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: TLS_CA_FILE
              value: {{ include "kubernaut.interServiceTLS.caFile" . | quote }}
          volumeMounts:
            - name: config
              mountPath: /etc/gateway
              readOnly: true
            {{- include "kubernaut.tlsCaVolumeMount" . | nindent 12 }}
            {{- if and .Values.global.fleet.enabled $gatewayFleetPreamble.oauth2.enabled }}
            - name: oauth2-credentials
              mountPath: "/etc/gateway/{{ $gatewayFleetPreamble.oauth2.credentialsSecretRef }}"
              readOnly: true
            {{- end }}
            {{- if and .Values.global.fleet.enabled $gatewayFleetPreamble.config.tokenSecretRef }}
            - name: fleet-acm-token
              mountPath: "/etc/gateway/{{ $gatewayFleetPreamble.config.tokenSecretRef }}"
              readOnly: true
            {{- end }}
          {{- /* DD-PLATFORM-008: when global.fleet.enabled=true, Gateway builds
          a federated scope-checker (fleet.NewScopeChecker) against FMC/ACM and
          a registry.ClusterRegistry against the MCP Gateway synchronously at
          boot -- the exact same blocking-dependency shape already fixed for
          apifrontend/effectivenessmonitor/workflowexecution (confirmed via a
          liveness-probe-induced crash loop against a cold FMC/Keycloak during
          Issue #1737 Fleet E2E validation: "Readiness probe failed... connect:
          connection refused" while the process was still resolving its fleet
          dependencies). Applying the shared helper here follows the DD's own
          "default remediation pattern going forward" guidance rather than
          reinventing probe tuning for this service. */}}
          {{- include "kubernaut.startupProbe" (dict "port" "health") | nindent 10 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: gateway-config
        {{- include "kubernaut.tlsCaVolume" . | nindent 8 }}
        {{- if and .Values.global.fleet.enabled $gatewayFleetPreamble.oauth2.enabled }}
        - name: oauth2-credentials
          secret:
            secretName: {{ $gatewayFleetPreamble.oauth2.credentialsSecretRef }}
        {{- end }}
        {{- if and .Values.global.fleet.enabled $gatewayFleetPreamble.config.tokenSecretRef }}
        - name: fleet-acm-token
          secret:
            secretName: {{ $gatewayFleetPreamble.config.tokenSecretRef }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: gateway
    {{- include "kubernaut.labels" . | nindent 4 }}
spec:
  type: {{ $v.service.type }}
  selector:
    app: gateway
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
      {{- if and (eq $v.service.type "NodePort") $v.service.nodePort }}
      nodePort: {{ $v.service.nodePort }}
      {{- end }}
    - name: health
      protocol: TCP
      port: 8081
      targetPort: 8081
    - name: metrics
      protocol: TCP
      port: 9090
      targetPort: 9090
