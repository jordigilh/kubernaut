{{- /*
checksum/config (Issue #1737 gap) needs this content reachable from the
Deployment's pod template annotations, a separate `include` call site from
the ConfigMap below -- named templates don't inherit $-scoped variables from
their caller (and can't be `define`d inside this file's top-level `if`
below), so $fmcFleetPreamble must be recomputed here rather than reused.
*/}}
{{- define "kubernaut.fleetmetadatacache.configYAML" -}}
{{- $fmcFleetPreamble := include "kubernaut.fleet.preamble" (dict "root" . "fleet" .Values.fleetmetadatacache "oauth2" .Values.fleetmetadatacache.oauth2) | fromYaml -}}
{{- $v := include "kubernaut.mergedValues" (dict "root" . "service" "fleetmetadatacache") | fromYaml -}}
server:
  apiAddr: ":8080"
  healthAddr: ":8081"
  metricsAddr: ":9090"
  tls:
    certDir: {{ include "kubernaut.interServiceTLS.certDir" . | quote }}
mcpGateway:
  endpoint: {{ $fmcFleetPreamble.config.mcpGatewayEndpoint | quote }}
  gatewayType: {{ $fmcFleetPreamble.config.mcpGatewayType | quote }}
  {{- /* Issue #1730: fleetmetadatacache.namespace falls back to
  global.fleet.mcpGatewayNamespace (via kubernaut.fleet.config) when unset;
  $v.namespace's own schema default ("kubernaut-system") is the final
  fallback when neither is set, preserving pre-#1730 behavior. */}}
  namespace: {{ $fmcFleetPreamble.config.namespace | default $v.namespace | quote }}
  {{- /* Issue #2262 Phase 2: fleet.MCPGatewayConfig.Resilience (pkg/fleet/config.go)
  nests under mcpGateway, unlike every other service's fleet.resilience --
  only render keys the operator actually set; an unset field keeps
  mcpclient.DefaultResilienceConfig()'s pre-#2262 default unchanged (see
  mcpclient.ResilienceConfigFromFleet). */}}
  {{- if $fmcFleetPreamble.resilience }}
  resilience:
    {{- $fmcFleetPreamble.resilience | toYaml | nindent 4 }}
  {{- end }}
valkey:
  {{- /* values.yaml documents valkeyAddr: "" as "uses shared Valkey
  instance", but left unimplemented that default actually falls through to
  an empty string (Go binary's ServiceConfig.Validate() then rejects it with
  "valkey.addr is required" at startup, Issue #1737 DD-TEST-015 regression --
  same class of gap as global.fleet.backend above: a documented default that
  was never materialized in the template). kubernaut.valkey.addr already
  computes the chart's own shared Valkey Service address (or the BYO
  valkey.host when valkey.enabled=false) for postgresql/datastorage; reuse it
  here instead of requiring every fleetmetadatacache.enabled=true caller to
  redundantly pass --set fleetmetadatacache.valkeyAddr=valkey:6380. */}}
  addr: {{ .Values.fleetmetadatacache.valkeyAddr | default (include "kubernaut.valkey.addr" .) | quote }}
  {{- /* DD-PLATFORM-006 Decision Area 13 follow-up (round-16 RCA, PR #1790):
  Decision Area 13's original client census (prompted by Decision Area 8
  making the chart's own Valkey TLS-only) covered DataStorage and the
  APIFrontend replay cache, but missed FMC -- a third Go client
  (pkg/fleet/fmc.ValkeyWriter, pkg/fleet/scopecache.ValkeyCacheReader) that
  had zero TLS support. Unlike the replay cache (which fails open to an
  in-memory fallback on a bad handshake), FMC's Valkey dependency is
  load-bearing -- its own /readyz gates on a Valkey PING -- so this mirrors
  DataStorage's config.redis.tls pattern (mandatory, no enabled gate) rather
  than the replay cache's opt-in one. caFile defaults to the already-
  distributed inter-service CA (kubernaut.tlsCaVolumeMount/Volume already
  mount /etc/tls-ca on this pod for the OAuth2 tlsCaFile use above, so no new
  mount is needed) so tls "just works" against the chart's own Valkey without
  any extra configuration. */}}
  tls:
    enabled: true
    certFile: {{ .Values.fleetmetadatacache.valkeyTLS.certFile | default "" | quote }}
    keyFile: {{ .Values.fleetmetadatacache.valkeyTLS.keyFile | default "" | quote }}
    caFile: {{ .Values.fleetmetadatacache.valkeyTLS.caFile | default (include "kubernaut.interServiceTLS.caFile" .) | quote }}
sync:
  interval: {{ $v.syncInterval | quote }}
  keyTtl: {{ $v.keyTTL | quote }}
oauth2:
  tokenUrl: {{ $fmcFleetPreamble.oauth2.tokenURL | quote }}
  credentialsDir: "/etc/fleetmetadatacache/fleet-oauth2"
  {{- /* #1755 DD-TEST-015 regression RCA (2nd finding, surfaced only after
     the tlsCaFile fix above let the TLS handshake to Keycloak succeed):
     this scopes block was also missing entirely (unlike gateway/
     effectivenessmonitor/workflowexecution, which all render it from the
     same $fleetPreamble.oauth2.scopes). Because it's a struct field with no
     YAML key present, FMC's own OAuth2Config Go default of
     []string{"openid", "groups"} (pkg/fleet/fmc/config/config.go
     DefaultServiceConfig) silently won -- those two scopes are not what
     Keycloak's kubernaut-fleet-read client is configured to grant for the
     client_credentials flow, so every token request failed with
     `oauth2: "invalid_scope" "Invalid scopes: openid groups"` (visible only
     via a temporarily Debug-leveled logger; production logs it at V(1) and
     just show endless "OAuth2 TokenSource rebuilt" retries). Confirmed live:
     gateway's identical clientID (kubernaut-fleet-read) succeeds because its
     ConfigMap actually renders scopes: ["kube-mcp-server-audience"]. */}}
  {{- if $fmcFleetPreamble.oauth2.scopes }}
  scopes:
    {{- range $fmcFleetPreamble.oauth2.scopes }}
    - {{ . | quote }}
    {{- end }}
  {{- end }}
  {{- /* #1755 DD-TEST-015 regression RCA: this tlsCaFile line was missing
     entirely (unlike gateway/effectivenessmonitor/workflowexecution/etc.,
     which all render it from the same $fleetPreamble.oauth2.tlsCAFile),
     so FMC's OAuth2 token-fetch HTTP client fell back to the system CA
     trust store and could never verify Keycloak's inter-service-CA-signed
     cert -- every client_credentials token fetch failed TLS verification
     (silently, at V(1) log level) and mcpclient.NewResilient retried for
     its full 5-minute MaxElapsedTime budget before giving up, permanently
     blocking FMC's API port (Gateway/RO's readiness dependency) from ever
     listening. Confirmed via live cluster: the exact same MCP Gateway
     call FMC makes succeeds instantly through curl -k (bypassing CA
     verification) using FMC's real credentials, while FMC's pod sits
     stuck retrying with TLS verification enabled and no CA configured. */}}
  tlsCaFile: {{ $fmcFleetPreamble.oauth2.tlsCAFile | default (include "kubernaut.interServiceTLS.caFile" .) | quote }}
{{- end }}
{{- /* DD-PLATFORM-006 Decision Area 10: fleetmetadatacache.enabled's effective value is derived
from global.fleet.enabled + global.fleet.backend when not explicitly set -- see
kubernaut.fleetmetadatacache.effectiveEnabled for the full rationale and the contradictory-
override fail() case. */}}
{{- if eq (include "kubernaut.fleetmetadatacache.effectiveEnabled" .) "true" }}
{{- $fmcFleetPreamble := include "kubernaut.fleet.preamble" (dict "root" $ "fleet" .Values.fleetmetadatacache "oauth2" .Values.fleetmetadatacache.oauth2) | fromYaml }}
{{- $v := include "kubernaut.mergedValues" (dict "root" $ "service" "fleetmetadatacache") | fromYaml }}
{{- /* Issue #1730: fleetmetadatacache.namespace falls back to
global.fleet.mcpGatewayNamespace (via kubernaut.fleet.config) when unset;
$v.namespace's own schema default ("kubernaut-system") is the final
fallback when neither is set, preserving pre-#1730 behavior. */}}
{{- $fmcNamespace := $fmcFleetPreamble.config.namespace | default $v.namespace }}
{{- /*
Issue #1984 Phase B/D: FMC being effectively enabled requires
global.fleet.mcpGatewayEndpoint (Phase B, values.schema.json), which in turn
requires global.fleet.oauth2.{enabled,tokenURL,credentialsSecretRef} complete
(Phase D, values.schema.json) -- jointly subsuming this unconditional
tokenURL/credentialsSecretRef fail() guard, which is now redundant (BR-PLATFORM-010).
*/}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fleetmetadatacache-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: fleetmetadatacache
    app.kubernetes.io/component: fleet-metadata-cache
    {{- include "kubernaut.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- include "kubernaut.fleetmetadatacache.configYAML" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleetmetadatacache
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: fleetmetadatacache
    app.kubernetes.io/component: fleet-metadata-cache
    {{- include "kubernaut.labels" . | nindent 4 }}
spec:
  replicas: {{ $v.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: fleetmetadatacache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fleetmetadatacache
        app.kubernetes.io/component: fleet-metadata-cache
      annotations:
        checksum/config: {{ include "kubernaut.fleetmetadatacache.configYAML" . | sha256sum }}
    spec:
      serviceAccountName: fleetmetadatacache
      {{- include "kubernaut.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "kubernaut.podSecurityContext" .Values.fleetmetadatacache | nindent 8 }}
      {{- include "kubernaut.affinity" (dict "component" .Values.fleetmetadatacache "matchLabels" (dict "app.kubernetes.io/name" "fleetmetadatacache")) | nindent 6 }}
      {{- include "kubernaut.scheduling" (dict "component" .Values.fleetmetadatacache "global" .Values.global) | nindent 6 }}
      containers:
        - name: fleetmetadatacache
          image: "{{ $v.image.repository }}:{{ $v.image.tag }}"
          imagePullPolicy: {{ $v.image.pullPolicy }}
          securityContext:
            {{- include "kubernaut.containerSecurityContext" .Values.fleetmetadatacache | nindent 12 }}
          args:
            - "--config=/etc/fleetmetadatacache/config.yaml"
          ports:
            - name: api
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          {{- /* DD-PLATFORM-008: FMC (always fleet-enabled by definition --
          this whole Deployment is gated on fleetmetadatacache.enabled=true)
          builds its OAuth2 token source and MCP Gateway connection
          synchronously at boot (main.go's "FMC starting" log precedes any
          successful sync), the same blocking-dependency shape already fixed
          for apifrontend/effectivenessmonitor/workflowexecution (confirmed
          via a liveness-probe-induced crash loop, "Readiness probe
          failed... connection refused" then "Liveness probe failed... will
          be restarted", during Issue #1737 Fleet E2E validation). Applying
          the shared helper here follows the DD's own "default remediation
          pattern going forward" guidance rather than reinventing probe
          tuning for this service. */}}
          {{- include "kubernaut.startupProbe" (dict "port" "health") | nindent 10 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.fleetmetadatacache.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/fleetmetadatacache
              readOnly: true
            - name: oauth2-credentials
              mountPath: /etc/fleetmetadatacache/fleet-oauth2
              readOnly: true
            - name: tls-certs
              mountPath: {{ include "kubernaut.interServiceTLS.certDir" . }}
              readOnly: true
            {{- /* #1755 DD-TEST-015 regression RCA companion to the oauth2.tlsCaFile
               fix above: without this mount, the CA path that tlsCaFile now points
               to (default /etc/tls-ca/ca.crt) would not exist in the container,
               turning the "can't verify Keycloak's cert" hang into an equally fatal
               "failed to read TLS CA file" error instead. gateway/effectivenessmonitor/
               workflowexecution all include this mount for the exact same reason. */}}
            {{- include "kubernaut.tlsCaVolumeMount" . | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: fleetmetadatacache-config
        - name: oauth2-credentials
          secret:
            secretName: {{ $fmcFleetPreamble.oauth2.credentialsSecretRef }}
        - name: tls-certs
          secret:
            secretName: fleetmetadatacache-tls
            optional: true
        {{- include "kubernaut.tlsCaVolume" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: fleetmetadatacache-service
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: fleetmetadatacache
    app.kubernetes.io/component: fleet-metadata-cache
    {{- include "kubernaut.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fleetmetadatacache
  ports:
    - name: api
      port: 8080
      targetPort: api
      protocol: TCP
    - name: health
      port: 8081
      targetPort: health
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fleetmetadatacache
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: fleetmetadatacache
    app.kubernetes.io/component: fleet-metadata-cache
    {{- include "kubernaut.labels" . | nindent 4 }}
{{- /*
#1686 (BR-RBAC-020): FMC's ClusterRole exists solely to grant its
ClusterRegistry's CRD watch (there is no other rule in this ClusterRole),
so when fleetmetadatacache.namespace scopes that watch to one namespace, the
ClusterRole/ClusterRoleBinding are skipped entirely in favor of the
namespace-scoped Role/RoleBinding below (least privilege) instead of
rendering a redundant empty ClusterRole.
*/}}
{{- if not $fmcNamespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fleetmetadatacache
  labels:
    app.kubernetes.io/name: fleetmetadatacache
    {{- include "kubernaut.labels" . | nindent 4 }}
rules:
{{- if eq $fmcFleetPreamble.config.mcpGatewayType "kuadrant" }}
  - apiGroups: ["mcp.kuadrant.io"]
    resources: ["mcpserverregistrations"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways", "httproutes"]
    verbs: ["get", "list", "watch"]
{{- else }}
  - apiGroups: ["gateway.envoyproxy.io"]
    resources: ["backends"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["aigateway.envoyproxy.io"]
    resources: ["mcproutes"]
    verbs: ["get", "list", "watch"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fleetmetadatacache
  labels:
    app.kubernetes.io/name: fleetmetadatacache
    {{- include "kubernaut.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fleetmetadatacache
subjects:
  - kind: ServiceAccount
    name: fleetmetadatacache
    namespace: {{ .Release.Namespace }}
{{- else }}
---
# #1686 (BR-RBAC-020): namespace-scoped equivalent of the ClusterRole rules
# above, granted instead of them when fleetmetadatacache.namespace (or its
# global.fleet.mcpGatewayNamespace fallback, Issue #1730) is set.
{{ include "kubernaut.fleet.registryNsRBAC" (dict "name" "fleetmetadatacache" "serviceAccount" "fleetmetadatacache" "namespace" $fmcNamespace "appLabels" "app.kubernetes.io/name: fleetmetadatacache" "mcpServerRegistrations" (eq $fmcFleetPreamble.config.mcpGatewayType "kuadrant") "kuadrantGateways" (eq $fmcFleetPreamble.config.mcpGatewayType "kuadrant") "eaigwBackends" (ne $fmcFleetPreamble.config.mcpGatewayType "kuadrant") "Release" .Release "labels" (include "kubernaut.labels" .)) }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fleetmetadatacache
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: fleetmetadatacache
    app.kubernetes.io/component: fleet-metadata-cache
    {{- include "kubernaut.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fleetmetadatacache
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- /* #1755 DD-TEST-015 regression RCA (5th finding): this rule never
       matched anything. gateway.yaml's and remediationorchestrator.yaml's
       Deployments both label their pods with the legacy `app: <name>`
       convention (`app: gateway`, `app: remediationorchestrator-controller`
       -- confirmed live via `kubectl get pod --show-labels`, neither carries
       an `app.kubernetes.io/name` label at all), not the
       `app.kubernetes.io/name` convention this rule was written against --
       the exact same convention mismatch already fixed once for Valkey's
       ingress rule above (see infrastructure/networkpolicy-valkey.yaml's
       identical comment). Default-deny NetworkPolicy silently dropped 100%
       of Gateway's/RO's traffic to FMC as a result -- confirmed live via
       Gateway's own readiness log ("FMC unreachable: ... context deadline
       exceeded") persisting even after FMC itself became fully Ready (1/1)
       once the egress fix above was applied, isolating this as a distinct,
       second bug on the ingress side. Matches both conventions per pod, as
       kubernaut.np.fleetmetadatacacheEgress already does for the reciprocal
       egress rule on the caller side.

       Issue #2059/E2E-FLEET-018 RCA (helios08 live repro, on top of the
       apifrontend.yaml backend/endpoint chart fix + suite_test.go's
       fmcSyncTimeout retry, both elsewhere in this PR): AF's own
       FederatedScopeChecker (#2025/ADR-068, apifrontend/backend_deps.go)
       calls this same /api/v1/scope/check endpoint directly -- but AF was
       never added to this allow-list when that feature landed, because
       this rule's scope was fixed once (above) for Gateway/RO and never
       revisited for AF's later, independent caller. Confirmed live: a raw
       `curl --max-time 5` from inside the apifrontend pod straight to
       FMC's pod IP on :8080 timed out (exit 28, silently dropped SYN,
       zero FMC-side log entries for the attempt) while the IDENTICAL call
       from remediationorchestrator's pod returned a real 401 in ~20ms --
       isolating the block to this ingress policy, not AF's egress (which
       already has an unconditional 0.0.0.0/0:8080 rule from
       kubernaut.np.llmEgress/mcpGatewayEgress) nor FMC's own readiness.
       Live-patching just this one NetworkPolicy (kubectl patch, adding an
       `app: apifrontend` podSelector) turned that same curl into the
       20ms 401 and made E2E-FLEET-018 pass end-to-end with zero other
       changes -- proving this ingress gap, not FMC sync lag, was the
       actual blocker CI was retrying against for 45s on every run. */}}
    - from:
        - podSelector:
            matchLabels:
              app: gateway
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
        - podSelector:
            matchLabels:
              app: remediationorchestrator-controller
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: remediationorchestrator
        - podSelector:
            matchLabels:
              app: apifrontend
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: apifrontend
      ports:
        - protocol: TCP
          port: 8080
    {{- include "kubernaut.np.metricsIngress" . | nindent 4 }}
  egress:
    {{- /* #1755 DD-TEST-015 regression RCA (4th finding, surfaced only after
       the tlsCaFile/scopes/idpEgress fixes let FMC's OAuth2 client and
       Keycloak handshake succeed): FMC's ClusterRegistry.Start()
       (pkg/fleet/registry/kuadrant_registry.go) builds a K8s dynamic
       informer watching MCPServerRegistration CRs via the in-cluster
       kubeconfig (ctrl.GetConfig(), i.e. https://kubernetes.default.svc:443)
       -- but unlike every OTHER fleet-aware service's NetworkPolicy
       (gateway/effectivenessmonitor/workflowexecution/remediationorchestrator/
       signalprocessing, all of which include kubernaut.np.commonEgress),
       this file never included it. The "443/namespaceSelector: {}" rule
       below looks like it should cover the API server's Service port, but
       does not: the API server here is a hostNetwork static pod (`kubectl
       get endpoints kubernetes` -> 10.89.0.78:6443, entirely outside the
       10.244.0.0/16 pod CIDR every other Service backend lives in), and
       namespaceSelector-based rules only match pod-network pods, not
       host-network ones -- a well-documented NetworkPolicy limitation.
       kubernaut.np.apiServerEgress (inside commonEgress) exists precisely
       to resolve the API server's real backend ipBlock instead. Confirmed
       live: a raw `/dev/tcp/kubernetes.default.svc/443` connect from inside
       the FMC pod hung past a 10s timeout (SYN silently dropped, the same
       signature as the Keycloak :8443 gap above) while the identical
       request succeeded instantly once this rule was added -- and without
       it, the informer's initial LIST retries forever with no error ever
       surfaced to the caller, permanently hanging wireFMCDependencies (and
       therefore /readyz, and therefore every caller of FMC's scope-check
       API, e.g. Gateway/RO) with no timeout and no log line. */}}
    {{- include "kubernaut.np.commonEgress" . | nindent 4 }}
    - to:
        - podSelector:
            # Issue #1737 gap found: infrastructure/valkey.yaml's pod template only
            # carries the legacy "app: valkey" label (predates the
            # "app.kubernetes.io/name" convention used elsewhere in this file) --
            # the selector below never matched any pod, silently dropping all FMC
            # egress to Valkey (default-deny) and blocking FMC's readiness probe.
            matchLabels:
              app: valkey
      ports:
        # DD-PLATFORM-006 DA8: Valkey is TLS-only on 6380.
        - protocol: TCP
          port: 6380
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    {{- /* #1755 DD-TEST-015 regression RCA (3rd finding, surfaced only after
       the tlsCaFile and scopes fixes above let FMC's OAuth2 client actually
       attempt a TLS handshake to Keycloak): the "443"/"8080" rule above
       assumes the fleet OAuth2 IdP always listens on 443 (correct for a real
       external IdP over HTTPS), but this E2E harness's Keycloak double
       listens on 8443 (test/infrastructure/fleet_e2e.go DeployKeycloakInfra).
       A newer kindnet build enforces NetworkPolicy by default (contrary to
       older assumptions in this investigation), so every FMC->Keycloak
       token-fetch TCP SYN to :8443 was silently dropped -- confirmed live via
       `curl --connect-timeout` to both the Service ClusterIP and the Pod IP
       directly, both timing out identically, while the same request to :443
       or a podSelector-matched target succeeds instantly. Reuses
       kubernaut.np.idpEgress (already used by apifrontend/networkpolicy.yaml
       for the identical DEX-on-5556 case in the FP suite) rather than a new
       helper -- its own doc comment already anticipates "a test-only OIDC
       provider ... at a non-443 port". See
       fullpipeline_e2e_helm.go's networkPolicies.idp.port=8443 override for
       the fleet-enabled install. */}}
    {{- include "kubernaut.np.idpEgress" . | nindent 4 }}
{{- end }}
