suite: "console.oauth2Proxy.skipDiscovery: split browser/in-cluster OIDC endpoints for when the IdP isn't reachable via the same hostname from both (e.g. IdP in its own namespace)"
templates:
  - templates/console/console.yaml
set:
  postgresql:
    auth:
      existingSecret: dummy
  valkey:
    existingSecret: dummy
  global:
    llmProfiles:
      primary:
        provider: openai
        model: gpt-4
        credentialsSecretName: llm-credentials-primary
  kubernautAgent:
    llmProfileRef: primary
  signalprocessing:
    policies:
      existingConfigMap: test-cm
  aianalysis:
    policies:
      existingConfigMap: test-cm
  console:
    enabled: true
    auth:
      secretName: console-auth
    ingress:
      host: console.apps.example.com
  apifrontend:
    config:
      auth:
        issuerURL: https://keycloak:8443/realms/kubernaut-fleet
tests:
  - it: "IT-HELM-OIDCSKIP-001: skipDiscovery unset (default false) renders plain OIDC discovery, unchanged from before this field existed"
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: "--skip-oidc-discovery=true"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--oidc-issuer-url=https://keycloak:8443/realms/kubernaut-fleet"

  - it: "IT-HELM-OIDCSKIP-002: skipDiscovery=true renders --skip-oidc-discovery plus the three manual endpoint flags, --oidc-issuer-url unchanged (string-matched against the IdP's iss claim, not dialed)"
    set:
      console:
        oauth2Proxy:
          skipDiscovery: true
          loginURL: https://keycloak:8443/realms/kubernaut-fleet/protocol/openid-connect/auth
          redeemURL: https://keycloak.idp.svc.cluster.local:8443/realms/kubernaut-fleet/protocol/openid-connect/token
          jwksURL: https://keycloak.idp.svc.cluster.local:8443/realms/kubernaut-fleet/protocol/openid-connect/certs
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--oidc-issuer-url=https://keycloak:8443/realms/kubernaut-fleet"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--skip-oidc-discovery=true"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--login-url=https://keycloak:8443/realms/kubernaut-fleet/protocol/openid-connect/auth"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--redeem-url=https://keycloak.idp.svc.cluster.local:8443/realms/kubernaut-fleet/protocol/openid-connect/token"
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--oidc-jwks-url=https://keycloak.idp.svc.cluster.local:8443/realms/kubernaut-fleet/protocol/openid-connect/certs"

  - it: "IT-HELM-OIDCSKIP-003: skipDiscovery=true without loginURL/redeemURL/jwksURL fails schema validation, proving the schema's if/then dependency"
    set:
      console:
        oauth2Proxy:
          skipDiscovery: true
    asserts:
      - failedTemplate:
          errorMessage: "values don't meet the specifications of the schema(s) in the following chart(s):\nkubernaut:\n- at '/console/oauth2Proxy': missing properties 'loginURL', 'redeemURL', 'jwksURL'\n"
